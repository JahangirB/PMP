# PMP Prep for iPhone. Generate the Xcode project with `xcodegen generate` (CI does this).
# Content (questions, lessons, flashcards, reference) is extracted from ../index.html and
# ../packs into Resources/ at build time by ../android/tools/extract-content.mjs, as on Android.
name: PMPPrep
options:
  bundleIdPrefix: com.jahangirb
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  PMPPrep:
    type: application
    platform: iOS
    sources:
      - path: PMPPrep
      - path: Resources/content
        type: folder
        buildPhase: resources
      - path: Resources/packs
        type: folder
        buildPhase: resources
    info:
      path: PMPPrep/Info.plist
      properties:
        CFBundleDisplayName: PMP Prep
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortraitUpsideDown]
        UIAppFonts: [nunito_regular.ttf, nunito_semibold.ttf, nunito_bold.ttf, nunito_extrabold.ttf]
        UIFileSharingEnabled: false
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.jahangirb.pmpprep
            CFBundleURLSchemes: [pmpprep]
    entitlements:
      path: PMPPrep/PMPPrep.entitlements
      properties:
        com.apple.security.application-groups: [group.com.jahangirb.pmpprep]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jahangirb.pmpprep
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: NO
    dependencies:
      - target: PMPPrepWidget
  PMPPrepWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PMPPrepWidget
      - path: PMPPrep/Data/Time.swift
      - path: PMPPrep/Data/WidgetStats.swift
    info:
      path: PMPPrepWidget/Info.plist
      properties:
        CFBundleDisplayName: PMP Prep
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PMPPrepWidget/PMPPrepWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.jahangirb.pmpprep]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jahangirb.pmpprep.widget
        TARGETED_DEVICE_FAMILY: "1,2"
  PMPPrepTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PMPPrepTests
    dependencies:
      - target: PMPPrep
schemes:
  PMPPrep:
    build:
      targets:
        PMPPrep: all
        PMPPrepTests: [test]
    test:
      targets: [PMPPrepTests]
