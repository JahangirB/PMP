    var head = [el("th", { text: title.replace(/^By /, "") })];
    if (extraCol) head.push(el("th", { class: "n", text: extraCol.head }));
    head = head.concat([
      el("th", { class: "n", text: "Right" }),
      el("th", { class: "n", text: "Asked" }),
      el("th", { class: "n", text: "Score" }),
      el("th", { text: "Band" })
    ]);
    var tbl = el("table", { class: "tbl" }, [el("thead", null, [el("tr", null, head)])]);
    var body = el("tbody");
    groups.slice().sort(function (a, b) { return (a.right / a.n) - (b.right / b.n); }).forEach(function (g) {
      var pct = g.n ? g.right / g.n : 0;
      var band = bandFor(pct, g.n);
      var cells = [el("td", { text: g.key })];
      if (extraCol) cells.push(el("td", { class: "n", text: extraCol.value(g) }));
      cells = cells.concat([
        el("td", { class: "n", text: String(g.right) }),
        el("td", { class: "n", text: String(g.n) }),
        el("td", { class: "n", text: PMP.fmt.pct(pct) }),
        el("td", null, [el("span", { class: "chip band band--" + band.id, text: band.label })])
      ]);
      body.appendChild(el("tr", null, cells));
    });
    tbl.appendChild(body);
    card.appendChild(tbl);
    return card;
  }

  function stat(k, v) {
    return el("div", { class: "stat" }, [
      el("span", { class: "stat-k", text: k }),
      el("span", { class: "stat-v", text: v })
    ]);
  }

  function renderResults(host, record) {
    var rows = record.rows, L = record.layout;
    var scored = rows.filter(function (r) { return !r.pretest; });
    var pct = record.score.pct;
    var band = bandFor(pct, scored.length);
    var answered = rows.filter(function (r) { return r.answered; });
    var missed = rows.filter(function (r) { return !r.correct; });
    var overPace = answered.filter(function (r) { return r.ms > L.paceSec * 1000; }).length;
    var avgSec = answered.length ? answered.reduce(function (a, r) { return a + r.ms; }, 0) / answered.length / 1000 : 0;

    host.appendChild(el("div", { class: "view-hd" }, [
      el("span", { class: "eyebrow", text: "Sitting of " + PMP.fmt.dateShort(record.finishedAt) +
        (record.endedBy === "timeout" ? " \u00B7 ran out of time" : record.endedBy === "ended" ? " \u00B7 ended early" : "") }),
      el("h2", { text: PMP.fmt.pct(pct) + " on the scored questions" }),
      el("p", { text: record.score.right + " of " + PMP.fmt.plural(record.score.of, "scored question") + " right, in " + PMP.fmt.duration(record.elapsedMs / 1000) + " of a " + L.minutes + " minute allowance." })
    ]));

    host.appendChild(el("div", { class: "card" }, [
      el("span", { class: "eyebrow", text: "The paper" }),
      el("div", { class: "sum-grid", style: "margin-top:var(--sp-4)" }, [
        stat("Scored", record.score.right + " / " + record.score.of),
        stat("Overall band", band.label),
        stat("Unanswered", String(rows.length - answered.length)),
        stat("Average pace", answered.length ? Math.round(avgSec) + "s" : "\u2014"),
        stat("Over " + L.paceSec.toFixed(0) + "s", String(overPace)),
        stat("Time left", PMP.fmt.clock(L.minutes * 60000 - record.elapsedMs))
      ]),
      el("p", { style: "margin-top:var(--sp-4)", text: "PMI does not publish a pass mark or the boundaries of its proficiency bands, and it reports a band rather than a percentage. The four bands used here are this build's own scale, applied to your raw percentage, and they are a study signal rather than a prediction." }),
      el("p", { text: (L.items - L.scored) + " of the " + L.items + " questions were pretest items and did not count towards the score above, the same proportion the published layout uses. They are marked in the review below." })
    ]));

    /* Domain first: it is the breakdown PMI itself reports against. */
    host.appendChild(bandTable("By domain",
      group(scored, function (r) { return PMP.ECO.DOMAIN_LABELS[r.domain] || r.domain; }),
      { head: "Weight", value: function (g) {
          var d = PMP.ECO.DOMAINS.filter(function (x) { return PMP.ECO.DOMAIN_LABELS[x] === g.key; })[0];
          return d ? PMP.fmt.pct(PMP.ECO.DOMAIN_WEIGHTS[d]) : "\u2014";
        } }));

    host.appendChild(bandTable("By ECO task", group(scored, function (r) {
      var t = PMP.ECO_TASK_BY_ID[r.ecoTask];
      return t ? PMP.ECO.DOMAIN_LABELS[t.domain] + " " + t.n + ". " + t.label : "Untagged";
    })));

    host.appendChild(bandTable("By approach", group(scored, function (r) {
      return PMP.ECO.APPROACH_LABELS[r.approach] || "Untagged";
    })));

    host.appendChild(bandTable("By question type", group(scored, function (r) {
      return PMP.QRender.label(r.type);
    })));

    host.appendChild(bandTable("By difficulty", group(scored, function (r) {
      return r.difficulty ? "Difficulty " + r.difficulty : "Untagged";
    })));

    /* Time. The useful cut is not the average but where the minutes went and
       whether the slow items were also the wrong ones. */
    var slow = answered.filter(function (r) { return r.ms > L.paceSec * 1000; });
    var slowRight = slow.filter(function (r) { return r.correct; }).length;
    var fast = answered.filter(function (r) { return r.ms <= L.paceSec * 1000; });
    var fastRight = fast.filter(function (r) { return r.correct; }).length;
    var flaggedRows = rows.filter(function (r) { return r.flagged; });
    var flaggedRight = flaggedRows.filter(function (r) { return r.correct; }).length;

    var timeCard = el("div", { class: "card" }, [
      el("span", { class: "eyebrow", text: "Where the time went" }),
      el("table", { class: "tbl" }, [
        el("thead", null, [el("tr", null, [
          el("th", { text: "Group" }), el("th", { class: "n", text: "Items" }),
          el("th", { class: "n", text: "Right" }), el("th", { class: "n", text: "Accuracy" })
        ])]),
        el("tbody", null, [
          el("tr", null, [
            el("td", { text: "Answered inside " + L.paceSec.toFixed(0) + "s" }),
            el("td", { class: "n", text: String(fast.length) }),
            el("td", { class: "n", text: String(fastRight) }),
            el("td", { class: "n", text: fast.length ? PMP.fmt.pct(fastRight / fast.length) : "\u2014" })
          ]),
          el("tr", null, [
            el("td", { text: "Answered over " + L.paceSec.toFixed(0) + "s" }),
            el("td", { class: "n", text: String(slow.length) }),
            el("td", { class: "n", text: String(slowRight) }),
            el("td", { class: "n", text: slow.length ? PMP.fmt.pct(slowRight / slow.length) : "\u2014" })
          ]),
          el("tr", null, [
            el("td", { text: "Flagged for review" }),
            el("td", { class: "n", text: String(flaggedRows.length) }),
            el("td", { class: "n", text: String(flaggedRight) }),
            el("td", { class: "n", text: flaggedRows.length ? PMP.fmt.pct(flaggedRight / flaggedRows.length) : "\u2014" })
          ])
        ])
      ]),
      el("p", { style: "margin-top:var(--sp-4)", text: "If the slow group is no more accurate than the fast one, the extra minutes are being spent on second-guessing rather than on working the problem, and the fix is a decision rule rather than more content." })
    ]);
    var blockRows = group(rows, function (r) { return blockLabel(r.block); });
    var blkTbl = el("table", { class: "tbl" }, [
      el("thead", null, [el("tr", null, [
        el("th", { text: "Block" }), el("th", { class: "n", text: "Items" }),
        el("th", { class: "n", text: "Right" }), el("th", { class: "n", text: "Time" }),
        el("th", { class: "n", text: "Avg" })
      ])])
    ]);
    var blkBody = el("tbody");
    blockRows.forEach(function (g) {
      blkBody.appendChild(el("tr", null, [
        el("td", { text: g.key }),
        el("td", { class: "n", text: String(g.n) }),
        el("td", { class: "n", text: String(g.right) }),
        el("td", { class: "n", text: PMP.fmt.duration(g.ms / 1000) }),
        el("td", { class: "n", text: Math.round(g.ms / g.n / 1000) + "s" })
      ]));
    });
    blkTbl.appendChild(blkBody);
    timeCard.appendChild(blkTbl);
    host.appendChild(timeCard);

    /* Next actions */
    var missedIds = missed.map(function (r) { return r.qid; });
    var actions = el("div", { style: "display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-top:var(--sp-3)" });
    if (missedIds.length) {
      actions.appendChild(el("button", {
        class: "btn btn--primary", type: "button",
        onclick: function () { sendToQueue(missedIds); }
      }, [icon("target"), "Send the " + missedIds.length + " you missed to the drill queue"]));
      actions.appendChild(el("button", {
        class: "btn", type: "button",
        onclick: function () {
          var qs = missedIds.map(function (id) { return PMP.Content.byId(id); }).filter(Boolean);
          PMP.Router.navigate("practice");
          setTimeout(function () { PMP.Practice.startWith(PMP.rng.shuffle(qs).items, "practice"); }, 0);
        }
      }, "Drill them now"));
    }
    actions.appendChild(el("button", {
      class: "btn", type: "button", onclick: function () { reviewing = null; repaint(); }
    }, "Back to mock exams"));

    host.appendChild(el("div", { class: "card" }, [
      el("span", { class: "eyebrow", text: "Next" }),
      el("h2", { text: missedIds.length ? "The " + missedIds.length + " you did not get" : "Nothing was missed" }),
      el("p", { text: "The drill queue is a list waiting on the Practice page. It survives a reload, so you can send a sitting's misses to it now and work through them over the next few days without having to find them again." }),
      actions
    ]));

    host.appendChild(renderReview(record));
  }

  function sendToQueue(ids) {
    PMP.Store.commit(["queue"], function (s) {
      var have = Object.create(null);
      s.queue.forEach(function (id) { have[id] = true; });
      ids.forEach(function (id) { if (!have[id]) { s.queue.push(id); have[id] = true; } });
    });
    PMP.UI.toast(PMP.fmt.plural(ids.length, "question") + " sent to the drill queue on the Practice page.", "ok");
  }

  /* ── 10.03.13  REVIEW ────────────────────────────────────────────────────
     The sitting is rebuilt from its seed, so the review shows the options in
     the order they were on screen rather than a fresh shuffle. */
  function renderReview(record) {
    var card = el("div", { class: "card" }, [
      el("span", { class: "eyebrow", text: "Review" }),
      el("h2", { text: "Every question, with the reasoning" }),
      el("p", { text: "Wrong answers are open, right ones are collapsed." })
    ]);

    var missing = missingIds(record);
    if (missing.length) {
      card.appendChild(PMP.UI.empty("This sitting cannot be replayed",
        PMP.fmt.plural(missing.length, "question") + " from it is no longer in this build, so the paper cannot be put back the way it was. The scores above are unaffected.", "alert"));
      return card;
    }

    var rand = PMP.rng.seeded(record.seed);
    record.qids.forEach(function (qid, idx) {
      var q = PMP.Content.byId(qid);
      var p = PMP.QRender.present(q, { rand: rand, shuffle: record.shuffle });
      var row = record.rows[idx] || {};
      var value = record.answers[qid];
      var res = row.answered ? PMP.QRender.score(q, p, value) : null;

      var body = el("div");
      var det = el("details", { class: "review" }, [
        el("summary", null, [
          el("span", { class: "n", text: String(idx + 1) }),
          el("span", {
            class: "chip " + (row.correct ? "chip--correct" : row.answered ? "chip--incorrect" : ""),
            text: row.correct ? "Right" : row.answered ? "Wrong" : "No answer"
          }),
          row.pretest ? el("span", { class: "chip", text: "Pretest" }) : null,
          row.flagged ? el("span", { class: "chip chip--flagged", text: "Flagged" }) : null,
          el("span", { class: "s", text: q.stem })
        ]),
        el("div", { class: "review-bd" }, [body])
      ]);

      /* Rendered lazily: 180 panels built up front is a long freeze, and most
         of them are never opened. */
      var built = false;
      on(det, "toggle", function () {
        if (built || !det.open) return;
        built = true;
        var task = PMP.ECO_TASK_BY_ID[q.ecoTask];
        body.appendChild(el("div", { class: "q-meta" }, [
          el("span", { class: "chip", text: PMP.ECO.DOMAIN_LABELS[q.domain] || q.domain }),
          task ? el("span", { class: "chip", text: task.label }) : null,
          q.approach ? el("span", { class: "chip", text: PMP.ECO.APPROACH_LABELS[q.approach] }) : null,
          q.difficulty ? el("span", { class: "chip", text: "Difficulty " + q.difficulty }) : null,
          el("span", { class: "chip", text: PMP.fmt.duration((row.ms || 0) / 1000) + " spent" })
        ]));
        body.appendChild(el("p", { class: "q-stem", text: q.stem }));
        var mount = el("div");
        body.appendChild(mount);
        var ctrl = PMP.QRender.render(p, q, mount, { nonce: "rev" + idx });
        if (row.answered && ctrl.set) ctrl.set(value);
        if (res) ctrl.reveal(res);
        else {
          ctrl.reveal(PMP.QRender.score(q, p, p.type === "matching" || p.type === "fillblank" ? {} : []));
          body.appendChild(el("div", { class: "verdict verdict--wrong" }, [
            icon("alert"),
            el("div", null, [el("div", { class: "t", text: "You did not answer this one" }),
                             el("div", { class: "d", text: "It was marked wrong, which is what happens on the day. There is no penalty for guessing, so an unanswered question is always the worse of the two." })])
          ]));
        }
        if (q.explanation) {
          body.appendChild(el("div", { class: "explain" }, [
            el("h3", { text: "Why" }), el("p", { text: q.explanation })
          ]));
        }
        if (q.mindset) {
          body.appendChild(el("div", { class: "mindset" }, [
            el("h3", { text: "Mindset" }), el("p", { text: q.mindset })
          ]));
        }
      });

      if (row.answered && !row.correct) det.open = true;
      card.appendChild(det);
    });
    return card;
  }

  /* ── 10.03.14  HISTORY AND INTRO ─────────────────────────────────────── */
  function renderIntro(host) {
    var state = PMP.Store.state;
    var pool = PMP.Content.all().length;
    var L = layoutFor(Math.min(pool, E.TOTAL_ITEMS));
    var saved = resumable();

    host.appendChild(el("div", { class: "view-hd" }, [
      el("span", { class: "eyebrow", text: "\u00A73.3 \u00B7 Mock exam" }),
      el("h2", { text: "A full sitting, under exam conditions" }),
      el("p", { text: "One clock, two breaks, no feedback until you hand it in. The point is not the score; it is finding out what your judgement does at question 140 with forty minutes left." })
    ]));

    if (saved) {
      var mins = Math.round((Date.now() - saved.savedAt) / 60000);
      host.appendChild(el("div", { class: "card resume-card" }, [
        el("span", { class: "eyebrow", text: "Unfinished sitting" }),
        el("h2", { text: "You were on question " + (saved.i + 1) + " of " + saved.layout.items }),
        el("p", { text: "Saved " + (mins < 1 ? "less than a minute" : PMP.fmt.plural(mins, "minute")) + " ago, with " +
          PMP.fmt.clock(saved.layout.minutes * 60000 - saved.clockConsumed) + " left on the clock and " +
          PMP.fmt.plural(Object.keys(saved.answers).length, "answer") + " given." }),
        el("p", { class: "hint", text: "The clock does not run while the file is closed. It restarts from where it was when the sitting last saved, which is at most " + (AUTOSAVE_MS / 1000) + " seconds before the tab went away." }),
        el("div", { style: "display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-top:var(--sp-5)" }, [
          el("button", { class: "btn btn--primary", type: "button", onclick: resume }, [icon("timer"), "Resume the sitting"]),
          el("button", { class: "btn btn--danger", type: "button", onclick: discardSaved }, "Discard it")
        ])
      ]));
    }

    if (pool < MIN_ITEMS) {
      host.appendChild(PMP.UI.empty("Not enough questions for a sitting",
        "A mock exam needs at least " + MIN_ITEMS + " questions and this build has " + pool + ". Import a pack from Backup and packs.", "book"));
    } else {
      var setup = el("div", { class: "card" }, [
        el("span", { class: "eyebrow", text: "This sitting" }),
        el("h2", { text: L.full ? "Full length" : "Scaled to the pack you have" }),
        el("dl", { class: "kv", style: "margin-top:var(--sp-4)" }, [
          el("dt", { text: "Questions" }), el("dd", { class: "num", text: String(L.items) + " (" + L.scored + " scored, " + (L.items - L.scored) + " pretest)" }),
          el("dt", { text: "Time" }), el("dd", { class: "num", text: L.minutes + " minutes" }),
          el("dt", { text: "Pace" }), el("dd", { class: "num", text: L.paceSec.toFixed(1) + "s per question" }),
          el("dt", { text: "Break 1" }), el("dd", { class: "num", text: "after question " + L.break1After }),
          el("dt", { text: "Break 2" }), el("dd", { class: "num", text: "after question " + L.break2After }),
          el("dt", { text: "Break length" }), el("dd", { class: "num", text: PMP.fmt.plural(L.breakMinutes, "minute") }),
          el("dt", { text: "Mix" }), el("dd", { text: "People " + PMP.fmt.pct(PMP.ECO.DOMAIN_WEIGHTS.people) + " \u00B7 Process " + PMP.fmt.pct(PMP.ECO.DOMAIN_WEIGHTS.process) + " \u00B7 Business " + PMP.fmt.pct(PMP.ECO.DOMAIN_WEIGHTS.business) })
        ])
      ]);
      if (!L.full) {
        setup.appendChild(el("p", { class: "lock-warn", style: "margin-top:var(--sp-4)",
          text: "The published exam is " + E.TOTAL_ITEMS + " questions in " + E.MINUTES + " minutes. This build has " + pool + " questions, so a full-length sitting would have to ask you some of them twice. It is scaled instead: same pace, same break structure, fewer items." }));
      }
      setup.appendChild(el("div", { style: "display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-top:var(--sp-5)" }, [
        el("button", { class: "btn btn--primary", type: "button", disabled: !!saved, onclick: startNew }, [icon("timer"), "Start a sitting"])
      ]));
      if (saved) setup.appendChild(el("p", { class: "hint", text: "Finish or discard the unfinished sitting above before starting another." }));
      host.appendChild(setup);
    }

    /* History */
    var exams = (state.exams || []).slice().sort(function (a, b) {
      return new Date(b.finishedAt) - new Date(a.finishedAt);
    });
    var hist = el("div", { class: "card" }, [el("span", { class: "eyebrow", text: "Sitting history" })]);
    if (!exams.length) {
      hist.appendChild(el("p", { text: "No sittings yet. The first one is worth doing early and badly rather than late and well: it tells you where the gaps are while there is still time to close them." }));
    } else {
      var tbl = el("table", { class: "tbl" }, [
        el("thead", null, [el("tr", null, [
          el("th", { text: "Date" }), el("th", { class: "n", text: "Score" }),
          el("th", { text: "Band" }), el("th", { class: "n", text: "Items" }),
          el("th", { class: "n", text: "Time" }), el("th", { text: "" })
        ])])
      ]);
      var body = el("tbody");
      exams.forEach(function (rec) {
        var band = bandFor(rec.score.pct, rec.score.of);
        body.appendChild(el("tr", null, [
          el("td", { text: PMP.fmt.dateShort(rec.finishedAt) }),
          el("td", { class: "n", text: PMP.fmt.pct(rec.score.pct) }),
          el("td", null, [el("span", { class: "chip band band--" + band.id, text: band.label })]),
          el("td", { class: "n", text: rec.score.right + " / " + rec.score.of }),
          el("td", { class: "n", text: PMP.fmt.duration(rec.elapsedMs / 1000) }),
          el("td", null, [el("button", {
            class: "btn btn--sm", type: "button",
            onclick: function () { reviewing = rec.id; repaint(); }
          }, "Open")])
        ]));
      });
      tbl.appendChild(body);
      hist.appendChild(tbl);
      if (exams.length > 1) {
        var first = exams[exams.length - 1], last = exams[0];
        var delta = last.score.pct - first.score.pct;
        hist.appendChild(el("p", { style: "margin-top:var(--sp-4)", text:
          "Between your first sitting and your most recent one the score has moved " +
          (delta >= 0 ? "up " : "down ") + PMP.fmt.pct(Math.abs(delta)) + ". One sitting is noise; the direction across three or more is the signal." }));
      }
    }
    host.appendChild(hist);
  }

  /* ── 10.03.15  ROUTE AND GUARD ───────────────────────────────────────── */
  function view(host, params) {
    cleanup();
    if (live && !live.run.finished) return renderSitting(host);
    if (reviewing) {
      var rec = (PMP.Store.state.exams || []).filter(function (r) { return r.id === reviewing; })[0];
      if (rec) return renderResults(host, rec);
      reviewing = null;
    }
    return renderIntro(host);
  }

  PMP.Router.register("exam", { title: "Mock exam", render: view });

  /* Navigation away from a live sitting is refused rather than confirmed. A
     confirm gives the candidate a way to look something up and come back,
     which is exactly the habit a mock is meant to break. */
  PMP.Router.addGuard(function (to) {
    if (!live || live.run.finished) return null;
    if (to.name === "exam") return null;
    return "The mock exam is running. Use End exam if you want to stop \u2014 everything you have answered is saved.";
  });

  return {
    layoutFor: layoutFor,
    resumable: resumable,
    resume: resume,
    discardSaved: discardSaved,
    BANDS: BANDS,
    bandFor: bandFor,
    get active() { return !!(live && !live.run.finished); }
  };
})();

/* ── 10.13  DATA PORTABILITY ────────────────────────────────────────────────
   Both directions, for both kinds of file: progress out and back in, question
   packs out and back in. Four decisions worth knowing:

   · Nothing is applied until it has been validated and the person has seen
     what it will change. Import is a two-step: read and report, then apply.
     A file that fails validation never reaches PMP.Store at all.

   · Errors are indexed and name the field, per acceptance test 8. A pack with
     forty problems produces forty lines that each say where. "Invalid pack"
     with no location is not a usable error message when the fix is in someone
     else's JSON.

   · Merge is the default and replace is the one that asks twice. Merging is
     union-by-id for the list slices and last-write-wins for the map ones, and
     the summary says which of those is about to happen to how many records.

   · Every reader accepts a pasted string as well as a file. file:// input
     elements are blocked or awkward in enough places that a paste box is not
     a fallback here, it is a first-class route in.
   ═════════════════════════════════════════════════════════════════════════ */
PMP.Data = (function () {
  var el = PMP.dom.el, icon = PMP.dom.icon, on = PMP.dom.on, frag = PMP.dom.frag;

  var MAX_SHOWN_ERRORS = 60;

  /* ── 10.13.1  READING A FILE OR A PASTE ──────────────────────────────── */
  function readFile(file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(String(fr.result)); };
      fr.onerror = function () { reject(new Error("The file could not be read.")); };
      fr.readAsText(file);
    });
  }

  function picker(label, onText) {
    var input = el("input", {
      type: "file", accept: "application/json,.json", class: "sr-only", id: "pick-" + Math.random().toString(36).slice(2)
    });
    on(input, "change", function () {
      var f = input.files && input.files[0];
      if (!f) return;
      readFile(f).then(onText, function (e) { PMP.UI.toast(e.message, "err"); });
      input.value = "";
    });
    var btn = el("button", { class: "btn", type: "button", onclick: function () { input.click(); } },
      [icon("data"), label]);
    return el("span", null, [input, btn]);
  }

  function pasteBox(placeholderLabel) {
    return el("textarea", {
      class: "textarea", spellcheck: "false", "aria-label": placeholderLabel,
      placeholder: "Paste the contents of the file here"
    });
  }

  /* ── 10.13.2  ERROR REPORTING ────────────────────────────────────────────
     One row per problem: the index or field path exactly as the validator
     produced it, then the sentence. Sorted the way they appear in the file,
     which is the order someone fixing them will work in. */
  function errorList(rows, kind) {
    var tbl = el("table", { class: "tbl err-tbl" }, [
      el("thead", null, [el("tr", null, [
        el("th", { text: "#" }),
        el("th", { text: "Where" }),
        el("th", { text: kind === "warn" ? "Warning" : "Problem" })
      ])])
    ]);
    var body = el("tbody");
    rows.slice(0, MAX_SHOWN_ERRORS).forEach(function (r, i) {
      body.appendChild(el("tr", null, [
        el("td", { class: "n", text: String(i + 1) }),
        el("td", null, [el("code", { class: "where", text: r.where })]),
        el("td", { text: r.msg })
      ]));
    });
    tbl.appendChild(body);
    var wrap = el("div", null, [tbl]);
    if (rows.length > MAX_SHOWN_ERRORS) {
      wrap.appendChild(el("p", { class: "hint", text: "Showing the first " + MAX_SHOWN_ERRORS + " of " + rows.length + ". Fix these and read the file again; the rest are listed the same way." }));
    }
    return wrap;
  }

  function reportFailure(title, result, lead) {
    PMP.UI.sheet({
      title: title,
      body: frag([
        el("p", { text: lead }),
        el("p", { text: PMP.fmt.plural(result.errors.length, "problem") + " stopped it. Nothing has been changed." }),
        errorList(result.errors, "err"),
        result.warnings.length ? el("p", { style: "margin-top:var(--sp-4)", text: "There " + (result.warnings.length === 1 ? "is also 1 warning" : "are also " + result.warnings.length + " warnings") + ":" }) : null,
        result.warnings.length ? errorList(result.warnings, "warn") : null
      ]),
      actions: [{ id: "close", label: "Close", primary: true }]
    });
  }

  /* ── 10.13.3  PROGRESS OUT ───────────────────────────────────────────── */
  function exportProgress() { return PMP.Exporter.exportProgress(); }

  /* ── 10.13.4  PROGRESS IN ────────────────────────────────────────────────
     The list slices are unioned by id, so importing the same backup twice
     does not double anyone's attempt history. The map slices take the
     incoming value on a clash, which is the only rule that behaves sensibly
     when the file is newer than the device. Replace wipes first. */
  var LIST_SLICES = ["attempts", "exams", "journal", "issues"];
  var MAP_SLICES = ["srs", "notes", "flags"];
  var WHOLE_SLICES = ["settings", "planner", "packs", "queue", "examRun"];

  function planProgressMerge(obj) {
    var state = PMP.Store.state;
    var plan = { rows: [], newRecords: 0, updated: 0 };

    LIST_SLICES.forEach(function (k) {
      var incoming = Array.isArray(obj[k]) ? obj[k] : null;
      if (!incoming) { plan.rows.push({ slice: k, note: "not in the file, kept as is", add: 0, keep: (state[k] || []).length }); return; }
      var have = Object.create(null);
      (state[k] || []).forEach(function (r) { if (r && r.id) have[r.id] = true; });
      var add = incoming.filter(function (r) { return r && r.id && !have[r.id]; }).length;
      var dupe = incoming.length - add;
      plan.newRecords += add;
      plan.rows.push({ slice: k, add: add, keep: (state[k] || []).length, dupe: dupe,
        note: add + " new, " + dupe + " already here" });
    });

    MAP_SLICES.forEach(function (k) {
      var incoming = obj[k] && typeof obj[k] === "object" ? obj[k] : null;
      if (!incoming) { plan.rows.push({ slice: k, note: "not in the file, kept as is", add: 0, keep: Object.keys(state[k] || {}).length }); return; }
      var keys = Object.keys(incoming);
      var over = keys.filter(function (kk) { return (state[k] || {})[kk] !== undefined; }).length;
      plan.newRecords += keys.length - over;
      plan.updated += over;
      plan.rows.push({ slice: k, add: keys.length - over, keep: Object.keys(state[k] || {}).length, dupe: over,
        note: (keys.length - over) + " new, " + over + " overwritten by the file" });
    });

    WHOLE_SLICES.forEach(function (k) {
      if (!(k in obj)) { plan.rows.push({ slice: k, note: "not in the file, kept as is" }); return; }
      plan.rows.push({ slice: k, note: "kept as is unless you choose Replace" });
    });

    return plan;
  }

  function applyProgress(obj, mode) {
    var keys = PMP.STORE_CFG.PERSISTED.slice();
    PMP.Store.commit(keys, function (s) {
      if (mode === "replace") {
        var fresh = PMP.Store.defaults();
        keys.forEach(function (k) { s[k] = (k in obj && obj[k] != null) ? obj[k] : fresh[k]; });
        return;
      }
      LIST_SLICES.forEach(function (k) {
        if (!Array.isArray(obj[k])) return;
        var have = Object.create(null);
        (s[k] || []).forEach(function (r) { if (r && r.id) have[r.id] = true; });
        obj[k].forEach(function (r) { if (r && r.id && !have[r.id]) { s[k].push(r); have[r.id] = true; } });
      });
      MAP_SLICES.forEach(function (k) {
        if (!obj[k] || typeof obj[k] !== "object") return;
        Object.keys(obj[k]).forEach(function (kk) { s[k][kk] = obj[k][kk]; });
      });
    });
    PMP.Store.flush();
  }

  function importProgress(text) {
    var parsed = PMP.validate.parseJSON(text);
    if (!parsed.ok) {
      PMP.UI.sheet({
        title: "That file could not be read",
        body: frag([
          el("p", { text: parsed.error }),
          el("p", { text: "A progress file is the JSON this app exports. If you copied it out of a text editor, check that the whole thing came across, including the closing brace." })
        ]),
        actions: [{ id: "close", label: "Close", primary: true }]
      });
      return;
    }

    var result = PMP.validate.progress(parsed.value);
    if (!result.ok()) {
      reportFailure("That progress file was refused", result,
        "It parsed as JSON, but it is not a progress backup this build can read.");
      return;
    }

    var obj = parsed.value;
    var plan = planProgressMerge(obj);
    var tbl = el("table", { class: "tbl" }, [
      el("thead", null, [el("tr", null, [
        el("th", { text: "Section" }), el("th", { class: "n", text: "Here now" }), el("th", { text: "What merging does" })
      ])])
    ]);
    var body = el("tbody");
    plan.rows.forEach(function (r) {
      body.appendChild(el("tr", null, [
        el("td", { text: r.slice }),
        el("td", { class: "n", text: r.keep === undefined ? "\u2014" : String(r.keep) }),
        el("td", { text: r.note })
      ]));
    });
    tbl.appendChild(body);

    PMP.UI.sheet({
      title: "Import this backup?",
      body: frag([
        el("p", { text: "Exported " + PMP.fmt.dateShort(obj.exportedAt) + ", schema v" + obj.schemaVersion + "." }),
        el("p", { text: "Merging adds " + PMP.fmt.plural(plan.newRecords, "record") + " and overwrites " + plan.updated + " where the same note, flag or card exists in both. Replacing throws away everything on this device first." }),
        tbl,
        result.warnings.length ? el("p", { style: "margin-top:var(--sp-4)", text: "Warnings:" }) : null,
        result.warnings.length ? errorList(result.warnings, "warn") : null
      ]),
      actions: [
        { id: "cancel", label: "Cancel" },
        { id: "replace", label: "Replace everything", danger: true },
        { id: "merge", label: "Merge", primary: true }
      ]
    }).then(function (choice) {
      if (choice === "merge") {
        applyProgress(obj, "merge");
        PMP.UI.toast("Merged " + PMP.fmt.plural(plan.newRecords, "record") + ".", "ok");
        PMP.Router.navigate("data", null, true);
      } else if (choice === "replace") {
        PMP.UI.confirm("Replace everything on this device?",
          "Every attempt, sitting, note, flag and card schedule here is deleted and replaced by the contents of the file. This cannot be undone.",
          "Replace it all", true).then(function (yes) {
          if (!yes) return;
          applyProgress(obj, "replace");
          PMP.UI.toast("Progress replaced from the file.", "ok");
          PMP.Router.navigate("data", null, true);
        });
      }
    });
  }

  /* ── 10.13.5  PACKS OUT ──────────────────────────────────────────────────
     The pack that comes out is the pack the validator accepts going back in,
     which is what makes the format checkable rather than merely documented. */
  function packObject(questions, name) {
    return {
      type: "pmp-pack",
      schemaVersion: PMP.STORE_CFG.SCHEMA_VERSION,
      ecoVersion: PMP.ECO.VERSION,
      name: name || "PMP Prep Suite content",
      exportedAt: new Date().toISOString(),
      questions: questions
    };
  }

  function exportPack() {
    var text;
    try { text = JSON.stringify(packObject(PMP.Content.all(), "PMP Prep Suite \u2014 full pack"), null, 2); }
    catch (e) { PMP.UI.toast("The pack could not be written out.", "err"); return; }
    PMP.Exporter.offer(text, PMP.Exporter.filename("pmp-pack"), "Export question pack");
  }

  /* ── 10.13.6  PACKS IN ───────────────────────────────────────────────── */
  function importPack(text) {
    var parsed = PMP.validate.parseJSON(text);
    if (!parsed.ok) {
      PMP.UI.sheet({
        title: "That pack could not be read",
        body: el("p", { text: parsed.error }),
        actions: [{ id: "close", label: "Close", primary: true }]
      });
      return;
    }

    var obj = parsed.value;
    var result = PMP.validate.pack(obj);
    if (!result.ok()) {
      reportFailure("That pack was refused", result,
        "Every problem below names the item by its index in the file and the field inside it. Nothing from this pack has been added.");
      return;
    }

    /* Summary of what is about to arrive, by domain and by type, plus how
       many ids are already here and will therefore be skipped. */
    var qs = obj.questions;
    var dupes = qs.filter(function (q) { return PMP.Content.has(q.id); });
    var fresh = qs.length - dupes.length;
    var byDomain = Object.create(null), byType = Object.create(null), tasks = Object.create(null);
    qs.forEach(function (q) {
      byDomain[q.domain] = (byDomain[q.domain] || 0) + 1;
      byType[PMP.QRender.base(q.type)] = (byType[PMP.QRender.base(q.type)] || 0) + 1;
      tasks[q.ecoTask] = true;
    });

    var summary = el("dl", { class: "kv", style: "margin-top:var(--sp-3)" }, [
      el("dt", { text: "Name" }), el("dd", { text: obj.name || "unnamed pack" }),
      el("dt", { text: "Questions" }), el("dd", { class: "num", text: String(qs.length) }),
      el("dt", { text: "New here" }), el("dd", { class: "num", text: String(fresh) }),
      el("dt", { text: "Already here" }), el("dd", { class: "num", text: String(dupes.length) }),
      el("dt", { text: "ECO tasks" }), el("dd", { class: "num", text: Object.keys(tasks).length + " of " + PMP.ECO.TASK_COUNT }),
      el("dt", { text: "Outline" }), el("dd", { text: obj.ecoVersion || "not stated" }),
      el("dt", { text: "Domains" }), el("dd", { text: PMP.ECO.DOMAINS.map(function (d) {
        return PMP.ECO.DOMAIN_LABELS[d] + " " + (byDomain[d] || 0);
      }).join(" \u00B7 ") }),
      el("dt", { text: "Types" }), el("dd", { text: Object.keys(byType).map(function (t) {
        return PMP.QRender.label(t) + " " + byType[t];
      }).join(" \u00B7 ") })
    ]);

    PMP.UI.sheet({
      title: "Add this pack?",
      body: frag([
        el("p", { text: "The pack passed validation. Items whose id is already in this build are skipped rather than overwritten, so a pack cannot quietly change a question you have answer history against." }),
        summary,
        result.warnings.length ? el("p", { style: "margin-top:var(--sp-4)", text: "Warnings, which do not block the import:" }) : null,
        result.warnings.length ? errorList(result.warnings, "warn") : null
      ]),
      actions: [{ id: "cancel", label: "Cancel" }, { id: "add", label: "Add " + fresh + " questions", primary: true, icon: "book" }]
    }).then(function (choice) {
      if (choice !== "add") return;
      var res = PMP.Content.add(qs);
      var rec = {
        id: PMP.rng.id("pack"),
        name: obj.name || "Imported pack",
        importedAt: new Date().toISOString(),
        ecoVersion: obj.ecoVersion || null,
        count: res.added,
        questions: qs.filter(function (q) { return res.duplicates.indexOf(q.id) < 0; })
      };
      PMP.Store.commit(["packs"], function (s) { s.packs.push(rec); });
      PMP.Store.flush();
      PMP.UI.toast("Added " + PMP.fmt.plural(res.added, "question") + "." +
        (res.duplicates.length ? " " + res.duplicates.length + " skipped as duplicates." : ""), "ok");
      PMP.Router.navigate("data", null, true);
    });
  }

  function removePack(id) {
    var rec = (PMP.Store.state.packs || []).filter(function (p) { return p.id === id; })[0];
    if (!rec) return;
    PMP.UI.confirm("Remove \u201C" + rec.name + "\u201D?",
      "Its " + PMP.fmt.plural(rec.count, "question") + " leaves this build. Your answer history against them is kept, and those attempts still count towards accuracy, but the questions themselves will not appear in drills or sittings until the pack is imported again.",
      "Remove the pack", true).then(function (yes) {
      if (!yes) return;
      PMP.Content.remove((rec.questions || []).map(function (q) { return q.id; }));
      PMP.Store.commit(["packs"], function (s) {
        s.packs = s.packs.filter(function (p) { return p.id !== id; });
      });
      PMP.UI.toast("Pack removed.", "ok");
      PMP.Router.navigate("data", null, true);
    });
  }

  /* Applied at boot, after hydrate, before the first render. */
  function loadStoredPacks() {
    var packs = PMP.Store.state.packs || [];
    var total = 0;
    packs.forEach(function (p) { total += PMP.Content.add(p.questions || []).added; });
    return total;
  }

  /* ── 10.13.7  VIEW ───────────────────────────────────────────────────── */
  function importCard(cfg) {
    var box = pasteBox(cfg.label);
    var readBtn = el("button", {
      class: "btn btn--primary", type: "button",
      onclick: function () {
        var t = box.value.trim();
        if (!t) { PMP.UI.toast("Paste the file's contents into the box first, or choose a file.", "warn"); return; }
        cfg.onText(t);
      }
    }, [icon("check"), "Read what is in the box"]);

    return el("div", { class: "card" }, [
      el("span", { class: "eyebrow", text: cfg.eyebrow }),
      el("h2", { text: cfg.title }),
      el("p", { text: cfg.blurb }),
      el("div", { style: "display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-top:var(--sp-4)" }, [
        picker(cfg.pickLabel, cfg.onText)
      ]),
      el("p", { class: "hint", style: "margin-top:var(--sp-3)", text: "Or paste the file's contents:" }),
      box,
      el("div", { style: "display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-top:var(--sp-3)" }, [readBtn])
    ]);
  }

  function view(host) {
    var state = PMP.Store.state;

    host.appendChild(el("div", { class: "view-hd" }, [
      el("span", { class: "eyebrow", text: "\u00A73.13 \u00B7 Backup and packs" }),
      el("h2", { text: "Your data goes both ways" }),
      el("p", { text: "Everything this app knows about you lives on this device and travels in a file you control. Nothing is sent anywhere: the file makes no network requests at all." })
    ]));

    host.appendChild(el("div", { class: "card" }, [
      el("span", { class: "eyebrow", text: "Where your progress lives" }),
      el("dl", { class: "kv", style: "margin-top:var(--sp-3)" }, [
        el("dt", { text: "Storage" }), el("dd", { text: state.sys.storageMode === "persistent" ? (state.sys.storageTier === "idb" ? "IndexedDB" : "Local storage") : "Memory only" }),
        el("dt", { text: "Schema" }), el("dd", { text: "v" + state.sys.schemaVersion }),
        el("dt", { text: "Questions loaded" }), el("dd", { class: "num", text: String(PMP.Content.all().length) }),
        el("dt", { text: "Attempts" }), el("dd", { class: "num", text: String(state.attempts.length) }),
        el("dt", { text: "Mock sittings" }), el("dd", { class: "num", text: String(state.exams.length) }),
        el("dt", { text: "Cards in schedule" }), el("dd", { class: "num", text: String(Object.keys(state.srs).length) }),
        el("dt", { text: "Drill queue" }), el("dd", { class: "num", text: String((state.queue || []).length) })
      ]),
      el("div", { style: "display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-top:var(--sp-5)" }, [
        el("button", { class: "btn btn--primary", type: "button", onclick: exportProgress }, [icon("data"), "Export progress"]),
        el("button", { class: "btn", type: "button", onclick: exportPack }, [icon("book"), "Export question pack"])
      ])
    ]));

    host.appendChild(importCard({
      eyebrow: "Import \u00B7 progress",
      title: "Restore a backup",
      blurb: "Merging adds anything the file has that this device does not, and never duplicates a record you already have. Replacing deletes everything here first, and asks twice before it does.",
      pickLabel: "Choose a progress file",
      label: "Progress backup JSON",
      onText: importProgress
    }));

    host.appendChild(importCard({
      eyebrow: "Import \u00B7 questions",
      title: "Add a question pack",
      blurb: "Every item is checked before anything is added: type, domain, ECO task, stem, explanation, a rationale on every option, and the pieces each question type needs. Anything wrong is reported with its index in the file and the field it is in.",
      pickLabel: "Choose a pack file",
      label: "Question pack JSON",
      onText: importPack
    }));

    var packs = state.packs || [];
    var pcard = el("div", { class: "card" }, [el("span", { class: "eyebrow", text: "Imported packs" })]);
    if (!packs.length) {
      pcard.appendChild(el("p", { text: "None. The " + PMP.Content.all().length + " questions in this build are the ones it shipped with." }));
    } else {
      var tbl = el("table", { class: "tbl" }, [
        el("thead", null, [el("tr", null, [
          el("th", { text: "Pack" }), el("th", { class: "n", text: "Items" }),
          el("th", { text: "Imported" }), el("th", { text: "Outline" }), el("th", { text: "" })
        ])])
      ]);
      var tb = el("tbody");
      packs.forEach(function (p) {
        tb.appendChild(el("tr", null, [
          el("td", { text: p.name }),
          el("td", { class: "n", text: String(p.count) }),
          el("td", { text: PMP.fmt.dateShort(p.importedAt) }),
          el("td", { text: p.ecoVersion || "\u2014" }),
          el("td", null, [el("button", { class: "btn btn--sm", type: "button", onclick: function () { removePack(p.id); } }, "Remove")])
        ]));
      });
      tbl.appendChild(tb);
      pcard.appendChild(tbl);
    }
    host.appendChild(pcard);

    /* Schema documentation. A format nobody can write to is not portable. */
    host.appendChild(el("div", { class: "card" }, [
      el("span", { class: "eyebrow", text: "\u00A75 \u00B7 Pack format, schema v2" }),
      el("p", { text: "A pack is one JSON object. Every question needs an id unique within the file, a type, a domain, an ECO task id from the outline this build targets, a stem, an explanation, and a rationale on every option \u2014 including the ones nobody should choose, because those are the instructive ones." }),
      el("pre", { class: "code", text: SAMPLE }),
      el("div", { style: "display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-top:var(--sp-4)" }, [
        el("button", {
          class: "btn", type: "button",
          onclick: function () {
            PMP.Exporter.copyText(SAMPLE).then(function (ok) {
              PMP.UI.toast(ok ? "Sample pack copied." : "Copying was blocked. Select the text and copy it manually.", ok ? "ok" : "warn");
            });
          }
        }, [icon("clip"), "Copy the sample"]),
        el("button", {
          class: "btn", type: "button",
          onclick: function () { importPack(SAMPLE); }
        }, "Validate the sample")
      ])
    ]));

    host.appendChild(el("div", { class: "card" }, [
      el("span", { class: "eyebrow", text: "Danger" }),
      el("h2", { text: "Delete everything" }),
      el("p", { text: "Removes every attempt, sitting, note, flag, report and card schedule from this device. Export a backup first if any of it matters." }),
      el("div", { style: "margin-top:var(--sp-4)" }, [
        el("button", {
          class: "btn btn--danger", type: "button",
          onclick: function () {
            PMP.UI.confirm("Delete all progress?",
              "Every attempt, flashcard schedule, note and mock sitting is removed from this device. Imported packs go with them. This cannot be undone.",
              "Delete everything", true).then(function (yes) {
              if (!yes) return;
              PMP.Store.clearAll().then(function () {
                PMP.UI.toast("All progress deleted.", "ok");
                PMP.Router.navigate("data", null, true);
              });
            });
          }
        }, "Delete all progress")
      ])
    ]));
  }

  var SAMPLE = JSON.stringify({
    type: "pmp-pack",
    schemaVersion: 2,
    ecoVersion: PMP.ECO.VERSION,
    name: "Example pack",
    questions: [{
      id: "example-001",
      type: "single",
      domain: "process",
      ecoTask: "process-8",
      approach: "predictive",
      difficulty: 3,
      tags: ["schedule"],
      stem: "A stem long enough to describe a situation, not a definition lookup.",
      options: [
        { id: "a", text: "The answer that is right.", correct: true, rationale: "Why it is right." },
        { id: "b", text: "The answer that is tempting.", correct: false, rationale: "Why it is tempting and why it is still wrong." }
      ],
      explanation: "The rule the item turns on, stated so it transfers to the next item like it.",
      mindset: "Optional. One sentence naming the disposition behind the rule."
    }]
  }, null, 2);

  PMP.Router.register("data", { title: "Backup and packs", render: view });

  return {
    importProgress: importProgress, importPack: importPack,
    exportPack: exportPack, loadStoredPacks: loadStoredPacks,
    packObject: packObject
  };
})();

/* ── 10.14  CONTENT AUDIT ───────────────────────────────────────────────────
   A build-time self-check that ships with the build. It is not a study
   feature and does not pretend to be one: it exists so that a claim about the
   content can be tested rather than asserted.

   Acceptance test 10 is the whole point of this panel. Read as: the shipped
   pack passes every content rule in §4 and §3.5, with no failures, and the
   panel is what proves it — on the reader's machine, against the pack that is
   actually loaded, rather than against a spreadsheet somebody kept alongside.

   Two deliberate separations:

   · Failures are things that are wrong. Gaps are things that are missing.
     An item with no rationale on a distractor is a failure and the build does
     not ship. A task with three questions against a floor of four is a gap:
     the content is correct, there is just not enough of it yet, and calling
     that a failure would make the panel cry wolf for the whole of Phase 1.

   · The structural rules run through PMP.validate.pack — the same validator
     an imported pack goes through in §10.13. If the shipped content would not
     survive its own import, that is worth knowing, and running two different
     checkers would eventually let it happen.
   ═════════════════════════════════════════════════════════════════════════ */
PMP.Audit = (function () {
  var el = PMP.dom.el, icon = PMP.dom.icon, frag = PMP.dom.frag;

  /* §4 authoring rules, as thresholds rather than prose so they are testable.
     Every number here is this build's own editorial standard. */
  var RULE = {
    MIN_STEM: 60,             /* a scenario, not a definition lookup */
    MIN_STEM_RECALL: 30,      /* fillblank and hotspot stems can be terser */
    MIN_EXPLANATION: 80,
    MIN_RATIONALE: 25,
    MIN_OPTIONS: 3,
    MAX_OPTIONS: 10,
    TASK_FLOOR: 4,            /* per ECO task, in the finished 300-item pack */
    TARGET_PACK: 300,
    MIX_TOLERANCE: 0.08       /* domain share may drift this far from the ECO */
  };

  /* ── 10.14.1  THE RULES ──────────────────────────────────────────────── */
  function audit(questions) {
    var out = { failures: [], gaps: [], checks: [], counts: {} };
    var qs = questions || [];

    function fail(where, msg) { out.failures.push({ where: where, msg: msg }); }
    function gap(where, msg) { out.gaps.push({ where: where, msg: msg }); }

    /* Structural pass: the import validator, run against the shipped pack. */
    var structural = PMP.validate.pack(PMP.Data.packObject(qs, "self-check"));
    structural.errors.forEach(function (e) { out.failures.push(e); });
    structural.warnings.forEach(function (w) { out.gaps.push(w); });
    out.checks.push({
      id: "structural",
      label: "Every item survives this build's own pack validator",
      n: qs.length,
      bad: structural.errors.length
    });

    /* Editorial pass. */
    var stemBad = 0, explBad = 0, ratBad = 0, optBad = 0, dupText = 0, phBad = 0, tagBad = 0, echoBad = 0;
    var stems = Object.create(null);

    qs.forEach(function (q, i) {
      var at = "questions[" + i + "]";
      var t = PMP.QRender.base(q.type);
      var minStem = (t === "fillblank" || t === "hotspot") ? RULE.MIN_STEM_RECALL : RULE.MIN_STEM;

      if (!q.stem || String(q.stem).trim().length < minStem) {
        fail(at + ".stem", "Stem is " + String(q.stem || "").trim().length + " characters; the floor for a " + PMP.QRender.label(q.type).toLowerCase() + " item is " + minStem + ".");
        stemBad++;
      }
      /* On a matching or drop-down item the stem is a standing instruction —
         "complete each sentence", "pair each item with its owner" — and two
         such items sharing that wording is correct authoring, not a copy and
         paste. What has to be distinct on those types is the prompt set, so
         that is what the key is built from. Every other type is keyed on the
         stem alone, where a repeat really is a duplicate. */
      var key = PMP.text.normalise(q.stem || "");
      if (PMP.QRender.base(q.type) === "matching") {
        key += " \u00a7 " + (q.prompts || []).map(function (pr) {
          return PMP.text.normalise(pr && pr.text || "");
        }).join(" | ");
      }
      if (key && stems[key] !== undefined) {
        fail(at + ".stem", "Duplicate stem \u2014 the same wording is at index " + stems[key] + ".");
        dupText++;
      } else if (key) stems[key] = i;

      if (!q.explanation || String(q.explanation).trim().length < RULE.MIN_EXPLANATION) {
        fail(at + ".explanation", "Explanation is " + String(q.explanation || "").trim().length + " characters; the floor is " + RULE.MIN_EXPLANATION + ". An explanation that does not state the transferable rule is not doing its job.");
        explBad++;
      }
      if (q.placeholder) {
        fail(at + ".placeholder", "Placeholder item. Placeholders exist to exercise the renderers and must not ship inside a content pack.");
        phBad++;
      }
      if (!Array.isArray(q.tags) || !q.tags.length) {
        gap(at + ".tags", "No tags, so this item cannot be found by the tag filter.");
        tagBad++;
      }
      if (!q.difficulty || q.difficulty < 1 || q.difficulty > 5) {
        fail(at + ".difficulty", "Difficulty must be 1 to 5; found " + JSON.stringify(q.difficulty) + ".");
      }
      if (!PMP.ECO.APPROACH_LABELS[q.approach]) {
        fail(at + ".approach", "Approach must be predictive, agile or hybrid; found " + JSON.stringify(q.approach) + ".");
      }

      /* Option-bearing types: count, distinctness, and a rationale on every
         one of them — the §3.5 rule that every distractor teaches. */
      if (Array.isArray(q.options) && q.options.length) {
        if (q.options.length < RULE.MIN_OPTIONS || q.options.length > RULE.MAX_OPTIONS) {
          fail(at + ".options", "An item carries " + RULE.MIN_OPTIONS + " to " + RULE.MAX_OPTIONS + " options; this one has " + q.options.length + ".");
          optBad++;
        }
        var seenText = Object.create(null);
        q.options.forEach(function (o, j) {
          var oat = at + ".options[" + j + "]";
          if (!o || !o.text) fail(oat + ".text", "Missing option text.");
          else {
            var ok = PMP.text.normalise(o.text);
            if (seenText[ok]) fail(oat + ".text", "Two options say the same thing.");
            seenText[ok] = true;
          }
          var r = String((o && o.rationale) || "").trim();
          if (r.length < RULE.MIN_RATIONALE) {
            fail(oat + ".rationale", "Rationale is " + r.length + " characters; the floor is " + RULE.MIN_RATIONALE + ". Every option needs its own reason, including the ones nobody should pick.");
            ratBad++;
          }
        });

        var corr = q.options.filter(function (o) { return o && o.correct; });
        if (t === "single" && corr.length !== 1) {
          fail(at + ".options", "A multiple-choice item needs exactly one correct option; found " + corr.length + ".");
        }
        if (t === "multi" && corr.length < 2) {
          fail(at + ".options", "A multiple-response item needs at least two correct options; found " + corr.length + ".");
        }
        /* An explanation that only repeats the winning option teaches nothing
           that transfers to the next item like it. */
        if (t === "single" && corr[0] && q.explanation) {
          var en = PMP.text.normalise(q.explanation), cn = PMP.text.normalise(corr[0].text);
          if (cn && en.indexOf(cn) >= 0 && en.length < cn.length * 1.6) {
            fail(at + ".explanation", "The explanation is close to a restatement of the correct option. It should give the rule, not the answer.");
            echoBad++;
          }
        }
      }

      /* Type-specific shape. */
      if (t === "matching") {
        (q.prompts || []).forEach(function (pr, j) {
          var m = (q.options || []).filter(function (o) { return String(o.match) === String(pr.id); });
          if (m.length !== 1) {
            fail(at + ".prompts[" + j + "]", "Each line needs exactly one option matched to it; found " + m.length + ".");
          }
        });
        if (!(q.prompts || []).length) fail(at + ".prompts", "A matching item needs prompts.");
      }
      if (t === "hotspot") {
        if (!(q.regions || []).length) fail(at + ".regions", "A hotspot item needs regions.");
        if (!q.graphic || !q.graphic.viewBox) fail(at + ".graphic", "A hotspot item needs a graphic with a viewBox.");
        if (!(q.regions || []).some(function (r) { return r.correct; })) {
          fail(at + ".regions", "No region is marked correct.");
        }
        (q.regions || []).forEach(function (r, j) {
          if (String((r && r.rationale) || "").trim().length < RULE.MIN_RATIONALE) {
            fail(at + ".regions[" + j + "].rationale", "Every region needs its own rationale.");
          }
        });
      }
      if (t === "fillblank") {
        if (!(q.blanks || []).length) fail(at + ".blanks", "A fill-in item needs blanks.");
        (q.blanks || []).forEach(function (b, j) {
          var bat = at + ".blanks[" + j + "]";
          if (!b.label) fail(bat + ".label", "Every blank needs a label.");
          if (b.numeric) {
            if (typeof b.expect !== "number") fail(bat + ".expect", "A numeric blank needs a numeric expect.");
            if (typeof b.tol !== "number") fail(bat + ".tol", "A numeric blank needs a tolerance, even if it is zero.");
          } else if (!Array.isArray(b.accept) || !b.accept.length) {
            fail(bat + ".accept", "A text blank needs an accept list.");
          }
          if (String(b.rationale || "").trim().length < RULE.MIN_RATIONALE) {
            fail(bat + ".rationale", "Every blank needs its own rationale.");
          }
        });
      }
    });

    out.checks.push({ id: "stem", label: "Stem long enough to pose a situation", n: qs.length, bad: stemBad });
    out.checks.push({ id: "dup", label: "No two items share a stem", n: qs.length, bad: dupText });
    out.checks.push({ id: "expl", label: "Explanation states the transferable rule", n: qs.length, bad: explBad });
    out.checks.push({ id: "rat", label: "A rationale on every option, right and wrong (\u00A73.5)", n: qs.length, bad: ratBad });
    out.checks.push({ id: "opt", label: "Option count and distinctness", n: qs.length, bad: optBad });
    out.checks.push({ id: "echo", label: "Explanation is not a restatement of the answer", n: qs.length, bad: echoBad });
    out.checks.push({ id: "ph", label: "No placeholder items in the pack", n: qs.length, bad: phBad });

    /* ── Coverage and mix ── */
    var perTask = Object.create(null), perDomain = Object.create(null), perApproach = Object.create(null), perType = Object.create(null);
    PMP.ECO_TASKS.forEach(function (t) { perTask[t.id] = 0; });
    qs.forEach(function (q) {
      if (perTask[q.ecoTask] !== undefined) perTask[q.ecoTask]++;
      perDomain[q.domain] = (perDomain[q.domain] || 0) + 1;
      perApproach[q.approach] = (perApproach[q.approach] || 0) + 1;
      var t = PMP.QRender.base(q.type);
      perType[t] = (perType[t] || 0) + 1;
    });

    var uncovered = PMP.ECO_TASKS.filter(function (t) { return perTask[t.id] === 0; });
    uncovered.forEach(function (t) {
      fail("coverage." + t.id, "No question is tagged to " + PMP.ECO.DOMAIN_LABELS[t.domain] + " task " + t.n + ", " + t.label + ". A task with nothing against it cannot be practised or scored.");
    });

    /* The floor scales with the pack. At 60 items a floor of four per task is
       arithmetically impossible, and reporting 26 failures for that would be
       noise. The absolute floor is reported as a gap against the target. */
    var scaledFloor = Math.max(1, Math.floor(qs.length / PMP.ECO.TASK_COUNT));
    PMP.ECO_TASKS.forEach(function (t) {
      if (perTask[t.id] > 0 && perTask[t.id] < scaledFloor) {
        gap("coverage." + t.id, PMP.ECO.DOMAIN_LABELS[t.domain] + " task " + t.n + " has " + perTask[t.id] + ", below the " + scaledFloor + " this pack size implies.");
      }
      if (perTask[t.id] < RULE.TASK_FLOOR) {
        gap("target." + t.id, PMP.ECO.DOMAIN_LABELS[t.domain] + " task " + t.n + " has " + perTask[t.id] + " of the " + RULE.TASK_FLOOR + " the finished pack needs.");
      }
    });

    out.checks.push({ id: "coverage", label: "Every one of the " + PMP.ECO.TASK_COUNT + " ECO tasks has at least one question", n: PMP.ECO.TASK_COUNT, bad: uncovered.length });

    var mixBad = 0;
    PMP.ECO.DOMAINS.forEach(function (d) {
      var share = qs.length ? (perDomain[d] || 0) / qs.length : 0;
      var want = PMP.ECO.DOMAIN_WEIGHTS[d];
      if (Math.abs(share - want) > RULE.MIX_TOLERANCE) {
        fail("mix." + d, PMP.ECO.DOMAIN_LABELS[d] + " is " + PMP.fmt.pct(share, 1) + " of the pack against a published weight of " + PMP.fmt.pct(want) + ", outside the " + PMP.fmt.pct(RULE.MIX_TOLERANCE) + " tolerance.");
        mixBad++;
      }
    });
    out.checks.push({ id: "mix", label: "Domain mix within " + PMP.fmt.pct(RULE.MIX_TOLERANCE) + " of the published weighting", n: 3, bad: mixBad });

    var apprBad = 0;
    Object.keys(PMP.ECO.APPROACH_SPLIT).forEach(function (a) {
      var share = qs.length ? (perApproach[a] || 0) / qs.length : 0;
      if (Math.abs(share - PMP.ECO.APPROACH_SPLIT[a]) > RULE.MIX_TOLERANCE) {
        gap("approach." + a, PMP.ECO.APPROACH_LABELS[a] + " is " + PMP.fmt.pct(share, 1) + " against an assumed " + PMP.fmt.pct(PMP.ECO.APPROACH_SPLIT[a]) + ".");
        apprBad++;
      }
    });

    out.counts = {
      total: qs.length, perTask: perTask, perDomain: perDomain,
      perApproach: perApproach, perType: perType,
      uncovered: uncovered.length, scaledFloor: scaledFloor
    };
    out.pass = out.failures.length === 0;
    return out;
  }

  /* ── 10.14.2  VIEW ───────────────────────────────────────────────────── */
  function coverageGrid(counts) {
    var wrap = el("div", { class: "eco-grid" });
    PMP.ECO.DOMAINS.forEach(function (d) {
      var tasks = PMP.ECO_TASKS.filter(function (t) { return t.domain === d; });
      var col = el("div", { class: "eco-col" }, [
        el("span", { class: "eyebrow", text: PMP.ECO.DOMAIN_LABELS[d] + " \u00B7 " + (counts.perDomain[d] || 0) })
      ]);
      tasks.forEach(function (t) {
        var n = counts.perTask[t.id] || 0;
        var st = n === 0 ? "none" : n < counts.scaledFloor ? "thin" : n < 4 ? "ok" : "full";
        col.appendChild(el("div", { class: "eco-row", dataset: { st: st } }, [
          el("span", { class: "eco-n", text: String(t.n) }),
          el("span", { class: "eco-l", text: t.label }),
          el("span", { class: "eco-c num", text: String(n) })
        ]));
      });
      wrap.appendChild(col);
    });
    return wrap;
  }

  function ruleTable(checks) {
    var tbl = el("table", { class: "tbl" }, [
      el("thead", null, [el("tr", null, [
        el("th", { text: "Rule" }), el("th", { class: "n", text: "Checked" }),
        el("th", { class: "n", text: "Failed" }), el("th", { text: "" })
      ])])
    ]);
    var body = el("tbody");
    checks.forEach(function (c) {
      body.appendChild(el("tr", null, [
        el("td", { text: c.label }),
        el("td", { class: "n", text: String(c.n) }),
        el("td", { class: "n", text: String(c.bad) }),
        el("td", null, [el("span", {
          class: "chip " + (c.bad ? "chip--incorrect" : "chip--correct"),
          text: c.bad ? "Fail" : "Pass"
        })])
      ]));
    });
    tbl.appendChild(body);
    return tbl;
  }

  function issueTable(rows, kind) {
    var tbl = el("table", { class: "tbl err-tbl" }, [
      el("thead", null, [el("tr", null, [
        el("th", { text: "#" }), el("th", { text: "Where" }),
        el("th", { text: kind === "gap" ? "What is missing" : "What is wrong" })
      ])])
    ]);
    var body = el("tbody");
    rows.slice(0, 200).forEach(function (r, i) {
      body.appendChild(el("tr", null, [
        el("td", { class: "n", text: String(i + 1) }),
        el("td", null, [el("code", { class: "where", text: r.where })]),
        el("td", { text: r.msg })
      ]));
    });
    tbl.appendChild(body);
    return tbl;
  }

  function view(host) {
    var qs = PMP.Content.all();
    var r = audit(qs);
    var counts = r.counts;

    host.appendChild(el("div", { class: "view-hd" }, [
      el("span", { class: "eyebrow", text: "\u00A73.14 \u00B7 Build self-check" }),
      el("h2", { text: "Content audit" }),
      el("p", { text: "Acceptance test 10: every shipped item satisfies the content rules in \u00A74 and \u00A73.5. This panel runs those rules against the pack that is actually loaded, in front of you, rather than reporting a number somebody typed." })
    ]));

    host.appendChild(el("div", { class: "card verdict-card", dataset: { pass: String(r.pass) } }, [
      icon(r.pass ? "check" : "alert", "i verdict-i"),
      el("div", null, [
        el("h2", { text: r.pass ? "Pass \u2014 " + counts.total + " items, no failures" : "Fail \u2014 " + PMP.fmt.plural(r.failures.length, "problem") + " across " + counts.total + " items" }),
        el("p", { text: r.pass
          ? "Every rule below holds for every item currently loaded, including anything imported from a pack. " + (r.gaps.length ? PMP.fmt.plural(r.gaps.length, "gap") + " remains against the finished pack, listed at the bottom \u2014 gaps are missing content, not broken content." : "There are no outstanding gaps either.")
          : "The failures are listed below with the index of the item and the field inside it. A build with failures should not ship." })
      ])
    ]));

    host.appendChild(el("div", { class: "card" }, [
      el("span", { class: "eyebrow", text: "Rules" }),
      ruleTable(r.checks)
    ]));

    /* ── ECO-task coverage counter ── */
    var pctOfTarget = counts.total / 300;
    host.appendChild(el("div", { class: "card" }, [
      el("span", { class: "eyebrow", text: "ECO task coverage" }),
      el("h2", { text: counts.total + " questions across " + (PMP.ECO.TASK_COUNT - counts.uncovered) + " of " + PMP.ECO.TASK_COUNT + " tasks" }),
      el("p", { text: "The finished pack targets 300 questions with a floor of four per task. This build is at " + PMP.fmt.pct(pctOfTarget) + " of that target, which puts the arithmetic floor at " + counts.scaledFloor + " per task. A task at zero is a failure; a task under the floor is a gap." }),
      el("div", { class: "sum-grid", style: "margin-top:var(--sp-4)" }, [
        el("div", { class: "stat" }, [
          el("span", { class: "stat-k", text: "Tasks covered" }),
          el("span", { class: "stat-v", text: (PMP.ECO.TASK_COUNT - counts.uncovered) + " / " + PMP.ECO.TASK_COUNT })
        ]),
        el("div", { class: "stat" }, [
          el("span", { class: "stat-k", text: "At the 4 floor" }),
          el("span", { class: "stat-v", text: PMP.ECO_TASKS.filter(function (t) { return (counts.perTask[t.id] || 0) >= 4; }).length + " / " + PMP.ECO.TASK_COUNT })
        ]),
        el("div", { class: "stat" }, [
          el("span", { class: "stat-k", text: "Toward 300" }),
          el("span", { class: "stat-v", text: PMP.fmt.pct(pctOfTarget) })
        ]),
        el("div", { class: "stat" }, [
          el("span", { class: "stat-k", text: "Thinnest task" }),
          el("span", { class: "stat-v", text: String(Math.min.apply(null, PMP.ECO_TASKS.map(function (t) { return counts.perTask[t.id] || 0; }))) })
        ])
      ]),
      coverageGrid(counts)
    ]));

    /* Mix */
    var mixTbl = el("table", { class: "tbl" }, [
      el("thead", null, [el("tr", null, [
        el("th", { text: "Slice" }), el("th", { class: "n", text: "Items" }),
        el("th", { class: "n", text: "Share" }), el("th", { class: "n", text: "Published" }), el("th", { class: "n", text: "Drift" })
      ])])
    ]);
    var mixBody = el("tbody");
    PMP.ECO.DOMAINS.forEach(function (d) {
      var n = counts.perDomain[d] || 0, share = counts.total ? n / counts.total : 0;
      var want = PMP.ECO.DOMAIN_WEIGHTS[d];
      mixBody.appendChild(el("tr", null, [
        el("td", { text: PMP.ECO.DOMAIN_LABELS[d] }),
        el("td", { class: "n", text: String(n) }),
        el("td", { class: "n", text: PMP.fmt.pct(share, 1) }),
        el("td", { class: "n", text: PMP.fmt.pct(want) }),
        el("td", { class: "n", text: (share >= want ? "+" : "\u2212") + PMP.fmt.pct(Math.abs(share - want), 1) })
      ]));
    });
    Object.keys(PMP.ECO.APPROACH_SPLIT).forEach(function (a) {
      var n = counts.perApproach[a] || 0, share = counts.total ? n / counts.total : 0;
      var want = PMP.ECO.APPROACH_SPLIT[a];
      mixBody.appendChild(el("tr", null, [
        el("td", { text: PMP.ECO.APPROACH_LABELS[a] }),
        el("td", { class: "n", text: String(n) }),
        el("td", { class: "n", text: PMP.fmt.pct(share, 1) }),
        el("td", { class: "n", text: PMP.fmt.pct(want) }),
        el("td", { class: "n", text: (share >= want ? "+" : "\u2212") + PMP.fmt.pct(Math.abs(share - want), 1) })
      ]));
    });
    mixTbl.appendChild(mixBody);

    var typeRows = Object.keys(counts.perType).sort().map(function (t) {
      return el("li", null, [
        el("span", { class: "kbd", text: String(counts.perType[t]) }),
        el("span", { text: PMP.QRender.label(t) })
      ]);
    });

    host.appendChild(el("div", { class: "card" }, [
      el("span", { class: "eyebrow", text: "Mix against the outline" }),
      mixTbl,
      el("p", { style: "margin-top:var(--sp-4)", text: "PMI publishes the three domain weights and a 40 / 60 predictive-to-other split. It does not break the 60 down further, so the agile and hybrid figures above are measured against this build's own assumption and are reported as gaps rather than failures when they drift." }),
      el("span", { class: "eyebrow", style: "display:block;margin-top:var(--sp-5)", text: "By question type" }),
      el("ul", { class: "keylist", style: "margin-top:var(--sp-3)" }, typeRows)
    ]));

    if (r.failures.length) {
      host.appendChild(el("div", { class: "card" }, [
        el("span", { class: "eyebrow", text: "Failures" }),
        el("h2", { text: PMP.fmt.plural(r.failures.length, "item") + " must be fixed" }),
        issueTable(r.failures, "fail")
      ]));
    }

    if (r.gaps.length) {
      var gapCard = el("div", { class: "card" }, [
        el("span", { class: "eyebrow", text: "Gaps" }),
        el("h2", { text: PMP.fmt.plural(r.gaps.length, "gap") + " against the finished pack" }),
        el("p", { text: "These are not failures. Every one is content that has not been written yet rather than content that is wrong, and they clear as the pack grows toward 300." })
      ]);
      var det = el("details", { class: "review" }, [
        el("summary", null, [el("span", { class: "s", text: "Show all " + r.gaps.length }) ]),
        el("div", { class: "review-bd" }, [issueTable(r.gaps, "gap")])
      ]);
      gapCard.appendChild(det);
      host.appendChild(gapCard);
    }

    host.appendChild(el("div", { class: "card" }, [
      el("span", { class: "eyebrow", text: "Sourcing" }),
      el("p", { text: "Every stem, option, rationale and explanation in this build is original writing. No PMI text is reproduced, these are not retired exam questions, and nothing here was scraped from a question bank. The ECO task labels are this build's own paraphrases of the outline's task titles." }),
      el("p", { text: "That is a claim this panel cannot verify for you \u2014 no automated check can tell original prose from copied prose. It is recorded here because the rest of the panel is testable and this part has to be taken on trust, which is worth saying out loud rather than leaving implied." })
    ]));
  }

  PMP.Router.register("audit", { title: "Content audit", render: view });

  return { audit: audit, RULE: RULE };
})();

/* ═══ §12  BOOTSTRAP ══════════════════════════════════════════════════════ */

/* ── 12.1  FAILURE HANDLING ────────────────────────────────────────────────
   Anything that escapes lands here. The first thing offered is always a way
   to get the person's progress out of the file, before anything else. */
PMP.report = (function () {
  var shown = false;
  return function report(err, where) {
    PMP.Store.commit(["ui"], function (s) {
      s.ui.lastError = { where: where || "unknown", message: (err && err.message) || String(err), at: Date.now() };
    }, { transient: true });
    if (shown) return;
    shown = true;
    setTimeout(function () { shown = false; }, 5000);
    var detail = (err && err.message) ? err.message : "No further detail was available.";
    PMP.UI.sheet({
      title: "Something went wrong",
      body: PMP.dom.frag([
        PMP.dom.el("p", { text: "The app hit an error in " + (where || "an unknown section") + ". Your saved progress has not been changed." }),
        PMP.dom.el("p", { text: "Export a backup now, then reload the file. If it happens again, note what you were doing and include it in your issue report." }),
        PMP.dom.el("p", { class: "hint", text: detail })
      ]),
      actions: [
        { id: "close", label: "Continue anyway" },
        { id: "export", label: "Export progress", icon: "data", primary: true }
      ]
    }).then(function (choice) {
      if (choice === "export") PMP.Exporter.exportProgress();
    });
  };
})();

window.addEventListener("error", function (e) {
  PMP.report(e.error || new Error(e.message), "page");
});
window.addEventListener("unhandledrejection", function (e) {
  PMP.report(e.reason instanceof Error ? e.reason : new Error(String(e.reason)), "background task");
});

/* Leaving mid-exam loses the sitting on a browser that cannot persist.
   §10.03 sets ui.examActive; the guard itself lives here so it survives
   whatever the exam module does. */
window.addEventListener("beforeunload", function (e) {
  if (!PMP.Store.state.ui.examActive) return;
  e.preventDefault();
  e.returnValue = "";
  return "";
});


/* ── 12.2  SHELL WIRING ─────────────────────────────────────────────────── */
PMP.Shell = (function () {
  var railEl, scrimEl, toggleEl, lastRoute = null;

  function setNav(open) {
    railEl.setAttribute("data-open", open ? "true" : "false");
    scrimEl.setAttribute("data-open", open ? "true" : "false");
    scrimEl.hidden = !open;
    toggleEl.setAttribute("aria-expanded", open ? "true" : "false");
    toggleEl.setAttribute("aria-label", open ? "Close navigation" : "Open navigation");
    if (open) { var first = railEl.querySelector(".nav-i"); if (first) first.focus(); }
  }

  function applyTheme(pref) {
    var resolved = pref;
    if (pref === "system") {
      var mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)");
      resolved = (mq && mq.matches) ? "light" : "dark";
    }
    document.documentElement.setAttribute("data-theme", resolved);
    document.getElementById("theme-icon").setAttribute("href", resolved === "dark" ? "#i-moon" : "#i-sun");
    document.getElementById("theme-label").textContent = resolved === "dark" ? "Dark" : "Light";
    /* Written outside the store namespace so §01.6 can read it before paint. */
    try { window.localStorage.setItem("pmp.theme", pref === "system" ? "" : pref); } catch (e) { /* not persistent; the toggle still works for the session */ }
  }

  function cycleTheme() {
    var cur = document.documentElement.getAttribute("data-theme");
    var next = cur === "dark" ? "light" : "dark";
    PMP.Store.commit(["settings"], function (s) { s.settings.theme = next; });
    applyTheme(next);
    PMP.UI.announce(next === "dark" ? "Dark theme" : "Light theme");
  }

  function renderStatus(state) {
    var tag = document.getElementById("mode-tag");
    var txt = document.getElementById("mode-text");
    var mode = state.sys.storageMode;
    tag.setAttribute("data-mode", mode);
    txt.textContent = mode === "persistent" ? "Saved on this device"
                    : mode === "session" ? "Session only"
                    : "Checking";
    var explain = mode === "persistent"
      ? "Progress is stored on this device (" + (state.sys.storageTier === "idb" ? "IndexedDB" : "local storage") + ")."
      : mode === "session" ? "Progress is held in memory and will be lost when this tab closes."
      : "Checking where progress can be stored.";
    tag.setAttribute("title", explain);
    /* The label text is hidden under 600px, so the name lives on the element. */
    tag.setAttribute("aria-label", txt.textContent + ". " + explain);
    document.getElementById("brand-eco").textContent = "ECO " + PMP.ECO.VERSION;
    var due = document.getElementById("due-badge");
    var scheduled = Object.keys(state.srs).length;
    due.textContent = String(scheduled);
    due.hidden = scheduled === 0;
  }

  function init() {
    railEl = document.getElementById("rail");
    scrimEl = document.getElementById("scrim");
    toggleEl = document.getElementById("nav-toggle");

    PMP.dom.on(toggleEl, "click", function () {
      setNav(railEl.getAttribute("data-open") !== "true");
    });
    PMP.dom.on(scrimEl, "click", function () { setNav(false); });
    PMP.dom.on(document, "keydown", function (e) {
      if (e.key === "Escape" && railEl.getAttribute("data-open") === "true") {
        setNav(false); toggleEl.focus();
      }
    });
    PMP.dom.on(document.getElementById("theme-btn"), "click", cycleTheme);
    PMP.dom.on(document.getElementById("export-btn"), "click", function () { PMP.Exporter.exportProgress(); });
    PMP.dom.delegate(document.getElementById("sheet"), "click", "[data-sheet-close]", function () { PMP.UI.closeSheet(null); });
    PMP.dom.on(document.getElementById("sheet"), "close", function () { PMP.UI.closeSheet(null); });

    /* Follow the OS only while the person has not chosen for themselves. */
    if (window.matchMedia) {
      var mq = window.matchMedia("(prefers-color-scheme: light)");
      var onChange = function () {
        if (PMP.Store.state.settings.theme === "system") applyTheme("system");
      };
      if (mq.addEventListener) mq.addEventListener("change", onChange);
      else if (mq.addListener) mq.addListener(onChange);
    }

    PMP.Store.subscribe(function (state, changed) {
      if (changed.indexOf("sys") >= 0 || changed.indexOf("srs") >= 0) {
        renderStatus(state);
        PMP.UI.renderBanners(state);
      }
      if (changed.indexOf("ui") >= 0 && state.ui.route !== lastRoute) {
        lastRoute = state.ui.route;
        if (railEl.getAttribute("data-open") === "true") setNav(false);
      }
    });
  }

  return { init: init, applyTheme: applyTheme, setNav: setNav, renderStatus: renderStatus };
})();


/* ── 12.3  ROUTE REGISTRATION ──────────────────────────────────────────────
   Stub renderers. Each is replaced in place by its §10 module as that module
   lands; the route names, titles and nav links do not change. */
(function registerStubs() {
  var el = PMP.dom.el;

  /* A section that has landed in §10 already owns its route. A stub never
     overwrites one, so the order the two are declared in stops mattering. */
  function register(name, def) {
    if (!PMP.Router.has(name)) PMP.Router.register(name, def);
  }

  function stub(title, lead, spec, extra) {

      host.appendChild(el("div", { class: "view-hd" }, [

        el("p", { text: lead })
      ]));
      var card = el("div", { class: "card" }, [
        el("span", { class: "eyebrow", text: "Planned for this section" }),
        el("ul", { class: "stub-list" }, spec.map(function (s) {
          return el("li", null, [el("span", { class: "ref", text: s[0] }), el("span", { text: s[1] })]);
        }))
      ]);
      host.appendChild(card);
      if (extra) host.appendChild(extra());
    };
  }

  register("dashboard", {
    title: "Dashboard",
    render: stub("Dashboard", "Your readiness score, domain mastery, streak and next best action will open here.", [
      ["\u00A73.1", "Readiness score 0\u2013100 with the five-component breakdown on click"],
      ["\u00A73.1", "Domain mastery bars at the 33 / 41 / 26 weighting, and the predictive versus adaptive split"],
      ["\u00A73.1", "Streak, questions answered today against your daily target, minutes studied"],

/* ── 12.4  BOOT ────────────────────────────────────────────────────────────
   The first line of work in the whole file. Everything above only declared. */
(function boot() {
  function run() {
    PMP.Shell.init();
    PMP.Shell.applyTheme(PMP.Store.state.settings.theme || "system");

    PMP.Storage.probe()
      .then(function (mode) {
        PMP.Store.commit(["sys"], function (s) {
          s.sys.storageMode = mode;
          s.sys.storageTier = PMP.Storage.tier;
        }, { transient: true });
        return mode === "session" ? null : PMP.Store.hydrate();
      })
      .catch(function (e) {
        PMP.Store.commit(["sys"], function (s) { s.sys.storageMode = "session"; }, { transient: true });
        PMP.report(e, "startup");
      })
      .then(function () {
        PMP.Shell.applyTheme(PMP.Store.state.settings.theme || "system");
        /* Imported packs join PMP.QUESTIONS before the first render, so the
           pool counts every view shows are right the first time rather than
           after a repaint. */
        try { PMP.Data.loadStoredPacks(); } catch (e) { PMP.report(e, "pack load"); }
        PMP.Store.commit(["sys"], function (s) { s.sys.ready = true; }, { transient: true });
        PMP.Shell.renderStatus(PMP.Store.state);
        PMP.UI.renderBanners(PMP.Store.state);
        PMP.Router.start();
        offerResume();
      });
  }

  /* An unfinished sitting is offered once, on the first paint after a reload.
     It is a prompt rather than an automatic resume: reopening a mock exam is
     a decision about the next two hours, and the person may have closed the
     tab precisely because they did not want to be in one. */
  function offerResume() {
    var saved;
    try { saved = PMP.Exam.resumable(); } catch (e) { return; }
    if (!saved) return;
    if (PMP.Router.current && PMP.Router.current.name === "exam") return;
    var left = saved.layout.minutes * 60000 - saved.clockConsumed;
    setTimeout(function () {
      PMP.UI.sheet({
        title: "You have a mock exam in progress",
        body: PMP.dom.frag([
          PMP.dom.el("p", { text: "You were on question " + (saved.i + 1) + " of " + saved.layout.items +
            ", with " + PMP.fmt.clock(left) + " left on the clock and " +
            PMP.fmt.plural(Object.keys(saved.answers).length, "answer") + " given." }),
          PMP.dom.el("p", { text: "The clock has not been running while the file was closed. It picks up from where the sitting last saved itself." })
        ]),
        actions: [
          { id: "later", label: "Not now" },
          { id: "go", label: "Resume the sitting", icon: "timer", primary: true }
        ]
      }).then(function (choice) {
        if (choice === "go") { PMP.Router.navigate("exam"); PMP.Exam.resume(); }
      });
    }, 400);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", run);
  else run();
})();
