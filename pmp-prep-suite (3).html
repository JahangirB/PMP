      { id: "b", text: "Raise it with the sponsor as a threat to the business case, with an assessment of how the competitor's release affects the expected benefits.", correct: true,
        rationale: "The business case is what justifies the spend and it has just been challenged by something outside the project. Surfacing that with an assessment is the project manager's obligation, and the decision is the sponsor's." },
      { id: "c", text: "Propose additional features that differentiate your product from the competitor's offering.", correct: false,
        rationale: "It jumps to a response before anyone has decided whether to keep going. Adding scope to a project whose justification is in question is the most expensive available way to find out." },
      { id: "d", text: "Commission market analysis to establish how much of your expected market the competitor will take.", correct: false,
        rationale: "The analysis may well be needed and commissioning it is the sponsor's call, not a way of delaying telling them. It also spends weeks before the sponsor knows anything." }
    ],
    explanation: "Monitoring the external environment for things that undermine the business case is part of the role, and a competitor giving away most of your value proposition is exactly that. On schedule and on budget is not a defence, because both are measures of execution rather than of worth. It goes to the sponsor with an assessment of the effect on benefits, and what happens next \u2014 continue, pivot, or stop \u2014 is theirs to decide."
  },

  {
    id: "pmp-b8-002", type: "single", domain: "business", ecoTask: "business-8",
    approach: "hybrid", difficulty: 4, tags: ["external", "supply-chain", "geopolitical"],
    stem: "Your hardware rollout depends on a component manufactured in a single country that has just introduced export licensing for that category of goods. Licences are being granted, but with a six to ten week lead time that did not previously exist. Your rollout starts in nine weeks. What should the project manager do first?",
    options: [
      { id: "a", text: "Place the licence applications immediately for the full rollout quantity, then re-plan around the confirmed dates.", correct: false,
        rationale: "Acting fast on licences is right and doing it for the full quantity commits you before you know whether a second source or a phased approach is better. It also fixes the plan to the slowest input." },
      { id: "b", text: "Establish what the licensing actually applies to and what alternatives exist, then take the sponsor a re-plan with the options and their costs.", correct: true,
        rationale: "The exposure is real and its shape is unknown: scope of the rule, availability of alternatives, whether a phased start works. Establishing that first is what makes the re-plan a decision rather than a reaction." },
      { id: "c", text: "Notify stakeholders that the rollout will be delayed by six to ten weeks and revise the schedule accordingly.", correct: false,
        rationale: "It announces a delay before establishing whether one is necessary. A phased start, existing stock or an alternative source may absorb some or all of it." },
      { id: "d", text: "Raise it as a risk with a high impact rating and monitor the licensing situation weekly.", correct: false,
        rationale: "This is no longer a risk. The rule exists and the lead time is known, so monitoring it as something that might happen is the wrong instrument for an issue that already has." }
    ],
    explanation: "An external change that has already happened is an issue rather than a risk, and it is worked by establishing its actual boundaries before responding. What the rule covers, what alternatives exist and whether the rollout can be phased are all knowable in days and all change the answer. The re-plan then goes to the sponsor as options with costs, because the trade-off between delay, cost and a different source is theirs."
  },

  {
    id: "pmp-p1-004", type: "single", domain: "people", ecoTask: "people-1",
    approach: "predictive", difficulty: 3, tags: ["vision", "handover", "sponsor"],
    stem: "You take over a stalled warehouse relocation eleven months in. The original sponsor has left, the objectives in the charter refer to a distribution contract the company lost last quarter, and the team is still building to them because nobody told them otherwise. The new sponsor is available and engaged. The team is a week from delivering a racking layout sized for volumes that no longer exist. What should the project manager do first?",
    mindset: "Work to the outcome the organisation needs now, not the one the paperwork was written for.",
    options: [
      { id: "a", text: "Stop the racking work and take the discrepancy to the new sponsor with a recommendation on what the project should now be for.", correct: true,
        rationale: "The team is a week from spending real money against a purpose that expired. Halting that specific piece and bringing the sponsor a recommendation rather than a problem is what makes the conversation short and the decision informed." },
      { id: "b", text: "Let the racking layout complete as planned, then raise the change through the change control process once there is a deliverable to compare against.", correct: false,
        rationale: "This is the process-completeness error: finishing known-wrong work because a procedure has a slot for it later. Change control governs decisions about scope, not permission to keep building against a purpose everyone can already see is void." },
      { id: "c", text: "Update the charter to reflect current volumes and circulate the revised version to the team and the new sponsor.", correct: false,
        rationale: "This is the document-first error. Rewriting the charter yourself asserts a new purpose that the sponsor has not agreed, and a charter is the record of an alignment rather than the means of creating one." },
      { id: "d", text: "Run a workshop with the team to re-derive the objectives from what the business needs today.", correct: false,
        rationale: "This is the consultation-misdirected error: the team can describe the work but cannot authorise a change of purpose. A workshop produces a well-argued position that still has to go to the sponsor, at the cost of the week you do not have." }
    ],
    explanation: "When the stated purpose of a project has been overtaken by events, the priority is to stop the spend that is running against it and get the decision to whoever now owns it. Speed matters more than completeness here, because every day of delay converts into work that will be thrown away. Bringing a recommendation rather than an open question is what keeps the escalation to one conversation instead of three."
  },

  {
    id: "pmp-p1-005", type: "single", domain: "people", ecoTask: "people-1",
    approach: "agile", difficulty: 2, tags: ["vision", "pivot", "team"],
    stem: "A product team pivots from serving small independent retailers to serving two large grocery chains. The product owner announces the change at a sprint review with a slide. Three sprints later the team is still refining stories written for the old audience, and in refinement two developers argue about a feature neither chain has asked for. Nobody has objected to the pivot. What is the most useful thing for the project manager to do?",
    mindset: "A change of direction is not communicated until the team can use it to make decisions without you.",
    options: [
      { id: "a", text: "Ask the product owner to repeat the pivot rationale at the next review, with more detail on the commercial case.", correct: false,
        rationale: "This is the repeat-the-broadcast error. The first announcement did not fail because it was too short; it failed because a slide cannot be used as a decision aid during refinement, and a longer slide will not be either." },
      { id: "b", text: "Work with the product owner to rewrite the backlog against the two chains, then have the team walk the revised items and mark what no longer applies.", correct: true,
        rationale: "The pivot has to reach the artefact the team actually touches. Having the team walk the revised backlog is what surfaces the leftovers and converts an announcement into something they can apply on their own next week." },
      { id: "c", text: "Raise the stale stories in the retrospective and ask the team to agree an action to keep the backlog current.", correct: false,
        rationale: "This is the wrong-forum error. Retrospectives improve how the team works, and this is a gap in what the team knows about the product, which the retrospective is not equipped to close." },
      { id: "d", text: "Have the two chains' account managers brief the team directly on what those customers need.", correct: false,
        rationale: "This is the right-move-wrong-order error. A briefing lands on top of a backlog still full of items for the old audience, so the team hears the new direction and then goes back to a queue that contradicts it." }
    ],
    explanation: "Direction that lives only in an announcement does not change behaviour, because the thing a team works from is its queue. The reliable route is to change the artefact and then have the team handle it, since that is what exposes the items written under the old assumption. Silence after a pivot is usually a sign that people have nothing to disagree with yet, not that they have understood."
  },

  {
    id: "pmp-p2-004", type: "single", domain: "people", ecoTask: "people-2",
    approach: "predictive", difficulty: 4, tags: ["conflict", "resources", "departments"],
    stem: "Two department heads both need the same test rig in the final fortnight before your go-live. Each has emailed you separately arguing their case, each has copied your sponsor, and the tone has sharpened over three exchanges. Your project needs the rig for two of those fourteen days. Neither head has spoken to the other. The sponsor has not replied to either email. What should the project manager do?",
    mindset: "Get the people who disagree into the same conversation before you carry either position forward.",
    options: [
      { id: "a", text: "Reply to both, copying the sponsor, setting out the two days your project needs and proposing a schedule for the remaining twelve.", correct: false,
        rationale: "This is the solve-it-in-writing error. A fourth email into a thread that has sharpened three times adds a third position to a dispute that already has two, and it commits you publicly before you know what either head actually needs." },
      { id: "b", text: "Ask the sponsor to arbitrate, since both heads have already escalated and the sponsor holds authority over both departments.", correct: false,
        rationale: "This is the premature-escalation error. Neither head has spoken to the other, so the disagreement has not yet been attempted at the level that can resolve it, and an arbitrated split leaves both parties managing the outcome rather than owning it." },
      { id: "c", text: "Convene the two heads, establish what each actually needs the rig for and by when, and work the schedule from the constraints rather than the claims.", correct: true,
        rationale: "Positions harden in email and soften in a room. Separating the underlying need from the stated demand is what usually reveals that the two requirements are not in as direct a collision as three rounds of correspondence made them look." },
      { id: "d", text: "Book the rig for your two days immediately, then let the two departments settle the remaining twelve between themselves.", correct: false,
        rationale: "This is the secure-your-own-interest error. It protects your go-live and makes you a third claimant in a dispute you will need both heads' goodwill to survive, particularly during a fortnight when either could quietly deprioritise your testing." }
    ],
    explanation: "A dispute conducted in writing between parties who have not spoken tends to escalate, because each exchange is a position statement rather than an exploration. Bringing the parties together and working from underlying need rather than stated demand is what makes room visible. Escalation stays available and becomes better founded once a genuine attempt at the working level has been made and recorded."
  },

  {
    id: "pmp-p3-004", type: "pulldown", domain: "people", ecoTask: "people-3",
    approach: "hybrid", difficulty: 3, tags: ["leadership", "delegation", "empowerment"],
    stem: "A hybrid programme has four squads at very different stages of maturity. The programme manager is deciding how much decision-making authority to hand each squad this quarter, and wants the level to fit the squad rather than a uniform policy. Complete each sentence with the delegation level that fits the situation described. Two choices are not used.",
    mindset: "Delegate to the level the team can carry today, then move the line as capability grows.",
    prompts: [
      { id: "d1", text: "A squad formed six weeks ago has twice committed to dates it could not meet, and the programme has an external regulatory deadline. The manager should" },
      { id: "d2", text: "A squad with two years together has met every commitment and now spends an hour a week waiting for sign-off on decisions it has never got wrong. The manager should" },
      { id: "d3", text: "A squad is technically strong but has just absorbed three new members and is visibly unsure how much latitude it now has. The manager should" }
    ],
    options: [
      { id: "consult", text: "decide, but only after asking the squad for input", correct: true, match: "d1",
        rationale: "A squad that has misjudged its own capacity twice needs the commitment to be sound more than it needs the autonomy. Asking for input keeps the squad's knowledge in the decision while the manager still carries the date the regulator is holding." },
      { id: "devolve", text: "hand the decision over entirely and be told the outcome", correct: true, match: "d2",
        rationale: "A sustained record of good decisions and an hour a week of waiting is a queue the sign-off is creating rather than preventing. Full devolution removes the cost and loses nothing, because the squad has already been making the calls in substance." },
      { id: "agree", text: "set the boundaries jointly and let the squad decide inside them", correct: true, match: "d3",
        rationale: "Capability is high but the working agreement has just been disturbed by new members. Naming the boundaries together restores certainty about where the squad may act without narrowing the authority it has earned." },
      { id: "instruct", text: "decide alone and tell the squad what has been decided", correct: false, match: null,
        rationale: "Not used. Unilateral instruction fits a genuine emergency or a decision the team has no information about, and all three squads here hold knowledge the manager needs." },
      { id: "abdicate", text: "leave the decision unassigned and see who picks it up", correct: false, match: null,
        rationale: "Not used. Declining to say who owns a decision is not delegation, and on the first squad it would put a regulatory date in the hands of whoever happens to feel responsible." }
    ],
    explanation: "The level of authority handed to a team is set by what that team can currently carry and by what is riding on the decision, not by a programme-wide policy or by the manager's general preference for empowerment. Repeated misjudgement pulls the line back toward consultation; a long record of sound calls pushes it out to full devolution; a disturbance in team composition calls for the boundaries to be restated rather than the authority reduced."
  },

  {
    id: "pmp-p3-005", type: "single", domain: "people", ecoTask: "people-3",
    approach: "agile", difficulty: 3, tags: ["leadership", "self-organisation", "impediments"],
    stem: "In daily standups you have started assigning the day's work item by item, because two sprints ago the team left an urgent defect unclaimed for a day. Velocity has held steady. In the last retrospective a senior developer said, carefully, that standup now feels like a status meeting, and three others nodded. Nobody has asked you to stop. What should the project manager do?",
    mindset: "Ownership grows where the team is allowed to carry the consequences of its own decisions.",
    options: [
      { id: "a", text: "Continue, since velocity has held and the team has not formally asked for the practice to change.", correct: false,
        rationale: "This is the metric-as-permission error. Velocity measures throughput, not ownership, and a team that has been nodding along in a retrospective has already asked in the only register available to it." },
      { id: "b", text: "Stop assigning work, explain why you started, and agree with the team how urgent items will get picked up.", correct: true,
        rationale: "The practice was a response to a real failure, so naming that failure is what stops the withdrawal reading as a reversal on a whim. Agreeing the mechanism for urgent work addresses the original problem without keeping the cure that caused this one." },
      { id: "c", text: "Keep assigning only the urgent items and let the team self-organise around everything else.", correct: false,
        rationale: "This is the split-the-difference error. It reserves exactly the decisions that carry the most learning, and the team continues to experience standup as a meeting where the important calls are made by someone else." },
      { id: "d", text: "Ask the team in the next retrospective whether they would like you to stop assigning work.", correct: false,
        rationale: "This is the false-consultation error. The team has already signalled its view, and asking a team to formally request that its manager relinquish control puts the cost of speaking up on the people with the least power to bear it." }
    ],
    explanation: "A control introduced to fix a specific failure tends to outlive the failure, because nothing forces a review of it while the numbers look fine. The correction is to withdraw the control, state plainly why it existed, and replace it with an agreement the team owns. Hedged withdrawals keep the highest-value decisions in the manager's hands, which is precisely where the team stops learning."
  },

  {
    id: "pmp-p4-004", type: "multi", domain: "people", ecoTask: "people-4",
    approach: "predictive", difficulty: 3, tags: ["stakeholders", "engagement", "power"],
    stem: "A regulatory reporting project has a general counsel who holds an effective veto at the sign-off gate but has attended none of the six monthly steering meetings and answers emails in about a fortnight. Your gate is eleven weeks away. Her deputy attends everything, is well informed, and has told you twice that he cannot commit on her behalf. Which two actions should the project manager take?",
    mindset: "Engagement is designed around the stakeholder you have, not the one the plan assumed.",
    options: [
      { id: "a", text: "Ask the general counsel what form and frequency of contact would let her form a view before the gate, and rebuild the engagement around her answer.", correct: true,
        rationale: "Six months of non-attendance is evidence the current mechanism does not fit her, and she is the only person who can say what would. Redesigning around the answer is what converts a stakeholder who is absent into one who is merely differently engaged." },
      { id: "b", text: "Work through the deputy to surface legal concerns early, while being explicit with him that the decision itself still needs the general counsel.", correct: true,
        rationale: "The deputy is informed and cannot commit, so he is a route to the issues rather than to the decision. Naming that distinction openly stops the arrangement drifting into an assumption that his comfort equals her approval." },
      { id: "c", text: "Treat the deputy's attendance and informed participation as the department's representation and proceed to the gate on that basis.", correct: false,
        rationale: "This is the proxy-as-principal error. He has told you twice that he cannot commit, so relying on him substitutes the person who is available for the person who holds the veto, and it fails at the gate rather than before it." },
      { id: "d", text: "Ask the sponsor to require the general counsel's attendance at the remaining steering meetings.", correct: false,
        rationale: "This is the compel-attendance error. It fills a seat with someone who has demonstrated for six months that this forum is not how she engages, and it spends sponsor authority on a stakeholder you will need to work with well beyond this gate." },
      { id: "e", text: "Record the risk of late legal objection in the register with a mitigation of early document circulation.", correct: false,
        rationale: "This is the register-as-action error. Circulating documents to someone with a fortnight's email latency is the mechanism that has already failed, so the mitigation restates the problem in the column marked solution." }
    ],
    explanation: "A stakeholder with high authority and low observable engagement is not disengaged so much as engaged on terms the project has not discovered. The work is to find those terms from the stakeholder directly, and to use the available deputy for what a deputy can actually do, which is early sight of the issues rather than the decision itself. Substituting the accessible person for the accountable one is the failure this pattern most reliably produces."
  },

  {
    id: "pmp-p5-003", type: "matching", domain: "people", ecoTask: "people-5",
    approach: "predictive", difficulty: 3, tags: ["expectations", "alignment", "negotiation"],
    stem: "A finance transformation has three stakeholder groups whose expectations have drifted apart during a long planning phase. The project manager is choosing how to close each gap, and the right move differs in each case. Match each situation to the approach that fits it best. Two choices are not used.",
    mindset: "Diagnose why expectations diverged before choosing the technique for closing the gap.",
    prompts: [
      { id: "e1", text: "Two directors want incompatible things from the same module, both are certain they were promised it, and the contemporaneous notes are ambiguous." },
      { id: "e2", text: "A user group expects a reporting capability that was descoped in month two, and the descoping was recorded but never communicated to them." },
      { id: "e3", text: "A regional head expects a March cutover; the plan has always said June, and he has been told June four times and repeats March each month." }
    ],
    options: [
      { id: "reconcile", text: "Bring both parties to a joint session and negotiate one agreed position", correct: true, match: "e1",
        rationale: "Two irreconcilable expectations with no authoritative record cannot be settled by producing evidence, because the evidence is ambiguous. What is left is a negotiation between the two holders, conducted together so neither hears the outcome secondhand." },
      { id: "inform", text: "Communicate the decision that was already taken, with its rationale and consequences", correct: true, match: "e2",
        rationale: "Here the gap is purely informational: a decision was properly made and never travelled. The group needs the decision, why it was taken and what it means for them, not a renegotiation of a settled question." },
      { id: "root", text: "Investigate why the message is not landing before repeating it again", correct: true, match: "e3",
        rationale: "Four accurate communications that produced no change mean the barrier is not the information. Something, whether an incentive, a commitment made elsewhere or a misunderstanding of what cutover means, is holding the expectation in place." },
      { id: "escalate", text: "Refer the disagreement upward for a ruling", correct: false, match: null,
        rationale: "Not used. Escalation suits a genuine deadlock between parties who have tried and failed to agree, and none of these three has yet had a serious attempt at the working level." },
      { id: "baseline", text: "Point to the approved baseline and hold the line", correct: false, match: null,
        rationale: "Not used. Citing the baseline settles what the project is committed to and does nothing about why someone believes otherwise, which is the live problem in all three situations." }
    ],
    explanation: "Expectation gaps have different causes and the technique has to match the cause. Genuinely competing expectations with no clear record need negotiation between the holders; a properly taken decision that never reached the affected group needs communication rather than reopening; and an expectation that survives repeated accurate correction signals a barrier that has to be found before any further message will land. Reaching for the baseline or for escalation treats all three as the same problem."
  },

  {
    id: "pmp-p5-004", type: "single", domain: "people", ecoTask: "people-5",
    approach: "agile", difficulty: 2, tags: ["expectations", "commitments", "sales"],
    stem: "Your product owner, wanting to close a deal, told a prospective customer that a bulk import feature would ship in the next release. The team has not sized it, it is not in the sprint, and two developers think it is a fortnight of work. The customer has repeated the commitment in writing. The product owner tells you privately that she may have got ahead of herself. What should the project manager do first?",
    mindset: "An expectation that cannot be met is cheapest to correct on the day it is created.",
    options: [
      { id: "a", text: "Have the team size the feature, then work with the product owner on what can honestly be committed and get the corrected position to the customer quickly.", correct: true,
        rationale: "The estimate is the missing input and two developers' impression is not one. Correcting the customer early costs a difficult conversation now instead of a broken commitment later, when the customer has planned around it." },
      { id: "b", text: "Pull the bulk import into the current sprint and displace lower-value items so the commitment is met.", correct: false,
        rationale: "This is the honour-it-regardless error. It rewards a commitment made outside the team's planning, and it silently transfers the cost to whichever stakeholders were expecting the displaced items." },
      { id: "c", text: "Ask the product owner to correct the customer herself, since she made the commitment.", correct: false,
        rationale: "This is the ownership-as-abdication error. She did make it, and leaving her to unwind it alone forfeits the sizing information the team holds and risks a second inaccurate number replacing the first." },
      { id: "d", text: "Add the feature to the top of the backlog and let the next refinement session establish whether the date is achievable.", correct: false,
        rationale: "This is the defer-the-bad-news error. It leaves a written commitment standing while the answer is worked out, and every day of that delay makes the correction more expensive for the customer to absorb." }
    ],
    explanation: "A commitment made without the team's input is a defect in the expectation rather than in the plan, and the repair is to establish the real position and communicate it before the customer builds on it. Meeting the promise anyway teaches that commitments made outside planning will be absorbed, and delegating the retraction to whoever made the error discards the information that would make the second message reliable."
  },

  {
    id: "pmp-p5-005", type: "single", domain: "people", ecoTask: "people-5",
    approach: "hybrid", difficulty: 4, tags: ["expectations", "rollout", "divisions"],
    stem: "A shared platform is being rolled out to two divisions. The retail division has been told it will get a phased rollout with a pilot; the wholesale division has been told the same platform arrives in a single cutover. Both understandings came from your own steering pack, which used different wording in two sections. Build has assumed a single cutover throughout. Discovery is three weeks from complete. What should the project manager do?",
    mindset: "When you created the divergence, correct it yourself before it costs either party a decision.",
    options: [
      { id: "a", text: "Take the contradiction to both divisions together, acknowledge it originated in your reporting, and establish one rollout approach both can plan against.", correct: true,
        rationale: "A joint correction stops each division hearing a different second version, and owning the source is what makes the correction credible. Establishing one approach they can plan against is the actual deliverable, not the apology." },
      { id: "b", text: "Confirm the single cutover to retail, since that is what build has assumed and changing it now would be expensive.", correct: false,
        rationale: "This is the cheapest-for-the-project error. It resolves the contradiction by overruling one division without discussion, and retail may have made staffing or trading decisions on the phased understanding that a cutover would strand." },
      { id: "c", text: "Correct the steering pack wording in the next issue so future reporting is unambiguous.", correct: false,
        rationale: "This is the fix-the-artefact error. It prevents recurrence and leaves both divisions holding the two understandings they already have, since neither will read a revised section as a retraction of what they were told." },
      { id: "d", text: "Ask each division separately what they now expect, then design a rollout that accommodates both.", correct: false,
        rationale: "This is the separate-conversations error. Handling it division by division risks producing a third position, and it treats a contradiction the project introduced as though it were a genuine difference in requirements." }
    ],
    explanation: "Where a project's own communication has created two incompatible expectations, the correction belongs in one conversation with both parties, because sequential correction produces a fresh set of divergent understandings. Owning the source plainly is what earns the room to settle it, and the purpose of the session is a single approach both can plan against rather than a determination of who was right."
  },

  {
    id: "pmp-p6-003", type: "single", domain: "people", ecoTask: "people-6",
    approach: "predictive", difficulty: 3, tags: ["customer", "requirements", "signals"],
    stem: "Halfway through a twelve-month customer portal build, your client's own market has shifted and their competitors have launched self-service returns. Your contract, requirements and baseline contain no returns capability and the client has raised nothing formally. In an informal call their operations lead mentioned returns three times. Your delivery is on schedule and within budget. What should the project manager do?",
    mindset: "Track what the customer now needs, not only what the customer formally asked for.",
    options: [
      { id: "a", text: "Continue to the baseline, since the client has raised no formal change and the contract is being met.", correct: false,
        rationale: "This is the contract-compliance error. Delivering exactly what was agreed while the customer's need moves produces a project that succeeds against its measures and lands something the client can no longer use." },
      { id: "b", text: "Raise the shift with the client, establish whether returns has become a real requirement, and set out the options and their cost while there is still time to act.", correct: true,
        rationale: "Three unprompted mentions is a signal worth testing, and testing it costs a conversation. Presenting options with costs keeps the decision with the client rather than converting an observation into unrequested scope." },
      { id: "c", text: "Add a returns capability to the design now, so the portal is not obsolete at launch.", correct: false,
        rationale: "This is the anticipate-and-build error. It commits budget and schedule to a requirement the client has not confirmed, and unrequested scope delivered against a fixed contract is difficult to be paid for and harder to defend." },
      { id: "d", text: "Note the market change in the risk register and monitor whether the client raises it formally.", correct: false,
        rationale: "This is the passive-monitoring error. It records an exposure the project could reduce today and waits for the client to act, by which point the remaining schedule may be too short to absorb the change." }
    ],
    explanation: "Customer expectations move with the customer's own environment, and a project that tracks only formal requests will discover the movement at acceptance. Informal signals are worth surfacing deliberately rather than acting on unilaterally: raising the question preserves the client's authority over scope while there is still schedule to spend, whereas building ahead of confirmation and waiting for a formal request both remove that choice in opposite directions."
  },

  {
    id: "pmp-p6-004", type: "single", domain: "people", ecoTask: "people-6",
    approach: "agile", difficulty: 2, tags: ["customer", "acceptance", "criteria"],
    stem: "An internal operations team is the customer for a scheduling tool. For four consecutive sprints they have accepted the demo, then raised defects in the following week that turn out to be behaviours the team never agreed to build. Their manager is frustrated, your team is demoralised, and the rework is now about a fifth of each sprint. Acceptance criteria exist and are written by your business analyst. What should the project manager do?",
    mindset: "Acceptance is only meaningful when the customer helped define what they were accepting.",
    options: [
      { id: "a", text: "Have the operations team write or co-write the acceptance criteria before each item is built, and confirm them at refinement.", correct: true,
        rationale: "Criteria written by an analyst capture what the analyst understood, which is why the mismatch appears only once operations use the thing. Co-writing moves the disagreement to before the build, where it costs a conversation rather than a fifth of a sprint." },
      { id: "b", text: "Require the operations manager to sign the acceptance criteria before development starts on each item.", correct: false,
        rationale: "This is the signature-as-understanding error. A signature on someone else's document creates accountability for a misunderstanding rather than preventing it, and the same behaviours will surface in the same place the following week." },
      { id: "c", text: "Extend the demo into a longer hands-on session so the operations team can exercise the software properly before accepting.", correct: false,
        rationale: "This is the too-late-to-help error, since it catches the mismatch a few days earlier at the end of the build rather than the start. The item has already been built to the wrong understanding by then, so the rework is deferred rather than avoided." },
      { id: "d", text: "Track the post-acceptance defects separately as new requirements and schedule them into later sprints.", correct: false,
        rationale: "This is the reclassify-the-symptom error. Renaming the rework makes the reporting tidier and leaves the cause untouched, while the operations team continues to experience the tool as not doing what they expected." }
    ],
    explanation: "Repeated acceptance followed by immediate defect reports usually means the acceptance criteria describe someone's interpretation of the need rather than the need. The durable fix is to move the customer upstream into defining what good looks like before the work starts, since that is the only point at which the misunderstanding is cheap. Tightening the ceremony at the end, or formalising sign-off on the same flawed document, both leave the misunderstanding in place."
  },

  {
    id: "pmp-p7-003", type: "single", domain: "people", ecoTask: "people-7",
    approach: "predictive", difficulty: 3, tags: ["knowledge", "handover", "attrition"],
    stem: "The only engineer who understands your legacy billing interface has resigned and works four more weeks. Her documentation is thin, and the interface has failed twice in two years, each time resolved by her within hours. Two other engineers are capable but have never touched it. Your project depends on that interface through to a cutover in seven months. What should the project manager do with her remaining time?",
    mindset: "Knowledge transfers through shared work, not through documents handed over at the door.",
    options: [
      { id: "a", text: "Have her write comprehensive documentation of the interface as her main task for the four weeks.", correct: false,
        rationale: "This is the documentation-only error. A document written under time pressure captures what she can articulate, not what she does under pressure, and the two failures were resolved by judgement that does not survive being written down." },
      { id: "b", text: "Pair the two engineers with her on real interface work, including a rehearsed failure, and have them write the documentation from what they learn.", correct: true,
        rationale: "Working the interface alongside her is what transfers the diagnostic judgement the failures needed. Having the receivers write the document tests what actually landed, because they can only describe what they now understand." },
      { id: "c", text: "Negotiate a retainer so she remains available on call through the cutover in seven months.", correct: false,
        rationale: "This is the retain-the-dependency error. It buys insurance and removes the pressure to transfer anything, so in seven months the organisation is in the same position with less time and no remaining leverage." },
      { id: "d", text: "Record a series of walkthrough videos covering the interface architecture and the two previous failures.", correct: false,
        rationale: "This is the capture-without-practice error. Video preserves her explanation more faithfully than a document and still produces engineers who have watched someone else diagnose a fault rather than engineers who have diagnosed one." }
    ],
    explanation: "Tacit knowledge, the kind that resolves an outage in hours, moves through joint work rather than through artefacts. The strongest available transfer puts the receiving people on the real system with the departing expert present, rehearses the failure mode that matters, and uses documentation written by the receivers as the test of what was absorbed. Artefact-first approaches capture the explicable residue and leave the judgement behind."
  },

  {
    id: "pmp-p7-004", type: "single", domain: "people", ecoTask: "people-7",
    approach: "hybrid", difficulty: 4, tags: ["knowledge", "vendor", "transition"],
    stem: "A vendor has run your data platform for three years under a contract ending in five months, and will be replaced by an internal team. The contract requires a handover pack at termination. The vendor is cooperative but its staff are being reassigned as work tails off, and the two people with the deepest platform knowledge leave the account in six weeks. Your internal team is hired but not yet started. What should the project manager do?",
    mindset: "Sequence knowledge transfer around when the knowledge leaves, not when the contract ends.",
    options: [
      { id: "a", text: "Bring the internal team's start date forward if possible and, whether or not that succeeds, secure structured transfer from the two departing specialists within the six weeks.", correct: true,
        rationale: "The binding constraint is six weeks, not five months, and it is set by people rather than by the contract. Acting on the specialists' window is what protects the knowledge even in the case where the internal start cannot be moved." },
      { id: "b", text: "Hold the vendor to the contractual handover pack and review it against the platform when the internal team starts.", correct: false,
        rationale: "This is the contract-timing error. The pack arrives at termination, by which point the two people who could have explained it have been gone for months, and a review then finds gaps with no one left to fill them." },
      { id: "c", text: "Ask the vendor to keep the two specialists on the account until the contract ends.", correct: false,
        rationale: "This is the plan-that-is-not-yours error. It depends on a commercial decision inside the vendor's own resourcing, and if declined at week five you have spent the window without a fallback." },
      { id: "d", text: "Commission the vendor to produce enhanced documentation from the two specialists before they leave the account.", correct: false,
        rationale: "This is the artefact-substitution error. It uses the six weeks to generate a description of the platform rather than to build capability, and there is still no one on your side able to interrogate what was written." }
    ],
    explanation: "In a transition the real deadline is the date the knowledge leaves the building, which is often well inside the contractual end. Planning has to be built around that window and around receivers who can absorb what is transferred. Contractual handover artefacts and vendor retention requests are both worth having, but neither should be the primary plan, because one arrives too late and the other is not yours to decide."
  },

  {
    id: "pmp-p8-003", type: "multi", domain: "people", ecoTask: "people-8",
    approach: "predictive", difficulty: 3, tags: ["communication", "reporting", "sponsor"],
    stem: "Your sponsor has twice made decisions in steering that contradict information sent in the weekly status report, most recently approving an extra workstream in a week the report flagged a resourcing shortfall. The report runs to nine pages with a one-page summary at the front. The sponsor is engaged in the meetings themselves and asks good questions. Which two actions should the project manager take?",
    mindset: "Reporting has done its job only when the decision-maker can act on it.",
    options: [
      { id: "a", text: "Ask the sponsor directly what she needs from the report, when she reads it, and what would have changed the resourcing decision.", correct: true,
        rationale: "The gap between an engaged sponsor and a contradicted report is a design problem in the reporting, and she is the only source for what would work. Anchoring on the specific decision keeps the conversation concrete rather than a general request for feedback." },
      { id: "b", text: "Raise material items that need a decision at the start of the steering meeting itself, rather than relying on the written report to carry them.", correct: true,
        rationale: "Decisions taken in the room should be informed in the room. Putting the decision-relevant items in front of her at the point of decision closes the gap regardless of when or whether the written report is read." },
      { id: "c", text: "Expand the executive summary so the resourcing position is unmissable on the first page.", correct: false,
        rationale: "This is the louder-not-different error. A one-page summary already exists and did not carry the point, so more emphasis in the same channel repeats an approach with two failures behind it." },
      { id: "d", text: "Ask the sponsor to confirm in writing that she has read each weekly report before steering.", correct: false,
        rationale: "This is the compliance-over-communication error. It creates an audit trail that shifts blame onto the sponsor for the next contradicted decision, and it does nothing to make the information usable." },
      { id: "e", text: "Circulate the report earlier in the week so there is more time to absorb it before the meeting.", correct: false,
        rationale: "This is the timing-assumption error. It presumes the cause is insufficient time rather than format, relevance or channel, and nothing in the sponsor's behaviour points to time as the constraint." }
    ],
    explanation: "When a decision-maker acts against information you have supplied, the reporting has failed even though it was accurate. The two moves that reliably help are finding out from the recipient what would actually inform her and putting decision-critical items into the forum where decisions are made. Amplifying, formalising or rescheduling the same artefact all assume the format was right and only the delivery was wrong."
  },

  {
    id: "pmp-p8-004", type: "single", domain: "people", ecoTask: "people-8",
    approach: "agile", difficulty: 2, tags: ["communication", "distributed", "transparency"],
    stem: "Your team works across three time zones with a two-hour overlap. Decisions taken during the overlap are not reaching the engineers who are offline, and twice this month work has been built against a decision that had been reversed. The team already runs a daily standup in the overlap and keeps a chat channel that scrolls fast. What should the project manager do?",
    mindset: "In a distributed team, a decision does not exist until it is written somewhere durable.",
    options: [
      { id: "a", text: "Record decisions and their reasoning in a single durable place the whole team reads at the start of its own day, and reference it from the chat channel.", correct: true,
        rationale: "The failure is that decisions live in a fast-scrolling stream and a meeting half the team cannot attend. A durable record read at each person's start of day matches the artefact to how a distributed team actually consumes information." },
      { id: "b", text: "Move the daily standup to a time all three zones can attend so decisions are heard by everyone.", correct: false,
        rationale: "This is the synchronise-everything error. With a two-hour overlap there is no such time, and forcing one puts a recurring meeting outside working hours for at least one zone in order to solve a problem that is really about persistence." },
      { id: "c", text: "Have the overlap group post a summary of each decision to the chat channel immediately after standup.", correct: false,
        rationale: "This is the same-channel error. The channel is already the place decisions are getting lost, so a summary posted into a fast stream is scrolled past by the people who most need it." },
      { id: "d", text: "Assign a liaison in each zone to brief their colleagues on decisions taken during the overlap.", correct: false,
        rationale: "This is the human-relay error. It introduces three retellings of every decision, adds a dependency on three individuals' availability, and makes the reasoning behind a decision the first thing to be lost." }
    ],
    explanation: "Distributed teams need information that persists and can be consumed asynchronously, because the constraint is that most of the team is asleep when most decisions are made. A single durable record covering the decision and the reasoning behind it, read at the start of each person's day, is what makes reversals visible. Extending synchronous ceremonies or relying on fast channels and human relays all assume everyone is available at the same time."
  },

  {
    id: "pmp-p8-005", type: "single", domain: "people", ecoTask: "people-8",
    approach: "predictive", difficulty: 5, tags: ["communication", "incident", "stakeholders"],
    stem: "A data migration you ran over the weekend has corrupted a subset of customer records. Your technical lead is confident it affects under one per cent but cannot confirm the number for six hours. Meanwhile the head of customer service has already emailed her team saying the issue is fixed, a regional director is asking for numbers, and a journalist has contacted the press office. What should the project manager do first?",
    mindset: "In a live incident, say what is known, what is not, and when you will next speak.",
    options: [
      { id: "a", text: "Wait for the six-hour analysis so that everything communicated is confirmed and accurate.", correct: false,
        rationale: "This is the accuracy-before-anything error. Six hours of silence does not stop communication, it just leaves the customer service email and the journalist's enquiry to fill the space with a version nobody in the project controls." },
      { id: "b", text: "Issue a single position to all parties stating what is known, what is not yet known, that the earlier all-clear was premature, and when the next update will come.", correct: true,
        rationale: "One position from one source stops the divergence, and correcting the premature all-clear is urgent because it is currently being acted on. A committed next update time is what buys the six hours without inviting people to keep asking." },
      { id: "c", text: "Brief the regional director and the press office with the current estimate, and correct customer service once the numbers are confirmed.", correct: false,
        rationale: "This is the tiered-disclosure error. Briefing the senior and external audiences first leaves the operational team acting on a known-false all-clear, and the inconsistency surfaces the moment those audiences compare notes." },
      { id: "d", text: "Ask the head of customer service to retract her email, and hold all other communication until the analysis completes.", correct: false,
        rationale: "This is the partial-correction error. Retracting without supplying what is currently known creates alarm with no anchor, and the regional director and the journalist remain unanswered while speculation runs." }
    ],
    explanation: "Incident communication is judged on consistency and timeliness rather than completeness. A single statement covering what is known, what remains unknown, what previously said was wrong, and when the next update will arrive gives every audience the same footing and prevents the vacuum being filled elsewhere. Waiting for certainty, briefing audiences in tiers, or retracting without replacing all leave some group acting on a version of events the project knows to be wrong."
  },
