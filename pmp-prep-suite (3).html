/* 05.3–05.7  The other packs are still empty by design: §12.2 runs a content
   audit and the views report the real count rather than pretending. */
PMP.CASES      = [];
PMP.SCENARIOS  = [];
PMP.FLASHCARDS = [];
PMP.FORMULAS   = [];
PMP.REFERENCE  = [];
PMP.GLOSSARY   = [];

/* ── 05.8  CONTENT INDEX ────────────────────────────────────────────────────
   PMP.QUESTIONS is not frozen: §10.13 appends imported packs to it at boot.
   Everything that needs an id lookup goes through here rather than keeping a
   private map, so an import cannot leave a stale index behind somewhere. */
PMP.Content = (function () {
  var map = null, stamp = -1;

  function index() {
    if (map && stamp === PMP.QUESTIONS.length) return map;
    map = Object.create(null);
    PMP.QUESTIONS.forEach(function (q) { if (q && q.id) map[q.id] = q; });
    stamp = PMP.QUESTIONS.length;
    return map;
  }

  return {
    byId: function (id) { return index()[id] || null; },
    has: function (id) { return !!index()[id]; },
    all: function () { return PMP.QUESTIONS; },
    invalidate: function () { map = null; stamp = -1; },
    /* Returns how many were added and how many were skipped as duplicates.
       An id already present always wins: a pack cannot silently overwrite an
       item someone has answer history against. */
    add: function (list) {
      var added = 0, dupes = [];
      (list || []).forEach(function (q) {
        if (!q || !q.id) return;
        if (index()[q.id]) { dupes.push(q.id); return; }
        PMP.QUESTIONS.push(q);
        map = null; stamp = -1;
        added++;
      });
      return { added: added, duplicates: dupes };
    },
    remove: function (ids) {
      var kill = Object.create(null);
      (ids || []).forEach(function (id) { kill[id] = true; });
      var before = PMP.QUESTIONS.length;
      for (var i = PMP.QUESTIONS.length - 1; i >= 0; i--) {
        if (kill[PMP.QUESTIONS[i].id]) PMP.QUESTIONS.splice(i, 1);
      }
      map = null; stamp = -1;
      return before - PMP.QUESTIONS.length;
    }
  };
})();


/* ═══ §06  STORAGE ADAPTER ════════════════════════════════════════════════
   No feature module ever touches localStorage, IndexedDB or this object
   directly. §07 is the only caller. The API is async throughout so the three
   tiers are interchangeable.
   ═══════════════════════════════════════════════════════════════════════ */
PMP.Storage = (function () {
  var CFG = PMP.STORE_CFG;
  var tier = null;          /* "local" | "idb" | "memory" */
  var mode = "probing";     /* "probing" | "persistent" | "session" */
  var mem = Object.create(null);
  var idb = null;
  var listeners = [];

  function emit(evt, detail) {
    for (var i = 0; i < listeners.length; i++) {
      try { listeners[i](evt, detail); } catch (e) { /* a bad listener must not break a write */ }
    }
  }

  /* ── 06.1  PROBE ─────────────────────────────────────────────────────────
     A tier passes only if a value written can be read back and then removed.
     This catches the silent no-op case (Safari private mode historically, and
     some file:// sandboxes) as well as the throwing case. */
  function probeLocal() {
    try {
      var k = CFG.PROBE_KEY, v = "p" + Date.now();
      window.localStorage.setItem(k, v);
      if (window.localStorage.getItem(k) !== v) return false;
      window.localStorage.removeItem(k);
      return window.localStorage.getItem(k) === null;
    } catch (e) { return false; }
  }

  function openIDB() {
    /* IndexedDB.open can hang without resolving on an opaque file:// origin,
       so the open is raced against a timeout rather than awaited forever. */
    return new Promise(function (resolve) {
      var settled = false;
      function done(db) { if (!settled) { settled = true; resolve(db); } }
      var timer = setTimeout(function () { done(null); }, CFG.IDB_TIMEOUT_MS);
      try {
        if (!window.indexedDB) { clearTimeout(timer); return done(null); }
        var req = window.indexedDB.open(CFG.IDB_NAME, 1);
        req.onupgradeneeded = function () {
          try { req.result.createObjectStore(CFG.IDB_STORE); } catch (e) { /* exists */ }
        };
        req.onsuccess = function () { clearTimeout(timer); done(req.result); };
        req.onerror = function () { clearTimeout(timer); done(null); };
        req.onblocked = function () { clearTimeout(timer); done(null); };
      } catch (e) { clearTimeout(timer); done(null); }
    });
  }

  function idbOp(kind, key, value) {
    return new Promise(function (resolve, reject) {
      if (!idb) return reject(new Error("IndexedDB unavailable"));
      var tx, os, req;
      try {
        tx = idb.transaction(CFG.IDB_STORE, kind === "get" || kind === "keys" ? "readonly" : "readwrite");
        os = tx.objectStore(CFG.IDB_STORE);
        req = kind === "get" ? os.get(key)
            : kind === "set" ? os.put(value, key)
            : kind === "del" ? os.delete(key)
            : os.getAllKeys();
      } catch (e) { return reject(e); }
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error || new Error("IndexedDB operation failed")); };
    });
  }

  function probeIDB() {
    return openIDB().then(function (db) {
      idb = db;
      if (!db) return false;
      var k = CFG.PROBE_KEY, v = "p" + Date.now();
      return idbOp("set", k, v)
        .then(function () { return idbOp("get", k); })
        .then(function (got) {
          if (got !== v) return false;
          return idbOp("del", k).then(function () { return true; });
        })
        .catch(function () { return false; });
    });
  }

  /* ── 06.2  TIER SELECTION ──────────────────────────────────────────────── */
  function probe() {
    if (probeLocal()) {
      tier = "local"; mode = "persistent";
      return Promise.resolve(mode);
    }
    return probeIDB().then(function (ok) {
      if (ok) { tier = "idb"; mode = "persistent"; }
      else { tier = "memory"; mode = "session"; idb = null; }
      return mode;
    }).catch(function () {
      tier = "memory"; mode = "session"; idb = null;
      return mode;
    });
  }

  /* ── 06.3  GET / SET / REMOVE / KEYS ───────────────────────────────────── */
  function nsKey(k) { return CFG.NS + k; }

  function get(key) {
    var k = nsKey(key);
    try {
      if (tier === "local") {
        var raw = window.localStorage.getItem(k);
        return Promise.resolve(raw === null ? null : JSON.parse(raw));
      }
      if (tier === "idb") {
        return idbOp("get", k).then(function (v) { return v === undefined ? null : v; });
      }
    } catch (e) {
      /* Corrupt JSON on disk must not take the app down. Drop the key and
         carry on with defaults; §07 reports it. */
      emit("corrupt", { key: key, error: e });
      return Promise.resolve(null);
    }
    return Promise.resolve(k in mem ? mem[k] : null);
  }

  function set(key, value) {
    var k = nsKey(key);
    try {
      if (tier === "local") {
        window.localStorage.setItem(k, JSON.stringify(value));
        return Promise.resolve(true);
      }
      if (tier === "idb") {
        return idbOp("set", k, value).catch(function (e) { return onWriteError(e, key); });
      }
    } catch (e) {
      return Promise.resolve(onWriteError(e, key));
    }
    mem[k] = value;
    return Promise.resolve(true);
  }

  function remove(key) {
    var k = nsKey(key);
    try {
      if (tier === "local") { window.localStorage.removeItem(k); return Promise.resolve(true); }
      if (tier === "idb") { return idbOp("del", k).catch(function () { return false; }); }
    } catch (e) { return Promise.resolve(false); }
    delete mem[k];
    return Promise.resolve(true);
  }

  function keys() {
    try {
      if (tier === "local") {
        var out = [], i, k;
        for (i = 0; i < window.localStorage.length; i++) {
          k = window.localStorage.key(i);
          if (k && k.indexOf(CFG.NS) === 0) out.push(k.slice(CFG.NS.length));
        }
        return Promise.resolve(out);
      }
      if (tier === "idb") {
        return idbOp("keys").then(function (all) {
          return (all || []).filter(function (k) { return String(k).indexOf(CFG.NS) === 0; })
                            .map(function (k) { return String(k).slice(CFG.NS.length); });
        });
      }
    } catch (e) { return Promise.resolve([]); }
    return Promise.resolve(Object.keys(mem).map(function (k) { return k.slice(CFG.NS.length); }));
  }

  /* ── 06.4  QUOTA ────────────────────────────────────────────────────────
     A full disk is not a crash. Emit once, let §07 raise the banner offering
     export and prune, and keep the value in memory so the session continues. */
  function isQuota(e) {
    if (!e) return false;
    return e.name === "QuotaExceededError"
        || e.name === "NS_ERROR_DOM_QUOTA_REACHED"
        || e.code === 22 || e.code === 1014;
  }

  function onWriteError(e, key) {
    if (isQuota(e)) {
      /* The value stays live in §07 state, so the session continues intact. */
      emit("quota", { key: key });
      return false;
    }
    emit("writefail", { key: key, error: e });
    return false;
  }

  /* ── 06.5  PUBLIC ──────────────────────────────────────────────────────── */
  return {
    probe: probe,
    get: get, set: set, remove: remove, keys: keys,
    on: function (fn) { listeners.push(fn); },
    get mode() { return mode; },
    get tier() { return tier; },
    /* Used by §07 only, when a write fails and the app degrades to session. */
    demote: function () { tier = "memory"; mode = "session"; }
  };
})();


/* ═══ §07  STORE / STATE ══════════════════════════════════════════════════
   One store. Features read through select() and write through actions.
   Nothing outside this section calls PMP.Storage.
   ═══════════════════════════════════════════════════════════════════════ */
PMP.Store = (function () {
  var CFG = PMP.STORE_CFG;
  var subs = [];
  var dirty = Object.create(null);
  var flushTimer = null;
  var flushing = false;

  /* ── 07.1  SHAPE & DEFAULTS ────────────────────────────────────────────
     Keys listed in STORE_CFG.PERSISTED are written to disk. Everything under
     `ui` and `sys` is session-only by design. */
  function defaults() {
    return {
      sys: {
        ready: false,
        schemaVersion: CFG.SCHEMA_VERSION,
        storageMode: "probing",
        storageTier: null,
        quotaHit: false,
        corruptKeys: []
      },
      ui: {
        route: null,
        navOpen: false,
        examActive: false,
        lastError: null
      },
      settings: {
        theme: PMP.THEME_PREF || "system",
        examDate: null,
        dailyTarget: 30,
        confidenceTracking: true,
        shuffleOptions: true
      },
      /* One row per committed answer. `credit` is the part mark 0–1 and
         `correct` is the all-or-nothing item mark; `order` is the option
         order that was on screen, so a review can reproduce it exactly. */
      attempts: [],   /* { id, qid, ecoTask, domain, approach, type, difficulty,
                         correct, credit, ms, at, confidence, mode, order } */
      srs: {},        /* cardId -> { ease, interval, reps, lapses, due, suspended } */
      exams: [],      /* { id, startedAt, finishedAt, answers, score, layout } */
      notes: {},      /* qid -> string */
      flags: {},      /* qid -> true, set from any question view */
      journal: [],    /* { id, qid, cause, at, note } */
      planner: { generatedAt: null, weeks: [], done: {} },
      issues: [],     /* { id, qid, text, at } */
      /* The sitting in progress, or null. Written by §10.03 every few seconds
         so that an unclean close costs seconds of clock rather than the paper.
         It holds ids and a seed, never the questions themselves. */
      examRun: null,  /* { id, seed, layout, qids, answers, flags, times, ... } */
      packs: [],      /* { id, name, importedAt, ecoVersion, count, questions } */
      queue: []       /* qids sent to Practice from a mock exam result screen */
    };
  }

  var state = defaults();

  /* Migration hook. Progress files and stored slices carry schemaVersion; a
     v1 slice is upgraded here, an unknown major is refused by §09.6 before it
     ever reaches the store. */
  function migrate(key, value, fromVersion) {
    if (fromVersion === CFG.SCHEMA_VERSION) return value;
    if (fromVersion === 1) {
      /* v1 predates the July 2026 outline: its ecoTask ids belong to the
         retired 35-task table and cannot be mapped safely. Attempts are kept
         for accuracy history but flagged so §10.01 excludes them from
         coverage until they are re-tagged. */
      if (key === "attempts" && Array.isArray(value)) {
        return value.map(function (a) {
          var b = Object.assign({}, a);
          b.legacyEco = b.ecoTask || null;
          b.ecoTask = null;

  }

  /* ── 07.2  SUBSCRIBE / NOTIFY ──────────────────────────────────────────
     Listeners receive (state, changedKeys). A listener that throws is
     isolated so one broken view cannot stop the rest from updating. */
  function subscribe(fn) {
    subs.push(fn);
    return function () {
      var i = subs.indexOf(fn);
      if (i >= 0) subs.splice(i, 1);
    };
  }

  function notify(changed) {

  /* Memoised selector. Recomputes only when the watched slices change. */
  function selector(keys, compute) {

  function commit(keys, mutate, opts) {

  }

  /* ── 07.4  PERSISTENCE BRIDGE ──────────────────────────────────────────
     Debounced ~500 ms and batched: a slice touched fifty times in a burst is
     written once. Never a write per keystroke. */
  function schedule() {
    if (flushTimer || flushing) return;
    if (!Object.keys(dirty).length) return;
    flushTimer = setTimeout(function () { flushTimer = null; flush(); }, CFG.DEBOUNCE_MS);
  }

  function flush() {
    var keys = Object.keys(dirty);
    if (!keys.length || state.sys.storageMode === "session") { dirty = Object.create(null); return Promise.resolve(); }
    dirty = Object.create(null);
    flushing = true;
    var writes = keys.map(function (k) {
      return PMP.Storage.set(k, { v: CFG.SCHEMA_VERSION, d: state[k] });
    });
    return Promise.all(writes).then(function () {

      schedule();
    }).catch(function () {

    });
  }

  function hydrate() {
    var keys = CFG.PERSISTED;
    return Promise.all(keys.map(function (k) { return PMP.Storage.get(k); }))
      .then(function (vals) {
        vals.forEach(function (wrapped, i) {

  /* Prune. Offered when the disk is full — drops the oldest attempts, which
     are the largest slice and the least load-bearing once they have aged out
     of the readiness window. Returns how many were removed. */
  function pruneAttempts(keep) {
    keep = keep || CFG.PRUNE_KEEP_ATTEMPTS;
    var before = state.attempts.length;

    commit(["attempts"], function (s) {
      s.attempts = s.attempts.slice(-keep);
    });

  }

  function clearAll() {
    return Promise.all(CFG.PERSISTED.map(function (k) { return PMP.Storage.remove(k); }))
      .then(function () {
        var fresh = defaults();
        CFG.PERSISTED.forEach(function (k) { state[k] = fresh[k]; bump(k); });
        dirty = Object.create(null);
        notify(CFG.PERSISTED.slice());
      });

  /* Storage events raised by §06 land here and become UI state. */
  PMP.Storage.on(function (evt, detail) {
    if (evt === "quota") {
      if (state.sys.quotaHit) return;
      commit(["sys"], function (s) { s.sys.quotaHit = true; }, { transient: true });
    } else if (evt === "corrupt") {
      commit(["sys"], function (s) {

    } else if (evt === "writefail") {

    }
  });

  return {
    get state() { return state; },
    defaults: defaults,
    subscribe: subscribe,
    selector: selector,
    commit: commit,
    hydrate: hydrate,
    flush: flush,
    pruneAttempts: pruneAttempts,
    clearAll: clearAll,
    /* Exposed for §12.1: a crash handler needs the raw state to offer export. */
    snapshot: function () {
      var out = { schemaVersion: CFG.SCHEMA_VERSION, type: "pmp-progress", exportedAt: new Date().toISOString() };
      CFG.PERSISTED.forEach(function (k) { out[k] = state[k]; });
      return out;
    }
  };
})();


/* ═══ §08  ROUTER ═════════════════════════════════════════════════════════
   Hash-based so the file works from file://. Routes are registered here with
   a title and a render function; §10 replaces the stub renderers in place.
   ═══════════════════════════════════════════════════════════════════════ */
PMP.Router = (function () {
  var routes = Object.create(null);
  var order = [];
  var current = null;
  var guards = [];
  var started = false;

  /* ── 08.1  PARSE / BUILD ───────────────────────────────────────────────
     "#/practice?domain=process&difficulty=3" -> { name, params } */
  function parse(hash) {
    var raw = String(hash || "").replace(/^#/, "");
    if (raw.charAt(0) === "/") raw = raw.slice(1);
    var qi = raw.indexOf("?");
    var name = (qi >= 0 ? raw.slice(0, qi) : raw).replace(/\/+$/, "");
    var params = Object.create(null);
    if (qi >= 0) {
      raw.slice(qi + 1).split("&").forEach(function (pair) {
        if (!pair) return;
        var eq = pair.indexOf("=");
        var k = decodeURIComponent(eq < 0 ? pair : pair.slice(0, eq));
        var v = eq < 0 ? "" : decodeURIComponent(pair.slice(eq + 1).replace(/\+/g, " "));
        params[k] = v;
      });
    }
    return { name: name || "dashboard", params: params };
  }

  function build(name, params) {
    var q = [];
    if (params) {
      Object.keys(params).forEach(function (k) {
        if (params[k] === null || params[k] === undefined || params[k] === "") return;
        q.push(encodeURIComponent(k) + "=" + encodeURIComponent(params[k]));
      });
    }
    return "#/" + name + (q.length ? "?" + q.join("&") : "");
  }

  function navigate(name, params, replace) {
    var url = build(name, params);
    /* replaceState is the nicer path — it swaps the entry instead of stacking
       one — but it is not always available to us. Some engines refuse it
       outright for file:// documents, which is exactly where this build is
       expected to run, and a refusal throws rather than returning false. A
       plain hash write always works, so the history call is treated as an
       optimisation that is allowed to fail. */
    if (replace && window.history && window.history.replaceState) {
      try {
        window.history.replaceState(null, "", url);
        handle();
        return;
      } catch (e) { /* fall through to the hash write below */ }
    }
    if (window.location.hash === url) handle(); else window.location.hash = url;
  }

  /* ── 08.2  ROUTE TABLE & GUARDS ────────────────────────────────────────
     A guard returns null to allow, or a message to block. The exam guard is
     registered in §10.03; the hook lives here so navigation cannot bypass it. */
  function register(name, def) {
    routes[name] = def;
    order.push(name);
  }
  function addGuard(fn) { guards.push(fn); }

  function checkGuards(to) {
    for (var i = 0; i < guards.length; i++) {
      var msg = guards[i](to, current);
      if (msg) return msg;
    }
    return null;
  }

  /* ── 08.3  HANDLE — render, retitle, move focus ────────────────────────
     Focus moves to the view container on every route change so a keyboard or
     screen-reader user lands in the new content, not back at the top of nav. */
  function handle() {
    var to = parse(window.location.hash);
    if (!routes[to.name]) {
      PMP.UI.toast("No section called \u201C" + to.name + "\u201D. Showing the dashboard.", "warn");
      return navigate("dashboard", null, true);
    }

    var blocked = checkGuards(to);
    if (blocked) {
      PMP.UI.toast(blocked, "warn");
      if (current) window.location.hash = build(current.name, current.params);
      return;
    }

    var def = routes[to.name];
    var host = document.getElementById("view");
    host.innerHTML = "";
    try {
      def.render(host, to.params);
    } catch (e) {
      host.innerHTML = "";
      host.appendChild(PMP.UI.empty(
        "This section did not load",
        "Something went wrong rendering " + def.title + ". Your saved progress is untouched. Export a backup, then reload the file.",
        "alert"
      ));
      PMP.report(e, "render:" + to.name);
    }

    current = to;
    document.getElementById("view-title").textContent = def.title;
    document.title = def.title + " \u2014 PMP Prep Suite";
    markActive(to.name);

    try { host.focus({ preventScroll: true }); } catch (e) { host.focus(); }
    if (window.scrollTo) window.scrollTo(0, 0);
    PMP.Store.commit(["ui"], function (s) { s.ui.route = to.name; s.ui.navOpen = false; }, { transient: true });
    PMP.UI.announce(def.title);
  }

  function markActive(name) {
    var links = document.querySelectorAll(".nav-i");
    for (var i = 0; i < links.length; i++) {
      if (links[i].getAttribute("data-route") === name) links[i].setAttribute("aria-current", "page");
      else links[i].removeAttribute("aria-current");
    }
  }

  function start() {
    if (started) return;
    started = true;
    window.addEventListener("hashchange", handle);
    if (!window.location.hash) navigate("dashboard", null, true);
    else handle();
  }

  return {
    register: register, addGuard: addGuard, navigate: navigate,
    parse: parse, build: build, start: start,
    has: function (name) { return !!routes[name]; },
    get current() { return current; },
    get names() { return order.slice(); }
  };
})();


/* ═══ §09  UTILITIES ══════════════════════════════════════════════════════ */

/* ── 09.1  DOM ──────────────────────────────────────────────────────────── */
PMP.dom = (function () {
  function el(tag, attrs, children) {

        var v = attrs[k];

        else if (k.indexOf("on") === 0 && typeof v === "function") node.addEventListener(k.slice(2), v);

    svg.setAttribute("class", cls || "i");

    svg.setAttribute("focusable", "false");

  }

    return function () { target.removeEventListener(evt, fn, opts); };
  }

     and the glossary. */
  function virtualise(host, opts) {
    var rowH = opts.rowHeight, total = opts.count, render = opts.render, over = opts.overscan || 8;
    var spacer = el("div", { style: "height:" + (rowH * total) + "px;position:relative" });
    var pool = el("div", { style: "position:absolute;left:0;right:0;top:0" });
    spacer.appendChild(pool);
    host.innerHTML = "";
    host.style.overflowY = "auto";
    host.appendChild(spacer);
    var lastStart = -1;
    function paint() {
      var start = Math.max(0, Math.floor(host.scrollTop / rowH) - over);
      if (start === lastStart) return;
      lastStart = start;
      var visible = Math.ceil(host.clientHeight / rowH) + over * 2;
      var end = Math.min(total, start + visible);
      pool.style.transform = "translateY(" + (start * rowH) + "px)";
      pool.innerHTML = "";
      for (var i = start; i < end; i++) pool.appendChild(render(i));
    }
    var off = on(host, "scroll", paint, { passive: true });
    paint();
    return { repaint: function () { lastStart = -1; paint(); }, destroy: off };
  }

  return { el: el, frag: frag, append: append, icon: icon, on: on, delegate: delegate, virtualise: virtualise };
})();

/* ── 09.2  FORMAT ───────────────────────────────────────────────────────── */
PMP.fmt = (function () {
  function pad(n) { return n < 10 ? "0" + n : String(n); }

  /* Exam clock. Always h:mm:ss so the field width never changes. */
  function clock(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    return Math.floor(s / 3600) + ":" + pad(Math.floor(s / 60) % 60) + ":" + pad(s % 60);
  }
  function duration(sec) {
    sec = Math.max(0, Math.round(sec));

    var m = Math.floor(sec / 60);

    return Math.floor(m / 60) + "h " + pad(m % 60) + "m";
  }
  function pct(x, dp) { return (x * 100).toFixed(dp === undefined ? 0 : dp) + "%"; }

  }

})();

/* ── 09.3  TIME ─────────────────────────────────────────────────────────────
   Every elapsed figure is a Date.now() delta. Ticks are never accumulated:
   a background tab is throttled to roughly one tick a second or slower, and
   summing ticks would silently give the candidate extra exam time. */
PMP.time = (function () {
  function Clock(totalMs) {
    this.totalMs = totalMs;
    this.startedAt = null;
    this.consumed = 0;      /* ms banked from previous running spans */
    this.running = false;
  }

    if (this.running) return this;
    this.startedAt = Date.now(); this.running = true; return this;
  };
  Clock.prototype.pause = function () {

    this.startedAt = null; this.running = false; return this;

    return this.consumed + (this.running ? Date.now() - this.startedAt : 0);

  Clock.prototype.expired = function () { return this.elapsed() >= this.totalMs; };

    return function () { clearInterval(id); };
  }

  function startOfDay(ts) { var d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function daysBetween(a, b) { return Math.round((startOfDay(b) - startOfDay(a)) / 86400000); }

  return { Clock: Clock, tick: tick, startOfDay: startOfDay, daysBetween: daysBetween };
})();

/* ── 09.4  RANDOM ───────────────────────────────────────────────────────────
   Seeded so a mock sitting can be reconstructed exactly from its stored seed,
   and so the content audit is reproducible. */

      if (total <= 0) hit = Math.floor(rand() * pool.length);

        if (hit >= pool.length) hit = pool.length - 1;

    return prefix + "-" + Date.now().toString(36) + "-" + Math.floor(Math.random() * 1e6).toString(36);
  }

})();

/* ── 09.5  TEXT ─────────────────────────────────────────────────────────────
   Trigram index for the glossary and reference search. No external library. */

    }

})();

/* ── 09.6  VALIDATE ─────────────────────────────────────────────────────────
   Every import path runs through here before a single byte reaches the store.
   Errors are indexed and name the offending field, per acceptance test 8. */

    try { return { ok: true, value: JSON.parse(raw) }; }
    catch (e) {
      var m = /position (\d+)/.exec(e.message);
      return { ok: false, error: "The file is not valid JSON" + (m ? " (character " + m[1] + ")" : "") + "." };
    }
  }

  function checkVersion(obj, expectedType, r) {
    if (!obj || typeof obj !== "object") { r.err("file", "The file does not contain a JSON object."); return false; }
    if (obj.type && obj.type !== expectedType) { r.err("type", "This file is \u201C" + obj.type + "\u201D, not " + expectedType + "."); return false; }
    var v = obj.schemaVersion;
    if (typeof v !== "number") { r.err("schemaVersion", "Missing schemaVersion."); return false; }
    if (v > PMP.STORE_CFG.SCHEMA_VERSION) {
      r.err("schemaVersion", "This file uses schema " + v + ". This build reads up to " + PMP.STORE_CFG.SCHEMA_VERSION + ". Update the app, or export again from the older version.");
      return false;
    }
    return true;
  }

  function pack(obj) {
    var r = new Result();
    if (!checkVersion(obj, "pmp-pack", r)) return r;
    if (!Array.isArray(obj.questions)) { r.err("questions", "Missing a questions array."); return r; }
    if (obj.ecoVersion && obj.ecoVersion !== PMP.ECO.VERSION) {
      r.warn("ecoVersion", "Pack targets ECO " + obj.ecoVersion + "; this build targets " + PMP.ECO.VERSION + ". Task coverage will not count until items are re-tagged.");
    }
    var seen = Object.create(null);
    obj.questions.forEach(function (q, i) {
      var at = "questions[" + i + "]";
      if (!q || typeof q !== "object") return r.err(at, "Not an object.");
      if (!q.id) r.err(at + ".id", "Missing id.");
      /* `in`, not truthiness: the first item sits at index 0, which is falsy. */
      else if (q.id in seen) r.err(at + ".id", "Duplicate id \u201C" + q.id + "\u201D (first seen at index " + seen[q.id] + ").");
      else seen[q.id] = i;
      if (TYPES.indexOf(q.type) < 0) r.err(at + ".type", "Unknown type \u201C" + q.type + "\u201D. Expected one of: " + TYPES.join(", ") + ".");
      if (PMP.ECO.DOMAINS.indexOf(q.domain) < 0) r.err(at + ".domain", "Unknown domain \u201C" + q.domain + "\u201D.");
      if (!PMP.ECO_TASK_BY_ID[q.ecoTask]) r.err(at + ".ecoTask", "Unknown ECO task \u201C" + q.ecoTask + "\u201D for outline " + PMP.ECO.VERSION + ".");
      if (!q.stem || String(q.stem).trim().length < 10) r.err(at + ".stem", "Stem is missing or too short.");
      if (!q.explanation) r.err(at + ".explanation", "Missing explanation.");
      if (Array.isArray(q.options)) {
        if (!q.options.some(function (o) { return o && o.correct; })) r.err(at + ".options", "No option is marked correct.");
        q.options.forEach(function (o, j) {
          if (!o || !o.rationale) r.err(at + ".options[" + j + "].rationale", "Every option needs its own rationale.");
        });
      } else if (q.type !== "fillblank" && q.type !== "hotspot") {
        r.err(at + ".options", "Missing options array.");
      }

      /* Type-specific shape. A pack can satisfy every rule above and still be
         unrenderable: a matching item with no prompts, a hotspot with no
         regions, a numeric blank with nothing to compare against. Each of
         these is caught here rather than at render time, because the render
         is in front of somebody sitting a mock exam. */
      var t = PMP.QRender ? PMP.QRender.base(q.type) : q.type;
      if (t === "matching") {
        if (!Array.isArray(q.prompts) || !q.prompts.length) {
          r.err(at + ".prompts", "A matching or drop-down item needs a prompts array.");
        } else {
          q.prompts.forEach(function (pr, j) {
            if (!pr || pr.id == null) return r.err(at + ".prompts[" + j + "].id", "Every prompt needs an id.");
            var hits = (q.options || []).filter(function (o) { return o && String(o.match) === String(pr.id); });
            if (hits.length !== 1) {
              r.err(at + ".prompts[" + j + "]", "Needs exactly one option whose match is \u201C" + pr.id + "\u201D; found " + hits.length + ".");
            }
          });
        }
      }
      if (t === "hotspot") {
        if (!Array.isArray(q.regions) || !q.regions.length) {
          r.err(at + ".regions", "A hotspot item needs a regions array.");
        } else if (!q.regions.some(function (rg) { return rg && rg.correct; })) {
          r.err(at + ".regions", "No region is marked correct.");
        }
        if (!q.graphic || !q.graphic.viewBox) {
          r.err(at + ".graphic", "A hotspot item needs a graphic with a viewBox.");
        }
      }
      if (t === "fillblank") {
        if (!Array.isArray(q.blanks) || !q.blanks.length) {
          r.err(at + ".blanks", "A fill-in-the-blank item needs a blanks array.");
        } else {
          q.blanks.forEach(function (b, j) {
            var bat = at + ".blanks[" + j + "]";
            if (!b || b.id == null) return r.err(bat + ".id", "Every blank needs an id.");
            if (b.numeric) {
              if (typeof b.expect !== "number") r.err(bat + ".expect", "A numeric blank needs a numeric expect value.");
            } else if (!Array.isArray(b.accept) || !b.accept.length) {
              r.err(bat + ".accept", "A text blank needs a non-empty accept array.");
            }
          });
        }
      }
    });
    return r;
  }

  function progress(obj) {
    var r = new Result();
    if (!checkVersion(obj, "pmp-progress", r)) return r;
    PMP.STORE_CFG.PERSISTED.forEach(function (k) {
      if (!(k in obj)) { r.warn(k, "Not present in the file; the current value will be kept."); return; }
      var expected = Array.isArray(PMP.Store.defaults()[k]) ? "array" : typeof PMP.Store.defaults()[k];
      var actual = Array.isArray(obj[k]) ? "array" : typeof obj[k];
      if (actual !== expected) r.err(k, "Expected " + expected + ", found " + actual + ".");
    });
    return r;
  }

  return { pack: pack, progress: progress, parseJSON: parseJSON, TYPES: TYPES, Result: Result };
})();

/* ── 09.7  UI PRIMITIVES ────────────────────────────────────────────────── */
PMP.UI = (function () {
  var el = PMP.dom.el, icon = PMP.dom.icon;

  function announce(msg, assertive) {
    var node = document.getElementById(assertive ? "live-alert" : "live-polite");
    if (!node) return;
    node.textContent = "";
    setTimeout(function () { node.textContent = msg; }, 30);
  }

  function toast(msg, kind, ms) {
    var host = document.getElementById("toasts");
    if (!host) return;
    kind = kind || "ok";
    var iconName = kind === "err" ? "alert" : kind === "warn" ? "alert" : "check";
    var node = el("div", { class: "toast toast--" + kind, role: "status" }, [
      icon(iconName),
      el("span", { text: msg }),
      el("button", {
        class: "icon-btn x", type: "button", "aria-label": "Dismiss",
        onclick: function () { node.remove(); }
      }, [icon("x")])
    ]);
    host.appendChild(node);
    announce(msg, kind === "err");
    setTimeout(function () { if (node.parentNode) node.remove(); }, ms || (kind === "ok" ? 4000 : 8000));
    return node;
  }

  /* One dialog element, reused. Returns a promise resolving to the id of the
     action the person chose, or null if they closed it. */
  var sheetResolve = null;
  function sheet(opts) {
    var dlg = document.getElementById("sheet");
    var title = document.getElementById("sheet-title");
    var body = document.getElementById("sheet-body");
    var foot = document.getElementById("sheet-foot");
    title.textContent = opts.title;
    body.innerHTML = "";
    PMP.dom.append(body, opts.body);
    foot.innerHTML = "";
    (opts.actions || [{ id: "close", label: "Close" }]).forEach(function (a) {
      foot.appendChild(el("button", {
        class: "btn" + (a.primary ? " btn--primary" : a.danger ? " btn--danger" : ""),
        type: "button",
        onclick: function () { close(a.id); }
      }, [a.icon ? icon(a.icon) : null, a.label]));
    });
    if (typeof dlg.showModal === "function") dlg.showModal();
    else dlg.setAttribute("open", "");
    var first = foot.querySelector(".btn--primary") || foot.querySelector(".btn");
    if (first) first.focus();
    return new Promise(function (res) { sheetResolve = res; });
  }
  function close(id) {
    /* dlg.close() fires a 'close' event synchronously and §12.2 routes that
       back here. Detach the resolver before closing so the caller receives the
       action they chose rather than the null from the re-entrant call. */
    var resolve = sheetResolve;
    sheetResolve = null;
    var dlg = document.getElementById("sheet");
    if (dlg.open && typeof dlg.close === "function") dlg.close();
    else dlg.removeAttribute("open");
    if (resolve) resolve(id || null);
  }

  function confirm(title, message, confirmLabel, danger) {
    return sheet({
      title: title,
      body: el("p", { text: message }),
      actions: [
        { id: "cancel", label: "Cancel" },
        { id: "ok", label: confirmLabel, primary: !danger, danger: !!danger }
      ]
    }).then(function (r) { return r === "ok"; });
  }

  function empty(heading, detail, iconName) {
    return el("div", { class: "empty" }, [
      icon(iconName || "info"),
      el("h3", { text: heading }),
      el("p", { text: detail })
    ]);
  }

  /* ── Banners. The storage banner is not dismissible: if progress will be
     lost on close, the person needs to see that every time. ─────────────── */
  function renderBanners(state) {
    var host = document.getElementById("banners");
    if (!host) return;
    host.innerHTML = "";

    if (state.sys.storageMode === "session") {
      host.appendChild(el("div", { class: "banner", role: "alert" }, [
        icon("alert"),
        el("div", { class: "banner-b" }, [
          el("div", { class: "banner-t", text: "Progress is not being saved" }),
          el("div", {
            class: "banner-d",
            text: "This browser will not let the file store data on disk, so everything you do is held in memory only and disappears when you close the tab. Export a backup before you finish, and import it next time."
          })
        ]),
        el("button", {
          class: "btn btn--sm", type: "button",
          onclick: function () { PMP.Exporter.exportProgress(); }
        }, [icon("data"), "Export now"])
      ]));
    }

    if (state.sys.quotaHit) {
      host.appendChild(el("div", { class: "banner banner--danger", role: "alert" }, [
        icon("alert"),
        el("div", { class: "banner-b" }, [
          el("div", { class: "banner-t", text: "Storage is full" }),
          el("div", {
            class: "banner-d",
            text: "The last save did not complete because this browser's storage for the file is full. Export a backup, then remove older attempt history to free space."
          })
        ]),
        el("button", { class: "btn btn--sm", type: "button", onclick: function () { PMP.Exporter.exportProgress(); } }, [icon("data"), "Export"]),
        el("button", {
          class: "btn btn--sm", type: "button",
          onclick: function () {
            var keep = PMP.STORE_CFG.PRUNE_KEEP_ATTEMPTS;
            confirm("Remove older attempts?",
              "The most recent " + keep + " answered questions are kept. Older attempts are deleted permanently. Your flashcards, mock exam history and notes are not affected.",
              "Remove older attempts", true).then(function (yes) {
              if (!yes) return;
              var n = PMP.Store.pruneAttempts(keep);
              PMP.Store.commit(["sys"], function (s) { s.sys.quotaHit = false; }, { transient: true });
              toast(n ? "Removed " + PMP.fmt.plural(n, "older attempt") + "." : "Nothing to remove.", "ok");
            });
          }
        }, "Free space")
      ]));
    }

    if (state.sys.corruptKeys.length) {
      host.appendChild(el("div", { class: "banner", role: "alert" }, [
        icon("alert"),
        el("div", { class: "banner-b" }, [
          el("div", { class: "banner-t", text: "Some saved data could not be read" }),
          el("div", { class: "banner-d", text: "These sections were reset to their defaults: " + state.sys.corruptKeys.join(", ") + ". If you have a backup file, import it to restore them." })
        ]),
        el("button", { class: "btn btn--sm", type: "button", onclick: function () { PMP.Router.navigate("data"); } }, "Import backup")
      ]));
    }
  }

  return { toast: toast, sheet: sheet, closeSheet: close, confirm: confirm, empty: empty, announce: announce, renderBanners: renderBanners };
})();

/* ── 09.8  EXPORT ───────────────────────────────────────────────────────────
   A Blob download is the happy path, but it is not reliable everywhere: iOS
   Safari opens JSON in a tab instead of saving it, and some file:// sandboxes
   refuse the object URL outright. So every export offers three routes and
   never assumes the first one worked. */
PMP.Exporter = (function () {
  var el = PMP.dom.el;

  function filename(prefix) {
    var d = new Date();
    return prefix + "-" + d.getFullYear() + "-" + PMP.fmt.pad(d.getMonth() + 1) + "-" + PMP.fmt.pad(d.getDate()) + ".json";
  }

  function tryDownload(text, name) {
    try {
      var blob = new Blob([text], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = el("a", { href: url, download: name, style: "display:none" });
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 4000);
      return true;
    } catch (e) { return false; }
  }

  function copyText(text) {
    /* navigator.clipboard needs a secure context, which file:// is not, so the
       execCommand path is the primary route here rather than the fallback. */
    return new Promise(function (resolve) {
      var ta = el("textarea", {
        style: "position:fixed;top:0;left:0;opacity:0;pointer-events:none",
        "aria-hidden": "true"
      });
      ta.value = text;
      document.body.appendChild(ta);
      ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      ta.remove();
      if (ok) return resolve(true);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { resolve(true); }, function () { resolve(false); });
      } else resolve(false);
    });
  }

  function offer(text, name, heading) {
    var ta = el("textarea", { class: "textarea", readonly: true, spellcheck: "false", "aria-label": "Backup file contents" });
    ta.value = text;

    var body = PMP.dom.frag([
      el("p", { text: "Your backup is " + PMP.fmt.bytes(text.length) + ". Save it with the button below, or copy the text and paste it into a file yourself." }),
      el("p", { text: "To restore it later, open Backup and packs and choose Import progress." }),
      ta
    ]);

    return PMP.UI.sheet({
      title: heading || "Export progress",
      body: body,
      actions: [
        { id: "close", label: "Close" },
        { id: "copy", label: "Copy to clipboard", icon: "clip" },
        { id: "save", label: "Save file", icon: "data", primary: true }
      ]
    }).then(function (choice) {
      if (choice === "save") {
        if (tryDownload(text, name)) PMP.UI.toast("Saved " + name + ".", "ok");
        else PMP.UI.toast("This browser blocked the download. Copy the text instead.", "warn");
      } else if (choice === "copy") {
        return copyText(text).then(function (ok) {
          PMP.UI.toast(ok ? "Backup copied to the clipboard." : "Copying was blocked. Select the text in the box and copy it manually.", ok ? "ok" : "warn");
        });
      }
    });
  }

  function exportProgress() {
    var text;
    try { text = JSON.stringify(PMP.Store.snapshot(), null, 2); }
    catch (e) { PMP.UI.toast("Your progress could not be turned into a backup file.", "err"); return Promise.resolve(); }
    return offer(text, filename("pmp-progress"), "Export progress");
  }

  return { exportProgress: exportProgress, offer: offer, copyText: copyText, filename: filename, tryDownload: tryDownload };
})();


/* ═══ §10  FEATURE MODULES ════════════════════════════════════════════════
   One IIFE each. A module that has landed registers its own route here, and
   the stubs in §12.3 stand aside for it rather than overwriting it.
   Built: 10.02 practice engine, 10.03 mock exam simulator,
          10.04 question renderers, 10.13 data portability,
          10.14 content audit.
   Still stubs: 10.01, 10.05 to 10.12.
   ════════════════════════════════════════════════════════════════════ */

/* ── 10.02  PRACTICE ENGINE ─────────────────────────────────────────────────
   Filters (§3.2), the three drill modes, and everything that wraps a single
   item: flag, note, report an issue, and the per-question pace timer.

   Three deliberate choices worth knowing before reading the code:

   · Filters live in module state, not the store. They are a way of asking a
     question, not a preference worth surviving a reload, and the route reads
     #/practice?domain=process&type=multi so a filtered drill is still linkable.

   · Every item's panel is built once and kept. Going back to question 3 shows
     the same option order, the same typing and the same feedback, because it
     is literally the same DOM. Nothing is re-shuffled under someone mid-drill.

   · An attempt is recorded the moment an answer is committed, not at the end.
     Closing the tab halfway through a drill loses the drill, never the work.
     A skipped item records nothing at all: it is not evidence of anything, and
     writing it down as a wrong answer would quietly poison the readiness
     score in §10.01.
   ═════════════════════════════════════════════════════════════════════════ */
PMP.Practice = (function () {
  var el = PMP.dom.el, icon = PMP.dom.icon, on = PMP.dom.on, frag = PMP.dom.frag;
  var CFG = PMP.PRACTICE;
  var PACE_MS = CFG.PACE_TARGET_SEC * 1000;

  var filters = null;
  var session = null;
  var teardown = [];
  var el_ = {};            /* live nodes for the running drill */

  /* ── helpers ─────────────────────────────────────────────────────────── */
  function mmss(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    return Math.floor(s / 60) + ":" + PMP.fmt.pad(s % 60);
  }
  function cleanup() {
    teardown.forEach(function (fn) { try { fn(); } catch (e) {} });
    teardown = [];
    /* Whatever took the drill off screen, the question the person was on is no
       longer in front of them, so its pace clock stops. show() restarts it
       when they come back. Without this, wandering off to check the formula
       lab would land on their time-per-question figure as if they had sat
       there staring at the item. */
    if (session && !session.finished) {
      var item = session.items[session.i];
      if (item && !item.committed) item.clock.pause();
    }
  }
  function everySecond(fn) {
    var id = setInterval(fn, 250);
    teardown.push(function () { clearInterval(id); });
    fn();
  }
  function repaint() {
    var host = document.getElementById("view");
    if (!host) return;
    host.innerHTML = "";
    view(host, {});
  }
  function defaultFilters() {
    return { domain: "", ecoTask: "", approach: "", difficulty: "", type: "", tag: "", status: "" };
  }

  /* ── 10.02.1  THE POOL ───────────────────────────────────────────────────
     One pass over the attempt history gives per-question history for the
     status filter and per-task accuracy for the adaptive weighting. */
  function historyIndex(state) {
    var m = Object.create(null);
    state.attempts.forEach(function (a) {
      if (!a || !a.qid) return;
      var e = m[a.qid] || (m[a.qid] = { n: 0, right: 0, lastCorrect: false, lastAt: null });
      e.n++;
      if (a.correct) e.right++;
      e.lastCorrect = !!a.correct;
      e.lastAt = a.at || e.lastAt;
    });
    return m;
  }

  function taskIndex(state) {
    var m = Object.create(null);
    state.attempts.forEach(function (a) {
      if (!a || !a.ecoTask) return;
      var e = m[a.ecoTask] || (m[a.ecoTask] = { n: 0, credit: 0 });
      e.n++;
      e.credit += (typeof a.credit === "number") ? a.credit : (a.correct ? 1 : 0);
    });
    return m;
  }

  function statusOf(q, state, hist) {
    if (state.flags[q.id]) return "flagged";
    var h = hist[q.id];
    if (!h) return "unseen";
    return h.lastCorrect ? "right" : "wrong";
  }

  function matches(q, f, state, hist) {
    if (f.domain && q.domain !== f.domain) return false;
    if (f.ecoTask && q.ecoTask !== f.ecoTask) return false;
    if (f.approach && (q.approach || "") !== f.approach) return false;
    if (f.difficulty && String(q.difficulty || "") !== f.difficulty) return false;
    if (f.type && PMP.QRender.base(q.type) !== f.type && q.type !== f.type) return false;
    if (f.tag && (q.tags || []).indexOf(f.tag) < 0) return false;
    if (f.status) {
      var h = hist[q.id];
      if (f.status === "flagged" && !state.flags[q.id]) return false;
      if (f.status === "noted" && !state.notes[q.id]) return false;
      if (f.status === "unseen" && h) return false;
      if (f.status === "wrong" && (!h || h.lastCorrect)) return false;
      if (f.status === "right" && (!h || !h.lastCorrect)) return false;
    }
    return true;
  }

  function pool() {
    var state = PMP.Store.state, hist = historyIndex(state);
    return PMP.QUESTIONS.filter(function (q) { return matches(q, filters, state, hist); });
  }

  /* ── 10.02.2  SELECTION ──────────────────────────────────────────────────
     Practice and timed drills take a straight random sample. An adaptive drill
     weights each candidate by how weak its ECO task looks, using a prior so
     that a task with two attempts is not treated as settled evidence, and it
     nudges unseen items up and recently-correct items down. The weighting is
     shown to the person in the mode card rather than left as a black box. */
  function weightFor(q, tasks, hist) {
    var t = tasks[q.ecoTask] || { n: 0, credit: 0 };
    var A = CFG.ADAPTIVE;
    var acc = (t.credit + A.PRIOR * A.PRIOR_N) / (t.n + A.PRIOR_N);
    var w = Math.pow(1 - acc, A.EXPONENT) + A.FLOOR;
    var h = hist[q.id];
    if (!h) w *= A.UNSEEN_BOOST;
    else if (h.lastCorrect) w *= A.RIGHT_DAMP;
    return w;
  }

  function choose(list, count, mode) {
    if (list.length <= count) return PMP.rng.shuffle(list).items;
    if (mode !== "adaptive") return PMP.rng.shuffle(list).items.slice(0, count);
    var state = PMP.Store.state, tasks = taskIndex(state), hist = historyIndex(state);
    return PMP.rng.sample(list, list.map(function (q) { return weightFor(q, tasks, hist); }), count);
  }

  /* ── 10.02.3  SETUP VIEW ─────────────────────────────────────────────── */
  function selectField(cfg) {
    var sel = el("select", { class: "select", id: cfg.id });
    (cfg.options || []).forEach(function (o) {
      if (o.group) {
        var g = el("optgroup", { label: o.group });
        o.items.forEach(function (i2) {
          g.appendChild(el("option", { value: i2.v, text: i2.t, selected: i2.v === cfg.value }));
        });
        sel.appendChild(g);
      } else {
        sel.appendChild(el("option", { value: o.v, text: o.t, selected: o.v === cfg.value }));
      }
    });
    on(sel, "change", function () { cfg.onChange(sel.value); });
    return el("label", { class: "field", for: cfg.id }, [
      el("span", { class: "lbl", text: cfg.label }),
      sel
    ]);
  }

  function taskOptions() {
    var out = [{ v: "", t: "Any task" }];
    PMP.ECO.DOMAINS.forEach(function (d) {
      if (filters.domain && filters.domain !== d) return;
      out.push({
        group: PMP.ECO.DOMAIN_LABELS[d],
        items: PMP.ECO_TASKS.filter(function (t) { return t.domain === d; }).map(function (t) {
          return { v: t.id, t: t.n + ". " + t.label };
        })
      });
    });
    return out;
  }

  function tagOptions() {
    var seen = Object.create(null);
    PMP.QUESTIONS.forEach(function (q) { (q.tags || []).forEach(function (t) { seen[t] = true; }); });
    return [{ v: "", t: "Any tag" }].concat(Object.keys(seen).sort().map(function (t) { return { v: t, t: t }; }));
  }

  function typeOptions() {
    var seen = Object.create(null);
    PMP.QUESTIONS.forEach(function (q) { seen[PMP.QRender.base(q.type)] = true; });
    return [{ v: "", t: "Any type" }].concat(Object.keys(seen).sort().map(function (t) {
      return { v: t, t: PMP.QRender.TYPE_LABELS[t] || t };
    }));
  }

  function renderSetup(host, params) {
    var state = PMP.Store.state;

    host.appendChild(el("div", { class: "view-hd" }, [
      el("span", { class: "eyebrow", text: "Practice" }),
      el("h2", { text: "Build a drill" }),
      el("p", { text: "Filter down to what you want to work on, choose how you want to be pushed, and go. Answers are saved as you give them, so a drill you abandon still counts." })
    ]));

    if (!PMP.QUESTIONS.length) {
      host.appendChild(PMP.UI.empty(
        "No questions are loaded",
        "This build has no content pack. Import one from Backup and packs, and every filter below will start working against it.",
        "book"
      ));
      return;
    }

    /* The drill queue ── filled by the mock exam results screen in §10.03.
       It sits above the filters because a queue with something in it is
       almost always the better use of the next twenty minutes than a fresh
       filtered drill, and because a queue nobody can see is a queue nobody
       works through. */
    var queued = (state.queue || []).map(function (id) { return PMP.Content.byId(id); }).filter(Boolean);
    if (queued.length) {
      host.appendChild(el("div", { class: "card queue-card" }, [
        el("span", { class: "eyebrow", text: "From your mock exams" }),
        el("h2", { text: PMP.fmt.plural(queued.length, "question") + " waiting in the drill queue" }),
        el("p", { text: "These are questions you missed in a sitting and sent here to work through. They stay until you clear them." }),
        el("div", { style: "display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-top:var(--sp-5)" }, [
          el("button", {
            class: "btn btn--primary", type: "button",
            onclick: function () {
              var take = PMP.rng.shuffle(queued).items.slice(0, Math.min(20, queued.length));
              var taken = Object.create(null);
              take.forEach(function (q) { taken[q.id] = true; });
              PMP.Store.commit(["queue"], function (st) {
                st.queue = st.queue.filter(function (id) { return !taken[id]; });
              });
              startWith(take, "practice");
            }
          }, [icon("target"), "Drill " + Math.min(20, queued.length) + " of them"]),
          el("button", {
            class: "btn", type: "button",
            onclick: function () {
              PMP.UI.confirm("Clear the drill queue?",
                "The " + queued.length + " questions in it go back into the general pool. Your answer history is not affected.",
                "Clear it", true).then(function (yes) {
                if (!yes) return;
                PMP.Store.commit(["queue"], function (st) { st.queue = []; });
                repaint();
              });
            }
          }, "Clear the queue")
        ])
      ]));
    }

    /* Filters ── §3.2 */
    var poolNode = el("b", { text: "0" });
    var startBtns = [];

    function refreshPool() {
      var n = pool().length;
      poolNode.textContent = String(n);
      startBtns.forEach(function (b) { b.disabled = n === 0; });
      var lenSel = document.getElementById("f-length");
      if (lenSel) {
        Array.prototype.forEach.call(lenSel.options, function (o) {
          o.disabled = parseInt(o.value, 10) > n && parseInt(o.value, 10) !== 0;
        });
      }
    }

    function setFilter(k, v, rebuild) {
      filters[k] = v;
      if (k === "domain") filters.ecoTask = "";
      if (rebuild) { repaint(); return; }
      refreshPool();
    }

    var fcard = el("div", { class: "card" }, [
      el("span", { class: "eyebrow", text: "\u00A73.2 \u00B7 Filters" }),
      el("h2", { text: "What do you want to practise?" })
    ]);
    fcard.appendChild(el("div", { class: "filters" }, [
      selectField({
        id: "f-domain", label: "Domain", value: filters.domain,
        options: [{ v: "", t: "All domains" }].concat(PMP.ECO.DOMAINS.map(function (d) {
          return { v: d, t: PMP.ECO.DOMAIN_LABELS[d] };
        })),
        onChange: function (v) { setFilter("domain", v, true); }
      }),
      selectField({
        id: "f-task", label: "ECO task", value: filters.ecoTask, options: taskOptions(),
        onChange: function (v) { setFilter("ecoTask", v); }
      }),
      selectField({
        id: "f-approach", label: "Approach", value: filters.approach,
        options: [{ v: "", t: "Any approach" }].concat(Object.keys(PMP.ECO.APPROACH_LABELS).map(function (a) {
          return { v: a, t: PMP.ECO.APPROACH_LABELS[a] };
        })),
        onChange: function (v) { setFilter("approach", v); }
      }),
      selectField({
        id: "f-diff", label: "Difficulty", value: filters.difficulty,
        options: [{ v: "", t: "Any difficulty" }, { v: "1", t: "1 \u00B7 recall" }, { v: "2", t: "2" },
                  { v: "3", t: "3 \u00B7 typical" }, { v: "4", t: "4" }, { v: "5", t: "5 \u00B7 hardest" }],
        onChange: function (v) { setFilter("difficulty", v); }
      }),
      selectField({
        id: "f-type", label: "Question type", value: filters.type, options: typeOptions(),
        onChange: function (v) { setFilter("type", v); }
      }),
      selectField({
        id: "f-tag", label: "Tag", value: filters.tag, options: tagOptions(),
        onChange: function (v) { setFilter("tag", v); }
      }),
      selectField({
        id: "f-status", label: "Status", value: filters.status,
        options: [
          { v: "", t: "Any status" }, { v: "unseen", t: "Not seen yet" },
          { v: "wrong", t: "Got wrong last time" }, { v: "right", t: "Got right last time" },
          { v: "flagged", t: "Flagged" }, { v: "noted", t: "Has a note" }
        ],
        onChange: function (v) { setFilter("status", v); }
      })
    ]));
    fcard.appendChild(el("div", { class: "filter-bar" }, [
      el("span", { class: "pool-n" }, [poolNode, " of " + PMP.QUESTIONS.length + " questions match"]),
      el("span", { class: "spacer" }),
      el("button", {
        class: "btn btn--sm", type: "button",
        onclick: function () { filters = defaultFilters(); repaint(); }
      }, "Clear filters")
    ]));
    host.appendChild(fcard);

    /* Mode ── §3.2 */
    var mcard = el("div", { class: "card" }, [
      el("span", { class: "eyebrow", text: "\u00A73.2 \u00B7 Mode" }),
      el("h2", { text: "How should it run?" })
    ]);
    var modeWrap = el("div", { class: "modes" });
    var chosenMode = CFG.DEFAULT_MODE;
    var modeRows = [];
    Object.keys(MODES).forEach(function (key) {
      var m = MODES[key];
      var input = el("input", { type: "radio", name: "drill-mode", value: key, id: "mode-" + key, checked: key === chosenMode });
      var row = el("label", { class: "mode-opt", for: input.id, dataset: { sel: String(key === chosenMode) } }, [
        input, icon(m.icon),
        el("span", null, [el("span", { class: "t", text: m.name }), el("span", { class: "d", text: m.blurb })])
      ]);
      on(input, "change", function () {
        chosenMode = key;
        modeRows.forEach(function (r) { r.row.setAttribute("data-sel", String(r.key === key)); });
      });
      modeRows.push({ key: key, row: row });
      modeWrap.appendChild(row);
    });
    mcard.appendChild(modeWrap);

    var lengthSel = el("select", { class: "select", id: "f-length" });
    CFG.LENGTHS.forEach(function (n) {
      lengthSel.appendChild(el("option", { value: String(n), text: n + " questions", selected: n === CFG.DEFAULT_LENGTH }));
    });
    mcard.appendChild(el("div", { class: "filters", style: "margin-top:var(--sp-4)" }, [
      el("label", { class: "field", for: "f-length" }, [el("span", { class: "lbl", text: "Length" }), lengthSel])
    ]));

    var startBtn = el("button", {
      class: "btn btn--primary", type: "button",
      onclick: function () { start(chosenMode, parseInt(lengthSel.value, 10)); }
    }, [icon("target"), "Start drill"]);
    startBtns.push(startBtn);
    mcard.appendChild(el("div", { class: "filter-bar" }, [
      el("span", { class: "pool-n", text: "Pace target " + CFG.PACE_TARGET_SEC + "s per question" }),
      el("span", { class: "spacer" }),
      startBtn
    ]));
    host.appendChild(mcard);

    host.appendChild(el("div", { class: "card" }, [
      el("span", { class: "eyebrow", text: "\u00A73.4 \u00B7 Keyboard" }),
      el("h2", { text: "Everything is reachable without a mouse" }),
      keyHelpList()
    ]));

    refreshPool();
  }

  function keyHelpList() {
    return el("ul", { class: "keylist", style: "margin-top:var(--sp-4)" }, [
      ["A \u2013 J", "Choose that option. In a multiple-response item the key toggles it. The letters beside the options always win, so these five actions work on any item that does not use their letter."],
      ["1 \u2013 9", "Choose that option, or that numbered part of a diagram."],
      ["Enter", "Check the answer, then move to the next question."],
      ["N / P", "Next question, previous question."],
      ["F", "Flag this question for review."],
      ["K", "Write a note on this question."],
      ["R", "Report a problem with this question."],
      ["?", "Show this list."],
      ["Esc", "End the drill."]
    ].map(function (r) {
      return el("li", null, [el("span", { class: "kbd", text: r[0] }), el("span", { text: r[1] })]);
    }));
  }

  var MODES = {
    practice: {
      name: "Practice with feedback", icon: "target",
      blurb: "One question at a time, marked as soon as you answer, with the reasoning for every option. No clock on the drill; the pace timer still runs so you can see how you are tracking."
    },
    timed: {
      name: "Timed drill", icon: "timer",
      blurb: "The whole drill is on a clock at " + CFG.PACE_TARGET_SEC + " seconds a question. No marking until the end, so you have to commit and move on the way you will on the day."
    },
    adaptive: {
      name: "Adaptive drill", icon: "branch",
      blurb: "Same feedback as practice, but the questions are drawn towards the ECO tasks you are weakest on, with unseen items favoured and recently-correct ones held back."
    }
  };

  /* ── 10.02.4  SESSION ────────────────────────────────────────────────── */
  function start(mode, count) {
    var picked = choose(pool(), count, mode);
    if (!picked.length) { PMP.UI.toast("Nothing matches those filters.", "warn"); return; }
    startWith(picked, mode);
  }

  function startWith(questions, mode) {
    var shuffle = PMP.Store.state.settings.shuffleOptions !== false;
    session = {
      id: PMP.rng.id("drill"),
      mode: mode,
      startedAt: Date.now(),
      filters: JSON.parse(JSON.stringify(filters)),
      i: 0,
      finished: false,
      clock: mode === "timed" ? new PMP.time.Clock(questions.length * PACE_MS) : null,
      items: questions.map(function (q) {
        return {
          q: q,
          p: PMP.QRender.present(q, { shuffle: shuffle }),
          value: null, result: null, committed: false, recorded: false,
          confidence: null, seen: false, panel: null, ctrl: null, ui: {},
          clock: new PMP.time.Clock(PACE_MS)
        };
      })
    };
    repaint();
  }

  function record(item) {
    if (item.recorded || !item.result) return;
    item.recorded = true;
    var q = item.q;
    var attempt = {
      id: PMP.rng.id("att"),
      qid: q.id,
      ecoTask: q.ecoTask || null,
      domain: q.domain || null,
      approach: q.approach || null,
      type: PMP.QRender.base(q.type),
      difficulty: q.difficulty || null,
      correct: !!item.result.correct,
      credit: item.result.credit,
      ms: Math.round(item.clock.elapsed()),
      at: new Date().toISOString(),
      confidence: item.confidence,
      mode: session.mode,
      /* The display order the person actually saw, so a review can put the
         options back exactly where they were. */
      order: item.p.order
    };
    PMP.Store.commit(["attempts"], function (s) { s.attempts.push(attempt); });
  }

  /* ── 10.02.5  DRILL VIEW ─────────────────────────────────────────────── */
  function renderDrill(host) {
    var total = session.items.length;

    var progressFill = el("i", { style: "width:0%" });
    var paceBar = el("i");
    var paceClock = el("span", { class: "clock", text: "0:00" });
    var paceWrap = el("span", {
      class: "pace", dataset: { state: "ok" },
      title: "Time on this question against the " + CFG.PACE_TARGET_SEC + " second target"
    }, [el("span", { class: "bar", "aria-hidden": "true" }, [paceBar]), paceClock]);
    /* The ticking value is hidden from assistive tech: announcing a changing
       clock every second would bury the question. The elapsed time is spoken
       once, with the verdict, when the answer is checked. */
    paceWrap.setAttribute("aria-hidden", "true");

    var counter = el("span", { class: "pool-n" }, [el("b", { text: "1" }), " / " + total]);
    var drillClock = session.clock ? el("span", { class: "clock", style: "font-family:var(--font-mono)" }) : null;

    var hd = el("div", { class: "drill-hd" }, [
      el("span", { class: "mode-tag", "data-mode": "persistent" }, [
        el("span", { class: "dot", "aria-hidden": "true" }), MODES[session.mode].name
      ]),
      counter,
      el("span", { class: "progress", "aria-hidden": "true" }, [progressFill]),
      el("span", { class: "spacer" }),
      drillClock,
      paceWrap,
      el("button", {
        class: "icon-btn", type: "button", "aria-label": "Keyboard shortcuts",
        onclick: showKeyHelp
      }, [icon("info")]),
      el("button", { class: "btn btn--sm", type: "button", onclick: confirmEnd }, "End drill")
    ]);
    host.appendChild(hd);

    var card = el("div", { class: "card", id: "drill-card", tabindex: "-1" });
    host.appendChild(card);

    var navGrid = el("div", { class: "navgrid", style: "margin-top:var(--sp-4)" });
    var navCells = session.items.map(function (item, idx) {
      var cell = el("button", {
        class: "navgrid-c", type: "button", dataset: { st: "unseen" },
        "aria-label": "Question " + (idx + 1),
        onclick: function () { show(idx); }
      }, String(idx + 1));
      navGrid.appendChild(cell);
      return cell;
    });
    host.appendChild(el("div", { class: "card" }, [
      el("span", { class: "eyebrow", text: "Navigator" }),
      navGrid,
      el("div", { class: "legend" }, [
        el("span", { class: "chip chip--answered", text: "Answered" }),
        el("span", { class: "chip chip--flagged", text: "Flagged" }),
        session.mode === "timed" ? null : el("span", { class: "chip chip--correct", text: "Correct" }),
        session.mode === "timed" ? null : el("span", { class: "chip chip--incorrect", text: "Incorrect" }),
        el("span", { class: "chip", text: "Not seen" })
      ])
    ]));

    el_ = {
      card: card, counter: counter.querySelector("b"), progress: progressFill,
      paceWrap: paceWrap, paceBar: paceBar, paceClock: paceClock,
      drillClock: drillClock, navCells: navCells
    };

    everySecond(function () {
      var item = session.items[session.i];
      if (!item) return;
      var e = item.clock.elapsed();
      el_.paceClock.textContent = mmss(e);
      var ratio = e / PACE_MS;
      el_.paceBar.style.width = Math.min(100, ratio * 100) + "%";
      el_.paceWrap.setAttribute("data-state", ratio >= CFG.PACE_OVER_RATIO ? "over" : ratio >= 1 ? "warn" : "ok");
      if (session.clock) {
        el_.drillClock.textContent = mmss(session.clock.remaining()) + " left";
        if (session.clock.expired() && !session.finished) {
          PMP.UI.toast("Time is up. The drill has been marked.", "warn");
          finish();
        }
      }
    });

    /* The drill clock starts when the drill is on screen and is never paused
       until it is finished. Walking off to the dashboard mid-drill does not
       stop it, because on the day nothing stops it either. The per-question
       pace clocks do pause, in cleanup() — see the note there. */
    if (session.clock) session.clock.start();

    installKeys();
    show(session.i);
  }

  function show(idx) {
    var prev = session.items[session.i];
    if (prev && prev !== session.items[idx]) prev.clock.pause();
    session.i = idx;
    var item = session.items[idx];
    item.seen = true;
    if (!item.committed) item.clock.start();

    el_.card.innerHTML = "";
    el_.card.appendChild(panelFor(item, idx));
    el_.counter.textContent = String(idx + 1);
    el_.progress.style.width = ((idx + 1) / session.items.length * 100) + "%";
    updateNav();

    try { el_.card.focus({ preventScroll: true }); } catch (e) { el_.card.focus(); }
    PMP.UI.announce("Question " + (idx + 1) + " of " + session.items.length + ". " +
      PMP.QRender.label(item.q.type) + ". " + PMP.QRender.instruction(item.q));
  }

  function updateNav() {
    if (!el_.navCells) return;
    var flags = PMP.Store.state.flags;
    session.items.forEach(function (item, idx) {
      var st = "unseen";
      if (flags[item.q.id]) st = "flagged";
      else if (item.committed && item.result && session.mode !== "timed") st = item.result.correct ? "correct" : "incorrect";
      else if (item.committed || item.value) st = "answered";
      else if (item.seen) st = "answered";
      if (!item.seen && !item.committed && !flags[item.q.id]) st = "unseen";
      el_.navCells[idx].setAttribute("data-st", st);
      el_.navCells[idx].setAttribute("data-cur", idx === session.i ? "true" : "false");
      el_.navCells[idx].setAttribute("aria-label", "Question " + (idx + 1) + ", " + st +
        (idx === session.i ? ", current" : ""));
    });
  }

  /* ── 10.02.6  ONE ITEM ───────────────────────────────────────────────── */
  function panelFor(item, idx) {
    if (item.panel) return item.panel;
    var q = item.q, state = PMP.Store.state;
    var task = PMP.ECO_TASK_BY_ID[q.ecoTask];
    var panel = el("div");

    panel.appendChild(el("div", { class: "q-meta" }, [
      el("span", { class: "eyebrow", text: "Question " + (idx + 1) }),
      el("span", { class: "chip", text: PMP.QRender.label(q.type) }),
      el("span", { class: "chip", text: PMP.ECO.DOMAIN_LABELS[q.domain] || q.domain }),
      task ? el("span", { class: "chip", text: task.label }) : null,
      q.approach ? el("span", { class: "chip", text: PMP.ECO.APPROACH_LABELS[q.approach] || q.approach }) : null,
      q.difficulty ? el("span", { class: "chip", text: "Difficulty " + q.difficulty }) : null,
      q.placeholder ? el("span", { class: "chip chip--flagged", text: "Placeholder item" }) : null
    ]));
    panel.appendChild(el("p", { class: "q-stem", text: q.stem }));
    panel.appendChild(el("p", { class: "q-instr", text: PMP.QRender.instruction(q) }));

    var body = el("div");
    panel.appendChild(body);
    var feedback = el("div");
    panel.appendChild(feedback);

    item.ctrl = PMP.QRender.render(item.p, q, body, {
      nonce: idx,
      onChange: function () { onAnswerChanged(item); }
    });

    /* Tools ── flag, note, report an issue */
    var flagBtn = el("button", {
      class: "btn btn--sm", type: "button", "aria-pressed": state.flags[q.id] ? "true" : "false",
      dataset: { on: state.flags[q.id] ? "true" : "false" },
      onclick: function () { toggleFlag(item); }
    }, [icon("flag"), "Flag"]);

    var noteBtn = el("button", {
      class: "btn btn--sm", type: "button",
      dataset: { on: state.notes[q.id] ? "true" : "false" },
      onclick: function () { editNote(item); }
    }, [icon("journal"), state.notes[q.id] ? "Edit note" : "Add note"]);

    var reportBtn = el("button", {
      class: "btn btn--sm", type: "button",
      onclick: function () { reportIssue(item); }
    }, [icon("alert"), "Report a problem"]);

    var noteBox = el("div", { class: "q-note", hidden: !state.notes[q.id], text: state.notes[q.id] || "" });

    var tools = el("div", { class: "q-tools" }, [flagBtn, noteBtn, reportBtn, el("span", { class: "spacer" })]);

    var confBtns = null;
    if (state.settings.confidenceTracking) {
      confBtns = ["sure", "unsure"].map(function (k) {
        return el("button", {
          class: "btn btn--sm", type: "button", dataset: { on: "false", conf: k },
          onclick: function () { setConfidence(item, k); }
        }, k === "sure" ? "Sure" : "Not sure");
      });
      tools.appendChild(el("span", { class: "eyebrow", text: "Confidence" }));
      confBtns.forEach(function (b) { tools.appendChild(b); });
    }
    panel.appendChild(noteBox);
    panel.appendChild(tools);

    /* Footer ── the buttons change once, when the answer is committed */
    var backBtn = el("button", {
      class: "btn", type: "button", disabled: idx === 0,
      onclick: function () { if (session.i > 0) show(session.i - 1); }
    }, "Back");

    var last = idx === session.items.length - 1;
    var skipBtn = el("button", {
      class: "btn", type: "button",
      onclick: function () { advance(item); }
    }, last ? "Skip and finish" : "Skip");

    var primary = el("button", {
      class: "btn btn--primary", type: "button", disabled: true,
      onclick: function () {
        if (session.mode === "timed" || item.committed) advance(item);
        else check(item);
      }
    }, session.mode === "timed" ? (last ? "Finish drill" : "Next question") : "Check answer");

    var foot = el("div", { class: "q-tools", style: "border-top:0;padding-top:0" }, [
      backBtn, el("span", { class: "spacer" }), skipBtn, primary
    ]);
    panel.appendChild(foot);

    item.ui = {
      panel: panel, feedback: feedback, primary: primary, skip: skipBtn, back: backBtn,
      flagBtn: flagBtn, noteBtn: noteBtn, noteBox: noteBox, conf: confBtns, foot: foot, last: last
    };
    item.panel = panel;
    onAnswerChanged(item);
    return panel;
  }

  function onAnswerChanged(item) {
    if (!item.ui || !item.ui.primary || item.committed) return;
    var ready = item.ctrl.answered();
    item.ui.primary.disabled = session.mode === "timed" ? false : !ready;
    if (session.mode === "timed") item.value = ready ? item.ctrl.value() : null;
    updateNav();
  }

  function check(item) {
    if (item.committed) return;
    if (!item.ctrl.answered()) return;
    item.clock.pause();
    item.value = item.ctrl.value();
    item.result = PMP.QRender.score(item.q, item.p, item.value);
    item.committed = true;
    record(item);

    item.ctrl.reveal(item.result);
    showVerdict(item);

    item.ui.skip.hidden = true;
    item.ui.primary.textContent = item.ui.last ? "Finish drill" : "Next question";
    item.ui.primary.disabled = false;
    item.ui.primary.focus();
    updateNav();
  }

  function showVerdict(item) {
    var r = item.result;
    var kind = r.correct ? "right" : r.partial ? "part" : "wrong";
    var word = r.correct ? "Correct" : r.partial ? "Partly correct" : "Not correct";
    var secs = Math.round(item.clock.elapsed() / 1000);
    var pace = secs <= CFG.PACE_TARGET_SEC
      ? "Answered in " + PMP.fmt.duration(secs) + ", inside the " + CFG.PACE_TARGET_SEC + " second target."
      : "Answered in " + PMP.fmt.duration(secs) + ", which is " + PMP.fmt.duration(secs - CFG.PACE_TARGET_SEC) + " over the " + CFG.PACE_TARGET_SEC + " second target.";
    var extra = r.of ? " " + r.hit + " of " + r.of + " right." : "";

    item.ui.feedback.appendChild(el("div", { class: "verdict verdict--" + kind, role: "status" }, [
      icon(r.correct ? "check" : r.partial ? "alert" : "x"),
      el("div", null, [
        el("div", { class: "t", text: word + extra }),
        el("div", { class: "d", text: pace })
      ])
    ]));
    if (item.q.explanation) {
      item.ui.feedback.appendChild(el("div", { class: "explain" }, [
        el("h3", { text: "Why" }),
        el("p", { text: item.q.explanation })
      ]));
    }
    /* The mindset line is the one-sentence principle the item turns on. It is
       optional in the schema, so items authored before it was added simply do
       not render this block. */
    if (item.q.mindset) {
      item.ui.feedback.appendChild(el("div", { class: "mindset" }, [
        el("h3", { text: "Mindset" }),
        el("p", { text: item.q.mindset })
      ]));
    }
  }

  /* Advance. In a timed drill this is also where the answer is committed,
     because there is no separate check step. */
  function advance(item) {
    if (session.mode === "timed" && !item.committed && item.ctrl.answered()) {
      item.clock.pause();
      item.value = item.ctrl.value();
      item.result = PMP.QRender.score(item.q, item.p, item.value);
      item.committed = true;
      record(item);
    }
    if (session.i >= session.items.length - 1) return finish();
    show(session.i + 1);
  }

  /* ── 10.02.7  FLAG, NOTE, REPORT ─────────────────────────────────────── */
  function toggleFlag(item) {
    var qid = item.q.id;
    var now = !PMP.Store.state.flags[qid];
    PMP.Store.commit(["flags"], function (s) {
      if (now) s.flags[qid] = true; else delete s.flags[qid];
    });
    item.ui.flagBtn.setAttribute("data-on", now ? "true" : "false");
    item.ui.flagBtn.setAttribute("aria-pressed", now ? "true" : "false");
    PMP.UI.announce(now ? "Flagged for review" : "Flag removed");
    updateNav();
  }

  function editNote(item) {
    var qid = item.q.id;
    var ta = el("textarea", { class: "textarea", style: "min-height:120px;font-family:var(--font-ui);font-size:var(--t-sm)", "aria-label": "Your note on this question" });
    ta.value = PMP.Store.state.notes[qid] || "";
    PMP.UI.sheet({
      title: "Note on this question",
      body: frag([
        el("p", { text: "Write down what you want to remember: the trap you fell into, the rule that decides it, the wording that gave it away." }),
        ta
      ]),
      actions: [
        { id: "cancel", label: "Cancel" },
        { id: "clear", label: "Delete note" },
        { id: "save", label: "Save note", primary: true }
      ]
    }).then(function (choice) {
      if (choice !== "save" && choice !== "clear") return;
      var text = choice === "clear" ? "" : ta.value.trim();
      PMP.Store.commit(["notes"], function (s) {
        if (text) s.notes[qid] = text; else delete s.notes[qid];
      });
      item.ui.noteBox.textContent = text;
      item.ui.noteBox.hidden = !text;
      item.ui.noteBtn.setAttribute("data-on", text ? "true" : "false");
      item.ui.noteBtn.lastChild.textContent = text ? "Edit note" : "Add note";
      PMP.UI.toast(text ? "Note saved." : "Note deleted.", "ok");
    });
  }

  function reportIssue(item) {
    var qid = item.q.id;
    var kind = el("select", { class: "select", "aria-label": "What is wrong" });
    [
      ["wrong-answer", "The marked answer looks wrong"],
      ["ambiguous", "More than one answer works"],
      ["unclear", "The wording is unclear"],
      ["typo", "Typo or formatting problem"],
      ["eco", "Tagged to the wrong ECO task"],
      ["other", "Something else"]
    ].forEach(function (k) { kind.appendChild(el("option", { value: k[0], text: k[1] })); });

    var ta = el("textarea", { class: "textarea", style: "min-height:110px;font-family:var(--font-ui);font-size:var(--t-sm)", "aria-label": "What is wrong with this question" });

    PMP.UI.sheet({
      title: "Report a problem",
      body: frag([
        el("p", { text: "Reports are stored with your progress on this device and travel with your backup file. Nothing is sent anywhere \u2014 this file makes no network requests." }),
        el("label", { class: "field" }, [el("span", { class: "lbl", text: "What is wrong" }), kind]),
        el("label", { class: "field" }, [el("span", { class: "lbl", text: "Detail, optional" }), ta])
      ]),
      actions: [{ id: "cancel", label: "Cancel" }, { id: "send", label: "Save report", primary: true }]
    }).then(function (choice) {
      if (choice !== "send") return;
      PMP.Store.commit(["issues"], function (s) {
        s.issues.push({
          id: PMP.rng.id("iss"), qid: qid, kind: kind.value,
          text: ta.value.trim(), at: new Date().toISOString()
        });
      });
      PMP.UI.toast("Report saved with your progress.", "ok");
    });
  }

  function setConfidence(item, k) {
    item.confidence = item.confidence === k ? null : k;
    item.ui.conf.forEach(function (b) {
      b.setAttribute("data-on", b.getAttribute("data-conf") === item.confidence ? "true" : "false");
    });
  }

  /* ── 10.02.8  KEYBOARD ───────────────────────────────────────────────── */
  function typing(e) {
    var t = e.target;
    if (!t || !t.tagName) return false;
    var tag = t.tagName.toUpperCase();
    return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || t.isContentEditable;
  }

  function installKeys() {
    var off = on(document, "keydown", function (e) {
      if (!session || session.finished) return;
      if (document.getElementById("sheet") && document.getElementById("sheet").open) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      var item = session.items[session.i];
      if (!item) return;
      var inField = typing(e);

      if (e.key === "Enter") {
        /* Enter inside a text blank should mark the item, not submit a form. */
        if (inField && e.target.tagName.toUpperCase() === "TEXTAREA") return;
        e.preventDefault();
