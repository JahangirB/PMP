            text: "This browser will not let the file store data on disk, so everything you do is held in memory only and disappears when you close the tab. Export a backup before you finish, and import it next time."
          })
        ]),
        el("button", {
          class: "btn btn--sm", type: "button",
          onclick: function () { PMP.Exporter.exportProgress(); }
        }, [icon("data"), "Export now"])
      ]));
    }

    if (state.sys.quotaHit) {
      host.appendChild(el("div", { class: "banner banner--danger", role: "alert" }, [
        icon("alert"),
        el("div", { class: "banner-b" }, [
          el("div", { class: "banner-t", text: "Storage is full" }),
          el("div", {
            class: "banner-d",
            text: "The last save did not complete because this browser's storage for the file is full. Export a backup, then remove older attempt history to free space."
          })
        ]),
        el("button", { class: "btn btn--sm", type: "button", onclick: function () { PMP.Exporter.exportProgress(); } }, [icon("data"), "Export"]),
        el("button", {
          class: "btn btn--sm", type: "button",
          onclick: function () {
            var keep = PMP.STORE_CFG.PRUNE_KEEP_ATTEMPTS;
            confirm("Remove older attempts?",
              "The most recent " + keep + " answered questions are kept. Older attempts are deleted permanently. Your flashcards, mock exam history and notes are not affected.",
              "Remove older attempts", true).then(function (yes) {
              if (!yes) return;
              var n = PMP.Store.pruneAttempts(keep);
              PMP.Store.commit(["sys"], function (s) { s.sys.quotaHit = false; }, { transient: true });
              toast(n ? "Removed " + PMP.fmt.plural(n, "older attempt") + "." : "Nothing to remove.", "ok");
            });
          }
        }, "Free space")
      ]));
    }

    if (state.sys.corruptKeys.length) {
      host.appendChild(el("div", { class: "banner", role: "alert" }, [
        icon("alert"),
        el("div", { class: "banner-b" }, [
          el("div", { class: "banner-t", text: "Some saved data could not be read" }),
          el("div", { class: "banner-d", text: "These sections were reset to their defaults: " + state.sys.corruptKeys.join(", ") + ". If you have a backup file, import it to restore them." })
        ]),
        el("button", { class: "btn btn--sm", type: "button", onclick: function () { PMP.Router.navigate("data"); } }, "Import backup")
      ]));
    }
  }

  return { toast: toast, sheet: sheet, closeSheet: close, confirm: confirm, empty: empty, announce: announce, renderBanners: renderBanners };
})();

/* ── 09.8  EXPORT ───────────────────────────────────────────────────────────
   A Blob download is the happy path, but it is not reliable everywhere: iOS
   Safari opens JSON in a tab instead of saving it, and some file:// sandboxes
   refuse the object URL outright. So every export offers three routes and
   never assumes the first one worked. */
PMP.Exporter = (function () {
  var el = PMP.dom.el;

  function filename(prefix) {
    var d = new Date();
    return prefix + "-" + d.getFullYear() + "-" + PMP.fmt.pad(d.getMonth() + 1) + "-" + PMP.fmt.pad(d.getDate()) + ".json";
  }

  function tryDownload(text, name) {
    try {
      var blob = new Blob([text], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = el("a", { href: url, download: name, style: "display:none" });
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 4000);
      return true;
    } catch (e) { return false; }
  }

  function copyText(text) {
    /* navigator.clipboard needs a secure context, which file:// is not, so the
       execCommand path is the primary route here rather than the fallback. */
    return new Promise(function (resolve) {
      var ta = el("textarea", {
        style: "position:fixed;top:0;left:0;opacity:0;pointer-events:none",
        "aria-hidden": "true"
      });
      ta.value = text;
      document.body.appendChild(ta);
      ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      ta.remove();
      if (ok) return resolve(true);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { resolve(true); }, function () { resolve(false); });
      } else resolve(false);
    });
  }

  function offer(text, name, heading) {
    var ta = el("textarea", { class: "textarea", readonly: true, spellcheck: "false", "aria-label": "Backup file contents" });
    ta.value = text;

    var body = PMP.dom.frag([
      el("p", { text: "Your backup is " + PMP.fmt.bytes(text.length) + ". Save it with the button below, or copy the text and paste it into a file yourself." }),
      el("p", { text: "To restore it later, open Backup and packs and choose Import progress." }),
      ta
    ]);

    return PMP.UI.sheet({
      title: heading || "Export progress",
      body: body,
      actions: [
        { id: "close", label: "Close" },
        { id: "copy", label: "Copy to clipboard", icon: "clip" },
        { id: "save", label: "Save file", icon: "data", primary: true }
      ]
    }).then(function (choice) {
      if (choice === "save") {
        if (tryDownload(text, name)) PMP.UI.toast("Saved " + name + ".", "ok");
        else PMP.UI.toast("This browser blocked the download. Copy the text instead.", "warn");
      } else if (choice === "copy") {
        return copyText(text).then(function (ok) {
          PMP.UI.toast(ok ? "Backup copied to the clipboard." : "Copying was blocked. Select the text in the box and copy it manually.", ok ? "ok" : "warn");
        });
      }
    });
  }

  function exportProgress() {
    var text;
    try { text = JSON.stringify(PMP.Store.snapshot(), null, 2); }
    catch (e) { PMP.UI.toast("Your progress could not be turned into a backup file.", "err"); return Promise.resolve(); }
    return offer(text, filename("pmp-progress"), "Export progress");
  }

  return { exportProgress: exportProgress, offer: offer, copyText: copyText, filename: filename, tryDownload: tryDownload };
})();


/* ═══ §10  FEATURE MODULES ════════════════════════════════════════════════
   One IIFE each. A module that has landed registers its own route here, and
   the stubs in §12.3 stand aside for it rather than overwriting it.
   Built: 10.02 practice engine, 10.04 question renderers.
   Still stubs: 10.01, 10.03, 10.05 to 10.14.
   ════════════════════════════════════════════════════════════════════ */

/* ── 10.02  PRACTICE ENGINE ─────────────────────────────────────────────────
   Filters (§3.2), the three drill modes, and everything that wraps a single
   item: flag, note, report an issue, and the per-question pace timer.

   Three deliberate choices worth knowing before reading the code:

   · Filters live in module state, not the store. They are a way of asking a
     question, not a preference worth surviving a reload, and the route reads
     #/practice?domain=process&type=multi so a filtered drill is still linkable.

   · Every item's panel is built once and kept. Going back to question 3 shows
     the same option order, the same typing and the same feedback, because it
     is literally the same DOM. Nothing is re-shuffled under someone mid-drill.

   · An attempt is recorded the moment an answer is committed, not at the end.
     Closing the tab halfway through a drill loses the drill, never the work.
     A skipped item records nothing at all: it is not evidence of anything, and
     writing it down as a wrong answer would quietly poison the readiness
     score in §10.01.
   ═════════════════════════════════════════════════════════════════════════ */
PMP.Practice = (function () {
  var el = PMP.dom.el, icon = PMP.dom.icon, on = PMP.dom.on, frag = PMP.dom.frag;
  var CFG = PMP.PRACTICE;
  var PACE_MS = CFG.PACE_TARGET_SEC * 1000;

  var filters = null;
  var session = null;
  var teardown = [];
  var el_ = {};            /* live nodes for the running drill */

  /* ── helpers ─────────────────────────────────────────────────────────── */
  function mmss(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    return Math.floor(s / 60) + ":" + PMP.fmt.pad(s % 60);
  }
  function cleanup() {
    teardown.forEach(function (fn) { try { fn(); } catch (e) {} });
    teardown = [];
    /* Whatever took the drill off screen, the question the person was on is no
       longer in front of them, so its pace clock stops. show() restarts it
       when they come back. Without this, wandering off to check the formula
       lab would land on their time-per-question figure as if they had sat
       there staring at the item. */
    if (session && !session.finished) {
      var item = session.items[session.i];
      if (item && !item.committed) item.clock.pause();
    }
  }
  function everySecond(fn) {
    var id = setInterval(fn, 250);
    teardown.push(function () { clearInterval(id); });
    fn();
  }
  function repaint() {
    var host = document.getElementById("view");
    if (!host) return;
    host.innerHTML = "";
    view(host, {});
  }
  function defaultFilters() {
    return { domain: "", ecoTask: "", approach: "", difficulty: "", type: "", tag: "", status: "" };
  }

  /* ── 10.02.1  THE POOL ───────────────────────────────────────────────────
     One pass over the attempt history gives per-question history for the
     status filter and per-task accuracy for the adaptive weighting. */
  function historyIndex(state) {
    var m = Object.create(null);
    state.attempts.forEach(function (a) {
      if (!a || !a.qid) return;
      var e = m[a.qid] || (m[a.qid] = { n: 0, right: 0, lastCorrect: false, lastAt: null });
      e.n++;
      if (a.correct) e.right++;
      e.lastCorrect = !!a.correct;
      e.lastAt = a.at || e.lastAt;
    });
    return m;
  }

  function taskIndex(state) {
    var m = Object.create(null);
    state.attempts.forEach(function (a) {
      if (!a || !a.ecoTask) return;
      var e = m[a.ecoTask] || (m[a.ecoTask] = { n: 0, credit: 0 });
      e.n++;
      e.credit += (typeof a.credit === "number") ? a.credit : (a.correct ? 1 : 0);
    });
    return m;
  }

  function statusOf(q, state, hist) {
    if (state.flags[q.id]) return "flagged";
    var h = hist[q.id];
    if (!h) return "unseen";
    return h.lastCorrect ? "right" : "wrong";
  }

  function matches(q, f, state, hist) {
    if (f.domain && q.domain !== f.domain) return false;
    if (f.ecoTask && q.ecoTask !== f.ecoTask) return false;
    if (f.approach && (q.approach || "") !== f.approach) return false;
    if (f.difficulty && String(q.difficulty || "") !== f.difficulty) return false;
    if (f.type && PMP.QRender.base(q.type) !== f.type && q.type !== f.type) return false;
    if (f.tag && (q.tags || []).indexOf(f.tag) < 0) return false;
    if (f.status) {
      var h = hist[q.id];
      if (f.status === "flagged" && !state.flags[q.id]) return false;
      if (f.status === "noted" && !state.notes[q.id]) return false;
      if (f.status === "unseen" && h) return false;
      if (f.status === "wrong" && (!h || h.lastCorrect)) return false;
      if (f.status === "right" && (!h || !h.lastCorrect)) return false;
    }
    return true;
  }

  function pool() {
    var state = PMP.Store.state, hist = historyIndex(state);
    return PMP.QUESTIONS.filter(function (q) { return matches(q, filters, state, hist); });
  }

  /* ── 10.02.2  SELECTION ──────────────────────────────────────────────────
     Practice and timed drills take a straight random sample. An adaptive drill
     weights each candidate by how weak its ECO task looks, using a prior so
     that a task with two attempts is not treated as settled evidence, and it
     nudges unseen items up and recently-correct items down. The weighting is
     shown to the person in the mode card rather than left as a black box. */
  function weightFor(q, tasks, hist) {
    var t = tasks[q.ecoTask] || { n: 0, credit: 0 };
    var A = CFG.ADAPTIVE;
    var acc = (t.credit + A.PRIOR * A.PRIOR_N) / (t.n + A.PRIOR_N);
    var w = Math.pow(1 - acc, A.EXPONENT) + A.FLOOR;
    var h = hist[q.id];
    if (!h) w *= A.UNSEEN_BOOST;
    else if (h.lastCorrect) w *= A.RIGHT_DAMP;
    return w;
  }

  function choose(list, count, mode) {
    if (list.length <= count) return PMP.rng.shuffle(list).items;
    if (mode !== "adaptive") return PMP.rng.shuffle(list).items.slice(0, count);
    var state = PMP.Store.state, tasks = taskIndex(state), hist = historyIndex(state);
    return PMP.rng.sample(list, list.map(function (q) { return weightFor(q, tasks, hist); }), count);
  }

  /* ── 10.02.3  SETUP VIEW ─────────────────────────────────────────────── */
  function selectField(cfg) {
    var sel = el("select", { class: "select", id: cfg.id });
    (cfg.options || []).forEach(function (o) {
      if (o.group) {
        var g = el("optgroup", { label: o.group });
        o.items.forEach(function (i2) {
          g.appendChild(el("option", { value: i2.v, text: i2.t, selected: i2.v === cfg.value }));
        });
        sel.appendChild(g);
      } else {
        sel.appendChild(el("option", { value: o.v, text: o.t, selected: o.v === cfg.value }));
      }
    });
    on(sel, "change", function () { cfg.onChange(sel.value); });
    return el("label", { class: "field", for: cfg.id }, [
      el("span", { class: "lbl", text: cfg.label }),
      sel
    ]);
  }

  function taskOptions() {
    var out = [{ v: "", t: "Any task" }];
    PMP.ECO.DOMAINS.forEach(function (d) {
      if (filters.domain && filters.domain !== d) return;
      out.push({
        group: PMP.ECO.DOMAIN_LABELS[d],
        items: PMP.ECO_TASKS.filter(function (t) { return t.domain === d; }).map(function (t) {
          return { v: t.id, t: t.n + ". " + t.label };
        })
      });
    });
    return out;
  }

  function tagOptions() {
    var seen = Object.create(null);
    PMP.QUESTIONS.forEach(function (q) { (q.tags || []).forEach(function (t) { seen[t] = true; }); });
    return [{ v: "", t: "Any tag" }].concat(Object.keys(seen).sort().map(function (t) { return { v: t, t: t }; }));
  }

  function typeOptions() {
    var seen = Object.create(null);
    PMP.QUESTIONS.forEach(function (q) { seen[PMP.QRender.base(q.type)] = true; });
    return [{ v: "", t: "Any type" }].concat(Object.keys(seen).sort().map(function (t) {
      return { v: t, t: PMP.QRender.TYPE_LABELS[t] || t };
    }));
  }

  function renderSetup(host, params) {
    var state = PMP.Store.state;

    host.appendChild(el("div", { class: "view-hd" }, [
      el("span", { class: "eyebrow", text: "Practice" }),
      el("h2", { text: "Build a drill" }),
      el("p", { text: "Filter down to what you want to work on, choose how you want to be pushed, and go. Answers are saved as you give them, so a drill you abandon still counts." })
    ]));

    if (!PMP.QUESTIONS.length) {
      host.appendChild(PMP.UI.empty(
        "No questions are loaded",
        "This build has no content pack. Import one from Backup and packs, and every filter below will start working against it.",
        "book"
      ));
      return;
    }

    /* Filters ── §3.2 */
    var poolNode = el("b", { text: "0" });
    var startBtns = [];

    function refreshPool() {
      var n = pool().length;
      poolNode.textContent = String(n);
      startBtns.forEach(function (b) { b.disabled = n === 0; });
      var lenSel = document.getElementById("f-length");
      if (lenSel) {
        Array.prototype.forEach.call(lenSel.options, function (o) {
          o.disabled = parseInt(o.value, 10) > n && parseInt(o.value, 10) !== 0;
        });
      }
    }

    function setFilter(k, v, rebuild) {
      filters[k] = v;
      if (k === "domain") filters.ecoTask = "";
      if (rebuild) { repaint(); return; }
      refreshPool();
    }

    var fcard = el("div", { class: "card" }, [
      el("span", { class: "eyebrow", text: "\u00A73.2 \u00B7 Filters" }),
      el("h2", { text: "What do you want to practise?" })
    ]);
    fcard.appendChild(el("div", { class: "filters" }, [
      selectField({
        id: "f-domain", label: "Domain", value: filters.domain,
        options: [{ v: "", t: "All domains" }].concat(PMP.ECO.DOMAINS.map(function (d) {
          return { v: d, t: PMP.ECO.DOMAIN_LABELS[d] };
        })),
        onChange: function (v) { setFilter("domain", v, true); }
      }),
      selectField({
        id: "f-task", label: "ECO task", value: filters.ecoTask, options: taskOptions(),
        onChange: function (v) { setFilter("ecoTask", v); }
      }),
      selectField({
        id: "f-approach", label: "Approach", value: filters.approach,
        options: [{ v: "", t: "Any approach" }].concat(Object.keys(PMP.ECO.APPROACH_LABELS).map(function (a) {
          return { v: a, t: PMP.ECO.APPROACH_LABELS[a] };
        })),
        onChange: function (v) { setFilter("approach", v); }
      }),
      selectField({
        id: "f-diff", label: "Difficulty", value: filters.difficulty,
        options: [{ v: "", t: "Any difficulty" }, { v: "1", t: "1 \u00B7 recall" }, { v: "2", t: "2" },
                  { v: "3", t: "3 \u00B7 typical" }, { v: "4", t: "4" }, { v: "5", t: "5 \u00B7 hardest" }],
        onChange: function (v) { setFilter("difficulty", v); }
      }),
      selectField({
        id: "f-type", label: "Question type", value: filters.type, options: typeOptions(),
        onChange: function (v) { setFilter("type", v); }
      }),
      selectField({
        id: "f-tag", label: "Tag", value: filters.tag, options: tagOptions(),
        onChange: function (v) { setFilter("tag", v); }
      }),
      selectField({
        id: "f-status", label: "Status", value: filters.status,
        options: [
          { v: "", t: "Any status" }, { v: "unseen", t: "Not seen yet" },
          { v: "wrong", t: "Got wrong last time" }, { v: "right", t: "Got right last time" },
          { v: "flagged", t: "Flagged" }, { v: "noted", t: "Has a note" }
        ],
        onChange: function (v) { setFilter("status", v); }
      })
    ]));
    fcard.appendChild(el("div", { class: "filter-bar" }, [
      el("span", { class: "pool-n" }, [poolNode, " of " + PMP.QUESTIONS.length + " questions match"]),
      el("span", { class: "spacer" }),
      el("button", {
        class: "btn btn--sm", type: "button",
        onclick: function () { filters = defaultFilters(); repaint(); }
      }, "Clear filters")
    ]));
    host.appendChild(fcard);

    /* Mode ── §3.2 */
    var mcard = el("div", { class: "card" }, [
      el("span", { class: "eyebrow", text: "\u00A73.2 \u00B7 Mode" }),
      el("h2", { text: "How should it run?" })
    ]);
    var modeWrap = el("div", { class: "modes" });
    var chosenMode = CFG.DEFAULT_MODE;
    var modeRows = [];
    Object.keys(MODES).forEach(function (key) {
      var m = MODES[key];
      var input = el("input", { type: "radio", name: "drill-mode", value: key, id: "mode-" + key, checked: key === chosenMode });
      var row = el("label", { class: "mode-opt", for: input.id, dataset: { sel: String(key === chosenMode) } }, [
        input, icon(m.icon),
        el("span", null, [el("span", { class: "t", text: m.name }), el("span", { class: "d", text: m.blurb })])
      ]);
      on(input, "change", function () {
        chosenMode = key;
        modeRows.forEach(function (r) { r.row.setAttribute("data-sel", String(r.key === key)); });
      });
      modeRows.push({ key: key, row: row });
      modeWrap.appendChild(row);
    });
    mcard.appendChild(modeWrap);

    var lengthSel = el("select", { class: "select", id: "f-length" });
    CFG.LENGTHS.forEach(function (n) {
      lengthSel.appendChild(el("option", { value: String(n), text: n + " questions", selected: n === CFG.DEFAULT_LENGTH }));
    });
    mcard.appendChild(el("div", { class: "filters", style: "margin-top:var(--sp-4)" }, [
      el("label", { class: "field", for: "f-length" }, [el("span", { class: "lbl", text: "Length" }), lengthSel])
    ]));

    var startBtn = el("button", {
      class: "btn btn--primary", type: "button",
      onclick: function () { start(chosenMode, parseInt(lengthSel.value, 10)); }
    }, [icon("target"), "Start drill"]);
    startBtns.push(startBtn);
    mcard.appendChild(el("div", { class: "filter-bar" }, [
      el("span", { class: "pool-n", text: "Pace target " + CFG.PACE_TARGET_SEC + "s per question" }),
      el("span", { class: "spacer" }),
      startBtn
    ]));
    host.appendChild(mcard);

    host.appendChild(el("div", { class: "card" }, [
      el("span", { class: "eyebrow", text: "\u00A73.4 \u00B7 Keyboard" }),
      el("h2", { text: "Everything is reachable without a mouse" }),
      keyHelpList()
    ]));

    refreshPool();
  }

  function keyHelpList() {
    return el("ul", { class: "keylist", style: "margin-top:var(--sp-4)" }, [
      ["A \u2013 J", "Choose that option. In a multiple-response item the key toggles it. The letters beside the options always win, so these five actions work on any item that does not use their letter."],
      ["1 \u2013 9", "Choose that option, or that numbered part of a diagram."],
      ["Enter", "Check the answer, then move to the next question."],
      ["N / P", "Next question, previous question."],
      ["F", "Flag this question for review."],
      ["K", "Write a note on this question."],
      ["R", "Report a problem with this question."],
      ["?", "Show this list."],
      ["Esc", "End the drill."]
    ].map(function (r) {
      return el("li", null, [el("span", { class: "kbd", text: r[0] }), el("span", { text: r[1] })]);
    }));
  }

  var MODES = {
    practice: {
      name: "Practice with feedback", icon: "target",
      blurb: "One question at a time, marked as soon as you answer, with the reasoning for every option. No clock on the drill; the pace timer still runs so you can see how you are tracking."
    },
    timed: {
      name: "Timed drill", icon: "timer",
      blurb: "The whole drill is on a clock at " + CFG.PACE_TARGET_SEC + " seconds a question. No marking until the end, so you have to commit and move on the way you will on the day."
    },
    adaptive: {
      name: "Adaptive drill", icon: "branch",
      blurb: "Same feedback as practice, but the questions are drawn towards the ECO tasks you are weakest on, with unseen items favoured and recently-correct ones held back."
    }
  };

  /* ── 10.02.4  SESSION ────────────────────────────────────────────────── */
  function start(mode, count) {
    var picked = choose(pool(), count, mode);
    if (!picked.length) { PMP.UI.toast("Nothing matches those filters.", "warn"); return; }
    startWith(picked, mode);
  }

  function startWith(questions, mode) {
    var shuffle = PMP.Store.state.settings.shuffleOptions !== false;
    session = {
      id: PMP.rng.id("drill"),
      mode: mode,
      startedAt: Date.now(),
      filters: JSON.parse(JSON.stringify(filters)),
      i: 0,
      finished: false,
      clock: mode === "timed" ? new PMP.time.Clock(questions.length * PACE_MS) : null,
      items: questions.map(function (q) {
        return {
          q: q,
          p: PMP.QRender.present(q, { shuffle: shuffle }),
          value: null, result: null, committed: false, recorded: false,
          confidence: null, seen: false, panel: null, ctrl: null, ui: {},
          clock: new PMP.time.Clock(PACE_MS)
        };
      })
    };
    repaint();
  }

  function record(item) {
    if (item.recorded || !item.result) return;
    item.recorded = true;
    var q = item.q;
    var attempt = {
      id: PMP.rng.id("att"),
      qid: q.id,
      ecoTask: q.ecoTask || null,
      domain: q.domain || null,
      approach: q.approach || null,
      type: PMP.QRender.base(q.type),
      difficulty: q.difficulty || null,
      correct: !!item.result.correct,
      credit: item.result.credit,
      ms: Math.round(item.clock.elapsed()),
      at: new Date().toISOString(),
      confidence: item.confidence,
      mode: session.mode,
      /* The display order the person actually saw, so a review can put the
         options back exactly where they were. */
      order: item.p.order
    };
    PMP.Store.commit(["attempts"], function (s) { s.attempts.push(attempt); });
  }

  /* ── 10.02.5  DRILL VIEW ─────────────────────────────────────────────── */
  function renderDrill(host) {
    var total = session.items.length;

    var progressFill = el("i", { style: "width:0%" });
    var paceBar = el("i");
    var paceClock = el("span", { class: "clock", text: "0:00" });
    var paceWrap = el("span", {
      class: "pace", dataset: { state: "ok" },
      title: "Time on this question against the " + CFG.PACE_TARGET_SEC + " second target"
    }, [el("span", { class: "bar", "aria-hidden": "true" }, [paceBar]), paceClock]);
    /* The ticking value is hidden from assistive tech: announcing a changing
       clock every second would bury the question. The elapsed time is spoken
       once, with the verdict, when the answer is checked. */
    paceWrap.setAttribute("aria-hidden", "true");

    var counter = el("span", { class: "pool-n" }, [el("b", { text: "1" }), " / " + total]);
    var drillClock = session.clock ? el("span", { class: "clock", style: "font-family:var(--font-mono)" }) : null;

    var hd = el("div", { class: "drill-hd" }, [
      el("span", { class: "mode-tag", "data-mode": "persistent" }, [
        el("span", { class: "dot", "aria-hidden": "true" }), MODES[session.mode].name
      ]),
      counter,
      el("span", { class: "progress", "aria-hidden": "true" }, [progressFill]),
      el("span", { class: "spacer" }),
      drillClock,
      paceWrap,
      el("button", {
        class: "icon-btn", type: "button", "aria-label": "Keyboard shortcuts",
        onclick: showKeyHelp
      }, [icon("info")]),
      el("button", { class: "btn btn--sm", type: "button", onclick: confirmEnd }, "End drill")
    ]);
    host.appendChild(hd);

    var card = el("div", { class: "card", id: "drill-card", tabindex: "-1" });
    host.appendChild(card);

    var navGrid = el("div", { class: "navgrid", style: "margin-top:var(--sp-4)" });
    var navCells = session.items.map(function (item, idx) {
      var cell = el("button", {
        class: "navgrid-c", type: "button", dataset: { st: "unseen" },
        "aria-label": "Question " + (idx + 1),
        onclick: function () { show(idx); }
      }, String(idx + 1));
      navGrid.appendChild(cell);
      return cell;
    });
    host.appendChild(el("div", { class: "card" }, [
      el("span", { class: "eyebrow", text: "Navigator" }),
      navGrid,
      el("div", { class: "legend" }, [
        el("span", { class: "chip chip--answered", text: "Answered" }),
        el("span", { class: "chip chip--flagged", text: "Flagged" }),
        session.mode === "timed" ? null : el("span", { class: "chip chip--correct", text: "Correct" }),
        session.mode === "timed" ? null : el("span", { class: "chip chip--incorrect", text: "Incorrect" }),
        el("span", { class: "chip", text: "Not seen" })
      ])
    ]));

    el_ = {
      card: card, counter: counter.querySelector("b"), progress: progressFill,
      paceWrap: paceWrap, paceBar: paceBar, paceClock: paceClock,
      drillClock: drillClock, navCells: navCells
    };

    everySecond(function () {
      var item = session.items[session.i];
      if (!item) return;
      var e = item.clock.elapsed();
      el_.paceClock.textContent = mmss(e);
      var ratio = e / PACE_MS;
      el_.paceBar.style.width = Math.min(100, ratio * 100) + "%";
      el_.paceWrap.setAttribute("data-state", ratio >= CFG.PACE_OVER_RATIO ? "over" : ratio >= 1 ? "warn" : "ok");
      if (session.clock) {
        el_.drillClock.textContent = mmss(session.clock.remaining()) + " left";
        if (session.clock.expired() && !session.finished) {
          PMP.UI.toast("Time is up. The drill has been marked.", "warn");
          finish();
        }
      }
    });

    /* The drill clock starts when the drill is on screen and is never paused
       until it is finished. Walking off to the dashboard mid-drill does not
       stop it, because on the day nothing stops it either. The per-question
       pace clocks do pause, in cleanup() — see the note there. */
    if (session.clock) session.clock.start();

    installKeys();
    show(session.i);
  }

  function show(idx) {
    var prev = session.items[session.i];
    if (prev && prev !== session.items[idx]) prev.clock.pause();
    session.i = idx;
    var item = session.items[idx];
    item.seen = true;
    if (!item.committed) item.clock.start();

    el_.card.innerHTML = "";
    el_.card.appendChild(panelFor(item, idx));
    el_.counter.textContent = String(idx + 1);
    el_.progress.style.width = ((idx + 1) / session.items.length * 100) + "%";
    updateNav();

    try { el_.card.focus({ preventScroll: true }); } catch (e) { el_.card.focus(); }
    PMP.UI.announce("Question " + (idx + 1) + " of " + session.items.length + ". " +
      PMP.QRender.label(item.q.type) + ". " + PMP.QRender.instruction(item.q));
  }

  function updateNav() {
    if (!el_.navCells) return;
    var flags = PMP.Store.state.flags;
    session.items.forEach(function (item, idx) {
      var st = "unseen";
      if (flags[item.q.id]) st = "flagged";
      else if (item.committed && item.result && session.mode !== "timed") st = item.result.correct ? "correct" : "incorrect";
      else if (item.committed || item.value) st = "answered";
      else if (item.seen) st = "answered";
      if (!item.seen && !item.committed && !flags[item.q.id]) st = "unseen";
      el_.navCells[idx].setAttribute("data-st", st);
      el_.navCells[idx].setAttribute("data-cur", idx === session.i ? "true" : "false");
      el_.navCells[idx].setAttribute("aria-label", "Question " + (idx + 1) + ", " + st +
        (idx === session.i ? ", current" : ""));
    });
  }

  /* ── 10.02.6  ONE ITEM ───────────────────────────────────────────────── */
  function panelFor(item, idx) {
    if (item.panel) return item.panel;
    var q = item.q, state = PMP.Store.state;
    var task = PMP.ECO_TASK_BY_ID[q.ecoTask];
    var panel = el("div");

    panel.appendChild(el("div", { class: "q-meta" }, [
      el("span", { class: "eyebrow", text: "Question " + (idx + 1) }),
      el("span", { class: "chip", text: PMP.QRender.label(q.type) }),
      el("span", { class: "chip", text: PMP.ECO.DOMAIN_LABELS[q.domain] || q.domain }),
      task ? el("span", { class: "chip", text: task.label }) : null,
      q.approach ? el("span", { class: "chip", text: PMP.ECO.APPROACH_LABELS[q.approach] || q.approach }) : null,
      q.difficulty ? el("span", { class: "chip", text: "Difficulty " + q.difficulty }) : null,
      q.placeholder ? el("span", { class: "chip chip--flagged", text: "Placeholder item" }) : null
    ]));
    panel.appendChild(el("p", { class: "q-stem", text: q.stem }));
    panel.appendChild(el("p", { class: "q-instr", text: PMP.QRender.instruction(q) }));

    var body = el("div");
    panel.appendChild(body);
    var feedback = el("div");
    panel.appendChild(feedback);

    item.ctrl = PMP.QRender.render(item.p, q, body, {
      nonce: idx,
      onChange: function () { onAnswerChanged(item); }
    });

    /* Tools ── flag, note, report an issue */
    var flagBtn = el("button", {
      class: "btn btn--sm", type: "button", "aria-pressed": state.flags[q.id] ? "true" : "false",
      dataset: { on: state.flags[q.id] ? "true" : "false" },
      onclick: function () { toggleFlag(item); }
    }, [icon("flag"), "Flag"]);

    var noteBtn = el("button", {
      class: "btn btn--sm", type: "button",
      dataset: { on: state.notes[q.id] ? "true" : "false" },
      onclick: function () { editNote(item); }
    }, [icon("journal"), state.notes[q.id] ? "Edit note" : "Add note"]);

    var reportBtn = el("button", {
      class: "btn btn--sm", type: "button",
      onclick: function () { reportIssue(item); }
    }, [icon("alert"), "Report a problem"]);

    var noteBox = el("div", { class: "q-note", hidden: !state.notes[q.id], text: state.notes[q.id] || "" });

    var tools = el("div", { class: "q-tools" }, [flagBtn, noteBtn, reportBtn, el("span", { class: "spacer" })]);

    var confBtns = null;
    if (state.settings.confidenceTracking) {
      confBtns = ["sure", "unsure"].map(function (k) {
        return el("button", {
          class: "btn btn--sm", type: "button", dataset: { on: "false", conf: k },
          onclick: function () { setConfidence(item, k); }
        }, k === "sure" ? "Sure" : "Not sure");
      });
      tools.appendChild(el("span", { class: "eyebrow", text: "Confidence" }));
      confBtns.forEach(function (b) { tools.appendChild(b); });
    }
    panel.appendChild(noteBox);
    panel.appendChild(tools);

    /* Footer ── the buttons change once, when the answer is committed */
    var backBtn = el("button", {
      class: "btn", type: "button", disabled: idx === 0,
      onclick: function () { if (session.i > 0) show(session.i - 1); }
    }, "Back");

    var last = idx === session.items.length - 1;
    var skipBtn = el("button", {
      class: "btn", type: "button",
      onclick: function () { advance(item); }
    }, last ? "Skip and finish" : "Skip");

    var primary = el("button", {
      class: "btn btn--primary", type: "button", disabled: true,
      onclick: function () {
        if (session.mode === "timed" || item.committed) advance(item);
        else check(item);
      }
    }, session.mode === "timed" ? (last ? "Finish drill" : "Next question") : "Check answer");

    var foot = el("div", { class: "q-tools", style: "border-top:0;padding-top:0" }, [
      backBtn, el("span", { class: "spacer" }), skipBtn, primary
    ]);
    panel.appendChild(foot);

    item.ui = {
      panel: panel, feedback: feedback, primary: primary, skip: skipBtn, back: backBtn,
      flagBtn: flagBtn, noteBtn: noteBtn, noteBox: noteBox, conf: confBtns, foot: foot, last: last
    };
    item.panel = panel;
    onAnswerChanged(item);
    return panel;
  }

  function onAnswerChanged(item) {
    if (!item.ui || !item.ui.primary || item.committed) return;
    var ready = item.ctrl.answered();
    item.ui.primary.disabled = session.mode === "timed" ? false : !ready;
    if (session.mode === "timed") item.value = ready ? item.ctrl.value() : null;
    updateNav();
  }

  function check(item) {
    if (item.committed) return;
    if (!item.ctrl.answered()) return;
    item.clock.pause();
    item.value = item.ctrl.value();
    item.result = PMP.QRender.score(item.q, item.p, item.value);
    item.committed = true;
    record(item);

    item.ctrl.reveal(item.result);
    showVerdict(item);

    item.ui.skip.hidden = true;
    item.ui.primary.textContent = item.ui.last ? "Finish drill" : "Next question";
    item.ui.primary.disabled = false;
    item.ui.primary.focus();
    updateNav();
  }

  function showVerdict(item) {
    var r = item.result;
    var kind = r.correct ? "right" : r.partial ? "part" : "wrong";
    var word = r.correct ? "Correct" : r.partial ? "Partly correct" : "Not correct";
    var secs = Math.round(item.clock.elapsed() / 1000);
    var pace = secs <= CFG.PACE_TARGET_SEC
      ? "Answered in " + PMP.fmt.duration(secs) + ", inside the " + CFG.PACE_TARGET_SEC + " second target."
      : "Answered in " + PMP.fmt.duration(secs) + ", which is " + PMP.fmt.duration(secs - CFG.PACE_TARGET_SEC) + " over the " + CFG.PACE_TARGET_SEC + " second target.";
    var extra = r.of ? " " + r.hit + " of " + r.of + " right." : "";

    item.ui.feedback.appendChild(el("div", { class: "verdict verdict--" + kind, role: "status" }, [
      icon(r.correct ? "check" : r.partial ? "alert" : "x"),
      el("div", null, [
        el("div", { class: "t", text: word + extra }),
        el("div", { class: "d", text: pace })
      ])
    ]));
    if (item.q.explanation) {
      item.ui.feedback.appendChild(el("div", { class: "explain" }, [
        el("h3", { text: "Why" }),
        el("p", { text: item.q.explanation })
      ]));
    }
  }

  /* Advance. In a timed drill this is also where the answer is committed,
     because there is no separate check step. */
  function advance(item) {
    if (session.mode === "timed" && !item.committed && item.ctrl.answered()) {
      item.clock.pause();
      item.value = item.ctrl.value();
      item.result = PMP.QRender.score(item.q, item.p, item.value);
      item.committed = true;
      record(item);
    }
    if (session.i >= session.items.length - 1) return finish();
    show(session.i + 1);
  }

  /* ── 10.02.7  FLAG, NOTE, REPORT ─────────────────────────────────────── */
  function toggleFlag(item) {
    var qid = item.q.id;
    var now = !PMP.Store.state.flags[qid];
    PMP.Store.commit(["flags"], function (s) {
      if (now) s.flags[qid] = true; else delete s.flags[qid];
    });
    item.ui.flagBtn.setAttribute("data-on", now ? "true" : "false");
    item.ui.flagBtn.setAttribute("aria-pressed", now ? "true" : "false");
    PMP.UI.announce(now ? "Flagged for review" : "Flag removed");
    updateNav();
  }

  function editNote(item) {
    var qid = item.q.id;
    var ta = el("textarea", { class: "textarea", style: "min-height:120px;font-family:var(--font-ui);font-size:var(--t-sm)", "aria-label": "Your note on this question" });
    ta.value = PMP.Store.state.notes[qid] || "";
    PMP.UI.sheet({
      title: "Note on this question",
      body: frag([
        el("p", { text: "Write down what you want to remember: the trap you fell into, the rule that decides it, the wording that gave it away." }),
        ta
      ]),
      actions: [
        { id: "cancel", label: "Cancel" },
        { id: "clear", label: "Delete note" },
        { id: "save", label: "Save note", primary: true }
      ]
    }).then(function (choice) {
      if (choice !== "save" && choice !== "clear") return;
      var text = choice === "clear" ? "" : ta.value.trim();
      PMP.Store.commit(["notes"], function (s) {
        if (text) s.notes[qid] = text; else delete s.notes[qid];
      });
      item.ui.noteBox.textContent = text;
      item.ui.noteBox.hidden = !text;
      item.ui.noteBtn.setAttribute("data-on", text ? "true" : "false");
      item.ui.noteBtn.lastChild.textContent = text ? "Edit note" : "Add note";
      PMP.UI.toast(text ? "Note saved." : "Note deleted.", "ok");
    });
  }

  function reportIssue(item) {
    var qid = item.q.id;
    var kind = el("select", { class: "select", "aria-label": "What is wrong" });
    [
      ["wrong-answer", "The marked answer looks wrong"],
      ["ambiguous", "More than one answer works"],
      ["unclear", "The wording is unclear"],
      ["typo", "Typo or formatting problem"],
      ["eco", "Tagged to the wrong ECO task"],
      ["other", "Something else"]
    ].forEach(function (k) { kind.appendChild(el("option", { value: k[0], text: k[1] })); });

    var ta = el("textarea", { class: "textarea", style: "min-height:110px;font-family:var(--font-ui);font-size:var(--t-sm)", "aria-label": "What is wrong with this question" });

    PMP.UI.sheet({
      title: "Report a problem",
      body: frag([
        el("p", { text: "Reports are stored with your progress on this device and travel with your backup file. Nothing is sent anywhere \u2014 this file makes no network requests." }),
        el("label", { class: "field" }, [el("span", { class: "lbl", text: "What is wrong" }), kind]),
        el("label", { class: "field" }, [el("span", { class: "lbl", text: "Detail, optional" }), ta])
      ]),
      actions: [{ id: "cancel", label: "Cancel" }, { id: "send", label: "Save report", primary: true }]
    }).then(function (choice) {
      if (choice !== "send") return;
      PMP.Store.commit(["issues"], function (s) {
        s.issues.push({
          id: PMP.rng.id("iss"), qid: qid, kind: kind.value,
          text: ta.value.trim(), at: new Date().toISOString()
        });
      });
      PMP.UI.toast("Report saved with your progress.", "ok");
    });
  }

  function setConfidence(item, k) {
    item.confidence = item.confidence === k ? null : k;
    item.ui.conf.forEach(function (b) {
      b.setAttribute("data-on", b.getAttribute("data-conf") === item.confidence ? "true" : "false");
    });
  }

  /* ── 10.02.8  KEYBOARD ───────────────────────────────────────────────── */
  function typing(e) {
    var t = e.target;
    if (!t || !t.tagName) return false;
    var tag = t.tagName.toUpperCase();
    return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || t.isContentEditable;
  }

  function installKeys() {
    var off = on(document, "keydown", function (e) {
      if (!session || session.finished) return;
      if (document.getElementById("sheet") && document.getElementById("sheet").open) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      var item = session.items[session.i];
      if (!item) return;
      var inField = typing(e);

      if (e.key === "Enter") {
        /* Enter inside a text blank should mark the item, not submit a form. */
        if (inField && e.target.tagName.toUpperCase() === "TEXTAREA") return;
        e.preventDefault();
        if (!item.committed && session.mode !== "timed") { if (item.ctrl.answered()) check(item); }
        else advance(item);
        return;
      }
      if (e.key === "Escape") { e.preventDefault(); confirmEnd(); return; }
      if (inField) return;

      var k = e.key;
      if (k === "?") { e.preventDefault(); showKeyHelp(); return; }

      /* The letters printed beside the options win. They are the only key
         mapping on screen, so a person pressing B while looking at a B is
         choosing that option, not asking to go back a question. Everything
         below runs on what the renderer turns down, which is why the actions
         are on N, P, K and R: none of those falls inside A to J for a
         four-option item, and only F does for an item with six or more. */
      if (!item.committed && /^[a-jA-J1-9]$/.test(k) && item.ctrl.hotkey(k)) { e.preventDefault(); return; }

      if (k === "n" || k === "N") { e.preventDefault(); advance(item); return; }
      if (k === "p" || k === "P") { e.preventDefault(); if (session.i > 0) show(session.i - 1); return; }
      if (k === "f" || k === "F") { e.preventDefault(); toggleFlag(item); return; }
      if (k === "k" || k === "K") { e.preventDefault(); editNote(item); return; }
      if (k === "r" || k === "R") { e.preventDefault(); reportIssue(item); return; }
    });
    teardown.push(off);
  }

  function showKeyHelp() {
    PMP.UI.sheet({
      title: "Keyboard shortcuts",
      body: frag([
        el("p", { text: "These work anywhere in a drill, except while you are typing in a box." }),
        keyHelpList()
      ]),
      actions: [{ id: "close", label: "Close", primary: true }]
    });
  }

  function confirmEnd() {
    PMP.UI.confirm(
      "End this drill?",
      "You are on question " + (session.i + 1) + " of " + session.items.length + ". Everything you have already answered is saved, and you will see the summary for those.",
      "End drill", true
    ).then(function (yes) { if (yes) finish(); });
  }

  /* ── 10.02.9  SUMMARY ────────────────────────────────────────────────── */
  function finish() {
    if (session.finished) return;
    session.items.forEach(function (item) {
      item.clock.pause();
      if (!item.committed && item.ctrl && item.ctrl.answered()) {
        item.value = item.ctrl.value();
        item.result = PMP.QRender.score(item.q, item.p, item.value);
        item.committed = true;
        record(item);
      }
    });
    if (session.clock) session.clock.pause();
    session.finished = true;
    session.finishedAt = Date.now();
    cleanup();
    repaint();
  }

  function renderSummary(host) {
    var items = session.items;
    var answered = items.filter(function (i2) { return i2.committed && i2.result; });
    var right = answered.filter(function (i2) { return i2.result.correct; });
    var credit = answered.reduce(function (a, i2) { return a + i2.result.credit; }, 0);
    var totalMs = items.reduce(function (a, i2) { return a + i2.clock.elapsed(); }, 0);
    var avgSec = answered.length ? (answered.reduce(function (a, i2) { return a + i2.clock.elapsed(); }, 0) / answered.length / 1000) : 0;
    var overPace = answered.filter(function (i2) { return i2.clock.elapsed() > PACE_MS; }).length;

    host.appendChild(el("div", { class: "view-hd" }, [
      el("span", { class: "eyebrow", text: MODES[session.mode].name + " \u00B7 finished" }),
      el("h2", { text: answered.length ? PMP.fmt.pct(right.length / answered.length) + " correct" : "Nothing was answered" }),
      el("p", { text: answered.length
        ? right.length + " of " + PMP.fmt.plural(answered.length, "answered question") + " right, in " + PMP.fmt.duration(totalMs / 1000) + ". Every one of them is already saved to your history."
        : "This drill ended without a committed answer, so nothing was recorded." })
    ]));

    host.appendChild(el("div", { class: "card" }, [
      el("span", { class: "eyebrow", text: "The numbers" }),
      el("div", { class: "sum-grid", style: "margin-top:var(--sp-4)" }, [
        stat("Correct", right.length + " / " + answered.length),
        stat("With part marks", answered.length ? PMP.fmt.pct(credit / answered.length) : "\u2014"),
        stat("Average pace", answered.length ? Math.round(avgSec) + "s" : "\u2014"),
        stat("Over " + CFG.PACE_TARGET_SEC + "s", String(overPace)),
        stat("Skipped", String(items.length - answered.length))
      ]),
      el("p", { style: "margin-top:var(--sp-4)", text: "Part marks count each right option in a multiple-response or matching item. The exam scores the item as a whole, so the correct count above is the figure that feeds your readiness score." })
    ]));

    host.appendChild(breakdown("By ECO task", answered, function (i2) {
      var t = PMP.ECO_TASK_BY_ID[i2.q.ecoTask];
      return t ? t.label : "Untagged";
    }));
    host.appendChild(breakdown("By question type", answered, function (i2) {
      return PMP.QRender.label(i2.q.type);
    }));

    var reviewCard = el("div", { class: "card" }, [
      el("span", { class: "eyebrow", text: "Review" }),
      el("h2", { text: "Every question, with the reasoning" })
    ]);
    items.forEach(function (item, idx) {
      if (!item.panel) panelFor(item, idx);
      if (item.committed && item.result && !item.revealed) {
        item.ctrl.reveal(item.result);
        showVerdict(item);
      }
      item.revealed = true;
      if (item.ui.foot) item.ui.foot.hidden = true;
      var state = item.result ? (item.result.correct ? "correct" : item.result.partial ? "flagged" : "incorrect") : null;
      var det = el("details", { class: "review" }, [
        el("summary", null, [
          el("span", { class: "n", text: String(idx + 1) }),
          el("span", { class: "chip" + (state ? " chip--" + state : ""), text: item.result ? (item.result.correct ? "Correct" : item.result.partial ? "Part marks" : "Wrong") : "Skipped" }),
          el("span", { class: "s", text: item.q.stem })
        ]),
        el("div", { class: "review-bd" }, [item.panel])
      ]);
      if (item.result && !item.result.correct) det.open = true;
      reviewCard.appendChild(det);
    });
    host.appendChild(reviewCard);

    var wrong = items.filter(function (i2) { return i2.result && !i2.result.correct; }).map(function (i2) { return i2.q; });
    host.appendChild(el("div", { class: "card" }, [
      el("span", { class: "eyebrow", text: "Next" }),
      el("div", { style: "display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-top:var(--sp-3)" }, [
        wrong.length ? el("button", {
          class: "btn btn--primary", type: "button",
          onclick: function () { startWith(PMP.rng.shuffle(wrong).items, session.mode); }
        }, [icon("target"), "Redo the " + wrong.length + " you missed"]) : null,
        el("button", {
          class: "btn", type: "button",
          onclick: function () { startWith(choose(pool(), session.items.length, session.mode), session.mode); }
        }, "Another drill, same filters"),
        el("button", {
          class: "btn", type: "button",
          onclick: function () { session = null; repaint(); }
        }, "Change the filters")
      ])
    ]));
  }

  function stat(k, v) {
    return el("div", { class: "stat" }, [
      el("span", { class: "stat-k", text: k }),
      el("span", { class: "stat-v", text: v })
    ]);
  }

  function breakdown(title, answered, keyOf) {
    var card = el("div", { class: "card" }, [el("span", { class: "eyebrow", text: title })]);
    if (!answered.length) {
      card.appendChild(el("p", { text: "Nothing was answered, so there is nothing to break down." }));
      return card;
    }
    var groups = Object.create(null);
    answered.forEach(function (i2) {
      var k = keyOf(i2);
      var g = groups[k] || (groups[k] = { n: 0, right: 0, ms: 0 });
      g.n++;
      if (i2.result.correct) g.right++;
      g.ms += i2.clock.elapsed();
    });
    var tbl = el("table", { class: "tbl" }, [
      el("thead", null, [el("tr", null, [
        el("th", { text: title.replace("By ", "") }),
        el("th", { class: "n", text: "Right" }),
        el("th", { class: "n", text: "Asked" }),
        el("th", { class: "n", text: "Avg" })
      ])])
    ]);
    var body = el("tbody");
    Object.keys(groups).sort().forEach(function (k) {
      var g = groups[k];
      body.appendChild(el("tr", null, [
        el("td", { text: k }),
        el("td", { class: "n", text: String(g.right) }),
        el("td", { class: "n", text: String(g.n) }),
        el("td", { class: "n", text: Math.round(g.ms / g.n / 1000) + "s" })
      ]));
    });
    tbl.appendChild(body);
    card.appendChild(tbl);
    return card;
  }

  /* ── 10.02.10  ROUTE ─────────────────────────────────────────────────── */
  function view(host, params) {
    cleanup();
    if (!filters) {
      filters = defaultFilters();
      /* A link like #/practice?domain=process&type=multi lands pre-filtered. */
      if (params) Object.keys(filters).forEach(function (k) {
        if (params[k]) filters[k] = params[k];
      });
    }
    /* A live drill always wins: coming back to Practice after wandering off to
       the dashboard drops you where you left off, on the question you left off
       on, with the answer you had typed. End drill in the header is the way
       out, and it marks whatever has been answered on the way. */
    if (session && !session.finished) return renderDrill(host);
    if (session && session.finished) return renderSummary(host);
    return renderSetup(host, params);
  }

  PMP.Router.register("practice", { title: "Practice", render: view });

  /* Tickers and the document key handler belong to a drill that is on screen.
     Leaving the route takes them down; the session itself is left alone so
     Resume works when the person comes back. */
  PMP.Store.subscribe(function (state, changed) {
    if (changed.indexOf("ui") >= 0 && state.ui.route && state.ui.route !== "practice") cleanup();
  });

  return { startWith: startWith, cleanup: cleanup, get session() { return session; } };
})();

/* ── 10.04  QUESTION RENDERERS ──────────────────────────────────────────────
   Five renderers, one per question type in §3.4. Two of the seven type ids
   accepted by the validator in §09.6 are presentation variants and share a
   renderer with their base type: a "pulldown" is a matching item whose prompts
   read as blanks in the stem, and a "graphic" item is a hotspot over a diagram.
   Nothing outside this section needs to know which is which.

   Three rules hold across all five:

   1. An answer is always a set of option, prompt, region or blank *ids*.
      Never a displayed index. That is what makes shuffling safe.
   2. Shuffling touches the option pool only. Matching prompts keep their
      authored order because they often read as a sequence, and hotspot regions
      are positions in a picture, so neither can move.
   3. Every input is reachable and operable from the keyboard alone, and the
      state of every input is exposed through a native control or an ARIA role.

   The controller returned by render() is the whole contract with §10.02:
      node       the element that was appended
      value()    the current answer, in the shape score() expects
      answered() whether there is enough of an answer to submit
      focus()    move focus to the first input
      reveal(r)  mark up the result of score() and show the rationales
      hotkey(k)  handle a single character, returns true if it was used
   ═════════════════════════════════════════════════════════════════════════ */
PMP.QRender = (function () {
  var el = PMP.dom.el, icon = PMP.dom.icon, on = PMP.dom.on;
  var LETTERS = "ABCDEFGHIJ";
  var SVGNS = "http://www.w3.org/2000/svg";

  var ALIAS = { pulldown: "matching", graphic: "hotspot" };
  var LABEL = {
    single: "Multiple choice", multi: "Multiple response", matching: "Matching",
    pulldown: "Drop-down", hotspot: "Hotspot", graphic: "Graphic hotspot",
    fillblank: "Fill in the blank"
  };

  function base(type) { return ALIAS[type] || type; }
  function label(type) { return LABEL[type] || type; }
  function correctIds(q) {
    return (q.options || []).filter(function (o) { return o.correct; }).map(function (o, i) { return o.id; });
  }

  /* The line under the stem that tells the person what kind of answer is
     wanted. Multi says how many, because "select all that apply" without a
     count is the single most common source of avoidable partial credit. */
  function instruction(q) {
    var t = base(q.type);
    if (t === "single") return "Choose the best answer.";
    if (t === "multi") {
      var n = (q.options || []).filter(function (o) { return o.correct; }).length;
      return n > 1 ? "Choose " + n + " answers." : "Choose all that apply.";
    }
    if (t === "matching") {
      var extra = (q.options || []).length - (q.prompts || []).length;
      return "Choose one for each line." + (extra > 0 ? " " + (extra === 1 ? "One choice is" : extra + " choices are") + " not used." : "");
    }
    if (t === "hotspot") return (q.multi ? "Select every part of the diagram that applies." : "Select one part of the diagram.");
    if (t === "fillblank") return (q.blanks || []).length > 1 ? "Fill in both boxes." : "Type your answer in the box.";
    return "";
  }

  /* ── 10.04.1  PRESENT — shuffle with correct-answer mapping ───────────────
     The presentation is built once per item per sitting and then held for as
     long as that item is on screen, so the option order cannot change under
     someone who is midway through reading it. `src` is the index the option
     held in the pack and `order` is the display-to-source map, both stored on
     the attempt so a review can reproduce exactly what was on screen.
     Options carrying fixed:true (an "all of the above" style tail) keep their
     authored position while everything around them moves. */
  function present(q, opts) {
    opts = opts || {};
    var rand = opts.rand || Math.random;
    var doShuffle = opts.shuffle !== false && q.shuffle !== false;

    var decorated = (q.options || []).map(function (o, i) {
      return {
        id: o.id != null ? String(o.id) : "o" + i,
        text: o.text, rationale: o.rationale, correct: !!o.correct,
        match: o.match != null ? String(o.match) : null,
        fixed: !!o.fixed, src: i
      };
    });

    var options = decorated;
    if (doShuffle && decorated.length > 1) {
      var movable = decorated.filter(function (o) { return !o.fixed; });
      var res = PMP.rng.shuffle(movable, rand);
      var m = 0;
      options = decorated.map(function (o) { return o.fixed ? o : res.items[m++]; });
    }

    return {
      qid: q.id,
      type: base(q.type),
      declaredType: q.type,
      shuffled: doShuffle,
      options: options,
      order: options.map(function (o) { return o.src; }),
      prompts: (q.prompts || []).map(function (p, i) {
        return { id: p.id != null ? String(p.id) : "p" + i, text: p.text };
      }),
      regions: (q.regions || []).map(function (r, i) {
        var o = {};
        for (var k in r) if (Object.prototype.hasOwnProperty.call(r, k)) o[k] = r[k];
        o.id = r.id != null ? String(r.id) : "r" + i;
        o.n = r.n != null ? r.n : i + 1;
        return o;
      }),
      blanks: (q.blanks || []).map(function (b, i) {
        var o = {};
        for (var k in b) if (Object.prototype.hasOwnProperty.call(b, k)) o[k] = b[k];
        o.id = b.id != null ? String(b.id) : "b" + i;
        return o;
      })
    };
  }

  /* ── 10.04.2  SCORE ──────────────────────────────────────────────────────
     Every type returns the same shape: credit 0–1, and correct only when
     credit is a full 1. Partial credit is recorded on the attempt because it
     is the honest measure of a five-option multi-response item, but the exam
     scores the item, not the options, so `correct` stays all-or-nothing and
     that is the figure the readiness score in §10.01 will read. */
  function result(credit, extra) {
    var r = extra || {};
    r.credit = Math.max(0, Math.min(1, credit));
    r.correct = r.credit >= 1;
    r.partial = r.credit > 0 && r.credit < 1;
    return r;
  }

  function setOf(v) {
    var s = Object.create(null);
    (v || []).forEach(function (x) { s[x] = true; });
    return s;
  }

  function parseNumber(s) {
    var t = String(s == null ? "" : s).trim();
    if (!t) return NaN;
    /* Accountancy negatives, thousands separators and a trailing unit are all
       things people type. None of them should read as a wrong answer. */
    t = t.replace(/^\((.*)\)$/, "-$1").replace(/[,\s]/g, "").replace(/[$\u00A3\u20AC%]/g, "");
    if (!/^[-+]?\d*\.?\d+(e[-+]?\d+)?$/i.test(t)) return NaN;
    return parseFloat(t);
  }

  function blankIsRight(b, raw) {
    if (raw == null || String(raw).trim() === "") return false;
    if (b.numeric) {
      var v = parseNumber(raw);
      if (isNaN(v)) return false;
      return Math.abs(v - b.expect) <= (b.tol != null ? b.tol : 0);
    }
    var got = PMP.text.normalise(raw);
    return (b.accept || []).some(function (a) { return PMP.text.normalise(a) === got; });
  }

  function score(q, p, value) {
    var t = p.type, i;

    if (t === "single") {
      var right = p.options.filter(function (o) { return o.correct; })[0];
      var rid = right ? right.id : null;
      return result(value && value === rid ? 1 : 0, { right: rid ? [rid] : [], chosen: value ? [value] : [] });
    }

    if (t === "multi" || t === "hotspot") {
      var pool = t === "multi" ? p.options : p.regions;
      var rightIds = pool.filter(function (o) { return o.correct; }).map(function (o) { return o.id; });
      var picked = Array.isArray(value) ? value : (value ? [value] : []);
      var want = setOf(rightIds), got = setOf(picked);
      var hits = 0, wrong = 0;
      picked.forEach(function (id) { if (want[id]) hits++; else wrong++; });
      /* Wrong picks cancel right ones, so guessing everything scores zero
         rather than full marks. */
      var credit = rightIds.length ? (hits - wrong) / rightIds.length : 0;
      var exact = hits === rightIds.length && wrong === 0;
      return result(exact ? 1 : credit, { right: rightIds, chosen: picked, picked: got });
    }

    if (t === "matching") {
      var v = value || {};
      var perPrompt = {}, hit = 0;
      for (i = 0; i < p.prompts.length; i++) {
        var pr = p.prompts[i];
        var want2 = p.options.filter(function (o) { return o.match === pr.id; })[0];
        var ok = !!(want2 && v[pr.id] === want2.id);
        perPrompt[pr.id] = { chosen: v[pr.id] || null, want: want2 ? want2.id : null, ok: ok };
        if (ok) hit++;
      }
      return result(p.prompts.length ? hit / p.prompts.length : 0, { perPrompt: perPrompt, hit: hit, of: p.prompts.length });
    }

    if (t === "fillblank") {
      var vb = value || {}, perBlank = {}, hitB = 0;
      for (i = 0; i < p.blanks.length; i++) {
        var b = p.blanks[i];
        var okB = blankIsRight(b, vb[b.id]);
        perBlank[b.id] = { given: vb[b.id] == null ? "" : String(vb[b.id]), ok: okB };
        if (okB) hitB++;
      }
      return result(p.blanks.length ? hitB / p.blanks.length : 0, { perBlank: perBlank, hit: hitB, of: p.blanks.length });
    }

    return result(0, {});
  }

  function isAnswered(p, value) {
    var t = p.type, k;
    if (t === "single") return !!value;
    if (t === "multi" || t === "hotspot") return Array.isArray(value) && value.length > 0;
    if (t === "matching") {
      if (!value) return false;
      for (k = 0; k < p.prompts.length; k++) if (!value[p.prompts[k].id]) return false;
      return true;
    }
    if (t === "fillblank") {
      if (!value) return false;
      for (k = 0; k < p.blanks.length; k++) {
        var v = value[p.blanks[k].id];
        if (v == null || String(v).trim() === "") return false;
      }
      return true;
    }
    return false;
  }

  /* ── 10.04.3  SHARED PIECES ──────────────────────────────────────────── */
  function why(text, lead) {
    return el("div", { class: "why" }, [lead ? el("b", { text: lead + " " }) : null, text]);
  }

  function markIcon(kind) {
    return icon(kind === "correct" ? "check" : kind === "missed" ? "flag" : "x", "i mark");
  }

  /* ── 10.04.4  SINGLE AND MULTI ───────────────────────────────────────────
     A native radio or checkbox inside a label. That buys arrow-key movement
     within the group, Space to toggle, correct roles and correct state for a
     screen reader, and the browser's own click target handling, none of which
     a div with a role would give for free. The visible ring is drawn on the
     label with :focus-within because the input itself is offscreen. */
  function renderChoice(p, q, host, ctx) {
    var multi = p.type === "multi";
    var name = "opt-" + p.qid + "-" + (ctx.nonce || 0);
    var rows = [];

    var group = el("fieldset", { class: "opts" }, [
      el("legend", { class: "sr-only", text: instruction(q) })
    ]);

    p.options.forEach(function (o, i) {
      var input = el("input", {
        type: multi ? "checkbox" : "radio",
        name: name, value: o.id, id: name + "-" + i
      });
      var row = el("label", {
        class: "opt", for: input.id, dataset: { sel: "false", opt: o.id }
      }, [
        input,
        el("span", { class: "key", "aria-hidden": "true", text: LETTERS.charAt(i) || String(i + 1) }),
        el("span", { class: "txt" }, [el("span", { text: o.text })])
      ]);
      on(input, "change", function () { sync(); if (ctx.onChange) ctx.onChange(); });
      rows.push({ o: o, row: row, input: input });
      group.appendChild(row);
    });

    function sync() {
      rows.forEach(function (r) { r.row.setAttribute("data-sel", r.input.checked ? "true" : "false"); });
    }

    function value() {
      var picked = rows.filter(function (r) { return r.input.checked; }).map(function (r) { return r.o.id; });
      return multi ? picked : (picked[0] || null);
    }

    host.appendChild(group);

    return {
      node: group,
      value: value,
      answered: function () { return isAnswered(p, value()); },
      focus: function () {
        var checked = rows.filter(function (r) { return r.input.checked; })[0];
        (checked || rows[0]).input.focus();
      },
      hotkey: function (k) {
        var i = LETTERS.indexOf(k.toUpperCase());
        if (i < 0 && /^[1-9]$/.test(k)) i = parseInt(k, 10) - 1;
        if (i < 0 || i >= rows.length) return false;
        var r = rows[i];
        if (multi) r.input.checked = !r.input.checked;
        else r.input.checked = true;
        sync();
        r.input.focus();
        if (ctx.onChange) ctx.onChange();
        return true;
      },
      reveal: function (res) {
        var chosen = setOf(res.chosen || []);
        rows.forEach(function (r) {
          r.input.disabled = true;
          var mark = null;
          if (r.o.correct && chosen[r.o.id]) mark = "correct";
          else if (r.o.correct) mark = multi ? "missed" : "correct";
          else if (chosen[r.o.id]) mark = "incorrect";
          if (mark) {
            r.row.setAttribute("data-mark", mark);
            r.row.insertBefore(markIcon(mark), r.row.querySelector(".txt").nextSibling);
          }
          if (r.o.rationale) r.row.querySelector(".txt").appendChild(why(r.o.rationale));
        });
      }
    };
  }

  /* ── 10.04.5  MATCHING AND DROP-DOWN ─────────────────────────────────────
     One native select per prompt. A select is the one control here that needs
     no keyboard work of its own: type-ahead, arrow keys and the picker all
     come from the platform, on desktop and on a phone. */
  function renderMatching(p, q, host, ctx) {
    var wrap = el("div", { class: "match" });
    var rows = [];

    p.prompts.forEach(function (pr, i) {
      var sel = el("select", { class: "select", "aria-label": pr.text });
      sel.appendChild(el("option", { value: "", text: "\u2014 choose \u2014" }));
      p.options.forEach(function (o, j) {
        sel.appendChild(el("option", { value: o.id, text: o.text }));
      });
      on(sel, "change", function () { if (ctx.onChange) ctx.onChange(); });
      var row = el("div", { class: "match-row", dataset: { prompt: pr.id } }, [
        el("span", { class: "prompt" }, [
          el("span", { class: "eyebrow", text: String(i + 1) + " " }), pr.text
        ]),
        sel
      ]);
      rows.push({ pr: pr, sel: sel, row: row });
      wrap.appendChild(row);
    });

    function value() {
      var v = {};
      rows.forEach(function (r) { if (r.sel.value) v[r.pr.id] = r.sel.value; });
      return v;
    }

    host.appendChild(wrap);

    return {
      node: wrap,
      value: value,
      answered: function () { return isAnswered(p, value()); },
      focus: function () { if (rows[0]) rows[0].sel.focus(); },
      hotkey: function () { return false; },   /* the select owns its keys */
      reveal: function (res) {
        rows.forEach(function (r) {
          r.sel.disabled = true;
          var pp = res.perPrompt[r.pr.id] || {};
          r.row.setAttribute("data-mark", pp.ok ? "correct" : "incorrect");
          var chosenOpt = p.options.filter(function (o) { return o.id === pp.chosen; })[0];
          var wantOpt = p.options.filter(function (o) { return o.id === pp.want; })[0];
          if (pp.ok) {
            if (wantOpt && wantOpt.rationale) r.row.appendChild(why(wantOpt.rationale));
          } else {
            r.row.appendChild(why((wantOpt ? wantOpt.text + ". " + (wantOpt.rationale || "") : "No match was authored for this line."),
              "Answer:"));
            if (chosenOpt && chosenOpt.rationale) r.row.appendChild(why(chosenOpt.rationale, "You chose " + chosenOpt.text + ":"));
          }
        });
        /* Options nobody picked still carry a rationale, and for a matching
           item the unused choice is usually the instructive one. */
        var used = {};
        rows.forEach(function (r) { var pp = res.perPrompt[r.pr.id] || {}; used[pp.chosen] = true; used[pp.want] = true; });
        var spare = p.options.filter(function (o) { return !used[o.id] && o.rationale; });
        if (spare.length) {
          wrap.appendChild(el("div", { class: "match-row" }, [
            el("span", { class: "prompt" }, [el("span", { class: "eyebrow", text: "Not used " })]),
            el("span"),
            el("div", { class: "why" }, spare.map(function (o) {
              return el("div", null, [el("b", { text: o.text + ". " }), o.rationale]);
            }))
          ]));
        }
      }
    };
  }

  /* ── 10.04.6  HOTSPOT AND GRAPHIC ────────────────────────────────────────
     The diagram is drawn from the item's own data rather than loaded as an
     image: no external file to lose, it inherits the theme, and it stays sharp
     at any zoom. Each region is a focusable group with a radio or checkbox
     role, so the picture is fully operable from the keyboard — Tab or the
     arrow keys to move, Enter or Space to select. */
  function svgEl(tag, attrs, children) {
    var n = document.createElementNS(SVGNS, tag), k;
    if (attrs) for (k in attrs) if (Object.prototype.hasOwnProperty.call(attrs, k) && attrs[k] != null) n.setAttribute(k, attrs[k]);
    (children || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }

  function wrapLabel(text, max) {
    var words = String(text).split(" "), lines = [], line = "";
    words.forEach(function (w) {
      if (!line) line = w;
      else if ((line + " " + w).length <= max) line += " " + w;
      else { lines.push(line); line = w; }
    });
    if (line) lines.push(line);
    return lines.slice(0, 3);
  }

  function renderHotspot(p, q, host, ctx) {
    var g = q.graphic || {};
    var multi = !!q.multi;
    var wrap = el("div", { class: "hotspot" });
    var svg = svgEl("svg", {
      viewBox: g.viewBox || "0 0 660 130",
      role: "group",
      "aria-label": g.title || "Diagram"
    });

    /* Connectors between consecutive regions, drawn from the geometry so the
       item data does not have to carry line coordinates. */
    if (g.flow !== false) {
      var ordered = p.regions.slice().sort(function (a, b) { return (a.x || 0) - (b.x || 0); });
      for (var i = 0; i < ordered.length - 1; i++) {
        var a = ordered[i], b = ordered[i + 1];
        var y = (a.y || 0) + (a.h || 0) / 2;
        var x1 = (a.x || 0) + (a.w || 0), x2 = (b.x || 0);
        if (x2 - x1 < 6) continue;
        svg.appendChild(svgEl("path", { class: "flow", d: "M" + x1 + " " + y + " H" + (x2 - 6) }));
        svg.appendChild(svgEl("path", { class: "flow-h", d: "M" + (x2 - 7) + " " + (y - 4) + " l7 4 -7 4 z" }));
      }
    }

    var cells = [];
    p.regions.forEach(function (r, idx) {
      var cell = svgEl("g", {
        class: "hot", tabindex: "0",
        role: multi ? "checkbox" : "radio",
        "aria-checked": "false",
        "aria-label": r.label
      });
      cell.setAttribute("data-sel", "false");
      cell.setAttribute("data-region", r.id);
      cell.appendChild(svgEl("title", null, [document.createTextNode(r.label)]));
      cell.appendChild(svgEl("rect", { class: "box", x: r.x, y: r.y, width: r.w, height: r.h, rx: 6 }));
      cell.appendChild(svgEl("text", { class: "num", x: r.x + 8, y: r.y + 16 }, [document.createTextNode(String(r.n))]));
      var lines = wrapLabel(r.label, 14);
      var top = r.y + r.h / 2 - ((lines.length - 1) * 15) / 2 + 5;
      lines.forEach(function (ln, li) {
        cell.appendChild(svgEl("text", {
          class: "lab", x: r.x + r.w / 2, y: top + li * 15, "text-anchor": "middle"
        }, [document.createTextNode(ln)]));
      });
      cells.push({ r: r, cell: cell });
      svg.appendChild(cell);

      function toggle() {
        if (locked) return;
        if (multi) {
          var now = cell.getAttribute("data-sel") !== "true";
          setSel(cell, now);
        } else {
          cells.forEach(function (c) { setSel(c.cell, c.cell === cell); });
        }
        if (ctx.onChange) ctx.onChange();
      }
      on(cell, "click", toggle);
      on(cell, "keydown", function (e) {
        if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") { e.preventDefault(); toggle(); return; }
        var step = e.key === "ArrowRight" || e.key === "ArrowDown" ? 1
                 : e.key === "ArrowLeft" || e.key === "ArrowUp" ? -1 : 0;
        if (!step) return;
        e.preventDefault();
        var next = cells[(idx + step + cells.length) % cells.length];
        next.cell.focus();
      });
    });

    var locked = false;
    function setSel(cell, on2) {
      cell.setAttribute("data-sel", on2 ? "true" : "false");
      cell.setAttribute("aria-checked", on2 ? "true" : "false");
    }

    function value() {
      return cells.filter(function (c) { return c.cell.getAttribute("data-sel") === "true"; })
                  .map(function (c) { return c.r.id; });
    }

    wrap.appendChild(svg);
    if (g.caption) wrap.appendChild(el("p", { class: "cap", text: g.caption }));
    host.appendChild(wrap);

    return {
      node: wrap,
      value: value,
      answered: function () { return value().length > 0; },
      focus: function () { if (cells[0]) cells[0].cell.focus(); },
      hotkey: function (k) {
        if (!/^[1-9]$/.test(k)) return false;
        var want = parseInt(k, 10);
        var hit = cells.filter(function (c) { return c.r.n === want; })[0] || cells[want - 1];
        if (!hit) return false;
        if (multi) setSel(hit.cell, hit.cell.getAttribute("data-sel") !== "true");
        else cells.forEach(function (c) { setSel(c.cell, c === hit); });
        hit.cell.focus();
        if (ctx.onChange) ctx.onChange();
        return true;
      },
      reveal: function (res) {
        locked = true;
        var chosen = setOf(res.chosen || []);
        var list = el("ul", { class: "keylist", style: "margin-top:var(--sp-3)" });
        cells.forEach(function (c) {
          c.cell.setAttribute("tabindex", "-1");
          var mark = c.r.correct && chosen[c.r.id] ? "correct"
                   : c.r.correct ? "missed"
                   : chosen[c.r.id] ? "incorrect" : null;
          if (mark) c.cell.setAttribute("data-mark", mark);
          if (c.r.rationale && (mark || !multi)) {
            list.appendChild(el("li", null, [
              el("span", { class: "kbd", text: String(c.r.n) }),
              el("span", { class: "why", style: "margin:0" }, [el("b", { text: c.r.label + ". " }), c.r.rationale])
            ]));
          }
        });
        if (list.childNodes.length) wrap.appendChild(list);
      }
    };
  }

  /* ── 10.04.7  FILL IN THE BLANK ──────────────────────────────────────────
     Numeric blanks are compared inside a tolerance, and the parser forgives
     thousands separators, a currency symbol and bracketed negatives. Text
     blanks compare against an accept list through the same normaliser the
     glossary search uses in §09.5, so case and punctuation do not decide a
     mark. inputmode is set so a phone offers the right keypad. */
  function renderBlanks(p, q, host, ctx) {
    var wrap = el("div", { class: "blanks" });
    var rows = [];

    p.blanks.forEach(function (b, i) {
      var input = el("input", {
        class: "input", type: "text", id: "blank-" + p.qid + "-" + i,
        inputmode: b.numeric ? "decimal" : "text",
        autocomplete: "off", autocapitalize: "off", spellcheck: "false",
        placeholder: b.numeric ? "0" : ""
      });
      on(input, "input", function () { if (ctx.onChange) ctx.onChange(); });
      var row = el("div", { class: "blank", dataset: { blank: b.id } }, [
        el("label", { class: "lbl", for: input.id, text: b.label }),
        el("span", { class: "box" }, [input, b.unit ? el("span", { class: "unit", text: b.unit }) : null])
      ]);
      rows.push({ b: b, input: input, row: row });
      wrap.appendChild(row);
    });

    function value() {
      var v = {};
      rows.forEach(function (r) { v[r.b.id] = r.input.value; });
      return v;
    }

    host.appendChild(wrap);

    return {
      node: wrap,
      value: value,
      answered: function () { return isAnswered(p, value()); },
      focus: function () { if (rows[0]) rows[0].input.focus(); },
      hotkey: function () { return false; },   /* the person is typing */
      reveal: function (res) {
        rows.forEach(function (r) {
          r.input.readOnly = true;
          var pb = res.perBlank[r.b.id] || {};
          r.row.setAttribute("data-mark", pb.ok ? "correct" : "incorrect");
          var answer = r.b.numeric ? String(r.b.expect) : (r.b.accept || [])[0];
          r.row.appendChild(why(
            (pb.ok ? "" : "The answer is " + answer + (r.b.unit ? " " + r.b.unit : "") + ". ") + (r.b.rationale || ""),
            pb.ok ? "Correct." : null
          ));
        });
      }
    };
  }

  var RENDERERS = {
    single: renderChoice, multi: renderChoice, matching: renderMatching,
    hotspot: renderHotspot, fillblank: renderBlanks
  };

  /* ── 10.04.8  ENTRY POINT ─────────────────────────────────────────────── */
  function render(p, q, host, ctx) {
    ctx = ctx || {};
    var fn = RENDERERS[p.type];
    if (!fn) {
      host.appendChild(PMP.UI.empty(
        "This item cannot be shown",
        "It is tagged as type \u201C" + p.declaredType + "\u201D, which this build has no renderer for. Skip it, and report it from the pack it came from.",
        "alert"
      ));
      return {
        node: host, value: function () { return null; }, answered: function () { return false; },
        focus: function () {}, hotkey: function () { return false; }, reveal: function () {}
      };
    }
    return fn(p, q, host, ctx);
  }

  return {
    base: base, label: label, instruction: instruction, correctIds: correctIds,
    present: present, render: render, score: score, isAnswered: isAnswered,
    parseNumber: parseNumber, TYPE_LABELS: LABEL
  };
})();
