<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Offline PMP exam preparation. Single file, no network, no install.">
<title>PMP Prep Suite</title>

<!-- ═══ §01  CONFIG & CONSTANTS ══════════════════════════════════════════════
     Runs before paint. Nothing here touches the DOM except the theme attribute
     on <html>, which must be set before first paint or a dark-mode user gets a
     white flash. This is the only script in <head>.
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
"use strict";
var PMP = window.PMP = {};

/* ── 01.1  ECO ──────────────────────────────────────────────────────────────
   PMP Examination Content Outline, July 2026. Retrieved 2026-08-04.
   26 tasks: People 8, Process 10, Business Environment 8.
   Update ECO_VERSION, DOMAIN_WEIGHTS, APPROACH_SPLIT and ECO_TASKS (§05.1)
   together; nothing else in the file hard-codes these figures. */
PMP.ECO = Object.freeze({
  VERSION: "2026-07",
  LABEL: "PMI Examination Content Outline, July 2026",
  RETRIEVED: "2026-08-04",
  TASK_COUNT: 26,
  DOMAINS: Object.freeze(["people", "process", "business"]),
  DOMAIN_LABELS: Object.freeze({
    people: "People",
    process: "Process",
    business: "Business Environment"
  }),
  DOMAIN_WEIGHTS: Object.freeze({ people: 0.33, process: 0.41, business: 0.26 }),
  DOMAIN_TASK_COUNTS: Object.freeze({ people: 8, process: 10, business: 8 }),
  /* PMI publishes 40% predictive / 60% adaptive+hybrid and does not break the
     60% down further. The 35/25 sub-split is this build's assumption. */
  APPROACH_SPLIT: Object.freeze({ predictive: 0.40, agile: 0.35, hybrid: 0.25 }),
  APPROACH_LABELS: Object.freeze({
    predictive: "Predictive", agile: "Adaptive / agile", hybrid: "Hybrid"
  })
});

/* ── 01.2  EXAM LAYOUT ──────────────────────────────────────────────────────
   180 items, 170 scored + 10 pretest, 240 minutes.
   PMI does not publish the size of the case-study block, so CASE_BLOCK_ITEMS
   is an approximation and is surfaced as such in the About panel.
   Breaks are derived from the layout, never hard-coded question numbers. */
PMP.EXAM = Object.freeze({
  TOTAL_ITEMS: 180,
  SCORED_ITEMS: 170,
  PRETEST_ITEMS: 10,
  MINUTES: 240,
  BREAK_MINUTES: 10,
  BREAK_COUNT: 2,
  CASE_BLOCK_ITEMS: 40,          /* assumption — see About */
  CASE_BLOCK_ASSUMED: true,
  PACE_TARGET_SEC: 240 * 60 / 180,   /* 80.0 s */
  get BREAK_1_AFTER() { return this.CASE_BLOCK_ITEMS; },
  get BREAK_2_AFTER() {
    var rest = this.TOTAL_ITEMS - this.CASE_BLOCK_ITEMS;
    return this.CASE_BLOCK_ITEMS + Math.round(rest / 2);
  }
});

/* ── 01.3  READINESS WEIGHTS ── consumed by §10.01. Must sum to 100. ──────── */
PMP.READINESS = Object.freeze({
  WEIGHTS: Object.freeze({
    accuracy: 35, coverage: 20, mocks: 25, pace: 10, habit: 10
  }),
  ACCURACY_HALFLIFE_DAYS: 21,
  ACCURACY_FLOOR: 0.05,
  ACCURACY_PRIOR: 0.50,
  ACCURACY_PRIOR_N: 8,
  ACCURACY_WINDOW: 400,
  ACCURACY_MIN: 0.40, ACCURACY_MAX: 0.85,
  COVERAGE_TARGET_PER_TASK: 5,
  MOCK_WEIGHTS: Object.freeze([0.50, 0.30, 0.20]),
  MOCK_MIN: 0.45, MOCK_MAX: 0.80,
  MOCK_STALE_AFTER_DAYS: 45, MOCK_STALE_HALFLIFE: 90, MOCK_STALE_FLOOR: 0.5,
  PACE_BAND: Object.freeze([45, 80]), PACE_SLOW_ZERO: 130, PACE_FAST_ZERO: 15,
  PACE_MIN_SAMPLE: 30,
  HABIT_WINDOW_DAYS: 14, HABIT_TARGET_DAYS: 10,
  GATE_ITEMS: 100, GATE_TASKS: 15
});

/* ── 01.4  SPACED REPETITION (SM-2) ── consumed by §10.05 ────────────────── */
PMP.SRS = Object.freeze({
  EASE_START: 2.5, EASE_MIN: 1.3,
  GRADES: Object.freeze(["again", "hard", "good", "easy"]),
  LEECH_THRESHOLD: 6
});

/* ── 01.5  STORAGE ─────────────────────────────────────────────────────────
   PERSISTED lists every store slice written to disk. Anything absent is
   session-only by design (see §07.1). */
PMP.STORE_CFG = Object.freeze({
  SCHEMA_VERSION: 2,
  NS: "pmp.v2.",
  PROBE_KEY: "pmp.probe",
  DEBOUNCE_MS: 500,
  IDB_NAME: "pmp-prep-suite",
  IDB_STORE: "kv",
  IDB_TIMEOUT_MS: 2000,
  PRUNE_KEEP_ATTEMPTS: 1000,
  PERSISTED: Object.freeze([
    "settings", "attempts", "srs", "exams", "notes", "flags", "journal", "planner",
    "issues"
  ])
});

/* ── 01.6  THEME, PRE-PAINT ─────────────────────────────────────────────────
   Storage may throw here (file:// opaque origin). It is caught, and the file
   still renders — it simply falls back to the OS preference. */
(function () {
  var stored = null;
  try { stored = window.localStorage.getItem("pmp.theme"); } catch (e) { stored = null; }
  var theme = (stored === "light" || stored === "dark") ? stored : null;
  if (!theme) {
    var mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)");
    theme = (mq && mq.matches) ? "light" : "dark";
  }
  document.documentElement.setAttribute("data-theme", theme);
  PMP.INITIAL_THEME = theme;
  PMP.THEME_PREF = stored || "system";
})();

/* ── 01.7  PRACTICE / DRILL ──────────────────────────────────────────────
   PACE_TARGET_SEC is 76 s, not the 80.0 s that falls out of EXAM.PACE_TARGET_SEC
   (240 minutes over 180 items). The exam figure spends every available second
   on items. A drill target four seconds tighter banks 180 × 4 s ≈ 12 minutes
   across a full sitting, which is the reserve the flagged-item pass at the end
   has to come out of. Practising at the exam average leaves no such reserve.
   The two are deliberately separate constants: the mock exam simulator in
   §10.03 clocks at EXAM.PACE_TARGET_SEC, and only drills use this one. */
PMP.PRACTICE = Object.freeze({
  PACE_TARGET_SEC: 76,
  PACE_OVER_RATIO: 1.6,          /* elapsed ÷ target at which the meter goes red */
  LENGTHS: Object.freeze([5, 10, 20, 40]),
  DEFAULT_LENGTH: 10,
  DEFAULT_MODE: "practice",
  /* Adaptive weighting, consumed by §10.02.2. PRIOR and PRIOR_N stop a task
     with two attempts against it from reading as settled evidence; EXPONENT
     sharpens the pull towards weak tasks; the two multipliers favour items
     never seen and hold back ones answered correctly last time. */
  ADAPTIVE: Object.freeze({
    PRIOR: 0.5, PRIOR_N: 4, EXPONENT: 1.5, FLOOR: 0.05,
    UNSEEN_BOOST: 1.4, RIGHT_DAMP: 0.5
  })
});
</script>

<style>
/* ═══ §02  DESIGN TOKENS ═══════════════════════════════════════════════════
   Six named colours. Every other value in the file derives from this block.
   Discipline rule: --c-signal is reserved for focus, selection and active
   navigation. It is never used as an answer-state fill, so cyan and the
   --c-go teal never compete inside the navigator grid.
   ═════════════════════════════════════════════════════════════════════════ */

:root {
  /* ── 02.1  PALETTE (light) ───────────────────────────────────────────── */
  --c-ground:  #EDF1F5;
  --c-panel:   #FFFFFF;
  --c-signal:  #0B7A91;
  --c-go:      #0E7A57;
  --c-warn:    #9A6510;
  --c-danger:  #B3382A;

  /* ── 02.2  SURFACE RAMP — tints of the ground hue (214°) ─────────────── */
  --s-sunk:    #E2E8EF;
  --s-base:    var(--c-ground);
  --s-raise:   var(--c-panel);
  --s-edge:    #C7D3DF;
  --s-edge-hi: #A7B8C8;
  --s-wash:    rgba(11, 122, 145, 0.08);

  /* ── 02.3  FOREGROUND ────────────────────────────────────────────────── */
  --fg:        #101A24;
  --fg-muted:  #52657A;
  --fg-faint:  #7C8FA2;   /* 3.3:1 — icons and disabled only, never body copy */
  --fg-on-acc: #FFFFFF;

  /* ── 02.4  STATE FILLS — always rendered with a glyph ────────────────── */
  --st-correct-bg:   #DCF2E8;  --st-correct-fg:   #0E7A57;
  --st-incorrect-bg: #FBE3E0;  --st-incorrect-fg: #B3382A;
  --st-flagged-bg:   #FBEED4;  --st-flagged-fg:   #9A6510;
  --st-answered-bg:  #D4E4EC;  --st-answered-fg:  #23566B;
  --st-unseen-bg:    #E2E8EF;  --st-unseen-fg:    #7C8FA2;

  /* ── 02.5  TYPE ──────────────────────────────────────────────────────── */
  --font-ui: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
             Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
             "Liberation Mono", "Courier New", monospace;

  --t-xs:   0.75rem;
  --t-sm:   0.875rem;
  --t-base: 1rem;
  --t-md:   1.0625rem;
  --t-lg:   1.375rem;
  --t-xl:   1.75rem;
  --t-2xl:  2.5rem;
  --t-3xl:  3.5rem;

  --lh-tight: 1.15;
  --lh-snug:  1.35;
  --lh-body:  1.6;
  --ls-cap:   0.06em;

  --w-reg: 400; --w-med: 500; --w-semi: 600; --w-bold: 700;

  /* ── 02.6  SPACE ─────────────────────────────────────────────────────── */
  --sp-0: 2px;  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px;
  --sp-4: 16px; --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 64px;
  --hit-min: 44px;
  --measure: 68ch;
  --rail-w: 232px;

  /* ── 02.7  RADIUS ────────────────────────────────────────────────────── */
  --r-0: 0; --r-1: 3px; --r-2: 6px; --r-3: 10px; --r-4: 16px; --r-full: 999px;

  /* ── 02.8  EDGE & LIFT ───────────────────────────────────────────────── */
  --border:    1px solid var(--s-edge);
  --border-hi: 1px solid var(--s-edge-hi);
  --lift-1: 0 1px 0 rgba(16, 26, 36, 0.04), 0 1px 2px rgba(16, 26, 36, 0.06);
  --lift-2: 0 1px 0 rgba(16, 26, 36, 0.05), 0 6px 16px rgba(16, 26, 36, 0.10);
  --scrim:  rgba(6, 12, 18, 0.55);
  --ring-w: 2px;
  --ring: 0 0 0 var(--ring-w) var(--s-base), 0 0 0 calc(var(--ring-w) * 2) var(--c-signal);

  /* Icon sizes. Not one of the four scales, but named because §03 uses them
     in eleven places and they must stay in step with --hit-min. */
  --icon-sm: 14px; --icon: 18px; --icon-lg: 20px; --icon-xl: 24px;

  /* ── 02.9  MOTION ────────────────────────────────────────────────────── */
  --dur-1: 90ms; --dur-2: 160ms; --dur-3: 240ms;
  --ease: cubic-bezier(0.2, 0.6, 0.2, 1);
}

/* ── 02.10  DARK THEME ─────────────────────────────────────────────────── */
:root[data-theme="dark"] {
  --c-ground:  #0E1620;
  --c-panel:   #182430;
  --c-signal:  #38BDD8;
  --c-go:      #3FBF8F;
  --c-warn:    #E8A33D;
  --c-danger:  #F0705E;

  --s-sunk:    #0A1017;
  --s-edge:    #27384A;
  --s-edge-hi: #3A5068;
  --s-wash:    rgba(56, 189, 216, 0.10);

  --fg:        #E3EBF3;
  --fg-muted:  #93A7BB;
  --fg-faint:  #6A7E93;
  --fg-on-acc: #08121A;

  --st-correct-bg:   #10302A;  --st-correct-fg:   #3FBF8F;
  --st-incorrect-bg: #331B18;  --st-incorrect-fg: #F0705E;
  --st-flagged-bg:   #33270F;  --st-flagged-fg:   #E8A33D;
  --st-answered-bg:  #102A35;  --st-answered-fg:  #7FC9DC;
  --st-unseen-bg:    #1B2733;  --st-unseen-fg:    #6A7E93;

  --lift-1: 0 1px 0 rgba(0, 0, 0, 0.30);
  --lift-2: 0 1px 0 rgba(0, 0, 0, 0.35), 0 8px 20px rgba(0, 0, 0, 0.45);
  --scrim:  rgba(2, 6, 10, 0.70);
}

/* ── 02.11  REDUCED MOTION ─────────────────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  :root { --dur-1: 0ms; --dur-2: 0ms; --dur-3: 0ms; }
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

/* ═══ §03  COMPONENT STYLES ═══════════════════════════════════════════════ */

/* ── 03.1  RESET & BASE ─────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-ui);
  font-size: var(--t-base);
  line-height: var(--lh-snug);
  color: var(--fg);
  background: var(--s-base);
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  overflow-wrap: break-word;
}
h1, h2, h3, h4, p, figure, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
a { color: var(--c-signal); text-decoration-thickness: 1px; text-underline-offset: 2px; }
svg { display: block; }
[hidden] { display: none !important; }

/* Every clock, score and measured figure. Digits must not jitter. */
.num, .clock, .score, .pace, .stat-v, .navgrid { font-variant-numeric: tabular-nums; }

:focus { outline: none; }
:focus-visible {
  outline: none;
  box-shadow: var(--ring);
}
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip {
  position: absolute; left: var(--sp-2); top: -100px; z-index: 90;
  padding: var(--sp-3) var(--sp-4); background: var(--c-signal);
  color: var(--fg-on-acc); border-radius: var(--r-2); font-weight: var(--w-semi);
}
.skip:focus { top: var(--sp-2); }

/* ── 03.2  PRIMITIVES ───────────────────────────────────────────────────── */

/* Micro-label. Mono + tracking is the instrument-panel voice of this UI. */
.eyebrow {
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  letter-spacing: var(--ls-cap);
  text-transform: uppercase;
  color: var(--fg-muted);
  font-weight: var(--w-med);
}

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: var(--sp-2);
  min-height: var(--hit-min); padding: 0 var(--sp-4);
  border: var(--border-hi); border-radius: var(--r-2);
  background: var(--s-raise); color: var(--fg);
  font-size: var(--t-sm); font-weight: var(--w-semi);
  transition: background var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease);
}
.btn:hover { background: var(--s-sunk); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.btn--primary {
  background: var(--c-signal); border-color: var(--c-signal); color: var(--fg-on-acc);
}
.btn--primary:hover { background: var(--c-signal); filter: brightness(1.08); }
.btn--danger { border-color: var(--c-danger); color: var(--c-danger); }
.btn--ghost { border-color: transparent; background: transparent; }
.btn--ghost:hover { background: var(--s-sunk); }
.btn--sm { min-height: 36px; padding: 0 var(--sp-2); font-size: var(--t-xs); }
.btn--block { width: 100%; }
.btn .i { width: var(--icon); height: var(--icon); flex: 0 0 var(--icon); }

.field { display: block; margin-bottom: var(--sp-4); }
.field > .lbl {
  display: block; margin-bottom: var(--sp-1);
  font-size: var(--t-sm); font-weight: var(--w-med); color: var(--fg-muted);
}
.input, .select, .textarea {
  width: 100%; min-height: var(--hit-min);
  padding: var(--sp-2) var(--sp-3);
  background: var(--s-sunk); color: var(--fg);
  border: var(--border); border-radius: var(--r-2);
}
.textarea { min-height: 160px; font-family: var(--font-mono); font-size: var(--t-xs); line-height: 1.5; resize: vertical; }
.input:focus-visible, .select:focus-visible, .textarea:focus-visible { border-color: var(--c-signal); }
.hint { margin-top: var(--sp-1); font-size: var(--t-xs); color: var(--fg-muted); }

.chip {
  display: inline-flex; align-items: center; gap: var(--sp-1);
  padding: var(--sp-1) var(--sp-2);
  border: var(--border); border-radius: var(--r-1);
  background: var(--s-sunk); color: var(--fg-muted);
  font-size: var(--t-xs); font-weight: var(--w-med);
}
.chip .i { width: var(--icon-sm); height: var(--icon-sm); }
.chip--correct   { background: var(--st-correct-bg);   color: var(--st-correct-fg);   border-color: currentColor; }
.chip--incorrect { background: var(--st-incorrect-bg); color: var(--st-incorrect-fg); border-color: currentColor; }
.chip--flagged   { background: var(--st-flagged-bg);   color: var(--st-flagged-fg);   border-color: currentColor; }
.chip--answered  { background: var(--st-answered-bg);  color: var(--st-answered-fg);  border-color: currentColor; }

.card {
  background: var(--s-raise); border: var(--border);
  border-radius: var(--r-3); padding: var(--sp-5);
  box-shadow: var(--lift-1);
}
.card + .card { margin-top: var(--sp-4); }
.card > h2 { font-size: var(--t-lg); font-weight: var(--w-semi); line-height: var(--lh-tight); }
.card > .eyebrow + h2 { margin-top: var(--sp-1); }
.card > p { margin-top: var(--sp-2); color: var(--fg-muted); font-size: var(--t-sm); line-height: var(--lh-body); max-width: var(--measure); }

.grid { display: grid; gap: var(--sp-4); }
.rule { height: 1px; background: var(--s-edge); border: 0; margin: var(--sp-5) 0; }

.stat { display: flex; flex-direction: column; gap: var(--sp-1); }
.stat-k { font-family: var(--font-mono); font-size: var(--t-xs); letter-spacing: var(--ls-cap); text-transform: uppercase; color: var(--fg-muted); }
.stat-v { font-size: var(--t-2xl); font-weight: var(--w-semi); line-height: var(--lh-tight); }

/* ── 03.3  APP FRAME ────────────────────────────────────────────────────── */
.app { display: flex; min-height: 100%; }

.rail {
  position: fixed; inset: 0 auto 0 0; z-index: 40;
  width: min(86vw, var(--rail-w));
  display: flex; flex-direction: column;
  background: var(--s-raise); border-right: var(--border);
  transform: translateX(-100%);
  transition: transform var(--dur-2) var(--ease);
  overscroll-behavior: contain;
}
.rail[data-open="true"] { transform: translateX(0); box-shadow: var(--lift-2); }

.brand {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-4); border-bottom: var(--border); flex: 0 0 auto;
}
.brand .mark {
  width: 32px; height: 32px; flex: 0 0 32px; border-radius: var(--r-2);
  background: var(--s-wash); border: 1px solid var(--c-signal);
  display: grid; place-items: center; color: var(--c-signal);
}
.brand .mark .i { width: var(--icon); height: var(--icon); }
.brand-t { font-size: var(--t-sm); font-weight: var(--w-semi); line-height: 1.2; }
.brand-s { font-family: var(--font-mono); font-size: 10px; letter-spacing: var(--ls-cap); text-transform: uppercase; color: var(--fg-muted); }

.nav { flex: 1 1 auto; overflow-y: auto; padding: var(--sp-3) var(--sp-2) var(--sp-5); }
.nav-grp { margin-top: var(--sp-4); }
.nav-grp:first-child { margin-top: 0; }
.nav-grp > .eyebrow { padding: var(--sp-2) var(--sp-3) var(--sp-1); display: block; }
.nav-i {
  display: flex; align-items: center; gap: var(--sp-3);
  width: 100%; min-height: var(--hit-min);
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--r-2);
  color: var(--fg-muted); font-size: var(--t-sm); font-weight: var(--w-med);
  text-align: left; text-decoration: none;
  border-left: 2px solid transparent;
  transition: background var(--dur-1) var(--ease), color var(--dur-1) var(--ease);
}
.nav-i:hover { background: var(--s-sunk); color: var(--fg); }
.nav-i .i { width: var(--icon); height: var(--icon); flex: 0 0 var(--icon); color: var(--fg-faint); }
.nav-i[aria-current="page"] {
  background: var(--s-wash); color: var(--fg);
  font-weight: var(--w-semi); border-left-color: var(--c-signal);
}
.nav-i[aria-current="page"] .i { color: var(--c-signal); }
.nav-i .badge {
  margin-left: auto; font-family: var(--font-mono); font-size: 11px;
  padding: 1px var(--sp-1); border-radius: var(--r-1);
  background: var(--s-sunk); color: var(--fg-muted);
}

.rail-foot { flex: 0 0 auto; padding: var(--sp-3); border-top: var(--border); display: flex; gap: var(--sp-2); }
.rail-foot .btn { flex: 1 1 0; min-width: 0; }

.scrim {
  position: fixed; inset: 0; z-index: 35;
  background: var(--scrim);
  opacity: 0; pointer-events: none;
  transition: opacity var(--dur-2) var(--ease);
}
.scrim[data-open="true"] { opacity: 1; pointer-events: auto; }

.main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: var(--sp-2);
  min-height: 56px; padding: var(--sp-2) var(--sp-3);
  background: var(--s-raise); border-bottom: var(--border);
  padding-top: max(var(--sp-2), env(safe-area-inset-top));
}
.topbar h1 {
  font-size: var(--t-base); font-weight: var(--w-semi);
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.icon-btn {
  display: grid; place-items: center;
  width: var(--hit-min); height: var(--hit-min); flex: 0 0 var(--hit-min);
  border-radius: var(--r-2); color: var(--fg-muted);
}
.icon-btn:hover { background: var(--s-sunk); color: var(--fg); }
.icon-btn .i { width: var(--icon-lg); height: var(--icon-lg); }
.topbar .spacer { flex: 1 1 auto; }
.mode-tag {
  display: inline-flex; align-items: center; gap: var(--sp-1);
  font-family: var(--font-mono); font-size: var(--t-xs);
  letter-spacing: var(--ls-cap); text-transform: uppercase;
  color: var(--fg-muted); padding: var(--sp-1) var(--sp-2);
  border: var(--border); border-radius: var(--r-1);
}
.mode-tag .dot { width: 7px; height: 7px; border-radius: var(--r-full); background: var(--c-go); }
.mode-tag[data-mode="session"] .dot { background: var(--c-warn); }
.mode-tag[data-mode="probing"] .dot { background: var(--fg-faint); }
@media (max-width: 599px) {
  /* The dot and its accessible name carry the meaning; the words do not fit. */
  #mode-text {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
  .mode-tag { padding: var(--sp-1); }
}

.view {
  flex: 1 1 auto; padding: var(--sp-5) var(--sp-4) var(--sp-8);
  max-width: 1120px; width: 100%; margin: 0 auto;
  padding-bottom: max(var(--sp-8), env(safe-area-inset-bottom));
}
.view-hd { margin-bottom: var(--sp-5); }
.view-hd h2 { font-size: var(--t-xl); font-weight: var(--w-semi); line-height: var(--lh-tight); margin-top: var(--sp-1); }
.view-hd p { margin-top: var(--sp-2); color: var(--fg-muted); font-size: var(--t-md); line-height: var(--lh-body); max-width: var(--measure); }

/* ── 03.4  BANNER, TOAST, DIALOG, EMPTY ─────────────────────────────────── */
.banner {
  display: flex; align-items: flex-start; gap: var(--sp-3); flex-wrap: wrap;
  padding: var(--sp-3) var(--sp-4);
  background: var(--st-flagged-bg); color: var(--st-flagged-fg);
  border-bottom: 1px solid currentColor;
}
.banner .i { width: var(--icon-lg); height: var(--icon-lg); flex: 0 0 var(--icon-lg); margin-top: var(--sp-0); }
.banner-b { flex: 1 1 min(100%, 220px); min-width: 0; }
.banner-t { font-weight: var(--w-semi); font-size: var(--t-sm); }
.banner-d { margin-top: var(--sp-1); font-size: var(--t-sm); line-height: var(--lh-body); color: var(--fg); }
.banner .btn { flex: 0 0 auto; align-self: center; background: var(--s-raise); }
.banner--danger { background: var(--st-incorrect-bg); color: var(--st-incorrect-fg); }

.toasts {
  position: fixed; z-index: 70; left: 50%; transform: translateX(-50%);
  bottom: max(var(--sp-4), env(safe-area-inset-bottom));
  width: min(480px, calc(100vw - var(--sp-6)));
  display: flex; flex-direction: column; gap: var(--sp-2);
  pointer-events: none;
}
.toast {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  background: var(--s-raise); border: var(--border-hi);
  border-radius: var(--r-3); box-shadow: var(--lift-2);
  font-size: var(--t-sm); pointer-events: auto;
  animation: rise var(--dur-3) var(--ease);
}
.toast .i { width: var(--icon); height: var(--icon); flex: 0 0 var(--icon); }
.toast--ok   { border-color: var(--c-go); }
.toast--ok .i   { color: var(--c-go); }
.toast--warn { border-color: var(--c-warn); }
.toast--warn .i { color: var(--c-warn); }
.toast--err  { border-color: var(--c-danger); }
.toast--err .i  { color: var(--c-danger); }
.toast .x { margin-left: auto; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

dialog.sheet {
  width: min(560px, calc(100vw - var(--sp-5)));
  max-height: min(80vh, 720px);
  padding: 0; border: var(--border-hi); border-radius: var(--r-4);
  background: var(--s-raise); color: var(--fg); box-shadow: var(--lift-2);
  overflow: hidden;
}
dialog.sheet::backdrop { background: var(--scrim); }
.sheet-hd { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-4) var(--sp-5); border-bottom: var(--border); }
.sheet-hd h2 { font-size: var(--t-lg); font-weight: var(--w-semi); flex: 1 1 auto; }
.sheet-bd { padding: var(--sp-5); overflow-y: auto; max-height: 56vh; }
.sheet-bd p { font-size: var(--t-sm); line-height: var(--lh-body); color: var(--fg-muted); }
.sheet-bd p + p { margin-top: var(--sp-3); }
.sheet-ft { display: flex; gap: var(--sp-2); justify-content: flex-end; flex-wrap: wrap; padding: var(--sp-4) var(--sp-5); border-top: var(--border); background: var(--s-sunk); }

.empty {
  display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-3);
  padding: var(--sp-6) var(--sp-5);
  border: 1px dashed var(--s-edge-hi); border-radius: var(--r-3);
  background: var(--s-raise);
}
.empty .i { width: var(--icon-xl); height: var(--icon-xl); color: var(--fg-faint); }
.empty h3 { font-size: var(--t-base); font-weight: var(--w-semi); }
.empty p { font-size: var(--t-sm); color: var(--fg-muted); line-height: var(--lh-body); max-width: var(--measure); }

.kv { display: grid; grid-template-columns: max-content 1fr; gap: var(--sp-2) var(--sp-4); font-size: var(--t-sm); }
.kv dt { color: var(--fg-muted); }
.kv dd { margin: 0; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ── 03.5  NAVIGATOR GRID — the signature element ───────────────────────── */
.navgrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(30px, 1fr));
  gap: var(--sp-1);
}
.navgrid-c {
  position: relative;
  aspect-ratio: 1; min-height: 30px;
  display: grid; place-items: center;
  border: 1px solid var(--s-edge); border-radius: var(--r-1);
  background: var(--st-unseen-bg); color: var(--st-unseen-fg);
  font-family: var(--font-mono); font-size: 11px; font-weight: var(--w-med);
}
.navgrid-c[data-st="answered"] { background: var(--st-answered-bg); color: var(--st-answered-fg); border-color: currentColor; }
.navgrid-c[data-st="flagged"]  { background: var(--st-flagged-bg);  color: var(--st-flagged-fg);  border-color: currentColor; }
.navgrid-c[data-st="correct"]  { background: var(--st-correct-bg);  color: var(--st-correct-fg);  border-color: currentColor; }
.navgrid-c[data-st="incorrect"]{ background: var(--st-incorrect-bg);color: var(--st-incorrect-fg);border-color: currentColor; }
/* Shape, not only hue: every state carries a corner glyph. */
.navgrid-c::after {
  content: ""; position: absolute; right: 2px; top: 2px;
  width: 8px; height: 8px; border: 1.5px solid currentColor;
}
.navgrid-c[data-st="unseen"]::after   { border-radius: var(--r-full); border-style: dotted; }
.navgrid-c[data-st="answered"]::after { border-radius: var(--r-full); background: currentColor; }
.navgrid-c[data-st="flagged"]::after  { border: 0; background: currentColor; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.navgrid-c[data-st="correct"]::after  { border: 0; background: currentColor; clip-path: polygon(0 52%, 18% 34%, 40% 56%, 82% 6%, 100% 24%, 40% 100%); }
.navgrid-c[data-st="incorrect"]::after{ border: 0; background: currentColor; clip-path: polygon(76% 0, 100% 24%, 24% 100%, 0 76%); }

.legend { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); margin-top: var(--sp-4); }

/* ── 03.6  RESERVED (stub view scaffolding) ─────────────────────────────── */
.stub-list { display: grid; gap: var(--sp-2); margin-top: var(--sp-4); }
.stub-list li { display: flex; gap: var(--sp-3); align-items: baseline; font-size: var(--t-sm); color: var(--fg-muted); line-height: var(--lh-body); }
.stub-list .ref { font-family: var(--font-mono); font-size: var(--t-xs); color: var(--c-signal); flex: 0 0 auto; }

/* ── 03.7  QUESTION ENGINE ──────────────────────────────────────────────────
   Filters, the item card, the five renderers and the pace meter. Answer state
   is carried by a border and a glyph as well as a fill, on the same rule as
   the navigator grid in 03.5: --c-signal stays reserved for focus and
   selection, so a selected option and a correct option never share a hue. */

/* Filters ── §3.2 */
.filters {
  display: grid; gap: var(--sp-3);
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  margin-top: var(--sp-4);
}
.filters .field { margin-bottom: 0; }
.filter-bar {
  display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap;
  margin-top: var(--sp-5); padding-top: var(--sp-4); border-top: var(--border);
}
.filter-bar .spacer { flex: 1 1 auto; }
.pool-n { font-family: var(--font-mono); font-size: var(--t-sm); color: var(--fg-muted); }
.pool-n b { color: var(--fg); font-size: var(--t-lg); font-weight: var(--w-semi); }

/* Mode picker ── §3.2. [data-sel] rather than :has(), so the file does not
   depend on a selector that older offline browsers may not support. */
.modes { display: grid; gap: var(--sp-2); margin-top: var(--sp-4); }
.mode-opt {
  display: flex; gap: var(--sp-3); align-items: flex-start;
  padding: var(--sp-3) var(--sp-4); min-height: var(--hit-min);
  border: var(--border-hi); border-radius: var(--r-2);
  background: var(--s-raise); cursor: pointer;
}
.mode-opt:hover { background: var(--s-sunk); }
.mode-opt:focus-within { box-shadow: var(--ring); }
.mode-opt input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.mode-opt[data-sel="true"] { border-color: var(--c-signal); background: var(--s-wash); }
.mode-opt .i { width: var(--icon-lg); height: var(--icon-lg); flex: 0 0 var(--icon-lg); color: var(--fg-faint); margin-top: var(--sp-0); }
.mode-opt[data-sel="true"] .i { color: var(--c-signal); }
.mode-opt .t { font-size: var(--t-sm); font-weight: var(--w-semi); }
.mode-opt .d { margin-top: var(--sp-1); font-size: var(--t-xs); color: var(--fg-muted); line-height: var(--lh-body); }

/* Drill header ── progress, clock, pace */
.drill-hd { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-4); }
.drill-hd .spacer { flex: 1 1 auto; }
.progress { flex: 0 1 220px; min-width: 90px; height: 6px; border-radius: var(--r-full); background: var(--s-sunk); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--c-signal); transition: width var(--dur-2) var(--ease); }

.pace { display: inline-flex; align-items: center; gap: var(--sp-2); }
.pace .bar { width: 64px; height: 6px; border-radius: var(--r-full); background: var(--s-sunk); overflow: hidden; }
.pace .bar > i { display: block; height: 100%; width: 0; background: var(--c-go); }
.pace .clock { font-family: var(--font-mono); font-size: var(--t-sm); color: var(--fg-muted); }
.pace[data-state="warn"] .bar > i { background: var(--c-warn); }
.pace[data-state="warn"] .clock { color: var(--st-flagged-fg); }
.pace[data-state="over"] .bar > i { background: var(--c-danger); }
.pace[data-state="over"] .clock { color: var(--st-incorrect-fg); font-weight: var(--w-semi); }

/* Item card */
.q-meta { display: flex; gap: var(--sp-2); flex-wrap: wrap; align-items: center; }
.q-stem { margin-top: var(--sp-4); font-size: var(--t-md); line-height: var(--lh-body); max-width: var(--measure); }
.q-instr { margin-top: var(--sp-3); font-size: var(--t-sm); color: var(--fg-muted); font-weight: var(--w-med); }

/* Options ── single and multi */
.opts { display: grid; gap: var(--sp-2); margin-top: var(--sp-4); border: 0; padding: 0; margin-inline: 0; }
.opt {
  position: relative; display: flex; gap: var(--sp-3); align-items: flex-start;
  padding: var(--sp-3) var(--sp-4); min-height: var(--hit-min);
  border: var(--border-hi); border-radius: var(--r-2);
  background: var(--s-raise); cursor: pointer;
  transition: background var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease);
}
.opt:hover { background: var(--s-sunk); }
.opt:focus-within { box-shadow: var(--ring); }
.opt input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.opt .key {
  flex: 0 0 24px; height: 24px; display: grid; place-items: center;
  border: var(--border-hi); border-radius: var(--r-1);
  font-family: var(--font-mono); font-size: var(--t-xs); color: var(--fg-muted);
}
.opt .txt { flex: 1 1 auto; min-width: 0; font-size: var(--t-sm); line-height: var(--lh-body); }
.opt .mark { flex: 0 0 var(--icon); width: var(--icon); height: var(--icon); margin-top: var(--sp-0); }
.opt[data-sel="true"] { border-color: var(--c-signal); background: var(--s-wash); }
.opt[data-sel="true"] .key { border-color: var(--c-signal); color: var(--c-signal); font-weight: var(--w-bold); }
.opt[data-mark] { cursor: default; }
.opt[data-mark="correct"]   { border-color: var(--st-correct-fg);   background: var(--st-correct-bg); }
.opt[data-mark="correct"] .mark, .opt[data-mark="correct"] .key { color: var(--st-correct-fg); }
.opt[data-mark="incorrect"] { border-color: var(--st-incorrect-fg); background: var(--st-incorrect-bg); }
.opt[data-mark="incorrect"] .mark, .opt[data-mark="incorrect"] .key { color: var(--st-incorrect-fg); }
.opt[data-mark="missed"]    { border-color: var(--st-flagged-fg);   background: var(--st-flagged-bg); }
.opt[data-mark="missed"] .mark, .opt[data-mark="missed"] .key { color: var(--st-flagged-fg); }
.why { margin-top: var(--sp-2); font-size: var(--t-xs); line-height: var(--lh-body); color: var(--fg-muted); }
.why b { color: var(--fg); font-weight: var(--w-semi); }

/* Matching and drop-down */
.match { display: grid; gap: var(--sp-2); margin-top: var(--sp-4); }
.match-row {
  display: grid; gap: var(--sp-2); align-items: center;
  padding: var(--sp-3) var(--sp-4);
  border: var(--border); border-radius: var(--r-2); background: var(--s-raise);
}
.match-row .prompt { font-size: var(--t-sm); line-height: var(--lh-body); }
.match-row .select { max-width: 100%; }
.match-row[data-mark="correct"]   { border-color: var(--st-correct-fg);   background: var(--st-correct-bg); }
.match-row[data-mark="incorrect"] { border-color: var(--st-incorrect-fg); background: var(--st-incorrect-bg); }
@media (min-width: 700px) {
  .match-row { grid-template-columns: 1fr minmax(180px, 38%); }
  .match-row .why { grid-column: 1 / -1; }
}

/* Hotspot and graphic */
.hotspot { margin-top: var(--sp-4); padding: var(--sp-3); border: var(--border); border-radius: var(--r-3); background: var(--s-sunk); }
.hotspot svg { width: 100%; height: auto; max-width: 680px; margin: 0 auto; }
.hotspot .cap { margin-top: var(--sp-2); font-size: var(--t-xs); color: var(--fg-muted); text-align: center; }
.hot { cursor: pointer; }
.hot .box { fill: var(--s-raise); stroke: var(--s-edge-hi); stroke-width: 1.5; }
.hot:hover .box { fill: var(--s-wash); }
.hot .lab { fill: var(--fg); font-family: var(--font-ui); font-size: 12px; font-weight: 500; pointer-events: none; }
.hot .num { fill: var(--fg-faint); font-family: var(--font-mono); font-size: 10px; pointer-events: none; }
.hot:focus-visible { outline: none; }
.hot:focus-visible .box { stroke: var(--c-signal); stroke-width: 3; stroke-dasharray: 5 3; }
.hot[data-sel="true"] .box { fill: var(--s-wash); stroke: var(--c-signal); stroke-width: 2.5; }
.hot[data-mark="correct"] .box   { fill: var(--st-correct-bg);   stroke: var(--st-correct-fg);   stroke-width: 2.5; }
.hot[data-mark="incorrect"] .box { fill: var(--st-incorrect-bg); stroke: var(--st-incorrect-fg); stroke-width: 2.5; }
.hot[data-mark="missed"] .box    { fill: var(--st-flagged-bg);   stroke: var(--st-flagged-fg);   stroke-width: 2.5; stroke-dasharray: 6 3; }
.flow { stroke: var(--s-edge-hi); stroke-width: 1.5; fill: none; }
.flow-h { fill: var(--s-edge-hi); }

/* Fill in the blank */
.blanks { display: grid; gap: var(--sp-3); margin-top: var(--sp-4); }
.blank { display: flex; gap: var(--sp-3); align-items: center; flex-wrap: wrap; padding: var(--sp-3) var(--sp-4); border: var(--border); border-radius: var(--r-2); background: var(--s-raise); }
.blank .lbl { flex: 1 1 220px; font-size: var(--t-sm); line-height: var(--lh-body); }
.blank .box { display: flex; align-items: center; gap: var(--sp-2); }
.blank .input { width: 150px; font-family: var(--font-mono); text-align: right; }
.blank .unit { font-family: var(--font-mono); font-size: var(--t-sm); color: var(--fg-muted); }
.blank[data-mark="correct"]   { border-color: var(--st-correct-fg);   background: var(--st-correct-bg); }
.blank[data-mark="incorrect"] { border-color: var(--st-incorrect-fg); background: var(--st-incorrect-bg); }
.blank .why { flex: 1 1 100%; }

/* Verdict and explanation */
.verdict {
  display: flex; gap: var(--sp-3); align-items: flex-start;
  margin-top: var(--sp-5); padding: var(--sp-3) var(--sp-4);
  border: 1px solid currentColor; border-radius: var(--r-2);
}
.verdict .i { width: var(--icon-lg); height: var(--icon-lg); flex: 0 0 var(--icon-lg); }
.verdict .t { font-weight: var(--w-semi); font-size: var(--t-sm); }
.verdict .d { margin-top: var(--sp-1); font-size: var(--t-sm); color: var(--fg); line-height: var(--lh-body); }
.verdict--right { background: var(--st-correct-bg);   color: var(--st-correct-fg); }
.verdict--part  { background: var(--st-flagged-bg);   color: var(--st-flagged-fg); }
.verdict--wrong { background: var(--st-incorrect-bg); color: var(--st-incorrect-fg); }
.explain { margin-top: var(--sp-4); font-size: var(--t-sm); line-height: var(--lh-body); max-width: var(--measure); }
.explain h3 { font-size: var(--t-xs); font-family: var(--font-mono); letter-spacing: var(--ls-cap); text-transform: uppercase; color: var(--fg-muted); margin-bottom: var(--sp-2); }

/* Item tools and footer */
.q-tools { display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap; margin-top: var(--sp-5); padding-top: var(--sp-4); border-top: var(--border); }
.q-tools .spacer { flex: 1 1 auto; }
.btn[data-on="true"] { border-color: var(--st-flagged-fg); background: var(--st-flagged-bg); color: var(--st-flagged-fg); }
.q-note { margin-top: var(--sp-3); padding: var(--sp-3) var(--sp-4); border-left: 2px solid var(--c-warn); background: var(--s-sunk); border-radius: var(--r-1); font-size: var(--t-sm); line-height: var(--lh-body); white-space: pre-wrap; }

/* Keyboard help */
.keylist { display: grid; gap: var(--sp-2); }
.keylist li { display: flex; gap: var(--sp-3); align-items: baseline; font-size: var(--t-sm); color: var(--fg-muted); }
.kbd {
  flex: 0 0 auto; font-family: var(--font-mono); font-size: 11px;
  padding: 2px var(--sp-1); min-width: 26px; text-align: center;
  border: var(--border-hi); border-bottom-width: 2px; border-radius: var(--r-1); color: var(--fg);
}

/* Summary */
.sum-grid { display: grid; gap: var(--sp-5); grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
.tbl { width: 100%; border-collapse: collapse; font-size: var(--t-sm); margin-top: var(--sp-3); }
.tbl th, .tbl td { text-align: left; padding: var(--sp-2); border-bottom: 1px solid var(--s-edge); }
.tbl th { font-family: var(--font-mono); font-size: var(--t-xs); letter-spacing: var(--ls-cap); text-transform: uppercase; color: var(--fg-muted); font-weight: var(--w-med); }
.tbl .n { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
.review { margin-top: var(--sp-3); border: var(--border); border-radius: var(--r-2); background: var(--s-raise); overflow: hidden; }
.review > summary { display: flex; gap: var(--sp-3); align-items: center; padding: var(--sp-3) var(--sp-4); min-height: var(--hit-min); cursor: pointer; font-size: var(--t-sm); }
.review > summary::-webkit-details-marker { display: none; }
.review > summary .n { font-family: var(--font-mono); font-size: var(--t-xs); color: var(--fg-muted); flex: 0 0 auto; }
.review > summary .s { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.review > summary:focus-visible { box-shadow: var(--ring); }
.review[open] > summary { border-bottom: var(--border); background: var(--s-sunk); }
.review-bd { padding: var(--sp-4); }

/* ── 03.8  RESPONSIVE ───────────────────────────────────────────────────── */
@media (min-width: 600px) {

/* ═══ §06  STORAGE ADAPTER ════════════════════════════════════════════════
   No feature module ever touches localStorage, IndexedDB or this object
   directly. §07 is the only caller. The API is async throughout so the three
   tiers are interchangeable.
   ═══════════════════════════════════════════════════════════════════════ */
PMP.Storage = (function () {
  var CFG = PMP.STORE_CFG;
  var tier = null;          /* "local" | "idb" | "memory" */
  var mode = "probing";     /* "probing" | "persistent" | "session" */
  var mem = Object.create(null);
  var idb = null;
  var listeners = [];

  function emit(evt, detail) {
    for (var i = 0; i < listeners.length; i++) {
      try { listeners[i](evt, detail); } catch (e) { /* a bad listener must not break a write */ }
    }
  }

  /* ── 06.1  PROBE ─────────────────────────────────────────────────────────
     A tier passes only if a value written can be read back and then removed.
     This catches the silent no-op case (Safari private mode historically, and
     some file:// sandboxes) as well as the throwing case. */
  function probeLocal() {
    try {
      var k = CFG.PROBE_KEY, v = "p" + Date.now();
      window.localStorage.setItem(k, v);
      if (window.localStorage.getItem(k) !== v) return false;
      window.localStorage.removeItem(k);
      return window.localStorage.getItem(k) === null;
    } catch (e) { return false; }
  }

  function openIDB() {
    /* IndexedDB.open can hang without resolving on an opaque file:// origin,
       so the open is raced against a timeout rather than awaited forever. */
    return new Promise(function (resolve) {
      var settled = false;
      function done(db) { if (!settled) { settled = true; resolve(db); } }
      var timer = setTimeout(function () { done(null); }, CFG.IDB_TIMEOUT_MS);
      try {
        if (!window.indexedDB) { clearTimeout(timer); return done(null); }
        var req = window.indexedDB.open(CFG.IDB_NAME, 1);
        req.onupgradeneeded = function () {
          try { req.result.createObjectStore(CFG.IDB_STORE); } catch (e) { /* exists */ }
        };
        req.onsuccess = function () { clearTimeout(timer); done(req.result); };
        req.onerror = function () { clearTimeout(timer); done(null); };
        req.onblocked = function () { clearTimeout(timer); done(null); };
      } catch (e) { clearTimeout(timer); done(null); }
    });
  }

  function idbOp(kind, key, value) {
    return new Promise(function (resolve, reject) {
      if (!idb) return reject(new Error("IndexedDB unavailable"));
      var tx, os, req;
      try {
        tx = idb.transaction(CFG.IDB_STORE, kind === "get" || kind === "keys" ? "readonly" : "readwrite");
        os = tx.objectStore(CFG.IDB_STORE);
        req = kind === "get" ? os.get(key)
            : kind === "set" ? os.put(value, key)
            : kind === "del" ? os.delete(key)
            : os.getAllKeys();
      } catch (e) { return reject(e); }
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error || new Error("IndexedDB operation failed")); };
    });
  }

  function probeIDB() {
    return openIDB().then(function (db) {
      idb = db;
      if (!db) return false;
      var k = CFG.PROBE_KEY, v = "p" + Date.now();
      return idbOp("set", k, v)
        .then(function () { return idbOp("get", k); })
        .then(function (got) {
          if (got !== v) return false;
          return idbOp("del", k).then(function () { return true; });
        })
        .catch(function () { return false; });
    });
  }

  /* ── 06.2  TIER SELECTION ──────────────────────────────────────────────── */
  function probe() {
    if (probeLocal()) {
      tier = "local"; mode = "persistent";
      return Promise.resolve(mode);
    }
    return probeIDB().then(function (ok) {
      if (ok) { tier = "idb"; mode = "persistent"; }
      else { tier = "memory"; mode = "session"; idb = null; }
      return mode;
    }).catch(function () {
      tier = "memory"; mode = "session"; idb = null;
      return mode;
    });
  }

  /* ── 06.3  GET / SET / REMOVE / KEYS ───────────────────────────────────── */
  function nsKey(k) { return CFG.NS + k; }

  function get(key) {
    var k = nsKey(key);
    try {
      if (tier === "local") {
        var raw = window.localStorage.getItem(k);
        return Promise.resolve(raw === null ? null : JSON.parse(raw));
      }
      if (tier === "idb") {
        return idbOp("get", k).then(function (v) { return v === undefined ? null : v; });
      }
    } catch (e) {
      /* Corrupt JSON on disk must not take the app down. Drop the key and
         carry on with defaults; §07 reports it. */
      emit("corrupt", { key: key, error: e });
      return Promise.resolve(null);
    }
    return Promise.resolve(k in mem ? mem[k] : null);
  }

  function set(key, value) {
    var k = nsKey(key);
    try {
      if (tier === "local") {
        window.localStorage.setItem(k, JSON.stringify(value));
        return Promise.resolve(true);
      }
      if (tier === "idb") {
        return idbOp("set", k, value).catch(function (e) { return onWriteError(e, key); });
      }
    } catch (e) {
      return Promise.resolve(onWriteError(e, key));
    }
    mem[k] = value;
    return Promise.resolve(true);
  }

  function remove(key) {
    var k = nsKey(key);
    try {
      if (tier === "local") { window.localStorage.removeItem(k); return Promise.resolve(true); }
      if (tier === "idb") { return idbOp("del", k).catch(function () { return false; }); }
    } catch (e) { return Promise.resolve(false); }
    delete mem[k];
    return Promise.resolve(true);
  }

  function keys() {
    try {
      if (tier === "local") {
        var out = [], i, k;
        for (i = 0; i < window.localStorage.length; i++) {
          k = window.localStorage.key(i);
          if (k && k.indexOf(CFG.NS) === 0) out.push(k.slice(CFG.NS.length));
        }
        return Promise.resolve(out);
      }
      if (tier === "idb") {
        return idbOp("keys").then(function (all) {
          return (all || []).filter(function (k) { return String(k).indexOf(CFG.NS) === 0; })
                            .map(function (k) { return String(k).slice(CFG.NS.length); });
        });
      }
    } catch (e) { return Promise.resolve([]); }
    return Promise.resolve(Object.keys(mem).map(function (k) { return k.slice(CFG.NS.length); }));
  }

  /* ── 06.4  QUOTA ────────────────────────────────────────────────────────
     A full disk is not a crash. Emit once, let §07 raise the banner offering
     export and prune, and keep the value in memory so the session continues. */
  function isQuota(e) {
    if (!e) return false;
    return e.name === "QuotaExceededError"
        || e.name === "NS_ERROR_DOM_QUOTA_REACHED"
        || e.code === 22 || e.code === 1014;
  }

  function onWriteError(e, key) {
    if (isQuota(e)) {
      /* The value stays live in §07 state, so the session continues intact. */
      emit("quota", { key: key });
      return false;
    }
    emit("writefail", { key: key, error: e });
    return false;
  }

  /* ── 06.5  PUBLIC ──────────────────────────────────────────────────────── */
  return {
    probe: probe,
    get: get, set: set, remove: remove, keys: keys,
    on: function (fn) { listeners.push(fn); },
    get mode() { return mode; },
    get tier() { return tier; },
    /* Used by §07 only, when a write fails and the app degrades to session. */
    demote: function () { tier = "memory"; mode = "session"; }
  };
})();


/* ═══ §07  STORE / STATE ══════════════════════════════════════════════════
   One store. Features read through select() and write through actions.
   Nothing outside this section calls PMP.Storage.
   ═══════════════════════════════════════════════════════════════════════ */
PMP.Store = (function () {
  var CFG = PMP.STORE_CFG;
  var subs = [];
  var dirty = Object.create(null);
  var flushTimer = null;
  var flushing = false;

  /* ── 07.1  SHAPE & DEFAULTS ────────────────────────────────────────────
     Keys listed in STORE_CFG.PERSISTED are written to disk. Everything under
     `ui` and `sys` is session-only by design. */
  function defaults() {
    return {
      sys: {
        ready: false,
        schemaVersion: CFG.SCHEMA_VERSION,
        storageMode: "probing",
        storageTier: null,
        quotaHit: false,
        corruptKeys: []
      },
      ui: {
        route: null,
        navOpen: false,
        examActive: false,
        lastError: null
      },
      settings: {
        theme: PMP.THEME_PREF || "system",
        examDate: null,
        dailyTarget: 30,
        confidenceTracking: true,
        shuffleOptions: true
      },
      /* One row per committed answer. `credit` is the part mark 0–1 and
         `correct` is the all-or-nothing item mark; `order` is the option
         order that was on screen, so a review can reproduce it exactly. */
      attempts: [],   /* { id, qid, ecoTask, domain, approach, type, difficulty,
                         correct, credit, ms, at, confidence, mode, order } */
      srs: {},        /* cardId -> { ease, interval, reps, lapses, due, suspended } */
      exams: [],      /* { id, startedAt, finishedAt, answers, score, layout } */
      notes: {},      /* qid -> string */
      flags: {},      /* qid -> true, set from any question view */
      journal: [],    /* { id, qid, cause, at, note } */
      planner: { generatedAt: null, weeks: [], done: {} },
      issues: []      /* { id, qid, text, at } */
    };
  }

  var state = defaults();

  /* Migration hook. Progress files and stored slices carry schemaVersion; a
     v1 slice is upgraded here, an unknown major is refused by §09.6 before it
     ever reaches the store. */
  function migrate(key, value, fromVersion) {
    if (fromVersion === CFG.SCHEMA_VERSION) return value;
    if (fromVersion === 1) {
      /* v1 predates the July 2026 outline: its ecoTask ids belong to the
         retired 35-task table and cannot be mapped safely. Attempts are kept
         for accuracy history but flagged so §10.01 excludes them from
         coverage until they are re-tagged. */
      if (key === "attempts" && Array.isArray(value)) {
        return value.map(function (a) {
          var b = Object.assign({}, a);
          b.legacyEco = b.ecoTask || null;
          b.ecoTask = null;
          return b;
        });
      }
    }
    return value;
  }

  /* ── 07.2  SUBSCRIBE / NOTIFY ──────────────────────────────────────────
     Listeners receive (state, changedKeys). A listener that throws is
     isolated so one broken view cannot stop the rest from updating. */
  function subscribe(fn) {
    subs.push(fn);
    return function () {
      var i = subs.indexOf(fn);
      if (i >= 0) subs.splice(i, 1);
    };
  }

  function notify(changed) {
    for (var i = 0; i < subs.length; i++) {
      try { subs[i](state, changed); }
      catch (e) { reportListenerError(e); }
    }
  }

  function reportListenerError(e) {
    if (PMP.UI && PMP.UI.toast) PMP.UI.toast("A panel failed to update. Your data is unaffected.", "err");
  }

  /* Memoised selector. Recomputes only when the watched slices change. */
  function selector(keys, compute) {
    var lastStamp = -1, lastValue;
    return function () {
      var stamp = 0, i;
      for (i = 0; i < keys.length; i++) stamp += stampOf(keys[i]);
      if (stamp !== lastStamp) { lastStamp = stamp; lastValue = compute(state); }
      return lastValue;
    };
  }
  var stamps = Object.create(null);
  function stampOf(k) { return stamps[k] || 0; }
  function bump(k) { stamps[k] = (stamps[k] || 0) + 1; }

  /* ── 07.3  COMMIT — the only writer ────────────────────────────────────
     mutate() receives a draft of the named slices. Anything it touches is
     marked dirty and queued for a debounced, batched write. */
  function commit(keys, mutate, opts) {
    opts = opts || {};
    var i, k;
    for (i = 0; i < keys.length; i++) {
      k = keys[i];
      if (!(k in state)) throw new Error("Unknown store slice: " + k);
    }
    mutate(state);
    for (i = 0; i < keys.length; i++) {
      k = keys[i];
      bump(k);
      if (CFG.PERSISTED.indexOf(k) >= 0 && !opts.transient) dirty[k] = true;
    }
    if (!opts.silent) notify(keys);
    schedule();
  }

  /* ── 07.4  PERSISTENCE BRIDGE ──────────────────────────────────────────
     Debounced ~500 ms and batched: a slice touched fifty times in a burst is
     written once. Never a write per keystroke. */
  function schedule() {
    if (flushTimer || flushing) return;
    if (!Object.keys(dirty).length) return;
    flushTimer = setTimeout(function () { flushTimer = null; flush(); }, CFG.DEBOUNCE_MS);
  }

  function flush() {
    var keys = Object.keys(dirty);
    if (!keys.length || state.sys.storageMode === "session") { dirty = Object.create(null); return Promise.resolve(); }
    dirty = Object.create(null);
    flushing = true;
    var writes = keys.map(function (k) {
      return PMP.Storage.set(k, { v: CFG.SCHEMA_VERSION, d: state[k] });
    });
    return Promise.all(writes).then(function () {
      flushing = false;
      schedule();
    }).catch(function () {
      flushing = false;
    });
  }

  function hydrate() {
    var keys = CFG.PERSISTED;
    return Promise.all(keys.map(function (k) { return PMP.Storage.get(k); }))
      .then(function (vals) {
        vals.forEach(function (wrapped, i) {
          if (!wrapped || typeof wrapped !== "object") return;
          var version = wrapped.v || 1;
          var data = ("d" in wrapped) ? wrapped.d : wrapped;
          if (data === null || data === undefined) return;
          state[keys[i]] = migrate(keys[i], data, version);
          bump(keys[i]);
        });
      });
  }

  /* Prune. Offered when the disk is full — drops the oldest attempts, which
     are the largest slice and the least load-bearing once they have aged out
     of the readiness window. Returns how many were removed. */
  function pruneAttempts(keep) {
    keep = keep || CFG.PRUNE_KEEP_ATTEMPTS;
    var before = state.attempts.length;
    if (before <= keep) return 0;
    commit(["attempts"], function (s) {
      s.attempts = s.attempts.slice(-keep);
    });
    return before - keep;
  }

  function clearAll() {
    return Promise.all(CFG.PERSISTED.map(function (k) { return PMP.Storage.remove(k); }))
      .then(function () {
        var fresh = defaults();
        CFG.PERSISTED.forEach(function (k) { state[k] = fresh[k]; bump(k); });
        dirty = Object.create(null);
        notify(CFG.PERSISTED.slice());
      });
  }

  /* Storage events raised by §06 land here and become UI state. */
  PMP.Storage.on(function (evt, detail) {
    if (evt === "quota") {
      if (state.sys.quotaHit) return;
      commit(["sys"], function (s) { s.sys.quotaHit = true; }, { transient: true });
    } else if (evt === "corrupt") {
      commit(["sys"], function (s) {
        if (s.sys.corruptKeys.indexOf(detail.key) < 0) s.sys.corruptKeys.push(detail.key);
      }, { transient: true });
    } else if (evt === "writefail") {
      commit(["sys"], function (s) { s.sys.storageMode = "session"; }, { transient: true });
      PMP.Storage.demote();
    }
  });

  return {
    get state() { return state; },
    defaults: defaults,
    subscribe: subscribe,
    selector: selector,
    commit: commit,
    hydrate: hydrate,
    flush: flush,
    pruneAttempts: pruneAttempts,
    clearAll: clearAll,
    /* Exposed for §12.1: a crash handler needs the raw state to offer export. */
    snapshot: function () {
      var out = { schemaVersion: CFG.SCHEMA_VERSION, type: "pmp-progress", exportedAt: new Date().toISOString() };
      CFG.PERSISTED.forEach(function (k) { out[k] = state[k]; });
      return out;
    }
  };
})();


/* ═══ §08  ROUTER ═════════════════════════════════════════════════════════
   Hash-based so the file works from file://. Routes are registered here with
   a title and a render function; §10 replaces the stub renderers in place.
   ═══════════════════════════════════════════════════════════════════════ */
PMP.Router = (function () {
  var routes = Object.create(null);
  var order = [];
  var current = null;
  var guards = [];
  var started = false;

  /* ── 08.1  PARSE / BUILD ───────────────────────────────────────────────
     "#/practice?domain=process&difficulty=3" -> { name, params } */
  function parse(hash) {
    var raw = String(hash || "").replace(/^#/, "");
    if (raw.charAt(0) === "/") raw = raw.slice(1);
    var qi = raw.indexOf("?");
    var name = (qi >= 0 ? raw.slice(0, qi) : raw).replace(/\/+$/, "");
    var params = Object.create(null);
    if (qi >= 0) {
      raw.slice(qi + 1).split("&").forEach(function (pair) {
        if (!pair) return;
        var eq = pair.indexOf("=");
        var k = decodeURIComponent(eq < 0 ? pair : pair.slice(0, eq));
        var v = eq < 0 ? "" : decodeURIComponent(pair.slice(eq + 1).replace(/\+/g, " "));
        params[k] = v;
      });
    }
    return { name: name || "dashboard", params: params };
  }

  function build(name, params) {
    var q = [];
    if (params) {
      Object.keys(params).forEach(function (k) {
        if (params[k] === null || params[k] === undefined || params[k] === "") return;
        q.push(encodeURIComponent(k) + "=" + encodeURIComponent(params[k]));
      });
    }
    return "#/" + name + (q.length ? "?" + q.join("&") : "");
  }

  function navigate(name, params, replace) {
    var url = build(name, params);
    if (replace && window.history && window.history.replaceState) {
      window.history.replaceState(null, "", url);
      handle();
    } else {
      window.location.hash = url;
    }
  }

  /* ── 08.2  ROUTE TABLE & GUARDS ────────────────────────────────────────
     A guard returns null to allow, or a message to block. The exam guard is
     registered in §10.03; the hook lives here so navigation cannot bypass it. */
  function register(name, def) {
    routes[name] = def;
    order.push(name);
  }
  function addGuard(fn) { guards.push(fn); }

  function checkGuards(to) {
    for (var i = 0; i < guards.length; i++) {
      var msg = guards[i](to, current);
      if (msg) return msg;
    }
    return null;
  }

  /* ── 08.3  HANDLE — render, retitle, move focus ────────────────────────
     Focus moves to the view container on every route change so a keyboard or
     screen-reader user lands in the new content, not back at the top of nav. */
  function handle() {
    var to = parse(window.location.hash);
    if (!routes[to.name]) {
      PMP.UI.toast("No section called \u201C" + to.name + "\u201D. Showing the dashboard.", "warn");
      return navigate("dashboard", null, true);
    }

    var blocked = checkGuards(to);
    if (blocked) {
      PMP.UI.toast(blocked, "warn");
      if (current) window.location.hash = build(current.name, current.params);
      return;
    }

    var def = routes[to.name];
    var host = document.getElementById("view");
    host.innerHTML = "";
    try {
      def.render(host, to.params);
    } catch (e) {
      host.innerHTML = "";
      host.appendChild(PMP.UI.empty(
        "This section did not load",
        "Something went wrong rendering " + def.title + ". Your saved progress is untouched. Export a backup, then reload the file.",
        "alert"
      ));
      PMP.report(e, "render:" + to.name);
    }

    current = to;
    document.getElementById("view-title").textContent = def.title;
    document.title = def.title + " \u2014 PMP Prep Suite";
    markActive(to.name);

    try { host.focus({ preventScroll: true }); } catch (e) { host.focus(); }
    if (window.scrollTo) window.scrollTo(0, 0);
    PMP.Store.commit(["ui"], function (s) { s.ui.route = to.name; s.ui.navOpen = false; }, { transient: true });
    PMP.UI.announce(def.title);
  }

  function markActive(name) {
    var links = document.querySelectorAll(".nav-i");
    for (var i = 0; i < links.length; i++) {
      if (links[i].getAttribute("data-route") === name) links[i].setAttribute("aria-current", "page");
      else links[i].removeAttribute("aria-current");
    }
  }

  function start() {
    if (started) return;
    started = true;
    window.addEventListener("hashchange", handle);
    if (!window.location.hash) navigate("dashboard", null, true);
    else handle();
  }

  return {
    register: register, addGuard: addGuard, navigate: navigate,
    parse: parse, build: build, start: start,
    has: function (name) { return !!routes[name]; },
    get current() { return current; },
    get names() { return order.slice(); }
  };
})();


/* ═══ §09  UTILITIES ══════════════════════════════════════════════════════ */

/* ── 09.1  DOM ──────────────────────────────────────────────────────────── */
PMP.dom = (function () {
  function el(tag, attrs, children) {
    var node = document.createElement(tag), k;
    if (attrs) {
      for (k in attrs) {
        if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
        var v = attrs[k];
        if (v === null || v === undefined || v === false) continue;
        if (k === "class") node.className = v;
        else if (k === "text") node.textContent = v;
        else if (k === "html") node.innerHTML = v;      /* trusted markup only */
        else if (k.indexOf("on") === 0 && typeof v === "function") node.addEventListener(k.slice(2), v);
        else if (k === "dataset") { for (var d in v) node.dataset[d] = v[d]; }
        else node.setAttribute(k, v === true ? "" : v);
      }
    }
    append(node, children);
    return node;
  }

  function append(node, children) {
    if (children === null || children === undefined) return node;
    if (!Array.isArray(children)) children = [children];
    children.forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      node.appendChild(typeof c === "string" || typeof c === "number"
        ? document.createTextNode(String(c)) : c);
    });
    return node;
  }

  function frag(children) { return append(document.createDocumentFragment(), children); }

  /* Inline SVG icon from the §04.3 sprite. */
  function icon(name, cls) {
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", cls || "i");
    svg.setAttribute("aria-hidden", "true");
    svg.setAttribute("focusable", "false");
    var use = document.createElementNS("http://www.w3.org/2000/svg", "use");
    use.setAttribute("href", "#i-" + name);
    svg.appendChild(use);
    return svg;
  }

  function on(target, evt, fn, opts) {
    target.addEventListener(evt, fn, opts);
    return function () { target.removeEventListener(evt, fn, opts); };
  }

  /* Event delegation, so a 180-cell grid needs one listener rather than 180. */
  function delegate(root, evt, sel, fn) {
    return on(root, evt, function (e) {
      var t = e.target.closest ? e.target.closest(sel) : null;
      if (t && root.contains(t)) fn(e, t);
    });
  }

  /* Windowed list. Anything over 200 rows renders only what is on screen
     plus an overscan margin. Required by the brief for the question browser
     and the glossary. */
  function virtualise(host, opts) {
    var rowH = opts.rowHeight, total = opts.count, render = opts.render, over = opts.overscan || 8;
    var spacer = el("div", { style: "height:" + (rowH * total) + "px;position:relative" });
    var pool = el("div", { style: "position:absolute;left:0;right:0;top:0" });
    spacer.appendChild(pool);
    host.innerHTML = "";
    host.style.overflowY = "auto";
    host.appendChild(spacer);
    var lastStart = -1;
    function paint() {
      var start = Math.max(0, Math.floor(host.scrollTop / rowH) - over);
      if (start === lastStart) return;
      lastStart = start;
      var visible = Math.ceil(host.clientHeight / rowH) + over * 2;
      var end = Math.min(total, start + visible);
      pool.style.transform = "translateY(" + (start * rowH) + "px)";
      pool.innerHTML = "";
      for (var i = start; i < end; i++) pool.appendChild(render(i));
    }
    var off = on(host, "scroll", paint, { passive: true });
    paint();
    return { repaint: function () { lastStart = -1; paint(); }, destroy: off };
  }

  return { el: el, frag: frag, append: append, icon: icon, on: on, delegate: delegate, virtualise: virtualise };
})();

/* ── 09.2  FORMAT ───────────────────────────────────────────────────────── */
PMP.fmt = (function () {
  function pad(n) { return n < 10 ? "0" + n : String(n); }

  /* Exam clock. Always h:mm:ss so the field width never changes. */
  function clock(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    return Math.floor(s / 3600) + ":" + pad(Math.floor(s / 60) % 60) + ":" + pad(s % 60);
  }
  function duration(sec) {
    sec = Math.max(0, Math.round(sec));
    if (sec < 60) return sec + "s";
    var m = Math.floor(sec / 60);
    if (m < 60) return m + "m " + pad(sec % 60) + "s";
    return Math.floor(m / 60) + "h " + pad(m % 60) + "m";
  }
  function pct(x, dp) { return (x * 100).toFixed(dp === undefined ? 0 : dp) + "%"; }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : (many || one + "s")); }
  function dateShort(iso) {
    if (!iso) return "\u2014";
    var d = new Date(iso);
    if (isNaN(d)) return "\u2014";
    return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
  }
  function relDays(iso) {
    if (!iso) return null;
    return Math.round((new Date(iso) - Date.now()) / 86400000);
  }
  function bytes(n) {
    if (n < 1024) return n + " B";
    if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
    return (n / 1048576).toFixed(2) + " MB";
  }
  return { clock: clock, duration: duration, pct: pct, plural: plural, dateShort: dateShort, relDays: relDays, bytes: bytes, pad: pad };
})();

/* ── 09.3  TIME ─────────────────────────────────────────────────────────────
   Every elapsed figure is a Date.now() delta. Ticks are never accumulated:
   a background tab is throttled to roughly one tick a second or slower, and
   summing ticks would silently give the candidate extra exam time. */
PMP.time = (function () {
  function Clock(totalMs) {
    this.totalMs = totalMs;
    this.startedAt = null;
    this.consumed = 0;      /* ms banked from previous running spans */
    this.running = false;
  }
  Clock.prototype.start = function () {
    if (this.running) return this;
    this.startedAt = Date.now(); this.running = true; return this;
  };
  Clock.prototype.pause = function () {
    if (!this.running) return this;
    this.consumed += Date.now() - this.startedAt;
    this.startedAt = null; this.running = false; return this;
  };
  Clock.prototype.elapsed = function () {
    return this.consumed + (this.running ? Date.now() - this.startedAt : 0);
  };
  Clock.prototype.remaining = function () { return Math.max(0, this.totalMs - this.elapsed()); };
  Clock.prototype.expired = function () { return this.elapsed() >= this.totalMs; };
  Clock.prototype.toJSON = function () {
    return { totalMs: this.totalMs, consumed: this.elapsed(), running: false };
  };
  Clock.from = function (o) {
    var c = new Clock(o.totalMs); c.consumed = o.consumed || 0; return c;
  };

  /* Single-node ticker. Writes textContent only — no layout thrash. */
  function tick(node, fn, intervalMs) {
    var id = setInterval(function () {
      var next = fn();
      if (node.textContent !== next) node.textContent = next;
    }, intervalMs || 250);
    return function () { clearInterval(id); };
  }

  function startOfDay(ts) { var d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function daysBetween(a, b) { return Math.round((startOfDay(b) - startOfDay(a)) / 86400000); }

  return { Clock: Clock, tick: tick, startOfDay: startOfDay, daysBetween: daysBetween };
})();

/* ── 09.4  RANDOM ───────────────────────────────────────────────────────────
   Seeded so a mock sitting can be reconstructed exactly from its stored seed,
   and so the content audit is reproducible. */
PMP.rng = (function () {
  function seeded(seed) {
    var s = seed >>> 0 || 1;
    return function () {
      s ^= s << 13; s >>>= 0;
      s ^= s >> 17;
      s ^= s << 5;  s >>>= 0;
      return s / 4294967296;
    };
  }
  function seedFrom(str) {
    var h = 2166136261, i;
    for (i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  /* Fisher–Yates. Returns the permutation alongside the shuffled array so a
     caller can map a displayed option index back to its original id. */
  function shuffle(arr, rand) {
    rand = rand || Math.random;
    var out = arr.slice(), order = out.map(function (_, i) { return i; }), i, j, t;
    for (i = out.length - 1; i > 0; i--) {
      j = Math.floor(rand() * (i + 1));
      t = out[i]; out[i] = out[j]; out[j] = t;
      t = order[i]; order[i] = order[j]; order[j] = t;
    }
    return { items: out, order: order };
  }
  /* Weighted sample without replacement, for the adaptive drill in §10.02.
     Weights are relative and need not sum to anything. A zero weight is never
     drawn while any positive weight remains, and an all-zero pool falls back
     to a flat draw rather than returning nothing. */
  function sample(items, weights, k, rand) {
    rand = rand || Math.random;
    var pool = items.map(function (it, i) { return { it: it, w: Math.max(0, weights[i] || 0) }; });
    var out = [], hit, total, t, acc;
    k = Math.min(k, pool.length);
    while (out.length < k && pool.length) {
      total = pool.reduce(function (a, p) { return a + p.w; }, 0);
      if (total <= 0) hit = Math.floor(rand() * pool.length);
      else {
        t = rand() * total; acc = 0;
        for (hit = 0; hit < pool.length; hit++) { acc += pool[hit].w; if (acc >= t) break; }
        if (hit >= pool.length) hit = pool.length - 1;
      }
      out.push(pool[hit].it);
      pool.splice(hit, 1);
    }
    return out;
  }
  function id(prefix) {
    return prefix + "-" + Date.now().toString(36) + "-" + Math.floor(Math.random() * 1e6).toString(36);
  }
  return { seeded: seeded, seedFrom: seedFrom, shuffle: shuffle, sample: sample, id: id };
})();

/* ── 09.5  TEXT ─────────────────────────────────────────────────────────────
   Trigram index for the glossary and reference search. No external library. */
PMP.text = (function () {
  function normalise(s) {
    var t = String(s || "").toLowerCase();
    if (t.normalize) t = t.normalize("NFKD").replace(/[\u0300-\u036f]/g, "");
    return t.replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
  }
  function trigrams(s) {
    var t = " " + normalise(s) + " ", out = [], i;
    for (i = 0; i < t.length - 2; i++) out.push(t.slice(i, i + 3));
    return out;
  }
  function index(records, fields) {
    var map = Object.create(null);
    records.forEach(function (r, i) {
      var text = fields.map(function (f) { return r[f] || ""; }).join(" ");
      var seen = Object.create(null);
      trigrams(text).forEach(function (g) {
        if (seen[g]) return; seen[g] = 1;
        (map[g] || (map[g] = [])).push(i);
      });
    });
    return { map: map, size: records.length };
  }
  function search(idx, query, limit) {
    var grams = trigrams(query);
    if (!grams.length) return [];
    var score = Object.create(null), i, j, list;
    for (i = 0; i < grams.length; i++) {
      list = idx.map[grams[i]];
      if (!list) continue;
      for (j = 0; j < list.length; j++) score[list[j]] = (score[list[j]] || 0) + 1;
    }
    return Object.keys(score)
      .map(function (k) { return { i: +k, score: score[k] / grams.length }; })
      .filter(function (r) { return r.score > 0.25; })
      .sort(function (a, b) { return b.score - a.score; })
      .slice(0, limit || 30);
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  return { normalise: normalise, trigrams: trigrams, index: index, search: search, escapeHtml: escapeHtml };
})();

/* ── 09.6  VALIDATE ─────────────────────────────────────────────────────────
   Every import path runs through here before a single byte reaches the store.
   Errors are indexed and name the offending field, per acceptance test 8. */
PMP.validate = (function () {
  var TYPES = ["single", "multi", "matching", "pulldown", "hotspot", "graphic", "fillblank"];

  function Result() { this.errors = []; this.warnings = []; }
  Result.prototype.err = function (where, msg) { this.errors.push({ where: where, msg: msg }); };
  Result.prototype.warn = function (where, msg) { this.warnings.push({ where: where, msg: msg }); };
  Result.prototype.ok = function () { return this.errors.length === 0; };

  function parseJSON(raw) {
    try { return { ok: true, value: JSON.parse(raw) }; }
    catch (e) {
      var m = /position (\d+)/.exec(e.message);
      return { ok: false, error: "The file is not valid JSON" + (m ? " (character " + m[1] + ")" : "") + "." };
    }
  }

  function checkVersion(obj, expectedType, r) {
    if (!obj || typeof obj !== "object") { r.err("file", "The file does not contain a JSON object."); return false; }
    if (obj.type && obj.type !== expectedType) { r.err("type", "This file is \u201C" + obj.type + "\u201D, not " + expectedType + "."); return false; }
    var v = obj.schemaVersion;
    if (typeof v !== "number") { r.err("schemaVersion", "Missing schemaVersion."); return false; }
    if (v > PMP.STORE_CFG.SCHEMA_VERSION) {
      r.err("schemaVersion", "This file uses schema " + v + ". This build reads up to " + PMP.STORE_CFG.SCHEMA_VERSION + ". Update the app, or export again from the older version.");
      return false;
    }
    return true;
  }

  function pack(obj) {
    var r = new Result();
    if (!checkVersion(obj, "pmp-pack", r)) return r;
    if (!Array.isArray(obj.questions)) { r.err("questions", "Missing a questions array."); return r; }
    if (obj.ecoVersion && obj.ecoVersion !== PMP.ECO.VERSION) {
      r.warn("ecoVersion", "Pack targets ECO " + obj.ecoVersion + "; this build targets " + PMP.ECO.VERSION + ". Task coverage will not count until items are re-tagged.");
    }
    var seen = Object.create(null);
    obj.questions.forEach(function (q, i) {
      var at = "questions[" + i + "]";
      if (!q || typeof q !== "object") return r.err(at, "Not an object.");
      if (!q.id) r.err(at + ".id", "Missing id.");
      /* `in`, not truthiness: the first item sits at index 0, which is falsy. */
      else if (q.id in seen) r.err(at + ".id", "Duplicate id \u201C" + q.id + "\u201D (first seen at index " + seen[q.id] + ").");
      else seen[q.id] = i;
      if (TYPES.indexOf(q.type) < 0) r.err(at + ".type", "Unknown type \u201C" + q.type + "\u201D. Expected one of: " + TYPES.join(", ") + ".");
      if (PMP.ECO.DOMAINS.indexOf(q.domain) < 0) r.err(at + ".domain", "Unknown domain \u201C" + q.domain + "\u201D.");
      if (!PMP.ECO_TASK_BY_ID[q.ecoTask]) r.err(at + ".ecoTask", "Unknown ECO task \u201C" + q.ecoTask + "\u201D for outline " + PMP.ECO.VERSION + ".");
      if (!q.stem || String(q.stem).trim().length < 10) r.err(at + ".stem", "Stem is missing or too short.");
      if (!q.explanation) r.err(at + ".explanation", "Missing explanation.");
      if (Array.isArray(q.options)) {
        if (!q.options.some(function (o) { return o && o.correct; })) r.err(at + ".options", "No option is marked correct.");
        q.options.forEach(function (o, j) {
          if (!o || !o.rationale) r.err(at + ".options[" + j + "].rationale", "Every option needs its own rationale.");
        });
      } else if (q.type !== "fillblank" && q.type !== "hotspot") {
        r.err(at + ".options", "Missing options array.");
      }
    });
    return r;
  }

  function progress(obj) {
    var r = new Result();
    if (!checkVersion(obj, "pmp-progress", r)) return r;
    PMP.STORE_CFG.PERSISTED.forEach(function (k) {
      if (!(k in obj)) { r.warn(k, "Not present in the file; the current value will be kept."); return; }
      var expected = Array.isArray(PMP.Store.defaults()[k]) ? "array" : typeof PMP.Store.defaults()[k];
      var actual = Array.isArray(obj[k]) ? "array" : typeof obj[k];
      if (actual !== expected) r.err(k, "Expected " + expected + ", found " + actual + ".");
    });
    return r;
  }

  return { pack: pack, progress: progress, parseJSON: parseJSON, TYPES: TYPES, Result: Result };
})();

/* ── 09.7  UI PRIMITIVES ────────────────────────────────────────────────── */
PMP.UI = (function () {
  var el = PMP.dom.el, icon = PMP.dom.icon;

  function announce(msg, assertive) {
    var node = document.getElementById(assertive ? "live-alert" : "live-polite");
    if (!node) return;
    node.textContent = "";
    setTimeout(function () { node.textContent = msg; }, 30);
  }

  function toast(msg, kind, ms) {
    var host = document.getElementById("toasts");
    if (!host) return;
    kind = kind || "ok";
    var iconName = kind === "err" ? "alert" : kind === "warn" ? "alert" : "check";
    var node = el("div", { class: "toast toast--" + kind, role: "status" }, [
      icon(iconName),
      el("span", { text: msg }),
      el("button", {
        class: "icon-btn x", type: "button", "aria-label": "Dismiss",
        onclick: function () { node.remove(); }
      }, [icon("x")])
    ]);
    host.appendChild(node);
    announce(msg, kind === "err");
    setTimeout(function () { if (node.parentNode) node.remove(); }, ms || (kind === "ok" ? 4000 : 8000));
    return node;
  }

  /* One dialog element, reused. Returns a promise resolving to the id of the
     action the person chose, or null if they closed it. */
  var sheetResolve = null;
  function sheet(opts) {
    var dlg = document.getElementById("sheet");
    var title = document.getElementById("sheet-title");
    var body = document.getElementById("sheet-body");
    var foot = document.getElementById("sheet-foot");
    title.textContent = opts.title;
    body.innerHTML = "";
    PMP.dom.append(body, opts.body);
    foot.innerHTML = "";
    (opts.actions || [{ id: "close", label: "Close" }]).forEach(function (a) {
      foot.appendChild(el("button", {
        class: "btn" + (a.primary ? " btn--primary" : a.danger ? " btn--danger" : ""),
        type: "button",
        onclick: function () { close(a.id); }
      }, [a.icon ? icon(a.icon) : null, a.label]));
    });
    if (typeof dlg.showModal === "function") dlg.showModal();
    else dlg.setAttribute("open", "");
    var first = foot.querySelector(".btn--primary") || foot.querySelector(".btn");
    if (first) first.focus();
    return new Promise(function (res) { sheetResolve = res; });
  }
  function close(id) {
    /* dlg.close() fires a 'close' event synchronously and §12.2 routes that
       back here. Detach the resolver before closing so the caller receives the
       action they chose rather than the null from the re-entrant call. */
    var resolve = sheetResolve;
    sheetResolve = null;
    var dlg = document.getElementById("sheet");
    if (dlg.open && typeof dlg.close === "function") dlg.close();
    else dlg.removeAttribute("open");
    if (resolve) resolve(id || null);
  }

  function confirm(title, message, confirmLabel, danger) {
    return sheet({
      title: title,
      body: el("p", { text: message }),
      actions: [
        { id: "cancel", label: "Cancel" },
        { id: "ok", label: confirmLabel, primary: !danger, danger: !!danger }
      ]
    }).then(function (r) { return r === "ok"; });
  }

  function empty(heading, detail, iconName) {
    return el("div", { class: "empty" }, [
      icon(iconName || "info"),
      el("h3", { text: heading }),
      el("p", { text: detail })
    ]);
  }

  /* ── Banners. The storage banner is not dismissible: if progress will be
     lost on close, the person needs to see that every time. ─────────────── */
  function renderBanners(state) {
    var host = document.getElementById("banners");
    if (!host) return;
    host.innerHTML = "";

    if (state.sys.storageMode === "session") {
      host.appendChild(el("div", { class: "banner", role: "alert" }, [
        icon("alert"),
        el("div", { class: "banner-b" }, [
          el("div", { class: "banner-t", text: "Progress is not being saved" }),
          el("div", {
            class: "banner-d",
