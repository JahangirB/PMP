<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Offline PMP exam preparation. Single file, no network, no install.">
<title>PMP Prep Suite</title>

<!-- ═══ §01  CONFIG & CONSTANTS ══════════════════════════════════════════════
     Runs before paint. Nothing here touches the DOM except the theme attribute
     on <html>, which must be set before first paint or a dark-mode user gets a
     white flash. This is the only script in <head>.
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
"use strict";
var PMP = window.PMP = {};

/* ── 01.1  ECO ──────────────────────────────────────────────────────────────
   PMP Examination Content Outline, July 2026. Retrieved 2026-08-04.
   26 tasks: People 8, Process 10, Business Environment 8.
   Update ECO_VERSION, DOMAIN_WEIGHTS, APPROACH_SPLIT and ECO_TASKS (§05.1)
   together; nothing else in the file hard-codes these figures. */
PMP.ECO = Object.freeze({
  VERSION: "2026-07",
  LABEL: "PMI Examination Content Outline, July 2026",
  RETRIEVED: "2026-08-04",
  TASK_COUNT: 26,
  DOMAINS: Object.freeze(["people", "process", "business"]),
  DOMAIN_LABELS: Object.freeze({
    people: "People",
    process: "Process",
    business: "Business Environment"
  }),
  DOMAIN_WEIGHTS: Object.freeze({ people: 0.33, process: 0.41, business: 0.26 }),
  DOMAIN_TASK_COUNTS: Object.freeze({ people: 8, process: 10, business: 8 }),
  /* PMI publishes 40% predictive / 60% adaptive+hybrid and does not break the
     60% down further. The 35/25 sub-split is this build's assumption. */
  APPROACH_SPLIT: Object.freeze({ predictive: 0.40, agile: 0.35, hybrid: 0.25 }),
  APPROACH_LABELS: Object.freeze({
    predictive: "Predictive", agile: "Adaptive / agile", hybrid: "Hybrid"
  })
});

/* ── 01.2  EXAM LAYOUT ──────────────────────────────────────────────────────
   180 items, 170 scored + 10 pretest, 240 minutes.
   PMI does not publish the size of the case-study block, so CASE_BLOCK_ITEMS
   is an approximation and is surfaced as such in the About panel.
   Breaks are derived from the layout, never hard-coded question numbers. */
PMP.EXAM = Object.freeze({
  TOTAL_ITEMS: 180,
  SCORED_ITEMS: 170,
  PRETEST_ITEMS: 10,
  MINUTES: 240,
  BREAK_MINUTES: 10,
  BREAK_COUNT: 2,
  CASE_BLOCK_ITEMS: 40,          /* assumption — see About */
  CASE_BLOCK_ASSUMED: true,
  PACE_TARGET_SEC: 240 * 60 / 180,   /* 80.0 s */
  get BREAK_1_AFTER() { return this.CASE_BLOCK_ITEMS; },
  get BREAK_2_AFTER() {
    var rest = this.TOTAL_ITEMS - this.CASE_BLOCK_ITEMS;
    return this.CASE_BLOCK_ITEMS + Math.round(rest / 2);
  }
});

/* ── 01.3  READINESS WEIGHTS ── consumed by §10.01. Must sum to 100. ──────── */
PMP.READINESS = Object.freeze({
  WEIGHTS: Object.freeze({
    accuracy: 35, coverage: 20, mocks: 25, pace: 10, habit: 10
  }),
  ACCURACY_HALFLIFE_DAYS: 21,
  ACCURACY_FLOOR: 0.05,
  ACCURACY_PRIOR: 0.50,
  ACCURACY_PRIOR_N: 8,
  ACCURACY_WINDOW: 400,
  ACCURACY_MIN: 0.40, ACCURACY_MAX: 0.85,
  COVERAGE_TARGET_PER_TASK: 5,
  MOCK_WEIGHTS: Object.freeze([0.50, 0.30, 0.20]),
  MOCK_MIN: 0.45, MOCK_MAX: 0.80,
  MOCK_STALE_AFTER_DAYS: 45, MOCK_STALE_HALFLIFE: 90, MOCK_STALE_FLOOR: 0.5,
  PACE_BAND: Object.freeze([45, 80]), PACE_SLOW_ZERO: 130, PACE_FAST_ZERO: 15,
  PACE_MIN_SAMPLE: 30,
  HABIT_WINDOW_DAYS: 14, HABIT_TARGET_DAYS: 10,
  GATE_ITEMS: 100, GATE_TASKS: 15
});

/* ── 01.4  SPACED REPETITION (SM-2) ── consumed by §10.05 ────────────────── */
PMP.SRS = Object.freeze({
  EASE_START: 2.5, EASE_MIN: 1.3,
  GRADES: Object.freeze(["again", "hard", "good", "easy"]),
  LEECH_THRESHOLD: 6
});

/* ── 01.5  STORAGE ─────────────────────────────────────────────────────────
   PERSISTED lists every store slice written to disk. Anything absent is
   session-only by design (see §07.1). */
PMP.STORE_CFG = Object.freeze({
  SCHEMA_VERSION: 2,
  NS: "pmp.v2.",
  PROBE_KEY: "pmp.probe",
  DEBOUNCE_MS: 500,
  IDB_NAME: "pmp-prep-suite",
  IDB_STORE: "kv",
  IDB_TIMEOUT_MS: 2000,
  PRUNE_KEEP_ATTEMPTS: 1000,
  PERSISTED: Object.freeze([
    "settings", "attempts", "srs", "exams", "notes", "flags", "journal", "planner",
    "issues", "examRun", "packs", "queue"
  ])
});

/* ── 01.6  THEME, PRE-PAINT ─────────────────────────────────────────────────
   Storage may throw here (file:// opaque origin). It is caught, and the file
   still renders — it simply falls back to the OS preference. */
(function () {
  var stored = null;
  try { stored = window.localStorage.getItem("pmp.theme"); } catch (e) { stored = null; }
  var theme = (stored === "light" || stored === "dark") ? stored : null;
  if (!theme) {
    var mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)");
    theme = (mq && mq.matches) ? "light" : "dark";
  }
  document.documentElement.setAttribute("data-theme", theme);
  PMP.INITIAL_THEME = theme;
  PMP.THEME_PREF = stored || "system";
})();

/* ── 01.7  PRACTICE / DRILL ──────────────────────────────────────────────
   PACE_TARGET_SEC is 76 s, not the 80.0 s that falls out of EXAM.PACE_TARGET_SEC
   (240 minutes over 180 items). The exam figure spends every available second
   on items. A drill target four seconds tighter banks 180 × 4 s ≈ 12 minutes
   across a full sitting, which is the reserve the flagged-item pass at the end
   has to come out of. Practising at the exam average leaves no such reserve.
   The two are deliberately separate constants: the mock exam simulator in
   §10.03 clocks at EXAM.PACE_TARGET_SEC, and only drills use this one. */
PMP.PRACTICE = Object.freeze({
  PACE_TARGET_SEC: 76,
  PACE_OVER_RATIO: 1.6,          /* elapsed ÷ target at which the meter goes red */
  LENGTHS: Object.freeze([5, 10, 20, 40]),
  DEFAULT_LENGTH: 10,
  DEFAULT_MODE: "practice",
  /* Adaptive weighting, consumed by §10.02.2. PRIOR and PRIOR_N stop a task
     with two attempts against it from reading as settled evidence; EXPONENT
     sharpens the pull towards weak tasks; the two multipliers favour items
     never seen and hold back ones answered correctly last time. */
  ADAPTIVE: Object.freeze({
    PRIOR: 0.5, PRIOR_N: 4, EXPONENT: 1.5, FLOOR: 0.05,
    UNSEEN_BOOST: 1.4, RIGHT_DAMP: 0.5
  })
});
</script>

<style>
/* ═══ §02  DESIGN TOKENS ═══════════════════════════════════════════════════
   Six named colours. Every other value in the file derives from this block.
   Discipline rule: --c-signal is reserved for focus, selection and active
   navigation. It is never used as an answer-state fill, so cyan and the
   --c-go teal never compete inside the navigator grid.
   ═════════════════════════════════════════════════════════════════════════ */

:root {
  /* ── 02.1  PALETTE (light) ───────────────────────────────────────────── */
  --c-ground:  #EDF1F5;
  --c-panel:   #FFFFFF;
  --c-signal:  #0B7A91;
  --c-go:      #0E7A57;
  --c-warn:    #9A6510;
  --c-danger:  #B3382A;

  /* ── 02.2  SURFACE RAMP — tints of the ground hue (214°) ─────────────── */
  --s-sunk:    #E2E8EF;
  --s-base:    var(--c-ground);
  --s-raise:   var(--c-panel);
  --s-edge:    #C7D3DF;
  --s-edge-hi: #A7B8C8;
  --s-wash:    rgba(11, 122, 145, 0.08);

  /* ── 02.3  FOREGROUND ────────────────────────────────────────────────── */
  --fg:        #101A24;
  --fg-muted:  #52657A;
  --fg-faint:  #7C8FA2;   /* 3.3:1 — icons and disabled only, never body copy */
  --fg-on-acc: #FFFFFF;

  /* ── 02.4  STATE FILLS — always rendered with a glyph ────────────────── */
  --st-correct-bg:   #DCF2E8;  --st-correct-fg:   #0E7A57;
  --st-incorrect-bg: #FBE3E0;  --st-incorrect-fg: #B3382A;
  --st-flagged-bg:   #FBEED4;  --st-flagged-fg:   #9A6510;
  --st-answered-bg:  #D4E4EC;  --st-answered-fg:  #23566B;
  --st-unseen-bg:    #E2E8EF;  --st-unseen-fg:    #7C8FA2;

  /* ── 02.5  TYPE ──────────────────────────────────────────────────────── */
  --font-ui: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
             Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
             "Liberation Mono", "Courier New", monospace;

  --t-xs:   0.75rem;
  --t-sm:   0.875rem;
  --t-base: 1rem;
  --t-md:   1.0625rem;
  --t-lg:   1.375rem;
  --t-xl:   1.75rem;
  --t-2xl:  2.5rem;
  --t-3xl:  3.5rem;

  --lh-tight: 1.15;
  --lh-snug:  1.35;
  --lh-body:  1.6;
  --ls-cap:   0.06em;

  --w-reg: 400; --w-med: 500; --w-semi: 600; --w-bold: 700;

  /* ── 02.6  SPACE ─────────────────────────────────────────────────────── */
  --sp-0: 2px;  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px;
  --sp-4: 16px; --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 64px;
  --hit-min: 44px;
  --measure: 68ch;
  --rail-w: 232px;

  /* ── 02.7  RADIUS ────────────────────────────────────────────────────── */
  --r-0: 0; --r-1: 3px; --r-2: 6px; --r-3: 10px; --r-4: 16px; --r-full: 999px;

  /* ── 02.8  EDGE & LIFT ───────────────────────────────────────────────── */
  --border:    1px solid var(--s-edge);
  --border-hi: 1px solid var(--s-edge-hi);
  --lift-1: 0 1px 0 rgba(16, 26, 36, 0.04), 0 1px 2px rgba(16, 26, 36, 0.06);
  --lift-2: 0 1px 0 rgba(16, 26, 36, 0.05), 0 6px 16px rgba(16, 26, 36, 0.10);
  --scrim:  rgba(6, 12, 18, 0.55);
  --ring-w: 2px;
  --ring: 0 0 0 var(--ring-w) var(--s-base), 0 0 0 calc(var(--ring-w) * 2) var(--c-signal);

  /* Icon sizes. Not one of the four scales, but named because §03 uses them
     in eleven places and they must stay in step with --hit-min. */
  --icon-sm: 14px; --icon: 18px; --icon-lg: 20px; --icon-xl: 24px;

  /* ── 02.9  MOTION ────────────────────────────────────────────────────── */
  --dur-1: 90ms; --dur-2: 160ms; --dur-3: 240ms;
  --ease: cubic-bezier(0.2, 0.6, 0.2, 1);
}

/* ── 02.10  DARK THEME ─────────────────────────────────────────────────── */
:root[data-theme="dark"] {
  --c-ground:  #0E1620;
  --c-panel:   #182430;
  --c-signal:  #38BDD8;
  --c-go:      #3FBF8F;
  --c-warn:    #E8A33D;
  --c-danger:  #F0705E;

  --s-sunk:    #0A1017;
  --s-edge:    #27384A;
  --s-edge-hi: #3A5068;
  --s-wash:    rgba(56, 189, 216, 0.10);

  --fg:        #E3EBF3;
  --fg-muted:  #93A7BB;
  --fg-faint:  #6A7E93;
  --fg-on-acc: #08121A;

  --st-correct-bg:   #10302A;  --st-correct-fg:   #3FBF8F;
  --st-incorrect-bg: #331B18;  --st-incorrect-fg: #F0705E;
  --st-flagged-bg:   #33270F;  --st-flagged-fg:   #E8A33D;
  --st-answered-bg:  #102A35;  --st-answered-fg:  #7FC9DC;
  --st-unseen-bg:    #1B2733;  --st-unseen-fg:    #6A7E93;

  --lift-1: 0 1px 0 rgba(0, 0, 0, 0.30);
  --lift-2: 0 1px 0 rgba(0, 0, 0, 0.35), 0 8px 20px rgba(0, 0, 0, 0.45);
  --scrim:  rgba(2, 6, 10, 0.70);
}

/* ── 02.11  REDUCED MOTION ─────────────────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  :root { --dur-1: 0ms; --dur-2: 0ms; --dur-3: 0ms; }
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

/* ═══ §03  COMPONENT STYLES ═══════════════════════════════════════════════ */

/* ── 03.1  RESET & BASE ─────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-ui);
  font-size: var(--t-base);
  line-height: var(--lh-snug);
  color: var(--fg);
  background: var(--s-base);
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  overflow-wrap: break-word;
}
h1, h2, h3, h4, p, figure, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
a { color: var(--c-signal); text-decoration-thickness: 1px; text-underline-offset: 2px; }
svg { display: block; }
[hidden] { display: none !important; }

/* Every clock, score and measured figure. Digits must not jitter. */
.num, .clock, .score, .pace, .stat-v, .navgrid { font-variant-numeric: tabular-nums; }

:focus { outline: none; }
:focus-visible {
  outline: none;
  box-shadow: var(--ring);
}
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip {
  position: absolute; left: var(--sp-2); top: -100px; z-index: 90;
  padding: var(--sp-3) var(--sp-4); background: var(--c-signal);
  color: var(--fg-on-acc); border-radius: var(--r-2); font-weight: var(--w-semi);
}
.skip:focus { top: var(--sp-2); }

/* ── 03.2  PRIMITIVES ───────────────────────────────────────────────────── */

/* Micro-label. Mono + tracking is the instrument-panel voice of this UI. */
.eyebrow {
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  letter-spacing: var(--ls-cap);
  text-transform: uppercase;
  color: var(--fg-muted);
  font-weight: var(--w-med);
}

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: var(--sp-2);
  min-height: var(--hit-min); padding: 0 var(--sp-4);
  border: var(--border-hi); border-radius: var(--r-2);
  background: var(--s-raise); color: var(--fg);
  font-size: var(--t-sm); font-weight: var(--w-semi);
  transition: background var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease);
}
.btn:hover { background: var(--s-sunk); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.btn--primary {
  background: var(--c-signal); border-color: var(--c-signal); color: var(--fg-on-acc);
}
.btn--primary:hover { background: var(--c-signal); filter: brightness(1.08); }
.btn--danger { border-color: var(--c-danger); color: var(--c-danger); }
.btn--ghost { border-color: transparent; background: transparent; }
.btn--ghost:hover { background: var(--s-sunk); }
.btn--sm { min-height: 36px; padding: 0 var(--sp-2); font-size: var(--t-xs); }
.btn--block { width: 100%; }
.btn .i { width: var(--icon); height: var(--icon); flex: 0 0 var(--icon); }

.field { display: block; margin-bottom: var(--sp-4); }
.field > .lbl {
  display: block; margin-bottom: var(--sp-1);
  font-size: var(--t-sm); font-weight: var(--w-med); color: var(--fg-muted);
}
.input, .select, .textarea {
  width: 100%; min-height: var(--hit-min);
  padding: var(--sp-2) var(--sp-3);
  background: var(--s-sunk); color: var(--fg);
  border: var(--border); border-radius: var(--r-2);
}
.textarea { min-height: 160px; font-family: var(--font-mono); font-size: var(--t-xs); line-height: 1.5; resize: vertical; }
.input:focus-visible, .select:focus-visible, .textarea:focus-visible { border-color: var(--c-signal); }
.hint { margin-top: var(--sp-1); font-size: var(--t-xs); color: var(--fg-muted); }

.chip {
  display: inline-flex; align-items: center; gap: var(--sp-1);
  padding: var(--sp-1) var(--sp-2);
  border: var(--border); border-radius: var(--r-1);
  background: var(--s-sunk); color: var(--fg-muted);
  font-size: var(--t-xs); font-weight: var(--w-med);
}
.chip .i { width: var(--icon-sm); height: var(--icon-sm); }
.chip--correct   { background: var(--st-correct-bg);   color: var(--st-correct-fg);   border-color: currentColor; }
.chip--incorrect { background: var(--st-incorrect-bg); color: var(--st-incorrect-fg); border-color: currentColor; }
.chip--flagged   { background: var(--st-flagged-bg);   color: var(--st-flagged-fg);   border-color: currentColor; }
.chip--answered  { background: var(--st-answered-bg);  color: var(--st-answered-fg);  border-color: currentColor; }

.card {
  background: var(--s-raise); border: var(--border);
  border-radius: var(--r-3); padding: var(--sp-5);
  box-shadow: var(--lift-1);
}
.card + .card { margin-top: var(--sp-4); }
.card > h2 { font-size: var(--t-lg); font-weight: var(--w-semi); line-height: var(--lh-tight); }
.card > .eyebrow + h2 { margin-top: var(--sp-1); }
.card > p { margin-top: var(--sp-2); color: var(--fg-muted); font-size: var(--t-sm); line-height: var(--lh-body); max-width: var(--measure); }

.grid { display: grid; gap: var(--sp-4); }
.rule { height: 1px; background: var(--s-edge); border: 0; margin: var(--sp-5) 0; }

.stat { display: flex; flex-direction: column; gap: var(--sp-1); }
.stat-k { font-family: var(--font-mono); font-size: var(--t-xs); letter-spacing: var(--ls-cap); text-transform: uppercase; color: var(--fg-muted); }
.stat-v { font-size: var(--t-2xl); font-weight: var(--w-semi); line-height: var(--lh-tight); }

/* ── 03.3  APP FRAME ────────────────────────────────────────────────────── */
.app { display: flex; min-height: 100%; }

.rail {
  position: fixed; inset: 0 auto 0 0; z-index: 40;
  width: min(86vw, var(--rail-w));
  display: flex; flex-direction: column;
  background: var(--s-raise); border-right: var(--border);
  transform: translateX(-100%);
  transition: transform var(--dur-2) var(--ease);
  overscroll-behavior: contain;
}
.rail[data-open="true"] { transform: translateX(0); box-shadow: var(--lift-2); }

.brand {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-4); border-bottom: var(--border); flex: 0 0 auto;
}
.brand .mark {
  width: 32px; height: 32px; flex: 0 0 32px; border-radius: var(--r-2);
  background: var(--s-wash); border: 1px solid var(--c-signal);
  display: grid; place-items: center; color: var(--c-signal);
}
.brand .mark .i { width: var(--icon); height: var(--icon); }
.brand-t { font-size: var(--t-sm); font-weight: var(--w-semi); line-height: 1.2; }
.brand-s { font-family: var(--font-mono); font-size: 10px; letter-spacing: var(--ls-cap); text-transform: uppercase; color: var(--fg-muted); }

.nav { flex: 1 1 auto; overflow-y: auto; padding: var(--sp-3) var(--sp-2) var(--sp-5); }
.nav-grp { margin-top: var(--sp-4); }
.nav-grp:first-child { margin-top: 0; }
.nav-grp > .eyebrow { padding: var(--sp-2) var(--sp-3) var(--sp-1); display: block; }
.nav-i {
  display: flex; align-items: center; gap: var(--sp-3);
  width: 100%; min-height: var(--hit-min);
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--r-2);
  color: var(--fg-muted); font-size: var(--t-sm); font-weight: var(--w-med);
  text-align: left; text-decoration: none;
  border-left: 2px solid transparent;
  transition: background var(--dur-1) var(--ease), color var(--dur-1) var(--ease);
}
.nav-i:hover { background: var(--s-sunk); color: var(--fg); }
.nav-i .i { width: var(--icon); height: var(--icon); flex: 0 0 var(--icon); color: var(--fg-faint); }
.nav-i[aria-current="page"] {
  background: var(--s-wash); color: var(--fg);
  font-weight: var(--w-semi); border-left-color: var(--c-signal);
}
.nav-i[aria-current="page"] .i { color: var(--c-signal); }
.nav-i .badge {
  margin-left: auto; font-family: var(--font-mono); font-size: 11px;
  padding: 1px var(--sp-1); border-radius: var(--r-1);
  background: var(--s-sunk); color: var(--fg-muted);
}

.rail-foot { flex: 0 0 auto; padding: var(--sp-3); border-top: var(--border); display: flex; gap: var(--sp-2); }
.rail-foot .btn { flex: 1 1 0; min-width: 0; }

.scrim {
  position: fixed; inset: 0; z-index: 35;
  background: var(--scrim);
  opacity: 0; pointer-events: none;
  transition: opacity var(--dur-2) var(--ease);
}
.scrim[data-open="true"] { opacity: 1; pointer-events: auto; }

.main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: var(--sp-2);
  min-height: 56px; padding: var(--sp-2) var(--sp-3);
  background: var(--s-raise); border-bottom: var(--border);
  padding-top: max(var(--sp-2), env(safe-area-inset-top));
}
.topbar h1 {
  font-size: var(--t-base); font-weight: var(--w-semi);
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.icon-btn {
  display: grid; place-items: center;
  width: var(--hit-min); height: var(--hit-min); flex: 0 0 var(--hit-min);
  border-radius: var(--r-2); color: var(--fg-muted);
}
.icon-btn:hover { background: var(--s-sunk); color: var(--fg); }
.icon-btn .i { width: var(--icon-lg); height: var(--icon-lg); }
.topbar .spacer { flex: 1 1 auto; }
.mode-tag {
  display: inline-flex; align-items: center; gap: var(--sp-1);
  font-family: var(--font-mono); font-size: var(--t-xs);
  letter-spacing: var(--ls-cap); text-transform: uppercase;
  color: var(--fg-muted); padding: var(--sp-1) var(--sp-2);
  border: var(--border); border-radius: var(--r-1);
}
.mode-tag .dot { width: 7px; height: 7px; border-radius: var(--r-full); background: var(--c-go); }
.mode-tag[data-mode="session"] .dot { background: var(--c-warn); }
.mode-tag[data-mode="probing"] .dot { background: var(--fg-faint); }
@media (max-width: 599px) {
  /* The dot and its accessible name carry the meaning; the words do not fit. */
  #mode-text {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
  .mode-tag { padding: var(--sp-1); }
}

.view {
  flex: 1 1 auto; padding: var(--sp-5) var(--sp-4) var(--sp-8);
  max-width: 1120px; width: 100%; margin: 0 auto;
  padding-bottom: max(var(--sp-8), env(safe-area-inset-bottom));
}
.view-hd { margin-bottom: var(--sp-5); }
.view-hd h2 { font-size: var(--t-xl); font-weight: var(--w-semi); line-height: var(--lh-tight); margin-top: var(--sp-1); }
.view-hd p { margin-top: var(--sp-2); color: var(--fg-muted); font-size: var(--t-md); line-height: var(--lh-body); max-width: var(--measure); }

/* ── 03.4  BANNER, TOAST, DIALOG, EMPTY ─────────────────────────────────── */
.banner {
  display: flex; align-items: flex-start; gap: var(--sp-3); flex-wrap: wrap;
  padding: var(--sp-3) var(--sp-4);
  background: var(--st-flagged-bg); color: var(--st-flagged-fg);
  border-bottom: 1px solid currentColor;
}
.banner .i { width: var(--icon-lg); height: var(--icon-lg); flex: 0 0 var(--icon-lg); margin-top: var(--sp-0); }
.banner-b { flex: 1 1 min(100%, 220px); min-width: 0; }
.banner-t { font-weight: var(--w-semi); font-size: var(--t-sm); }
.banner-d { margin-top: var(--sp-1); font-size: var(--t-sm); line-height: var(--lh-body); color: var(--fg); }
.banner .btn { flex: 0 0 auto; align-self: center; background: var(--s-raise); }
.banner--danger { background: var(--st-incorrect-bg); color: var(--st-incorrect-fg); }

.toasts {
  position: fixed; z-index: 70; left: 50%; transform: translateX(-50%);
  bottom: max(var(--sp-4), env(safe-area-inset-bottom));
  width: min(480px, calc(100vw - var(--sp-6)));
  display: flex; flex-direction: column; gap: var(--sp-2);
  pointer-events: none;
}
.toast {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  background: var(--s-raise); border: var(--border-hi);
  border-radius: var(--r-3); box-shadow: var(--lift-2);
  font-size: var(--t-sm); pointer-events: auto;
  animation: rise var(--dur-3) var(--ease);
}
.toast .i { width: var(--icon); height: var(--icon); flex: 0 0 var(--icon); }
.toast--ok   { border-color: var(--c-go); }
.toast--ok .i   { color: var(--c-go); }
.toast--warn { border-color: var(--c-warn); }
.toast--warn .i { color: var(--c-warn); }
.toast--err  { border-color: var(--c-danger); }
.toast--err .i  { color: var(--c-danger); }
.toast .x { margin-left: auto; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

dialog.sheet {
  width: min(560px, calc(100vw - var(--sp-5)));
  max-height: min(80vh, 720px);
  padding: 0; border: var(--border-hi); border-radius: var(--r-4);
  background: var(--s-raise); color: var(--fg); box-shadow: var(--lift-2);
  overflow: hidden;
}
dialog.sheet::backdrop { background: var(--scrim); }
.sheet-hd { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-4) var(--sp-5); border-bottom: var(--border); }
.sheet-hd h2 { font-size: var(--t-lg); font-weight: var(--w-semi); flex: 1 1 auto; }
.sheet-bd { padding: var(--sp-5); overflow-y: auto; max-height: 56vh; }
.sheet-bd p { font-size: var(--t-sm); line-height: var(--lh-body); color: var(--fg-muted); }
.sheet-bd p + p { margin-top: var(--sp-3); }
.sheet-ft { display: flex; gap: var(--sp-2); justify-content: flex-end; flex-wrap: wrap; padding: var(--sp-4) var(--sp-5); border-top: var(--border); background: var(--s-sunk); }

.empty {
  display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-3);
  padding: var(--sp-6) var(--sp-5);
  border: 1px dashed var(--s-edge-hi); border-radius: var(--r-3);
  background: var(--s-raise);
}
.empty .i { width: var(--icon-xl); height: var(--icon-xl); color: var(--fg-faint); }
.empty h3 { font-size: var(--t-base); font-weight: var(--w-semi); }
.empty p { font-size: var(--t-sm); color: var(--fg-muted); line-height: var(--lh-body); max-width: var(--measure); }

.kv { display: grid; grid-template-columns: max-content 1fr; gap: var(--sp-2) var(--sp-4); font-size: var(--t-sm); }
.kv dt { color: var(--fg-muted); }
.kv dd { margin: 0; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ── 03.5  NAVIGATOR GRID — the signature element ───────────────────────── */
.navgrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(30px, 1fr));
  gap: var(--sp-1);
}
.navgrid-c {
  position: relative;
  aspect-ratio: 1; min-height: 30px;
  display: grid; place-items: center;
  border: 1px solid var(--s-edge); border-radius: var(--r-1);
  background: var(--st-unseen-bg); color: var(--st-unseen-fg);
  font-family: var(--font-mono); font-size: 11px; font-weight: var(--w-med);
}
.navgrid-c[data-st="answered"] { background: var(--st-answered-bg); color: var(--st-answered-fg); border-color: currentColor; }
.navgrid-c[data-st="flagged"]  { background: var(--st-flagged-bg);  color: var(--st-flagged-fg);  border-color: currentColor; }
.navgrid-c[data-st="correct"]  { background: var(--st-correct-bg);  color: var(--st-correct-fg);  border-color: currentColor; }
.navgrid-c[data-st="incorrect"]{ background: var(--st-incorrect-bg);color: var(--st-incorrect-fg);border-color: currentColor; }
/* Shape, not only hue: every state carries a corner glyph. */
.navgrid-c::after {
  content: ""; position: absolute; right: 2px; top: 2px;
  width: 8px; height: 8px; border: 1.5px solid currentColor;
}
.navgrid-c[data-st="unseen"]::after   { border-radius: var(--r-full); border-style: dotted; }
.navgrid-c[data-st="answered"]::after { border-radius: var(--r-full); background: currentColor; }
.navgrid-c[data-st="flagged"]::after  { border: 0; background: currentColor; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.navgrid-c[data-st="correct"]::after  { border: 0; background: currentColor; clip-path: polygon(0 52%, 18% 34%, 40% 56%, 82% 6%, 100% 24%, 40% 100%); }
.navgrid-c[data-st="incorrect"]::after{ border: 0; background: currentColor; clip-path: polygon(76% 0, 100% 24%, 24% 100%, 0 76%); }

.legend { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); margin-top: var(--sp-4); }

/* ── 03.6  RESERVED (stub view scaffolding) ─────────────────────────────── */
.stub-list { display: grid; gap: var(--sp-2); margin-top: var(--sp-4); }
.stub-list li { display: flex; gap: var(--sp-3); align-items: baseline; font-size: var(--t-sm); color: var(--fg-muted); line-height: var(--lh-body); }
.stub-list .ref { font-family: var(--font-mono); font-size: var(--t-xs); color: var(--c-signal); flex: 0 0 auto; }

/* ── 03.7  QUESTION ENGINE ──────────────────────────────────────────────────
   Filters, the item card, the five renderers and the pace meter. Answer state
   is carried by a border and a glyph as well as a fill, on the same rule as
   the navigator grid in 03.5: --c-signal stays reserved for focus and
   selection, so a selected option and a correct option never share a hue. */

/* Filters ── §3.2 */
.filters {
  display: grid; gap: var(--sp-3);
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  margin-top: var(--sp-4);
}
.filters .field { margin-bottom: 0; }
.filter-bar {
  display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap;
  margin-top: var(--sp-5); padding-top: var(--sp-4); border-top: var(--border);
}
.filter-bar .spacer { flex: 1 1 auto; }
.pool-n { font-family: var(--font-mono); font-size: var(--t-sm); color: var(--fg-muted); }
.pool-n b { color: var(--fg); font-size: var(--t-lg); font-weight: var(--w-semi); }

/* Mode picker ── §3.2. [data-sel] rather than :has(), so the file does not
   depend on a selector that older offline browsers may not support. */
.modes { display: grid; gap: var(--sp-2); margin-top: var(--sp-4); }
.mode-opt {
  display: flex; gap: var(--sp-3); align-items: flex-start;
  padding: var(--sp-3) var(--sp-4); min-height: var(--hit-min);
  border: var(--border-hi); border-radius: var(--r-2);
  background: var(--s-raise); cursor: pointer;
}
.mode-opt:hover { background: var(--s-sunk); }
.mode-opt:focus-within { box-shadow: var(--ring); }
.mode-opt input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.mode-opt[data-sel="true"] { border-color: var(--c-signal); background: var(--s-wash); }
.mode-opt .i { width: var(--icon-lg); height: var(--icon-lg); flex: 0 0 var(--icon-lg); color: var(--fg-faint); margin-top: var(--sp-0); }
.mode-opt[data-sel="true"] .i { color: var(--c-signal); }
.mode-opt .t { font-size: var(--t-sm); font-weight: var(--w-semi); }
.mode-opt .d { margin-top: var(--sp-1); font-size: var(--t-xs); color: var(--fg-muted); line-height: var(--lh-body); }

/* Drill header ── progress, clock, pace */
.drill-hd { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-4); }
.drill-hd .spacer { flex: 1 1 auto; }
.progress { flex: 0 1 220px; min-width: 90px; height: 6px; border-radius: var(--r-full); background: var(--s-sunk); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--c-signal); transition: width var(--dur-2) var(--ease); }

.pace { display: inline-flex; align-items: center; gap: var(--sp-2); }
.pace .bar { width: 64px; height: 6px; border-radius: var(--r-full); background: var(--s-sunk); overflow: hidden; }
.pace .bar > i { display: block; height: 100%; width: 0; background: var(--c-go); }
.pace .clock { font-family: var(--font-mono); font-size: var(--t-sm); color: var(--fg-muted); }
.pace[data-state="warn"] .bar > i { background: var(--c-warn); }
.pace[data-state="warn"] .clock { color: var(--st-flagged-fg); }
.pace[data-state="over"] .bar > i { background: var(--c-danger); }
.pace[data-state="over"] .clock { color: var(--st-incorrect-fg); font-weight: var(--w-semi); }

/* Item card */
.q-meta { display: flex; gap: var(--sp-2); flex-wrap: wrap; align-items: center; }
.q-stem { margin-top: var(--sp-4); font-size: var(--t-md); line-height: var(--lh-body); max-width: var(--measure); }
.q-instr { margin-top: var(--sp-3); font-size: var(--t-sm); color: var(--fg-muted); font-weight: var(--w-med); }

/* Options ── single and multi */
.opts { display: grid; gap: var(--sp-2); margin-top: var(--sp-4); border: 0; padding: 0; margin-inline: 0; }
.opt {
  position: relative; display: flex; gap: var(--sp-3); align-items: flex-start;
  padding: var(--sp-3) var(--sp-4); min-height: var(--hit-min);
  border: var(--border-hi); border-radius: var(--r-2);
  background: var(--s-raise); cursor: pointer;
  transition: background var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease);
}
.opt:hover { background: var(--s-sunk); }
.opt:focus-within { box-shadow: var(--ring); }
.opt input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.opt .key {
  flex: 0 0 24px; height: 24px; display: grid; place-items: center;
  border: var(--border-hi); border-radius: var(--r-1);
  font-family: var(--font-mono); font-size: var(--t-xs); color: var(--fg-muted);
}
.opt .txt { flex: 1 1 auto; min-width: 0; font-size: var(--t-sm); line-height: var(--lh-body); }
.opt .mark { flex: 0 0 var(--icon); width: var(--icon); height: var(--icon); margin-top: var(--sp-0); }
.opt[data-sel="true"] { border-color: var(--c-signal); background: var(--s-wash); }
.opt[data-sel="true"] .key { border-color: var(--c-signal); color: var(--c-signal); font-weight: var(--w-bold); }
.opt[data-mark] { cursor: default; }
.opt[data-mark="correct"]   { border-color: var(--st-correct-fg);   background: var(--st-correct-bg); }
.opt[data-mark="correct"] .mark, .opt[data-mark="correct"] .key { color: var(--st-correct-fg); }
.opt[data-mark="incorrect"] { border-color: var(--st-incorrect-fg); background: var(--st-incorrect-bg); }
.opt[data-mark="incorrect"] .mark, .opt[data-mark="incorrect"] .key { color: var(--st-incorrect-fg); }
.opt[data-mark="missed"]    { border-color: var(--st-flagged-fg);   background: var(--st-flagged-bg); }
.opt[data-mark="missed"] .mark, .opt[data-mark="missed"] .key { color: var(--st-flagged-fg); }
.why { margin-top: var(--sp-2); font-size: var(--t-xs); line-height: var(--lh-body); color: var(--fg-muted); }
.why b { color: var(--fg); font-weight: var(--w-semi); }

/* Matching and drop-down */
.match { display: grid; gap: var(--sp-2); margin-top: var(--sp-4); }
.match-row {
  display: grid; gap: var(--sp-2); align-items: center;
  padding: var(--sp-3) var(--sp-4);
  border: var(--border); border-radius: var(--r-2); background: var(--s-raise);
}
.match-row .prompt { font-size: var(--t-sm); line-height: var(--lh-body); }
.match-row .select { max-width: 100%; }
.match-row[data-mark="correct"]   { border-color: var(--st-correct-fg);   background: var(--st-correct-bg); }
.match-row[data-mark="incorrect"] { border-color: var(--st-incorrect-fg); background: var(--st-incorrect-bg); }
@media (min-width: 700px) {
  .match-row { grid-template-columns: 1fr minmax(180px, 38%); }
  .match-row .why { grid-column: 1 / -1; }
}

/* Hotspot and graphic */
.hotspot { margin-top: var(--sp-4); padding: var(--sp-3); border: var(--border); border-radius: var(--r-3); background: var(--s-sunk); }
.hotspot svg { width: 100%; height: auto; max-width: 680px; margin: 0 auto; }
.hotspot .cap { margin-top: var(--sp-2); font-size: var(--t-xs); color: var(--fg-muted); text-align: center; }
.hot { cursor: pointer; }
.hot .box { fill: var(--s-raise); stroke: var(--s-edge-hi); stroke-width: 1.5; }
.hot:hover .box { fill: var(--s-wash); }
.hot .lab { fill: var(--fg); font-family: var(--font-ui); font-size: 12px; font-weight: 500; pointer-events: none; }
.hot .num { fill: var(--fg-faint); font-family: var(--font-mono); font-size: 10px; pointer-events: none; }
.hot:focus-visible { outline: none; }
.hot:focus-visible .box { stroke: var(--c-signal); stroke-width: 3; stroke-dasharray: 5 3; }
.hot[data-sel="true"] .box { fill: var(--s-wash); stroke: var(--c-signal); stroke-width: 2.5; }
.hot[data-mark="correct"] .box   { fill: var(--st-correct-bg);   stroke: var(--st-correct-fg);   stroke-width: 2.5; }
.hot[data-mark="incorrect"] .box { fill: var(--st-incorrect-bg); stroke: var(--st-incorrect-fg); stroke-width: 2.5; }
.hot[data-mark="missed"] .box    { fill: var(--st-flagged-bg);   stroke: var(--st-flagged-fg);   stroke-width: 2.5; stroke-dasharray: 6 3; }
.flow { stroke: var(--s-edge-hi); stroke-width: 1.5; fill: none; }
.flow-h { fill: var(--s-edge-hi); }

/* Fill in the blank */
.blanks { display: grid; gap: var(--sp-3); margin-top: var(--sp-4); }
.blank { display: flex; gap: var(--sp-3); align-items: center; flex-wrap: wrap; padding: var(--sp-3) var(--sp-4); border: var(--border); border-radius: var(--r-2); background: var(--s-raise); }
.blank .lbl { flex: 1 1 220px; font-size: var(--t-sm); line-height: var(--lh-body); }
.blank .box { display: flex; align-items: center; gap: var(--sp-2); }
.blank .input { width: 150px; font-family: var(--font-mono); text-align: right; }
.blank .unit { font-family: var(--font-mono); font-size: var(--t-sm); color: var(--fg-muted); }
.blank[data-mark="correct"]   { border-color: var(--st-correct-fg);   background: var(--st-correct-bg); }
.blank[data-mark="incorrect"] { border-color: var(--st-incorrect-fg); background: var(--st-incorrect-bg); }
.blank .why { flex: 1 1 100%; }

/* Verdict and explanation */
.verdict {
  display: flex; gap: var(--sp-3); align-items: flex-start;
  margin-top: var(--sp-5); padding: var(--sp-3) var(--sp-4);
  border: 1px solid currentColor; border-radius: var(--r-2);
}
.verdict .i { width: var(--icon-lg); height: var(--icon-lg); flex: 0 0 var(--icon-lg); }
.verdict .t { font-weight: var(--w-semi); font-size: var(--t-sm); }
.verdict .d { margin-top: var(--sp-1); font-size: var(--t-sm); color: var(--fg); line-height: var(--lh-body); }
.verdict--right { background: var(--st-correct-bg);   color: var(--st-correct-fg); }
.verdict--part  { background: var(--st-flagged-bg);   color: var(--st-flagged-fg); }
.verdict--wrong { background: var(--st-incorrect-bg); color: var(--st-incorrect-fg); }
.explain { margin-top: var(--sp-4); font-size: var(--t-sm); line-height: var(--lh-body); max-width: var(--measure); }
.explain h3 { font-size: var(--t-xs); font-family: var(--font-mono); letter-spacing: var(--ls-cap); text-transform: uppercase; color: var(--fg-muted); margin-bottom: var(--sp-2); }
.mindset {
  margin-top: var(--sp-3); padding: var(--sp-3) var(--sp-4);
  border-left: 2px solid var(--c-signal); border-radius: 0 var(--r-2) var(--r-2) 0;
  background: var(--s-raise); max-width: var(--measure);
}
.mindset h3 { font-size: var(--t-xs); font-family: var(--font-mono); letter-spacing: var(--ls-cap); text-transform: uppercase; color: var(--fg-muted); margin-bottom: var(--sp-1); }
.mindset p { font-size: var(--t-sm); line-height: var(--lh-body); }

/* Item tools and footer */
.q-tools { display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap; margin-top: var(--sp-5); padding-top: var(--sp-4); border-top: var(--border); }
.q-tools .spacer { flex: 1 1 auto; }
.btn[data-on="true"] { border-color: var(--st-flagged-fg); background: var(--st-flagged-bg); color: var(--st-flagged-fg); }
.q-note { margin-top: var(--sp-3); padding: var(--sp-3) var(--sp-4); border-left: 2px solid var(--c-warn); background: var(--s-sunk); border-radius: var(--r-1); font-size: var(--t-sm); line-height: var(--lh-body); white-space: pre-wrap; }

/* Keyboard help */
.keylist { display: grid; gap: var(--sp-2); }
.keylist li { display: flex; gap: var(--sp-3); align-items: baseline; font-size: var(--t-sm); color: var(--fg-muted); }
.kbd {
  flex: 0 0 auto; font-family: var(--font-mono); font-size: 11px;
  padding: 2px var(--sp-1); min-width: 26px; text-align: center;
  border: var(--border-hi); border-bottom-width: 2px; border-radius: var(--r-1); color: var(--fg);
}

/* Summary */
.sum-grid { display: grid; gap: var(--sp-5); grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
.tbl { width: 100%; border-collapse: collapse; font-size: var(--t-sm); margin-top: var(--sp-3); }
.tbl th, .tbl td { text-align: left; padding: var(--sp-2); border-bottom: 1px solid var(--s-edge); }
.tbl th { font-family: var(--font-mono); font-size: var(--t-xs); letter-spacing: var(--ls-cap); text-transform: uppercase; color: var(--fg-muted); font-weight: var(--w-med); }
.tbl .n { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
.review { margin-top: var(--sp-3); border: var(--border); border-radius: var(--r-2); background: var(--s-raise); overflow: hidden; }
.review > summary { display: flex; gap: var(--sp-3); align-items: center; padding: var(--sp-3) var(--sp-4); min-height: var(--hit-min); cursor: pointer; font-size: var(--t-sm); }
.review > summary::-webkit-details-marker { display: none; }
.review > summary .n { font-family: var(--font-mono); font-size: var(--t-xs); color: var(--fg-muted); flex: 0 0 auto; }
.review > summary .s { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.review > summary:focus-visible { box-shadow: var(--ring); }
.review[open] > summary { border-bottom: var(--border); background: var(--s-sunk); }
.review-bd { padding: var(--sp-4); }

/* ── 03.10  MOCK EXAM ───────────────────────────────────────────────────────
   The clock is the one number on screen that has to be readable from a metre
   away, so it gets the display size and the mono face. Everything else in the
   header stays quiet: a sitting is not the place for chrome. */
.exam-hd { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-4); }
.exam-hd .spacer { flex: 1 1 auto; }
.exam-clock-wrap {
  display: inline-flex; align-items: center; gap: var(--sp-2);
  padding: var(--sp-1) var(--sp-3); border: var(--border); border-radius: var(--r-2);
  background: var(--s-raise);
}
.exam-clock-wrap .i { width: var(--icon); height: var(--icon); color: var(--fg-faint); }
.exam-clock { font-family: var(--font-mono); font-size: var(--t-xl); font-weight: var(--w-semi); font-variant-numeric: tabular-nums; line-height: 1; }
.exam-clock-l { font-size: var(--t-xs); color: var(--fg-muted); }
.exam-clock-wrap[data-state="warn"] { border-color: var(--c-warn); }
.exam-clock-wrap[data-state="warn"] .exam-clock { color: var(--st-flagged-fg); }
.exam-clock-wrap[data-state="over"] { border-color: var(--c-danger); background: var(--st-incorrect-bg); }
.exam-clock-wrap[data-state="over"] .exam-clock { color: var(--st-incorrect-fg); }

.nav-blk-hd { display: flex; align-items: center; gap: var(--sp-3); margin: var(--sp-5) 0 var(--sp-2); }
.nav-blk-hd:first-of-type { margin-top: var(--sp-4); }
.nav-blk-hd .t { font-family: var(--font-mono); font-size: var(--t-xs); letter-spacing: var(--ls-cap); text-transform: uppercase; color: var(--fg-muted); }

/* A closed block is drawn back rather than hidden: the candidate still needs
   to see how much of the paper is behind them. The diagonal is the state
   carrier, so it survives without colour. */
.navgrid-c[data-locked="true"] { opacity: 0.55; cursor: default; }
.navgrid-c[data-locked="true"]::before {
  content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(135deg, transparent 0 4px, var(--s-edge-hi) 4px 5px);
  border-radius: inherit; pointer-events: none;
}
.navgrid-c[data-cur="true"] { box-shadow: var(--ring); }
.chip--locked { background: var(--st-unseen-bg); color: var(--fg-muted); }

.lock-note {
  display: flex; gap: var(--sp-3); align-items: flex-start;
  margin-top: var(--sp-4); padding: var(--sp-3) var(--sp-4);
  border-left: 2px solid var(--c-warn); background: var(--s-sunk);
  border-radius: var(--r-1); font-size: var(--t-sm); line-height: var(--lh-body);
}
.lock-note .i { width: var(--icon); height: var(--icon); flex: 0 0 var(--icon); color: var(--c-warn); }
.lock-warn { color: var(--st-flagged-fg); font-weight: var(--w-med); }

.break-card { text-align: center; }
.break-clock {
  display: block; margin: var(--sp-4) 0; font-family: var(--font-mono);
  font-size: var(--t-3xl); font-weight: var(--w-semi); font-variant-numeric: tabular-nums;
  line-height: 1; color: var(--c-signal);
}
.break-card p { margin-inline: auto; }
.resume-card { border-color: var(--c-signal); }

.band { font-weight: var(--w-med); }
.band--above  { background: var(--st-correct-bg);   color: var(--st-correct-fg);   border-color: currentColor; }
.band--target { background: var(--st-answered-bg);  color: var(--st-answered-fg);  border-color: currentColor; }
.band--below  { background: var(--st-flagged-bg);   color: var(--st-flagged-fg);   border-color: currentColor; }
.band--needs  { background: var(--st-incorrect-bg); color: var(--st-incorrect-fg); border-color: currentColor; }
.band--thin   { background: var(--st-unseen-bg);    color: var(--fg-muted); }

/* ── 03.11  DATA AND AUDIT ─────────────────────────────────────────────── */
.err-tbl { margin-top: var(--sp-4); }
.err-tbl td { vertical-align: top; font-size: var(--t-xs); line-height: var(--lh-body); }
.where { font-family: var(--font-mono); font-size: var(--t-xs); color: var(--c-signal); white-space: nowrap; }
.code {
  margin-top: var(--sp-4); padding: var(--sp-4); border: var(--border); border-radius: var(--r-2);
  background: var(--s-sunk); font-family: var(--font-mono); font-size: var(--t-xs);
  line-height: 1.55; overflow-x: auto; white-space: pre; color: var(--fg-muted);
}

.verdict-card { display: flex; gap: var(--sp-4); align-items: flex-start; }
.verdict-card .verdict-i { width: var(--icon-xl); height: var(--icon-xl); flex: 0 0 var(--icon-xl); }
.verdict-card[data-pass="true"]  { border-color: var(--st-correct-fg); }
.verdict-card[data-pass="true"] .verdict-i { color: var(--st-correct-fg); }
.verdict-card[data-pass="false"] { border-color: var(--st-incorrect-fg); }
.verdict-card[data-pass="false"] .verdict-i { color: var(--st-incorrect-fg); }

.eco-grid { display: grid; gap: var(--sp-5); grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); margin-top: var(--sp-5); }
.eco-col { display: grid; gap: var(--sp-1); align-content: start; }
.eco-row {
  display: flex; align-items: center; gap: var(--sp-2);
  padding: var(--sp-1) var(--sp-2); border-radius: var(--r-1);
  font-size: var(--t-xs); border-left: 3px solid var(--s-edge-hi);
}
.eco-row .eco-n { font-family: var(--font-mono); color: var(--fg-faint); width: 1.4em; }
.eco-row .eco-l { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.eco-row .eco-c { font-family: var(--font-mono); font-weight: var(--w-semi); }
.eco-row[data-st="none"] { border-left-color: var(--c-danger); background: var(--st-incorrect-bg); color: var(--st-incorrect-fg); }
.eco-row[data-st="thin"] { border-left-color: var(--c-warn); background: var(--st-flagged-bg); color: var(--st-flagged-fg); }
.eco-row[data-st="ok"]   { border-left-color: var(--c-signal); }
.eco-row[data-st="full"] { border-left-color: var(--c-go); }

.queue-card { border-color: var(--c-warn); }

/* ── 03.8  RESPONSIVE ───────────────────────────────────────────────────── */
@media (min-width: 600px) {
  .view { padding-left: var(--sp-6); padding-right: var(--sp-6); }
  .grid--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (min-width: 900px) {
  .rail {
    position: sticky; top: 0; right: auto; bottom: auto; left: auto;
    height: 100vh; align-self: flex-start;
    transform: none; flex: 0 0 var(--rail-w); width: var(--rail-w); box-shadow: none;
  }
  .scrim { display: none; }
  .nav-toggle { display: none; }
  .grid--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (min-width: 1200px) {
  .view { padding-top: var(--sp-6); }
}

/* ── 03.9  PRINT — formula sheet and reference pages ────────────────────── */
@media print {
  /* The only place raw colours are allowed: paper is white and ink is black,
     whichever screen theme the person is using. */
  .rail, .topbar, .scrim, .toasts, .banner { display: none !important; }
  body { background: #fff; color: #000; }
  .view { max-width: none; padding: 0; }
  .card { box-shadow: none; border: 1px solid #999; break-inside: avoid; }
}
</style>

  {
    id: "pmp-p4-001", type: "multi", domain: "people", ecoTask: "people-4",
    approach: "agile", difficulty: 3, tags: ["stakeholders", "engagement", "reviews"],
    stem: "Your sprint reviews are attended by the product owner and nobody else. Three business units will use the product at launch, and their managers have all declined the invitation more than once, saying they will review it when it is finished. Which two actions should the project manager take?",
    options: [
      { id: "a", text: "Find out from each manager what would make attending worth their time, and change the review to match.", correct: true,
        rationale: "Repeated declines are information rather than rudeness. The invitation is not paying for the hour it asks for, and the only people who can say what would are the ones declining." },
      { id: "b", text: "Take working software to each business unit in their own setting, on their own schedule.", correct: true,
        rationale: "If the stakeholders will not come to the demonstration, the demonstration goes to them. Feedback from real users before launch is the thing being protected, and the ceremony is only one way of getting it." },
      { id: "c", text: "Ask the sponsor to make attendance at sprint reviews mandatory for the three managers.", correct: false,
        rationale: "Mandated attendance fills seats and rarely produces engagement. It also converts a relationship you need at launch into an obligation someone imposed on them." },
      { id: "d", text: "Record the reviews and send the video, so the managers can watch when convenient.", correct: false,
        rationale: "A recording is a broadcast. It removes the one thing a review is for, which is the conversation that happens when the people who will use the thing react to it in front of the team." },
      { id: "e", text: "Note in the risk register that late business feedback may cause rework, and continue as you are.", correct: false,
        rationale: "Recording a risk you have the means to reduce is a way of documenting a decision not to act. The exposure is real, but the register is not the response." }
    ],
    explanation: "Stakeholder engagement is tailored to the stakeholder rather than run as a standing invitation everyone is expected to accept. Two moves follow: find out what would make the session valuable to them, and if the format is the obstacle, take the product to where they are. Compulsion and recordings both preserve the ceremony at the cost of the thing the ceremony exists to produce."
  },

  {
    id: "pmp-p4-002", type: "single", domain: "people", ecoTask: "people-4",
    approach: "predictive", difficulty: 2, tags: ["stakeholders", "analysis", "register"],
    stem: "You have identified twenty-eight stakeholders on a regulatory reporting project. Your sponsor asks why you are spending time classifying them rather than starting the requirements workshops. What is the best explanation of the value of the analysis?",
    options: [
      { id: "a", text: "It produces the stakeholder register, which is a required project artifact.", correct: false,
        rationale: "Answering that an artifact is required is the weakest defence available, and it invites the reply that the artifact can be written afterwards. It also does not say what the analysis is for." },
      { id: "b", text: "It shows which stakeholders have the power and interest to affect the outcome, so engagement effort goes where it changes something.", correct: true,
        rationale: "Classification exists to allocate a finite amount of attention. Knowing who can stop the project and who merely wants to be told is what makes the difference between an engagement plan and a mailing list." },
      { id: "c", text: "It identifies who must approve the requirements, which prevents rework later.", correct: false,
        rationale: "Approval authority is one output and a narrow one. Plenty of stakeholders who approve nothing can still sink a regulatory project, and the analysis is what surfaces them." },
      { id: "d", text: "It ensures all twenty-eight are invited to the requirements workshops so nothing is missed.", correct: false,
        rationale: "Inviting everyone to everything is the outcome analysis is meant to prevent. Twenty-eight people in a requirements workshop produces a worse result than the right six." }
    ],
    explanation: "Stakeholder analysis is a rationing tool. Attention is the scarce resource on any project, and classifying by influence and interest is how it gets pointed at the people whose position will actually move the outcome. The register and the approval list fall out of that work, but treating either as the purpose leads to a document that is complete and an engagement plan that is undifferentiated."
  },

  {
    id: "pmp-p4-003", type: "single", domain: "people", ecoTask: "people-4",
    approach: "hybrid", difficulty: 4, tags: ["stakeholders", "resistance", "influence"],
    stem: "A senior operations manager with no formal authority over your project has begun criticising it in forums you are not invited to. Your delivery depends on her team's cooperation in three months. She has declined two meeting requests. What should the project manager do?",
    options: [
      { id: "a", text: "Ask the sponsor to speak to her peer group and correct the criticism.", correct: false,
        rationale: "Countering criticism through hierarchy answers the noise and hardens the position. It also tells her that the way to be engaged with is to be complained about upward." },
      { id: "b", text: "Find out through people she trusts what her objection actually is, then address that before asking to meet again.", correct: true,
        rationale: "Two declined meetings mean a third invitation will not land either. Understanding the substance first is what turns the next approach into something worth her time rather than a repeat." },
      { id: "c", text: "Document the resistance in the risk register and build a contingency plan that avoids depending on her team.", correct: false,
        rationale: "Sensible to think about, but the dependency is real in three months and engineering around a senior operations function is rarely available. It also concedes the relationship." },
      { id: "d", text: "Send her the project documentation and a summary of the benefits, to correct any misunderstanding.", correct: false,
        rationale: "This assumes the objection is an information gap. Someone criticising in private forums usually has a substantive concern about impact on her operation, which more documentation will not touch." }
    ],
    explanation: "Resistance from someone with informal influence is handled by understanding it, not by out-communicating it. Declined meetings mean the direct route is closed for now, so the work goes through the network she does trust to find out what the actual objection is. Escalating or broadcasting benefits both treat her as an obstacle to be overcome, which is what turns a concern into an opposition."
  }
,

  {
    id: "pmp-p5-001", type: "single", domain: "people", ecoTask: "people-5",
    approach: "predictive", difficulty: 3, tags: ["expectations", "alignment", "scope"],
    stem: "Your sponsor has told the board the new system will go live in March. Your schedule, which the sponsor approved, shows a June go-live with a March pilot. You discover the discrepancy when a board member congratulates you on the March launch. What should the project manager do first?",
    options: [
      { id: "a", text: "Correct the board member on the spot, since an inaccurate expectation at board level is a serious risk.", correct: false,
        rationale: "Correcting the sponsor's message publicly and without warning damages the relationship you need to fix it. The board member is not the person who created the gap." },
      { id: "b", text: "Go to the sponsor, establish whether March was a misstatement or a commitment made on your behalf, and agree who corrects it.", correct: true,
        rationale: "The gap could be an error, a deliberate stretch, or the pilot being described as the launch. Which it is changes the response entirely, and the sponsor is the only source for that." },
      { id: "c", text: "Re-baseline the schedule to March and identify what would have to be descoped to make it, before raising it.", correct: false,
        rationale: "It moves quickly to a solution for a problem you have not yet diagnosed. Re-planning around a date that was misspoken would be a serious amount of work aimed at nothing." },
      { id: "d", text: "Send the board a written schedule summary showing the pilot and go-live dates clearly.", correct: false,
        rationale: "A written correction that goes around the sponsor is a public contradiction with a document attached. It also assumes the board's problem is that they were not shown the dates." }
    ],
    explanation: "A mismatch between what a sponsor has said and what the plan holds is diagnosed before it is corrected, because the three plausible causes need three different responses. The conversation is with the sponsor, promptly and privately, and it ends with agreement about who corrects the record. Fixing it around them, in public or on paper, costs the working relationship that any correction will need."
  },

  {
    id: "pmp-p5-002", type: "single", domain: "people", ecoTask: "people-5",
    approach: "agile", difficulty: 4, tags: ["expectations", "agile", "sponsor"],
    stem: "A sponsor new to iterative delivery has asked for a fixed scope, fixed date and fixed budget commitment for a twelve-month product build, and is frustrated that the team will only commit to the next quarter in detail. What is the most constructive response?",
    options: [
      { id: "a", text: "Explain that fixing all three is not possible in an agile delivery and that scope must be the variable.", correct: false,
        rationale: "It is true and it lands as a lecture about method to someone asking about risk. It also offers nothing in place of the certainty they were looking for." },
      { id: "b", text: "Produce the twelve-month plan they asked for, with the later quarters marked as indicative.", correct: false,
        rationale: "A plan labelled indicative is read as a plan. It buys short-term peace and sets up a much worse conversation in month seven when the indicative dates are quoted back." },
      { id: "c", text: "Establish what the sponsor actually needs the commitment for, then offer the strongest commitment that fits it \u2014 a fixed date and budget, with scope prioritised and reviewed each quarter.", correct: true,
        rationale: "The request is usually a proxy for a real need such as a board sign-off or a marketing window. Meeting that need with what can honestly be fixed is more useful than either refusing or pretending." },
      { id: "d", text: "Ask the sponsor to attend the next three sprint reviews so they can see the delivery rate for themselves.", correct: false,
        rationale: "Valuable over time and far too slow for a commitment being asked for now. It also answers a question about predictability with an invitation to watch." }
    ],
    explanation: "A demand for total certainty is nearly always a proxy for a specific obligation the sponsor has to someone else. Finding out what that is turns an argument about method into a solvable problem, and usually two of the three variables can genuinely be fixed. Offering the strongest honest commitment beats both a refusal on principle and a plan whose later half everyone privately knows is fiction."
  },

  {
    id: "pmp-p6-001", type: "single", domain: "people", ecoTask: "people-6",
    approach: "hybrid", difficulty: 3, tags: ["customer", "expectations", "change"],
    stem: "Halfway through a customer-facing implementation, the client's business has been reorganised and their new operations lead wants a different reporting model from the one specified. The contract fixes the specification. The relationship matters more to your organisation than this project's margin. What should the project manager do?",
    options: [
      { id: "a", text: "Deliver the specified reporting model, since the contract fixes it, and offer the new model as a follow-on engagement.", correct: false,
        rationale: "Contractually clean and commercially short-sighted. Handing over something the client has already told you does not fit their new organisation produces a delivery nobody uses." },
      { id: "b", text: "Assess what the change would cost in schedule and effort, put the options and their consequences to both sponsors, and let them decide.", correct: true,
        rationale: "The decision is commercial and belongs to the people who own the relationship and the margin. The project manager's job is to make it an informed decision rather than to make it." },
      { id: "c", text: "Absorb the change within the current scope, since preserving the relationship is the stated priority.", correct: false,
        rationale: "Quietly absorbing scope teaches the client that changes are free and hides a real cost from your own organisation. Prioritising the relationship is a decision someone should make explicitly." },
      { id: "d", text: "Raise a change request for the new reporting model and proceed once the client signs it.", correct: false,
        rationale: "Right instrument, incomplete answer. A change request the client signs without your own leadership weighing the relationship against the margin skips the decision that actually matters here." }
    ],
    explanation: "Shifting customer expectations are neither refused nor absorbed. They are quantified and put to the people who own the trade-off, with the commercial and relationship consequences stated. What makes this case sharper than a routine change is that the priority stated is relationship over margin, and a priority like that is exercised by sponsors making an explicit choice, not by a project manager giving work away."
  },

  {
    id: "pmp-p6-002", type: "single", domain: "people", ecoTask: "people-6",
    approach: "agile", difficulty: 2, tags: ["customer", "feedback", "review"],
    stem: "At a sprint review, the customer representative says the feature works exactly as specified but is not what they need in practice. The product owner points out that the acceptance criteria were signed off. What should happen next?",
    options: [
      { id: "a", text: "Treat the feature as accepted, since it met the agreed criteria, and log the new need as a separate request.", correct: false,
        rationale: "Technically correct and it wastes what just happened. The review has produced exactly the information iterative delivery exists to surface, and filing it as a separate request loses the moment." },
      { id: "b", text: "Explore what the customer needs in practice, and let the product owner decide where that sits in the backlog against everything else.", correct: true,
        rationale: "The gap between specified and useful is the normal output of a review, not a failure of sign-off. Understanding it and letting the product owner prioritise is the mechanism working as designed." },
      { id: "c", text: "Rework the feature in the next sprint, since delivering something the customer cannot use is not done.", correct: false,
        rationale: "Jumping straight to rework skips the prioritisation. The new need may be worth less than what else is in the backlog, and that judgement is the product owner's to make." },
      { id: "d", text: "Review why the acceptance criteria did not capture the real need, and tighten the criteria process.", correct: false,
        rationale: "Worth a retrospective conversation, and it is a process improvement rather than a response to the customer standing in front of you. It also assumes better criteria would have caught something only use revealed." }
    ],
    explanation: "Signed-off criteria being met while the need is unmet is the ordinary result of specifying ahead of use, and iterative reviews exist to find it early. The response is to understand the real need and hand it to the product owner to weigh against everything else competing for the next sprint. Both closing it out as accepted and committing to immediate rework skip the prioritisation that makes the feedback useful."
  },

  {
    id: "pmp-p7-001", type: "single", domain: "people", ecoTask: "people-7",
    approach: "predictive", difficulty: 2, tags: ["knowledge", "lessons-learned", "closure"],
    stem: "Your organisation runs a lessons-learned workshop at the end of every project and files the output in a shared drive. Reviewing three years of these, you find the same five problems recurring on project after project. What is the most useful change to make?",
    options: [
      { id: "a", text: "Improve the workshop format so lessons are captured more precisely and with clearer causes.", correct: false,
        rationale: "The lessons are being captured well enough to be recognisable three years later. Better capture addresses the part of the process that is already working." },
      { id: "b", text: "Move lesson capture from the end of the project to the end of each phase, so it happens while memory is fresh.", correct: false,
        rationale: "A genuine improvement to capture quality and timing, and it still leaves the lessons in the same drive being read by nobody at the moment a new project is being planned." },
      { id: "c", text: "Build the recurring lessons into planning: checklists, estimating assumptions and risk templates that new projects start from.", correct: true,
        rationale: "A lesson only transfers when it changes what the next project does by default. Embedding them in the artifacts people actually use at planning is what closes the loop." },
      { id: "d", text: "Require project managers to review the lessons repository during planning and record that they have done so.", correct: false,
        rationale: "Mandated reading produces a tick and a skim. It puts the burden of retrieval on each new project manager rather than on the organisation that owns the pattern." }
    ],
    explanation: "Knowledge transfer fails at the point of reuse far more often than at the point of capture, and a repository nobody consults at the right moment is a filing system rather than an asset. Recurring lessons are converted into defaults: the checklist, the estimating assumption, the standing risk. That way the next project inherits the learning without anyone having to remember to go and look for it."
  },

  {
    id: "pmp-p7-002", type: "single", domain: "people", ecoTask: "people-7",
    approach: "hybrid", difficulty: 3, tags: ["knowledge", "key-person", "risk"],
    stem: "The one engineer who understands your legacy billing integration has resigned and leaves in four weeks. There is no documentation. The integration is central to a release in ten weeks. What should the project manager prioritise in those four weeks?",
    options: [
      { id: "a", text: "Have the engineer write comprehensive documentation of the integration before leaving.", correct: false,
        rationale: "Documentation written under notice by someone with one foot out of the door is usually thin where it matters most, and nobody left behind can tell which parts are wrong until they need them." },
      { id: "b", text: "Pair two other engineers with them on real work against the integration, and capture what surfaces as they go.", correct: true,
        rationale: "Working alongside on live tasks transfers the tacit knowledge that documentation cannot hold, and it tests the transfer in the only way that counts \u2014 by having someone else do the work while help is still available." },
      { id: "c", text: "Recruit a contractor with legacy billing experience to take over the integration.", correct: false,
        rationale: "Worth pursuing in parallel and useless as the primary plan. Recruiting and onboarding rarely completes inside four weeks, and generic experience does not cover this specific integration." },
      { id: "d", text: "Bring the release forward so the integration work completes before the engineer leaves.", correct: false,
        rationale: "Compressing a ten-week release into four weeks to preserve one dependency trades a knowledge problem for a much larger delivery risk, and the knowledge gap still arrives afterwards." }
    ],
    explanation: "Tacit knowledge moves by doing rather than by writing, so the four weeks are spent having other people work the integration with the expert beside them rather than watching them write. Documentation is a by-product of that, captured as questions come up, and it is better documentation for having been written by the people who did not already know. The test of transfer is whether someone else can do the task while help is still in the building."
  },

  {
    id: "pmp-p8-001", type: "multi", domain: "people", ecoTask: "people-8",
    approach: "hybrid", difficulty: 3, tags: ["communication", "reporting", "stakeholders"],
    stem: "Your weekly project report goes to forty-one people. You learn that the steering group reads only the first paragraph, the delivery teams do not read it at all, and two regulators' representatives on the list need detail nobody else wants. Which two changes should the project manager make?",
    options: [
      { id: "a", text: "Segment the communication: a short decision-focused summary for the steering group, and a separate detailed pack for the regulatory readers.", correct: true,
        rationale: "Different audiences need different content at different depths, and one document that serves all of them serves none well. Segmenting is the standard fix and it is cheap." },
      { id: "b", text: "Find out what the delivery teams actually need to know and deliver it in the channel they already use.", correct: true,
        rationale: "A group that reads nothing is telling you the channel is wrong, not that they need no information. Meeting them where they already look is what converts a broadcast into communication." },
      { id: "c", text: "Reduce the distribution list to the people who demonstrably read the report.", correct: false,
        rationale: "It tidies the list and drops people who need information but are not being served by this format. The regulators would survive the cut; the delivery teams would be quietly cut off." },
      { id: "d", text: "Put the full report on a shared site and send a link, so each reader takes what they need.", correct: false,
        rationale: "Pull communication shifts the effort of finding the relevant part onto every reader. The steering group that reads one paragraph will read no paragraphs behind a link." },
      { id: "e", text: "Add a summary paragraph at the top of the existing report so the steering group's needs are met first.", correct: false,
        rationale: "A partial improvement that leaves the same document trying to serve three audiences. It helps the group already being served best and does nothing for the other two." }
    ],
    explanation: "Communication is planned by audience and need rather than by document. Three audiences with three different requirements point to segmented content pitched at the depth each one needs, and to using the channels people already have open rather than the one that is convenient to produce. Trimming the list or bolting a summary onto the front both preserve the single-artifact habit that caused the problem."
  },

  {
    id: "pmp-p8-002", type: "single", domain: "people", ecoTask: "people-8",
    approach: "predictive", difficulty: 2, tags: ["communication", "bad-news", "sponsor"],
    stem: "You have just confirmed that a critical supplier will miss a milestone, which will delay your project by around a month. Your sponsor is presenting to the board in two days and has not been told. Analysis of options will take a week. What should the project manager do?",
    options: [
      { id: "a", text: "Tell the sponsor now, with what is known and what is not, and say when the options will be ready.", correct: true,
        rationale: "A sponsor going into a board meeting needs to know what they do not know. Reporting a confirmed fact with the analysis still open is honest and gives them two days rather than none." },
      { id: "b", text: "Complete the options analysis first, so the sponsor receives the problem and the solutions together.", correct: false,
        rationale: "A good general principle applied at the wrong moment. Waiting a week means the sponsor stands in front of the board with information you already had and they did not." },
      { id: "c", text: "Tell the sponsor after the board meeting, so the presentation is not disrupted by an unresolved issue.", correct: false,
        rationale: "Protecting a sponsor from information before they speak on the record is how a delay becomes a credibility problem. It also makes the eventual conversation about why you waited." },
      { id: "d", text: "Send a written note to the sponsor and the board together, so everyone has the same information.", correct: false,
        rationale: "Informing the board at the same moment as the sponsor removes their ability to decide how to handle it. Bad news travels up one step first." }
    ],
    explanation: "Bringing options rather than problems is sound practice that stops applying the moment someone is about to speak publicly on the basis of information you know to be wrong. What goes to the sponsor immediately is the confirmed fact, the honest boundary of what is not yet known, and a date for the analysis. It goes to them alone, and to the board through them."
  },

  {
    id: "pmp-pr1-001", type: "multi", domain: "process", ecoTask: "process-1",
    approach: "hybrid", difficulty: 3, tags: ["planning", "tailoring", "integration"],
    stem: "You are planning a programme that replaces a core banking ledger and, on top of it, builds a customer-facing mobile app. The ledger work has fixed regulatory requirements and a hard compliance date. The app requirements are still forming. Which two planning decisions are best supported?",
    options: [
      { id: "a", text: "Plan the ledger replacement predictively against the compliance date, and run the app iteratively.", correct: true,
        rationale: "Delivery approach follows the nature of the work rather than an organisational preference. Fixed requirements with a hard date suit a plan-driven approach; forming requirements suit iteration." },
      { id: "b", text: "Define the integration points between the two and manage them as a single set of dependencies across both approaches.", correct: true,
        rationale: "Two approaches under one programme fail at the seam. Making the integration points explicit and managing them once is what keeps the hybrid a design rather than an accident." },
      { id: "c", text: "Run both workstreams to the same cadence so that progress can be compared on a single report.", correct: false,
        rationale: "Reporting convenience is a poor reason to impose a cadence. Forcing a regulatory ledger replacement into sprints usually produces sprint-shaped waterfall with extra ceremonies." },
      { id: "d", text: "Hold a single integrated baseline covering scope, schedule and cost for both workstreams from the outset.", correct: false,
        rationale: "You cannot baseline scope that is still forming without inventing it. A programme-level baseline over the app's undefined scope would be fiction that everyone then manages against." },
      { id: "e", text: "Apply the stricter regulatory governance to both workstreams for consistency.", correct: false,
        rationale: "Consistency is not free. Regulatory-grade change control on a mobile app kills the responsiveness that made iteration the right choice for it." }
    ],
    explanation: "Tailoring means each part of the work gets the approach its own characteristics call for, and the programme's job is to hold the seam between them. Fixed requirements against a hard date are plan-driven work; forming requirements are iterative work; and the dependencies where the two meet need managing explicitly. Imposing one cadence, one baseline or one governance standard across both trades the benefit of tailoring for the comfort of uniformity."
  },

  {
    id: "pmp-pr1-002", type: "single", domain: "process", ecoTask: "process-1",
    approach: "predictive", difficulty: 3, tags: ["planning", "approach", "selection"],
    stem: "A project will install identical point-of-sale hardware in 340 retail sites over eighteen months. The technical solution is proven and unchanged from a pilot last year. The sponsor has asked whether the project should be run in an agile way, since the organisation is adopting agile. What should the project manager advise?",
    options: [
      { id: "a", text: "Adopt agile, because organisational consistency in delivery method reduces overhead and improves resourcing flexibility.", correct: false,
        rationale: "Consistency is a real benefit and a secondary one. Choosing an approach for the organisation's convenience rather than the work's characteristics is the error the question is testing." },
      { id: "b", text: "Run it predictively, because the solution is known and repeated, while borrowing practices such as retrospectives that suit repetitive rollout work.", correct: true,
        rationale: "Known scope repeated 340 times is the textbook case for a plan-driven approach. Adopting the specific agile practices that help a rollout learn between sites is tailoring rather than method-shopping." },
      { id: "c", text: "Run it as a hybrid, with the first fifty sites iterative and the remainder predictive once the approach settles.", correct: false,
        rationale: "It sounds balanced and there is nothing to discover: the pilot already established the solution. Iterating over a proven installation adds ceremony without reducing uncertainty." },
      { id: "d", text: "Adopt agile for the schedule and predictive for the budget, so the plan can flex while costs stay controlled.", correct: false,
        rationale: "Approach is not something you can apply to the schedule and not the scope. This describes a governance arrangement rather than a delivery approach, and the two halves would immediately conflict." }
    ],
    explanation: "Delivery approach follows uncertainty. Where the solution is proven and the work is repetition at scale, a plan-driven approach is not a legacy choice but the correct one, and the value to be captured is in logistics and learning curve rather than in discovery. Tailoring still applies: retrospectives between waves of sites are worth borrowing precisely because a rollout has 340 chances to get better at itself."
  },

  {
    id: "pmp-pr1-003", type: "single", domain: "process", ecoTask: "process-1",
    approach: "hybrid", difficulty: 4, tags: ["tailoring", "governance", "planning"],
    stem: "Your organisation's methodology requires eleven planning documents before execution starts. Your project is a six-week integration with three people and one clear deliverable. The PMO insists all eleven are produced. What is the best course of action?",
    options: [
      { id: "a", text: "Produce all eleven documents, since compliance with the organisational methodology is not the project's decision to make.", correct: false,
        rationale: "Compliance without judgement on a six-week project can consume more effort than the delivery. Methodologies almost always contain a tailoring provision, and not looking for it is a choice too." },
      { id: "b", text: "Propose a tailored set to the PMO, showing which documents address real risk on this project and which do not, and agree the reduction formally.", correct: true,
        rationale: "Tailoring is negotiated with the owner of the standard and recorded, not taken unilaterally. Arguing from the risk each document addresses is what makes it a professional case rather than a request to skip paperwork." },
      { id: "c", text: "Produce shortened versions of all eleven, so the methodology is satisfied at proportionate cost.", correct: false,
        rationale: "Eleven thin documents satisfy the letter and produce nothing anyone will use. It also avoids the conversation about proportionality that the organisation needs to have." },
      { id: "d", text: "Escalate to the sponsor to obtain an exemption from the methodology for this project.", correct: false,
        rationale: "Going over the PMO to get an exemption wins this project and damages the relationship for the next ten. The PMO is also more likely to have a tailoring route already available." }
    ],
