    explanation: "Tailoring is the deliberate, agreed adjustment of a standard to the size and risk of the work, and it is done with the body that owns the standard. The argument is made document by document on the basis of what risk each one actually reduces here. Blanket compliance, blanket thinning and going around the PMO all avoid that conversation, and it is the conversation that produces a defensible answer."
  },

  {
    id: "pmp-pr2-001", type: "pulldown", domain: "process", ecoTask: "process-2",
    approach: "agile", difficulty: 2, tags: ["scope", "backlog", "definitions"],
    stem: "Complete each sentence with the term that fits. Two choices are not used.",
    prompts: [
      { id: "s1", text: "The shared standard that every backlog item must meet before the team calls it finished is the" },
      { id: "s2", text: "The set of conditions specific to one backlog item that the product owner will check when deciding whether to accept it is its" }
    ],
    options: [
      { id: "dod", text: "definition of done", correct: true, match: "s1",
        rationale: "The definition of done applies to every item equally and covers the quality bar: tested, reviewed, documented, deployable. It is the team's standard, and it does not change item by item." },
      { id: "ac", text: "acceptance criteria", correct: true, match: "s2",
        rationale: "Acceptance criteria are written per item and describe what that particular piece of functionality must do. They vary with every story; the definition of done does not." },
      { id: "dor", text: "definition of ready", correct: false, match: null,
        rationale: "Not used. A definition of ready describes when an item is well enough understood to be pulled into a sprint, which is about the start of work rather than the end of it." },
      { id: "mvp", text: "minimum viable product", correct: false, match: null,
        rationale: "Not used. A minimum viable product is the smallest release that produces learning or value in the market, which is a scoping decision about a release rather than a completion standard." }
    ],
    explanation: "The two are constantly confused and the distinction is simple: the definition of done is one standard for all items and covers quality, while acceptance criteria are written per item and cover behaviour. An item can meet every acceptance criterion and still not be done if it has not been tested to the team's standard. The two unused terms both concern the boundaries of work rather than its completion."
  },

  {
    id: "pmp-pr2-002", type: "single", domain: "process", ecoTask: "process-2",
    approach: "predictive", difficulty: 3, tags: ["scope", "creep", "change-control"],
    stem: "A business analyst on your team has been accepting small refinements directly from users during requirements validation sessions, on the grounds that each is a clarification rather than a change. The build estimate has grown by 18 percent since baseline. What should the project manager do?",
    options: [
      { id: "a", text: "Stop the practice immediately and require every future refinement to go through change control.", correct: false,
        rationale: "Half the answer. It closes the leak and leaves 18 percent of unbaselined work sitting in the estimate with nobody having decided to fund it." },
      { id: "b", text: "Assess what has accumulated, take it through change control as one package, and agree with the team where clarification ends and change begins.", correct: true,
        rationale: "The accumulated growth has to be surfaced and decided on, and the boundary has to be defined or the same thing happens again. Doing only one of the two leaves the project exposed." },
      { id: "c", text: "Absorb the growth if contingency covers it, and tighten the process going forward.", correct: false,
        rationale: "Using contingency to hide unapproved scope growth spends a reserve held for risk on a decision nobody made. It also removes the sponsor's chance to say the refinements are not worth 18 percent." },
      { id: "d", text: "Re-baseline the scope and schedule to reflect the current understanding of requirements.", correct: false,
        rationale: "Re-baselining is what happens after an approved change, not instead of one. Doing it first makes the growth official without anyone having authorised it." }
    ],
    explanation: "Uncontrolled scope growth needs two responses, and answers that offer one of them are the trap. What has already accumulated is quantified and put through change control so that someone with authority decides whether to fund it. Separately, the line between clarification and change is defined with the team, because it was the absence of that line rather than anyone's bad faith that produced the drift."
  },

  {
    id: "pmp-pr2-003", type: "single", domain: "process", ecoTask: "process-2",
    approach: "agile", difficulty: 2, tags: ["scope", "refinement", "backlog"],
    stem: "Your team consistently spends the first two days of each two-week sprint working out what the top items actually mean, and often discovers dependencies that stall them. Sprint goals are met about half the time. What is the most effective change?",
    options: [
      { id: "a", text: "Extend sprint planning so the team can analyse the items more thoroughly before committing.", correct: false,
        rationale: "A longer planning session in the same sprint moves the same discovery a few hours earlier. It does not create the time to resolve a dependency found during it." },
      { id: "b", text: "Introduce regular backlog refinement during the sprint, so upcoming items are understood and dependencies surfaced before they are committed to.", correct: true,
        rationale: "Refinement ahead of planning is the standard remedy: it moves discovery to a point where there is still time to act on what is found, rather than into the sprint that has to absorb it." },
      { id: "c", text: "Move to four-week sprints so there is more room to absorb the analysis and any dependencies.", correct: false,
        rationale: "Longer sprints hide the problem by giving it more space. Feedback slows, and a team that discovers dependencies late now discovers them late with four weeks committed instead of two." },
      { id: "d", text: "Have the product owner write fuller specifications for each item before it enters the sprint.", correct: false,
        rationale: "Detail written by one person is not the same as understanding held by the team, and it does not surface the technical dependencies the team is finding. It also recreates handover." }
    ],
    explanation: "Two days of every ten spent working out what the work means is discovery happening inside the commitment rather than before it. Continuous refinement moves that conversation earlier, where a discovered dependency can still be resolved or the item can be swapped out. Lengthening planning or the sprint gives the same late discovery more room; more written detail substitutes documentation for shared understanding."
  }
,

  {
    id: "pmp-pr3-001", type: "fillblank", domain: "process", ecoTask: "process-3",
    approach: "agile", difficulty: 3, tags: ["flow", "metrics", "littles-law"],
    stem: "A Kanban team currently has 24 work items in progress and finishes an average of 6 items per week. Work down the average cycle time, then the average cycle time the team would see if it capped work in progress at 12 items and throughput stayed the same.",
    blanks: [
      { id: "ct1", label: "Average cycle time now, in weeks", numeric: true, expect: 4, tol: 0.05, unit: "weeks",
        rationale: "Cycle time equals work in progress divided by throughput: 24 \u00F7 6 = 4 weeks. Every item currently takes four weeks on average to cross the board." },
      { id: "ct2", label: "Average cycle time at a WIP cap of 12, in weeks", numeric: true, expect: 2, tol: 0.05, unit: "weeks",
        rationale: "12 \u00F7 6 = 2 weeks. Halving the work in progress halves the cycle time, which is the whole argument for a WIP limit: nothing about the team changed except how much it started." }
    ],
    explanation: "Little's Law relates work in progress, throughput and cycle time, so cycle time is simply work in progress divided by throughput. The practical consequence is the one the second figure shows: with throughput unchanged, starting less finishes things sooner. A team that wants shorter lead times has two levers, and limiting what is in flight is nearly always the cheaper of the two."
  },

  {
    id: "pmp-pr3-002", type: "single", domain: "process", ecoTask: "process-3",
    approach: "agile", difficulty: 3, tags: ["value", "prioritisation", "backlog"],
    stem: "Your product backlog has 240 items. The product owner prioritises by asking each stakeholder to rank their own requests, then interleaving the lists. Delivery is steady but no stakeholder feels well served, and low-value work keeps reaching the team. What should be recommended?",
    options: [
      { id: "a", text: "Prioritise against a consistent measure of value and cost across the whole backlog, rather than merging separate rankings.", correct: true,
        rationale: "Interleaved lists guarantee that each stakeholder's least valuable item outranks another's most valuable. A single comparable measure is the only thing that lets the backlog be ordered as one queue." },
      { id: "b", text: "Allocate each stakeholder a fixed share of team capacity, proportional to their budget contribution.", correct: false,
        rationale: "It makes the current arrangement explicit and fairer to negotiate over, and it still optimises for share rather than for value. Low-value work continues to arrive, now with a quota behind it." },
      { id: "c", text: "Reduce the backlog by removing anything not touched in six months, so prioritisation has fewer candidates.", correct: false,
        rationale: "A backlog of 240 items is worth pruning and that is hygiene, not prioritisation. Removing stale items does not change how the remaining ones are ordered." },
      { id: "d", text: "Have the steering group approve the top twenty items each quarter.", correct: false,
        rationale: "It moves the same unstructured judgement to a more senior group at a slower cadence. Without a shared measure the steering group is interleaving lists too, just less often." }
    ],
    explanation: "Merging separately ranked lists produces an order that no measure of value would ever produce, which is why everyone is unhappy at once. The fix is a single yardstick applied across the whole backlog, so items from different stakeholders can be compared on the same terms. Capacity allocation and senior approval both preserve the underlying problem, which is that nothing is being compared."
  },

  {
    id: "pmp-pr4-001", type: "single", domain: "process", ecoTask: "process-4",
    approach: "predictive", difficulty: 3, tags: ["resources", "levelling", "schedule"],
    stem: "Your schedule shows a specialist welder required at 180 percent of availability across weeks 9 to 14. The project completion date has three weeks of total float in that path. Which technique should the project manager apply first?",
    options: [
      { id: "a", text: "Resource levelling, adjusting start dates to remove the over-allocation, accepting that the path may lengthen.", correct: false,
        rationale: "Levelling will certainly solve the over-allocation and it changes the critical path and usually the end date. It is the right tool when float has already been exhausted, which is not the case here." },
      { id: "b", text: "Resource smoothing, adjusting activities within their available float so the peak comes down without moving the completion date.", correct: true,
        rationale: "Smoothing works inside existing float and leaves the finish date alone. With three weeks of float available on that path, it is the technique to try before accepting a schedule extension." },
      { id: "c", text: "Fast-tracking the affected activities so the welder's work is spread across a longer window.", correct: false,
        rationale: "Fast-tracking overlaps activities that were sequential, which tends to increase concurrent resource demand rather than reduce it. It is a schedule compression tool, not a resource one." },
      { id: "d", text: "Crashing by adding a second welder, since the constraint is a resource shortage.", correct: false,
        rationale: "Adding a specialist resource costs money and may not be available at all. It is a legitimate option and it is not the first one when free float exists that has not been used." }
    ],
    explanation: "Smoothing and levelling are distinguished by what they are allowed to move. Smoothing works only within existing float and so preserves the completion date; levelling relaxes that constraint and may extend the schedule. Where float exists, smoothing is tried first because it costs nothing and risks nothing. Fast-tracking and crashing are compression techniques aimed at duration, and neither addresses an over-allocation directly."
  },

  {
    id: "pmp-pr4-002", type: "single", domain: "process", ecoTask: "process-4",
    approach: "agile", difficulty: 3, tags: ["resources", "team", "focus"],
    stem: "Four of your six developers are also assigned to two other projects, at nominally 40 percent each. Velocity is erratic, sprint goals are missed, and the developers report spending significant time re-orienting. The resource manager says the allocation is correct on paper. What is the strongest case to make?",
    options: [
      { id: "a", text: "That the allocation percentages should be revised upward to reflect the true effort the project needs.", correct: false,
        rationale: "It argues about the number rather than the structure. Sixty percent of a person split across two other projects has the same switching cost as forty." },
      { id: "b", text: "That splitting people across three projects imposes a switching cost the percentages do not capture, and that dedicating fewer people fully would deliver more.", correct: true,
        rationale: "The case is about the arithmetic being wrong rather than the allocation being unfair. Context switching is real, unbudgeted and invisible on a resource sheet, and naming that is what changes the conversation." },
      { id: "c", text: "That the erratic velocity makes forecasting impossible and the project therefore cannot commit to dates.", correct: false,
        rationale: "True and it presents as a complaint. It also puts the project's credibility on the line rather than the resourcing model's, and offers the resource manager nothing to act on." },
      { id: "d", text: "That the other two projects should be asked to reduce their claims on the shared developers.", correct: false,
        rationale: "This is a request to win a zero-sum contest between three projects, decided by whoever argues hardest. It does not challenge the assumption that a person divides cleanly." }
    ],
    explanation: "A resource sheet that adds to 100 percent implies people divide without loss, and they do not: every switch costs re-orientation that appears nowhere in the allocation. The argument to make is that the model is understating cost, with the erratic velocity as evidence, and that fewer fully dedicated people would deliver more than more partly assigned ones. Arguing about percentages or about who gets whom accepts the flawed model and merely competes inside it."
  },

  {
    id: "pmp-pr5-001", type: "multi", domain: "process", ecoTask: "process-5",
    approach: "predictive", difficulty: 4, tags: ["procurement", "contracts", "risk"],
    stem: "You are buying a bespoke control system. The functional requirements are firm, but the integration with your existing plant is poorly understood and could vary substantially in effort. Your organisation wants cost certainty. Which two approaches best fit?",
    options: [
      { id: "a", text: "Place the firm functional scope under a fixed-price arrangement, and the integration work under a cost-reimbursable or time-and-materials arrangement with a ceiling.", correct: true,
        rationale: "Contract type follows scope certainty, and this scope has two halves with different certainty. Splitting them prices the known work firmly and caps exposure on the unknown." },
      { id: "b", text: "Run a paid discovery phase on the integration first, then contract the integration work firmly once its scope is understood.", correct: true,
        rationale: "Buying the information before buying the work is what converts an unpriceable scope into a priceable one. It costs a phase and removes the risk premium a supplier would otherwise load into a fixed price." },
      { id: "c", text: "Place the whole scope under a firm fixed price, transferring the integration uncertainty to the supplier.", correct: false,
        rationale: "Transferring uncertainty a supplier cannot size gets it priced with a heavy contingency, or accepted and then fought over in claims. Cost certainty on paper, cost surprise in practice." },
      { id: "d", text: "Use a cost-plus-fixed-fee contract for the whole scope, since the integration effort is unknown.", correct: false,
        rationale: "It handles the unknown half and gives away the certainty available on the firm half. The buyer carries cost risk on requirements that were perfectly well defined." },
      { id: "e", text: "Use a fixed-price incentive-fee contract with a wide share ratio to motivate efficient integration.", correct: false,
        rationale: "Incentive arrangements need a credible target cost to share against, and the integration effort is precisely what cannot be estimated. The mechanism has nothing to anchor to." }
    ],
    explanation: "One contract type across a scope with two different levels of certainty forces the wrong risk allocation onto one half of it. Either split the arrangement so each half is priced on terms that match what is known, or buy the knowledge first through a discovery phase and then contract firmly. Transferring uncertainty nobody can size does not remove it; it converts it into a risk premium or a dispute."
  },

  {
    id: "pmp-pr5-002", type: "single", domain: "process", ecoTask: "process-5",
    approach: "hybrid", difficulty: 4, tags: ["procurement", "supplier", "performance"],
    stem: "A supplier has missed two consecutive delivery milestones. Their account manager assures you the third will be met. Your contract contains a termination-for-convenience clause and liquidated damages. Replacing the supplier would cost four months. What should the project manager do first?",
    options: [
      { id: "a", text: "Issue a formal notice invoking liquidated damages, to establish that the misses have consequences.", correct: false,
        rationale: "It protects the contractual position and makes the working relationship adversarial at the moment you most need the supplier to perform. It also does nothing to establish whether they can." },
      { id: "b", text: "Meet the supplier to establish the root cause of the misses, and agree a recovery plan with verifiable interim checkpoints.", correct: true,
        rationale: "Two misses and a verbal assurance are not enough to decide anything on. Finding the cause and putting in checkpoints that can be verified is what turns the next assurance into evidence." },
      { id: "c", text: "Begin a parallel procurement so that a replacement supplier can be engaged without losing four months.", correct: false,
        rationale: "A reasonable contingency once you know how bad this is. Started now, it costs real money and, if it becomes known, guarantees the deterioration you are trying to avoid." },
      { id: "d", text: "Escalate to the supplier's executive sponsor, since the account manager's assurance has failed twice.", correct: false,
        rationale: "Escalation is a lever worth holding rather than pulling second. Used before you know the cause, it may simply produce a more senior assurance of the same kind." }
    ],
    explanation: "Two missed milestones establish that something is wrong and not what. Contract remedies, parallel procurement and escalation are all available and each spends something you may need, so none of them is the first move. The first move is to find the cause and replace an assurance with checkpoints that can be verified before the milestone rather than after it, which is what makes the next decision an informed one."
  },

  {
    id: "pmp-pr6-001", type: "fillblank", domain: "process", ecoTask: "process-6",
    approach: "predictive", difficulty: 3, tags: ["evm", "forecasting", "formulas"],
    stem: "A project has a budget at completion of 800,000. At the current status date the earned value is 240,000 and the actual cost is 300,000. Assuming performance to date is representative of the rest of the project, work out the cost performance index and the estimate at completion.",
    blanks: [
      { id: "cpi", label: "Cost performance index, to two decimal places", numeric: true, expect: 0.8, tol: 0.005,
        rationale: "CPI = EV \u00F7 AC = 240,000 \u00F7 300,000 = 0.80. Every dollar spent has bought 80 cents of budgeted work." },
      { id: "eac", label: "Estimate at completion, in dollars", numeric: true, expect: 1000000, tol: 1, unit: "USD",
        rationale: "With current performance assumed to continue, EAC = BAC \u00F7 CPI = 800,000 \u00F7 0.80 = 1,000,000. The project is forecast to overrun its budget by 200,000." }
    ],
    explanation: "The cost performance index is the ratio of work earned to money spent, and dividing the budget by it projects the same efficiency across everything still to do. That assumption is the one to interrogate: the formula is right whenever the causes of the overrun are systemic, and wrong when the overrun came from a one-off event that will not recur, in which case the remaining work is added at budgeted rates instead."
  },

  {
    id: "pmp-pr6-002", type: "single", domain: "process", ecoTask: "process-6",
    approach: "predictive", difficulty: 3, tags: ["budget", "reserves", "governance"],
    stem: "A risk you identified and quantified has occurred, and responding to it will cost 60,000. Your contingency reserve holds 145,000 and your management reserve, held by the sponsor, holds 300,000. What should the project manager do?",
    options: [
      { id: "a", text: "Draw the 60,000 from the contingency reserve and report the drawdown in the next status report.", correct: true,
        rationale: "Contingency exists for exactly this: identified risks that have been analysed and provided for. Drawing it is a project-level decision, and reporting it keeps the drawdown visible." },
      { id: "b", text: "Request 60,000 from the management reserve, preserving contingency for risks that have not yet occurred.", correct: false,
        rationale: "Management reserve is for the unknown-unknowns and sits outside the cost baseline. Using it for a risk that was identified and funded skips the mechanism built for the purpose." },
      { id: "c", text: "Raise a change request to increase the cost baseline by 60,000, since the cost was not in the original estimate.", correct: false,
        rationale: "The cost was in the estimate: contingency is part of the cost baseline precisely so that identified risks do not require a change request when they materialise." },
      { id: "d", text: "Draw from contingency and immediately request a top-up from management reserve to restore the balance.", correct: false,
        rationale: "Automatically restoring contingency treats it as an entitlement rather than a provision. Whether the remaining 85,000 is still adequate is a question for the risk analysis, not a reflex." }
    ],
    explanation: "The two reserves answer to different owners and different kinds of uncertainty. Contingency sits inside the cost baseline, covers risks that were identified and quantified, and the project manager draws on it. Management reserve sits outside the baseline for genuine unknowns and needs the sponsor. A materialised known risk is the textbook contingency draw, and no change request is required because the money was already in the baseline."
  },

  {
    id: "pmp-pr6-003", type: "single", domain: "process", ecoTask: "process-6",
    approach: "agile", difficulty: 3, tags: ["budget", "agile", "forecasting"],
    stem: "Finance asks for a cost forecast for an agile product team funded quarterly. The team is stable at eight people, the run rate is predictable, and the backlog is not fixed. Finance wants to know what the total cost will be to complete the product. How should the project manager respond?",
    options: [
      { id: "a", text: "Estimate the remaining backlog in story points, divide by velocity, and multiply by the team's cost per sprint.", correct: false,
        rationale: "It produces a number, and it rests on a backlog that will change. Forecasting to completion against a scope nobody has fixed dresses an assumption up as arithmetic." },
      { id: "b", text: "Explain that cost is predictable and completion is not, and offer a forecast of cost per quarter alongside the value expected to be delivered in each.", correct: true,
        rationale: "With a stable team the run rate is the reliable half of the answer, and the honest framing is cost per period against expected value rather than a total to an undefined end." },
      { id: "c", text: "Ask the product owner to freeze the backlog so a total cost to complete can be calculated.", correct: false,
        rationale: "Freezing the backlog to satisfy a reporting format gives away the main benefit of funding a product team, which is the ability to change what gets built as you learn." },
      { id: "d", text: "Provide a range based on optimistic and pessimistic backlog assumptions, with a confidence level attached.", correct: false,
        rationale: "Better than a point estimate and still forecasting to a completion date for something that has no defined end. A range around an undefined scope is a wide range around nothing." }
    ],
    explanation: "A stable team funded by period has a highly predictable cost and an undefined end, so the honest forecast reports cost per quarter next to the value expected from it. Finance can then decide each quarter whether to keep funding, which is the actual decision. Calculating a total to complete requires fixing a backlog that is deliberately not fixed, and doing so trades the benefit of the funding model for the comfort of a single number."
  },

  {
    id: "pmp-pr7-001", type: "matching", domain: "process", ecoTask: "process-7",
    approach: "predictive", difficulty: 3, tags: ["quality", "cost-of-quality"],
    stem: "Match each activity to the cost-of-quality category it belongs to. One choice is not used.",
    prompts: [
      { id: "q1", text: "Training installers on the new torque procedure before the first unit is assembled." },
      { id: "q2", text: "Inspecting a sample of finished units against the specification before shipping." },
      { id: "q3", text: "Reworking units found defective on the production line before they leave the factory." },
      { id: "q4", text: "Recalling units from customers after a fault appears in the field." }
    ],
    options: [
      { id: "prev", text: "Prevention cost", correct: true, match: "q1",
        rationale: "Prevention is money spent to stop defects being created at all: training, process design, tooling. It is the cheapest category per defect avoided and the first to be cut under pressure." },
      { id: "appr", text: "Appraisal cost", correct: true, match: "q2",
        rationale: "Appraisal is the cost of finding out whether quality has been achieved \u2014 inspection, testing, audit. It detects defects rather than preventing them." },
      { id: "intf", text: "Internal failure cost", correct: true, match: "q3",
        rationale: "Internal failure is the cost of defects caught before the customer sees them: scrap and rework. Expensive, and far cheaper than the same defect escaping." },
      { id: "extf", text: "External failure cost", correct: true, match: "q4",
        rationale: "External failure is what a defect costs once it has reached the customer: recalls, warranty, liability, reputation. It is the most expensive category by a wide margin." },
      { id: "opp", text: "Opportunity cost", correct: false, match: null,
        rationale: "Not used. Opportunity cost is the value of the alternative not chosen. It is a real economic concept and it is not one of the four cost-of-quality categories." }
    ],
    explanation: "Cost of quality splits into conformance work, which is prevention and appraisal, and non-conformance work, which is internal and external failure. The cost per defect rises sharply left to right, which is the argument for spending on prevention: a defect stopped in training costs a fraction of the same defect found in inspection, and a tiny fraction of one recalled from a customer."
  },

  {
    id: "pmp-pr7-002", type: "single", domain: "process", ecoTask: "process-7",
    approach: "agile", difficulty: 3, tags: ["quality", "technical-debt", "velocity"],
    stem: "Over six sprints, your team's velocity has fallen steadily while the number of defects found in each sprint has risen. The team says shortcuts taken to hit earlier sprint commitments are now slowing everything down. The product owner wants the next release on time. What should the project manager advocate?",
    options: [
      { id: "a", text: "Adding a dedicated defect-fixing sprint after the release, so the current commitment is protected.", correct: false,
        rationale: "Deferring the repair keeps the release date and lets the decay continue for another release cycle. The velocity trend says the cost of waiting is rising, not flat." },
      { id: "b", text: "Making the trade-off explicit to the product owner: the falling velocity is the price of the shortcuts, and some capacity now buys the delivery rate back.", correct: true,
        rationale: "This is a prioritisation decision the product owner owns, and they can only make it if the connection between the shortcuts and the falling velocity is put in front of them in those terms." },
      { id: "c", text: "Allocating a fixed 20 percent of each sprint to technical debt as a standing policy.", correct: false,
        rationale: "A sensible steady-state practice and an arbitrary answer to a specific problem. The right number depends on what is actually causing the decay, which nobody has yet quantified." },
      { id: "d", text: "Tightening the definition of done so that new shortcuts cannot be taken in future sprints.", correct: false,
        rationale: "Necessary to stop the bleeding and it does nothing about six sprints of accumulated debt that is already slowing the team. It prevents the next problem, not this one." }
    ],
    explanation: "Technical debt is an economic trade-off, and the project manager's job is to make sure the person prioritising can see it as one. Falling velocity alongside rising defects is quantified evidence that shortcuts have a price, and putting that in front of the product owner turns an engineering complaint into a decision about the release. Standing policies and tighter standards both belong in the answer, but neither is the move that gets this release decided honestly."
  }
,

  {
    id: "pmp-pr8-001", type: "fillblank", domain: "process", ecoTask: "process-8",
    approach: "predictive", difficulty: 3, tags: ["schedule", "float", "critical-path"],
    stem: "In the schedule model, activity D has an early start of day 12 and a late start of day 19. All other activities are unchanged. Work out the total float on activity D, and then how many days late the project would finish if activity D started on day 12 but took 9 days longer than planned.",
    blanks: [
      { id: "tf", label: "Total float on activity D, in days", numeric: true, expect: 7, tol: 0, unit: "days",
        rationale: "Total float is late start minus early start: 19 \u2212 12 = 7 days. Activity D can absorb seven days of delay before the project completion date is affected." },
      { id: "late", label: "Days the project finishes late", numeric: true, expect: 2, tol: 0, unit: "days",
        rationale: "The first seven days of the overrun are absorbed by float; the remaining 9 \u2212 7 = 2 days push the completion date out. Activity D also becomes critical at that point." }
    ],
    explanation: "Total float is the difference between the late and early dates and measures how much an activity can move before the project finish moves with it. The second figure is the consequence that matters in practice: overrun is only felt at the project level once float is exhausted, and an activity that consumes all of its float has joined the critical path, so any further slip transmits day for day."
  },

  {
    id: "pmp-pr8-002", type: "hotspot", domain: "process", ecoTask: "process-8",
    approach: "predictive", difficulty: 2, tags: ["schedule", "process", "baseline"],
    stem: "The diagram shows the sequence this project follows to produce a schedule baseline. Select the step at which durations and dependencies are first combined into a model that reveals the earliest date the project can finish.",
    graphic: {
      viewBox: "0 0 660 130",
      title: "Schedule development, five steps left to right",
      caption: "Select a step. Use Tab or the arrow keys to move between steps, then Enter or Space."
    },
    regions: [
      { id: "s1", n: 1, label: "Define activities", x: 8, y: 34, w: 118, h: 62, correct: false,
        rationale: "Defining activities decomposes the work packages into things that can be scheduled. It produces the list, and nothing in it says how long anything takes or what order it goes in." },
      { id: "s2", n: 2, label: "Sequence activities", x: 142, y: 34, w: 118, h: 62, correct: false,
        rationale: "Sequencing establishes the dependencies between activities. It is half of what the model needs, and without durations it still cannot produce a date." },
      { id: "s3", n: 3, label: "Estimate durations", x: 276, y: 34, w: 118, h: 62, correct: false,
        rationale: "Duration estimating produces the other half of the input. On its own it gives you how long each activity takes but not how they combine." },
      { id: "s4", n: 4, label: "Develop schedule", x: 410, y: 34, w: 118, h: 62, correct: true,
        rationale: "This is where sequence and durations are run through the model together, producing the critical path, the float on every other path, and the earliest completion date." },
      { id: "s5", n: 5, label: "Control schedule", x: 544, y: 34, w: 108, h: 62, correct: false,
        rationale: "Controlling compares actual progress against the baseline and manages variance. It consumes the model that step 4 produced rather than creating it." }
    ],
    explanation: "The first three steps each produce an input and none of them can produce a date. Developing the schedule is where the network is analysed: the earliest finish falls out of it, and so does the critical path and the float available on everything else. Control is what happens afterwards, against the baseline that this step made possible."
  },

  {
    id: "pmp-pr8-003", type: "single", domain: "process", ecoTask: "process-8",
    approach: "agile", difficulty: 2, tags: ["schedule", "sprint", "commitment"],
    stem: "Your team has failed to complete everything it committed to in four of the last five sprints, each time by about 20 percent. The team is working hard and the product owner is losing confidence in the forecasts. What should the project manager suggest?",
    options: [
      { id: "a", text: "Commit to roughly what the team has actually completed in recent sprints, rather than to what it hopes to complete.", correct: true,
        rationale: "Consistent 20 percent overcommitment is a forecasting error, not an effort problem. Planning against demonstrated throughput restores the one thing that has been lost, which is the reliability of the forecast." },
      { id: "b", text: "Extend the sprint length so the outstanding 20 percent has room to complete inside the sprint.", correct: false,
        rationale: "A longer sprint at the same overcommitment rate finishes 80 percent of a bigger number. The ratio is the problem, and the length is not." },
      { id: "c", text: "Carry the incomplete items into the following sprint automatically so nothing is lost.", correct: false,
        rationale: "This is already happening in effect, and it is what makes each sprint start behind. Formalising the carry-over hides the overcommitment rather than correcting it." },
      { id: "d", text: "Investigate why the team is not completing its commitments and address the underlying impediments.", correct: false,
        rationale: "Worth doing and it assumes the shortfall has a cause outside the plan. A stable 20 percent gap across five sprints looks much more like consistent optimism than a recurring blocker." }
    ],
    explanation: "A steady, repeated shortfall of the same size is evidence about the estimate rather than about the team. Committing to demonstrated throughput rather than to hope makes the next forecast reliable, and reliability is what the product owner has actually lost. Longer sprints and formal carry-over both preserve the overcommitment; investigating impediments is a good habit that does not fit a gap this consistent."
  },

  {
    id: "pmp-pr9-001", type: "multi", domain: "process", ecoTask: "process-9",
    approach: "agile", difficulty: 3, tags: ["status", "metrics", "transparency"],
    stem: "Your organisation measures agile teams on velocity and publishes a league table comparing teams. Velocity across all teams has risen 40 percent in two quarters while release frequency and defect rates are unchanged. Which two conclusions are best supported?",
    options: [
      { id: "a", text: "The rise most likely reflects estimate inflation rather than a genuine increase in delivered output.", correct: true,
        rationale: "Velocity is measured in a unit each team defines for itself. When the number rises and nothing observable about delivery changes, the unit has almost certainly moved." },
      { id: "b", text: "Comparing velocity between teams is invalid, because story points are calibrated within a team and are not a common unit.", correct: true,
        rationale: "Points are a relative measure local to one team's shared reference. A league table across teams compares numbers that were never denominated in the same thing." },
      { id: "c", text: "The teams have become more efficient and the benefit has not yet reached release frequency.", correct: false,
        rationale: "Possible in principle and unlikely across every team simultaneously with no movement in any outcome measure. It also requires believing the one metric under pressure over all the ones that are not." },
      { id: "d", text: "Defect rates should be added to the league table so quality is measured alongside speed.", correct: false,
        rationale: "Adding a second metric to a table that is distorting behaviour gives teams two numbers to manage. The problem is the comparison, not the number of columns." },
      { id: "e", text: "Velocity should be replaced with hours worked, which is comparable across teams.", correct: false,
        rationale: "Hours are comparable and measure input rather than output. Swapping a gameable output measure for an input measure is a step backwards." }
    ],
    explanation: "Velocity is a planning aid for one team, expressed in a unit that team invented, and it becomes a target the moment it is published for comparison. A rise with no movement in release frequency or quality is the signature of estimate inflation. The deeper error is the league table itself: points are not a common currency, so the comparison was measuring nothing even before it started distorting behaviour."
  },

  {
    id: "pmp-pr9-002", type: "single", domain: "process", ecoTask: "process-9",
    approach: "predictive", difficulty: 2, tags: ["status", "reporting", "variance"],
    stem: "Your status report has shown the project as amber for eight consecutive weeks, with the same commentary each week. The steering group has stopped asking about it. What does this most likely indicate, and what should the project manager do?",
    options: [
      { id: "a", text: "The status is accurate and stable; continue reporting until the underlying issue resolves.", correct: false,
        rationale: "A status that has not moved in eight weeks is not stable, it is stuck. Continuing to report it identically is what trained the steering group to stop reading it." },
      { id: "b", text: "The report has stopped conveying information; state what specifically is unresolved, what it will cost, and what decision is needed.", correct: true,
        rationale: "Eight identical ambers means the report has become wallpaper. Replacing the colour with a specific unresolved item, its cost and the decision required is what makes it actionable again." },
      { id: "c", text: "The status should be escalated to red to regain the steering group's attention.", correct: false,
        rationale: "Changing the colour to be noticed rather than because the situation changed destroys the signal. It works once and makes every future rating suspect." },
      { id: "d", text: "The reporting cadence is too frequent; move to monthly so each report carries more change.", correct: false,
        rationale: "Less frequent reporting of the same uninformative content produces the same problem more slowly. The issue is what the report says, not how often it says it." }
    ],
    explanation: "A status that repeats unchanged for two months has stopped being a report and become a habit, which is why the audience has disengaged. The remedy is specificity: name the thing that is not resolving, quantify what it is costing, and state the decision needed and from whom. Escalating the colour for attention and slowing the cadence both leave the content untouched, and the content is the whole problem."
  },

  {
    id: "pmp-pr9-003", type: "single", domain: "process", ecoTask: "process-9",
    approach: "hybrid", difficulty: 3, tags: ["status", "reporting", "hybrid"],
    stem: "Your programme has three predictive workstreams reporting earned value and two agile teams reporting burn-up and cycle time. The board asks for a single view of programme progress. What should the project manager produce?",
    options: [
      { id: "a", text: "Convert the agile teams' output into earned value so all five workstreams report in one measure.", correct: false,
        rationale: "Manufacturing earned value from a backlog that changes requires a fixed scope to earn against. The conversion produces a comparable-looking number that is not measuring what it claims." },
      { id: "b", text: "Report each workstream in its native measures, and roll up to the board on outcomes and milestones that are common to all five.", correct: true,
        rationale: "The common language across mixed delivery is the outcome, not the metric. Each workstream keeps the measure that works for it, and the board sees the thing it actually needs to decide against." },
      { id: "c", text: "Report only the predictive workstreams' earned value, since the agile teams are funded separately.", correct: false,
        rationale: "It gives the board a partial view of a programme they are accountable for, and the omission will be noticed at exactly the wrong moment." },
      { id: "d", text: "Present all five sets of metrics side by side and let the board draw its own conclusions.", correct: false,
        rationale: "Five different measures with no synthesis moves the integration work onto the board. That work is the project manager's, and doing it is most of the value of the report." }
    ],
    explanation: "Mixed delivery approaches do not roll up through a common metric, because the metrics measure different things about differently-shaped work. They roll up through outcomes and milestones, which every workstream can be assessed against regardless of how it is run. Forcing one measure across all five produces false comparability; presenting five raw sets pushes the synthesis onto the audience least equipped to do it."
  },

  {
    id: "pmp-pr10-001", type: "multi", domain: "process", ecoTask: "process-10",
    approach: "predictive", difficulty: 3, tags: ["closure", "handover", "benefits"],
    stem: "Your project has delivered a warehouse management system that has been live for three weeks and is working. The sponsor wants the project closed this month so the budget can be released. Which two things must be completed before closure, rather than after it?",
    options: [
      { id: "a", text: "Formal acceptance of the deliverables by the parties named in the acceptance criteria.", correct: true,
        rationale: "Closure without recorded acceptance leaves the question of whether the project delivered what it agreed permanently open, and there is no one left to answer it afterwards." },
      { id: "b", text: "Transfer of the system, its documentation and its support arrangements to the operational owner.", correct: true,
        rationale: "Handover is the point of the project. A system running with nobody formally responsible for it after the team disperses is the classic closure failure, and it surfaces at the first incident." },
      { id: "c", text: "Confirmation that the projected efficiency benefits have been realised.", correct: false,
        rationale: "Benefits from a warehouse system take months to appear and are measured by the operational owner. Holding a project open until they land confuses delivery with benefits realisation." },
      { id: "d", text: "Completion of the twelve-month defect warranty period agreed with the supplier.", correct: false,
        rationale: "The warranty is a contractual arrangement that outlives the project. What closure requires is that responsibility for administering it has been transferred, not that it has expired." },
      { id: "e", text: "Resolution of every item on the outstanding defect list.", correct: false,
        rationale: "Minor defects are routinely handed over as a known list with an owner and a plan. Requiring an empty list before closure keeps projects open indefinitely for trivia." }
    ],
    explanation: "Closure is about finishing the project cleanly rather than about waiting for everything downstream of it to conclude. Two things must land before the team disperses: formal acceptance, which records that what was agreed was delivered, and transfer to an operational owner who will hold the system afterwards. Benefits, warranties and residual defects all continue past closure, and each is handled by transferring ownership rather than by delaying it."
  },

  {
    id: "pmp-pr10-002", type: "single", domain: "process", ecoTask: "process-10",
    approach: "agile", difficulty: 3, tags: ["closure", "release", "value"],
    stem: "An agile team has delivered the features that account for the bulk of the expected value. The remaining backlog is 90 items of low individual value, and funding runs for another two quarters. The product owner asks what to do. What should the project manager advise?",
    options: [
      { id: "a", text: "Continue delivering the backlog in priority order until the funding is exhausted.", correct: false,
        rationale: "It uses the money and stops asking whether the money should be used. Working down a queue because the funding exists is the exact behaviour value-driven delivery is meant to prevent." },
      { id: "b", text: "Assess whether the remaining items justify the run rate, and take a recommendation to the sponsor about closing early or redirecting the team.", correct: true,
        rationale: "Continuing is now a funding decision rather than a delivery one, and it belongs to whoever owns the money. Bringing them the comparison is what lets them make it." },
      { id: "c", text: "Close the project now, since the value has been delivered, and archive the remaining backlog.", correct: false,
        rationale: "It reaches the same conclusion without doing the analysis and without the sponsor. Some of those 90 items may matter more than their individual size suggests." },
      { id: "d", text: "Reduce the team size so the remaining backlog is delivered at lower cost over the two quarters.", correct: false,
        rationale: "A smaller team on low-value work still spends money on low-value work, and it breaks up a team that could be redeployed whole to something worth more." }
    ],
    explanation: "Once the value curve has flattened, the question changes from what to build next to whether to keep building at all. That is a decision about capital, so it goes to the sponsor with an honest comparison of what the remaining backlog is worth against what the team costs and what else it could do. Grinding through the queue, closing unilaterally and shrinking the team all avoid putting the real choice to the person who owns it."
  }
,

  /* ── BUSINESS ENVIRONMENT ── 15 items across the eight Business tasks ─── */

  {
    id: "pmp-b1-001", type: "matching", domain: "business", ecoTask: "business-1",
    approach: "hybrid", difficulty: 3, tags: ["governance", "authority", "escalation"],
    stem: "Match each decision to the level that owns it under a conventional governance structure. One choice is not used.",
    prompts: [
      { id: "g1", text: "Moving 15,000 between two work packages, with no change to total cost, scope or completion date." },
      { id: "g2", text: "Approving a change request that would take the project 6 percent above its approved cost tolerance." },
      { id: "g3", text: "Releasing funds held outside the cost baseline to deal with an event nobody had identified." }
    ],
    options: [
      { id: "pm", text: "The project manager, recorded in the log", correct: true, match: "g1",
        rationale: "Reallocation inside an approved envelope with no effect on cost, scope or date sits within normal delegated authority. It is recorded rather than approved, so the trail exists without the overhead." },
      { id: "ccb", text: "The change control board", correct: true, match: "g2",
        rationale: "A change that breaches an approved tolerance is exactly what a change control board exists for: it evaluates the impact against the baselines and decides on behalf of the organisation." },
      { id: "sponsor", text: "The sponsor, from management reserve", correct: true, match: "g3",
        rationale: "Management reserve sits outside the cost baseline for unknown-unknowns and is released by the sponsor. Its use is a governance act, not a project one, and it changes the funding rather than the baseline." },
      { id: "team", text: "The project team by consensus", correct: false, match: null,
        rationale: "Not used. Teams properly decide how to do the work, and none of the three above is a question about method. Consensus is the wrong instrument for decisions about money and authority." }
    ],
    explanation: "Governance works by defining who may decide what, with thresholds that route a decision upward only when it breaches one. Reallocation inside an envelope is delegated and merely logged; a breach of tolerance goes to the change control board; and money held outside the baseline is released by the sponsor. The unused option is a reminder that team consensus governs how work is done, not what is authorised."
  },

  {
    id: "pmp-b1-002", type: "single", domain: "business", ecoTask: "business-1",
    approach: "predictive", difficulty: 3, tags: ["governance", "tolerance", "escalation"],
    stem: "Your project's approved schedule tolerance is two weeks. Your current forecast shows a slip of nine days, and your mitigation plan would recover about six of them but will not be confirmed for a fortnight. What should the project manager do now?",
    options: [
      { id: "a", text: "Report the forecast slip and the mitigation plan now, noting that the tolerance is not yet breached.", correct: true,
        rationale: "Nine days is inside tolerance, so no escalation is required, and governance is better served by visibility than by silence. Reporting early with a plan is what preserves credibility if the mitigation fails." },
      { id: "b", text: "Escalate immediately, since a nine-day slip with uncertain mitigation could breach the two-week tolerance.", correct: false,
        rationale: "Escalating inside tolerance every time a breach is conceivable makes the tolerance meaningless and trains the governance body to filter you out." },
      { id: "c", text: "Wait two weeks for the mitigation result, then report the confirmed position.", correct: false,
        rationale: "Withholding a known forecast for a fortnight leaves the steering group making decisions on stale information, and the eventual report arrives with no time left to respond." },
      { id: "d", text: "Re-baseline the schedule to absorb the nine days, since it is within the agreed tolerance.", correct: false,
        rationale: "Tolerance is room to vary against the baseline, not permission to move the baseline. Re-baselining inside tolerance quietly consumes the buffer and hides the variance from everyone above." }
    ],
    explanation: "Tolerance defines when escalation becomes mandatory, and it says nothing about when reporting becomes useful. A forecast inside tolerance with mitigation still uncertain is reported as exactly that, which keeps the steering group current without triggering machinery that is not needed. Escalating early empties the threshold of meaning, waiting hides a known position, and re-baselining spends the tolerance without anyone deciding to."
  },

  {
    id: "pmp-b2-001", type: "pulldown", domain: "business", ecoTask: "business-2",
    approach: "predictive", difficulty: 3, tags: ["compliance", "audit", "evidence"],
    stem: "Complete each sentence with the term that fits. Two choices are not used.",
    prompts: [
      { id: "cm1", text: "The activity that establishes which laws, standards and internal policies the project must satisfy is best described as" },
      { id: "cm2", text: "The activity that produces the records an auditor will later use to confirm those requirements were met is best described as" }
    ],
    options: [
      { id: "identify", text: "compliance requirement identification", correct: true, match: "cm1",
        rationale: "Identification establishes the applicable obligations and their source. It happens early, because a requirement discovered late is usually a requirement that has already been breached." },
      { id: "evidence", text: "compliance evidence collection", correct: true, match: "cm2",
        rationale: "Evidence collection produces the artifacts that demonstrate conformance: test records, sign-offs, calibration certificates. Compliance you cannot evidence is indistinguishable from non-compliance during an audit." },
      { id: "gap", text: "gap analysis", correct: false, match: null,
        rationale: "Not used. A gap analysis compares the current state against a required state, which is a technique used inside compliance work rather than either of the two activities described." },
      { id: "quality", text: "quality assurance", correct: false, match: null,
        rationale: "Not used. Quality assurance checks that the processes being followed are capable of producing the required result, which overlaps compliance work without being the same thing." }
    ],
    explanation: "Compliance splits into knowing what applies and being able to prove you met it, and projects routinely do the first and neglect the second. Evidence has to be produced as the work happens: reconstructing it months later for an audit is expensive when it is possible and impossible when it is not. The two unused terms are techniques that support compliance rather than the activities themselves."
  },

  {
    id: "pmp-b2-002", type: "single", domain: "business", ecoTask: "business-2",
    approach: "hybrid", difficulty: 4, tags: ["compliance", "regulation", "change"],
    stem: "Two months from go-live, a regulator publishes a rule change that will make one module of your product non-compliant from a date four months after your launch. Your sponsor wants to launch as planned and fix it afterwards. What should the project manager do?",
    options: [
      { id: "a", text: "Comply with the sponsor's decision, since launch timing is a business decision within their authority.", correct: false,
        rationale: "Launch timing is theirs; whether they are deciding with full information is the project manager's responsibility. Deferring silently to a decision made on partial analysis is not the same as respecting authority." },
      { id: "b", text: "Establish exactly what the rule requires, what compliance would cost before and after launch, and put both options to the sponsor with the risk of each.", correct: true,
        rationale: "The sponsor's position may well be right: four months is real headroom. It becomes a sound decision only once the cost of retrofitting versus building it now, and the exposure in between, are quantified." },
      { id: "c", text: "Delay the launch until the module is compliant, since launching towards known non-compliance is not defensible.", correct: false,
        rationale: "The product is compliant at launch and for four months afterwards, so this treats a future obligation as a present breach. It also overrides a decision that belongs to the sponsor." },
      { id: "d", text: "Escalate to the compliance function so the decision is made outside the project.", correct: false,
        rationale: "Compliance should certainly be consulted, and handing them the decision skips the analysis they would need and removes the sponsor from a call that is properly theirs." }
    ],
    explanation: "A regulatory change with a future effective date is a cost and risk question rather than an immediate breach, and the sponsor is entitled to decide it. What the project manager owes them is the analysis that makes the decision sound: what the rule actually requires, what compliance costs now against later, and what exposure the gap creates. Silent compliance, unilateral delay and handing the decision away all skip that."
  },

  {
    id: "pmp-b3-001", type: "single", domain: "business", ecoTask: "business-3",
    approach: "predictive", difficulty: 2, tags: ["change-control", "baseline", "process"],
    stem: "A change request has been approved by the change control board. It adds two weeks and 40,000 to the project. What must the project manager ensure happens next?",
    options: [
      { id: "a", text: "The team is briefed on the new work so that execution can begin immediately.", correct: false,
        rationale: "Necessary and not sufficient. Starting work against an unchanged baseline means every subsequent variance report compares actuals to a plan that no longer describes the project." },
      { id: "b", text: "The affected baselines and subsidiary plans are updated, and the change is recorded in the change log with its decision.", correct: true,
        rationale: "An approved change that does not reach the baselines produces permanent phantom variance. Updating the plans and logging the decision is what makes the approval real in the system of record." },
      { id: "c", text: "The sponsor confirms the additional funding is available before the baseline is changed.", correct: false,
        rationale: "Funding should have formed part of the board's decision. Re-testing it afterwards suggests the board approved something it could not fund, which is a governance problem rather than a next step." },
      { id: "d", text: "The stakeholders affected by the two-week delay are informed of the revised dates.", correct: false,
        rationale: "It must happen and it comes after the schedule has been re-planned. Communicating dates before the baseline is updated risks circulating figures that then change." }
    ],
    explanation: "The step most often missed is the one after approval. A change is not implemented when the board says yes; it is implemented when the baselines, the subsidiary plans and the change log all reflect it, so that performance is thereafter measured against the plan the project is actually running to. Briefing the team and telling stakeholders both follow from an updated plan rather than preceding it."
  },

  {
    id: "pmp-b3-002", type: "single", domain: "business", ecoTask: "business-3",
    approach: "agile", difficulty: 3, tags: ["change-control", "agile", "backlog"],
    stem: "A stakeholder asks why an agile project needs change control at all, since the backlog is reordered every sprint and nobody raises a change request to do it. How should the project manager answer?",
    options: [
      { id: "a", text: "That agile delivery replaces change control with continuous reprioritisation, which is faster and equally rigorous.", correct: false,
        rationale: "Reprioritisation inside an agreed envelope is not a substitute for control over the envelope itself. This answer concedes that nothing governs the boundary, which is not true of a well-run agile project." },
      { id: "b", text: "That reordering within the agreed scope, budget and date is the product owner's to make freely, while anything that moves those boundaries still needs the same authority it would in any project.", correct: true,
        rationale: "It draws the line in the right place. Agile makes change cheap inside the envelope precisely so that the envelope itself can stay governed, and the two are not in tension." },
      { id: "c", text: "That change control applies to the product increment at each release, rather than to individual backlog items.", correct: false,
        rationale: "It attaches control to a delivery event rather than to the thing being controlled. A release that stays within scope, budget and date needs no approval, and one that does not needs it before the release." },
      { id: "d", text: "That the product owner holds delegated change authority, so change control has already happened when they reprioritise.", correct: false,
        rationale: "Close, and it overstates the delegation. Product owners are usually delegated authority over content and order, not over the funding envelope or the committed date." }
    ],
    explanation: "The distinction is between changing what is built and changing what was agreed. Reordering the backlog inside a fixed budget, date and scope boundary is the product owner exercising ordinary authority and needs no ceremony. Moving the boundary itself is a change to the organisation's commitment and needs the same approval anywhere. Agile lowers the cost of the first kind, which is what makes governing the second kind affordable."
  },

  {
    id: "pmp-b4-001", type: "hotspot", domain: "business", ecoTask: "business-4",
    approach: "hybrid", difficulty: 3, tags: ["impediments", "flow", "kanban"],
    stem: "The board below shows how many items are sitting in each stage of the team's workflow this morning. Select the stage where work is accumulating and the flow constraint sits.",
    graphic: {
      viewBox: "0 0 660 130",
      title: "Workflow board, five stages left to right with item counts",
      caption: "Select a stage. Use Tab or the arrow keys to move between stages, then Enter or Space."
    },
    regions: [
      { id: "k1", n: 1, label: "Ready 6", x: 8, y: 34, w: 118, h: 62, correct: false,
        rationale: "A queue of ready work is a supply of things not yet started. It says the team has work available, which is a different condition from work being stuck." },
      { id: "k2", n: 2, label: "Build 4", x: 142, y: 34, w: 118, h: 62, correct: false,
        rationale: "Four items in build for a team of this size is ordinary work in progress. Nothing here suggests items are arriving faster than they leave." },
      { id: "k3", n: 3, label: "Review 14", x: 276, y: 34, w: 118, h: 62, correct: true,
        rationale: "Fourteen items waiting against three or four everywhere else is the accumulation that marks the constraint: work arrives here faster than it can be cleared, and everything downstream is starved." },
      { id: "k4", n: 4, label: "Test 3", x: 410, y: 34, w: 118, h: 62, correct: false,
        rationale: "A thin test column downstream of a large queue is a symptom rather than the cause. Test is starved because review is not releasing work to it." },
      { id: "k5", n: 5, label: "Done 41", x: 544, y: 34, w: 108, h: 62, correct: false,
        rationale: "Completed items accumulate by design; the column only ever grows. A large done count says the team delivers, not that anything is blocked." }
    ],
    explanation: "The constraint is the stage where work arrives faster than it departs, and it shows up as a queue in front of it and starvation behind it. Review has both. The useful responses follow from that reading: limit what is started upstream, or add capability to clear reviews, rather than pushing harder on build, which would only make the queue longer."
  },

  {
    id: "pmp-b4-002", type: "single", domain: "business", ecoTask: "business-4",
    approach: "agile", difficulty: 2, tags: ["impediments", "escalation", "flow"],
    stem: "Your team maintains an impediment log. Reviewing it, you find eleven open items, of which nine have been open for more than three weeks and are all owned by people outside the team. What does this most likely indicate?",
    options: [
      { id: "a", text: "The team is raising too many impediments, and the threshold for logging one should be raised.", correct: false,
        rationale: "Nine genuine blockers outside the team's control is not over-reporting. Raising the threshold would reduce the log and leave the same work blocked, now invisibly." },
      { id: "b", text: "Impediments outside the team's control are not being escalated with enough force, and the project manager should be pursuing them directly.", correct: true,
        rationale: "A log is a record, not a mechanism. Items owned externally and open for weeks are the ones that need someone with reach across the organisation chasing them, which is the project manager's job." },
      { id: "c", text: "The log is being used correctly and the ageing items simply reflect organisational realities beyond the project.", correct: false,
        rationale: "Accepting three-week blockers as the way of things is how a team learns that raising an impediment achieves nothing. Some will be immovable; nine of eleven will not be." },
      { id: "d", text: "The team should re-plan its work to avoid the areas where these impediments occur.", correct: false,
        rationale: "Routing around blockers works occasionally and shrinks what the project can attempt. It also leaves the same obstacles in place for whoever hits them next." }
    ],
    explanation: "An impediment log measures how well obstacles are being cleared, and ageing items owned outside the team are the specific signal that escalation is not working. Those are the ones the project manager exists to pursue, because they need standing the team does not have. Raising the logging threshold, accepting the ageing as normal, and planning around the blockers all reduce the visible problem without touching the actual one."
  },

  {
    id: "pmp-b5-001", type: "fillblank", domain: "business", ecoTask: "business-5",
    approach: "predictive", difficulty: 3, tags: ["risk", "emv", "quantitative"],
    stem: "A project carries two quantified risks: a threat with a 30 percent probability and a 250,000 impact, and an opportunity with a 40 percent probability and a 100,000 benefit. Using the convention that threats are negative and opportunities positive, work out the expected monetary value of the threat and then the net expected monetary value of the pair.",
    blanks: [
      { id: "emv1", label: "Expected monetary value of the threat, in dollars", numeric: true, expect: -75000, tol: 1, unit: "USD",
        rationale: "EMV is probability multiplied by impact: 0.30 \u00D7 250,000 = 75,000, carried as \u221275,000 because a threat reduces value." },
      { id: "emv2", label: "Net expected monetary value of both risks, in dollars", numeric: true, expect: -35000, tol: 1, unit: "USD",
        rationale: "The opportunity contributes 0.40 \u00D7 100,000 = +40,000. Netting the two gives \u221275,000 + 40,000 = \u221235,000, so the pair is a net threat." }
    ],
    explanation: "Expected monetary value weights an outcome by its likelihood, and summing across risks with a consistent sign convention gives the net exposure a contingency provision has to cover. What the single figure hides is shape: a net of \u221235,000 could come from many small risks or, as here, from one large threat partly offset by an opportunity that may not arrive. The number sizes the reserve; the distribution behind it decides the response."
  },

  {
    id: "pmp-b5-002", type: "multi", domain: "business", ecoTask: "business-5",
    approach: "agile", difficulty: 3, tags: ["risk", "agile", "identification"],
    stem: "An agile programme has no risk register. The delivery manager argues that iterative delivery manages risk inherently, through short feedback loops and frequent releases. Which two responses are best supported?",
    options: [
      { id: "a", text: "Short iterations genuinely reduce delivery risk by shortening the time between a wrong assumption and the evidence of it.", correct: true,
        rationale: "This part of the argument is sound and worth conceding. Frequent working software is a real risk control, and treating it as one is what makes the rest of the conversation credible." },
      { id: "b", text: "Risks that sit outside the iteration \u2014 regulatory, supplier, security, funding \u2014 are not surfaced by delivery cadence and still need explicit management.", correct: true,
        rationale: "Iteration exposes risks in what is being built. A supplier failing or a regulation changing will not appear in a sprint review no matter how frequent it is." },
      { id: "c", text: "A risk register is required by the organisation's methodology, so the programme must produce one regardless.", correct: false,
        rationale: "An appeal to process compliance loses the argument even when it wins it. It also gives the delivery manager no reason to use the register once it exists." },
      { id: "d", text: "The absence of a register means risk is not being managed at all on the programme.", correct: false,
        rationale: "Overstated, and it is contradicted by the first option. Plenty of risk is being managed; the gap is in the categories that iteration does not reach." },
      { id: "e", text: "Risk should be managed by adding a risk item to the backlog whenever one is identified.", correct: false,
        rationale: "Backlog items are work to be done and many risks call for monitoring rather than action. Forcing every risk into the backlog either inflates it or loses the ones with no current task." }
    ],
    explanation: "The delivery manager is half right, and the productive answer concedes that half. Iteration is a genuine control over the risk that the wrong thing is being built, because it shortens the feedback loop. It does nothing about risks whose source is outside the delivery: suppliers, regulators, security, funding. Those need identifying, owning and monitoring explicitly, whatever the cadence of the work."
  },

  {
    id: "pmp-b5-003", type: "single", domain: "business", ecoTask: "business-5",
    approach: "predictive", difficulty: 4, tags: ["risk", "response", "residual"],
    stem: "You have transferred a threat of data loss to a specialist backup provider under contract. In review, a team member points out that the provider could itself fail, and that some exposure remains even when they perform. How should these two be recorded?",
    options: [
      { id: "a", text: "Provider failure is a secondary risk arising from the response; the exposure that remains after the response works is residual risk. Both are recorded and owned.", correct: true,
        rationale: "The distinction is exactly this: a secondary risk is created by the response itself, and residual risk is what the response does not remove. Both need an owner or they vanish from view." },
      { id: "b", text: "Both are residual risks, since both remain after the transfer response has been applied.", correct: false,
        rationale: "It collapses two different things. Provider failure did not exist before the transfer; it was introduced by it, and responses that create new exposure need tracking as their own category." },
      { id: "c", text: "Both are secondary risks, since both arise as a consequence of the decision to transfer.", correct: false,
        rationale: "Residual exposure is not a consequence of transferring. It is the part of the original threat the response never covered, and it would have existed under most other responses too." },
      { id: "d", text: "Neither needs recording, since the threat has been transferred and the provider now owns it.", correct: false,
        rationale: "Transfer moves impact and usually delivery, and it does not move accountability for the outcome. A provider failing is still your data loss, and the contract is the recourse rather than the protection." }
    ],
    explanation: "Every risk response leaves something behind and often creates something new. What is left over is residual risk; what the response itself introduces is secondary risk. Transfer is the response where the distinction bites hardest, because it feels final and is not: the counterparty becomes a new source of exposure, and accountability for the outcome stays where it started."
  },

  {
    id: "pmp-b6-001", type: "single", domain: "business", ecoTask: "business-6",
    approach: "agile", difficulty: 2, tags: ["improvement", "retrospective", "actions"],
    stem: "Your team's retrospectives are well attended and generate good discussion, but the same three problems have been raised in each of the last five. Nothing has changed. What is the most effective intervention?",
    options: [
      { id: "a", text: "Change the retrospective format, so the discussion surfaces different problems.", correct: false,
        rationale: "The discussion is not the failure. Rotating formats to find new problems while three known ones go unfixed is motion rather than improvement." },
      { id: "b", text: "End each retrospective with one improvement the team commits to, with an owner and a date, and open the next one by reviewing it.", correct: true,
        rationale: "Repetition without change means actions are not being carried out. One owned, dated commitment reviewed at the start of the next session closes the loop that is currently open." },
      { id: "c", text: "Escalate the three recurring problems to the sponsor, since the team has been unable to resolve them.", correct: false,
        rationale: "Premature. Nobody has yet tried to fix them, so there is nothing to escalate. Some may also be within the team's gift and would come straight back." },
      { id: "d", text: "Reduce retrospective frequency, since five sessions have produced no change and the time could be better spent.", correct: false,
        rationale: "It removes the one place the problems are being named. Fewer sessions producing no actions is the same failure at lower cost, not an improvement." }
    ],
    explanation: "A retrospective that generates discussion and no change has lost its second half. The remedy is small and specific: one improvement, one owner, one date, and a review of it at the start of the next session so that not doing it is visible. Changing the format looks for different problems, escalation skips the attempt, and meeting less often gives up on the mechanism entirely."
  },

  {
    id: "pmp-b7-001", type: "multi", domain: "business", ecoTask: "business-7",
    approach: "hybrid", difficulty: 4, tags: ["org-change", "adoption", "culture"],
    stem: "A new expenses system technically launched on time and works correctly. Six weeks later, 70 percent of claims are still being submitted on the old spreadsheet, which finance continues to accept. Which two actions are most likely to shift adoption?",
    options: [
      { id: "a", text: "Work with finance to stop accepting the old spreadsheet from an announced date.", correct: true,
        rationale: "As long as the old route works, the new one is optional, and optional change does not happen. Closing the alternative is usually the single highest-leverage move available." },
      { id: "b", text: "Find out from the people still using the spreadsheet what the new system makes harder, and fix what is real.", correct: true,
        rationale: "Seventy percent is too many for the explanation to be habit alone. Something in the new flow is worse for them, and closing the old route without fixing it converts resistance into resentment." },
      { id: "c", text: "Issue a communication from the sponsor reminding everyone that the new system is now mandatory.", correct: false,
        rationale: "A reminder that something is mandatory while the alternative is still accepted teaches people that the mandate is rhetorical. Announcements do not substitute for the two moves above." },
      { id: "d", text: "Run additional training sessions on the new system for all claimants.", correct: false,
        rationale: "Training answers a capability problem, and nothing here suggests people cannot use the system. Training a workforce that is choosing not to adopt is expensive and beside the point." },
      { id: "e", text: "Report the adoption figure as a project risk and hand it to the operational owner at closure.", correct: false,
        rationale: "A delivered system nobody uses has not delivered its benefit. Recording that as a risk and handing it on is closure of the project rather than completion of the change." }
    ],
    explanation: "Technical delivery and organisational change are different achievements, and a working system with 70 percent non-adoption has only the first. Two things move it together: remove the alternative, and find out what the new flow makes worse before you do. Doing only the first produces workarounds and ill will; doing only the second leaves the change optional. Communication and training address a willingness and capability problem that the evidence does not support."
  },

  {
    id: "pmp-b8-001", type: "single", domain: "business", ecoTask: "business-8",
    approach: "predictive", difficulty: 3, tags: ["external", "market", "business-case"],
    stem: "Eight months into a two-year project, a competitor releases a product that does most of what yours will do, free. Your project is on schedule and on budget. What should the project manager do?",
    options: [
      { id: "a", text: "Continue as planned, since the project is performing well against its baselines and market response is not the project's remit.", correct: false,
        rationale: "Performing well against a baseline says nothing about whether the work is still worth doing. A project that delivers perfectly into a changed market has succeeded at the wrong thing." },
