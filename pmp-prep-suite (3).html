/* ═══ §12  BOOTSTRAP ══════════════════════════════════════════════════════ */

/* ── 12.1  FAILURE HANDLING ────────────────────────────────────────────────
   Anything that escapes lands here. The first thing offered is always a way
   to get the person's progress out of the file, before anything else. */
PMP.report = (function () {
  var shown = false;
  return function report(err, where) {
    PMP.Store.commit(["ui"], function (s) {
      s.ui.lastError = { where: where || "unknown", message: (err && err.message) || String(err), at: Date.now() };
    }, { transient: true });
    if (shown) return;
    shown = true;
    setTimeout(function () { shown = false; }, 5000);
    var detail = (err && err.message) ? err.message : "No further detail was available.";
    PMP.UI.sheet({
      title: "Something went wrong",
      body: PMP.dom.frag([
        PMP.dom.el("p", { text: "The app hit an error in " + (where || "an unknown section") + ". Your saved progress has not been changed." }),
        PMP.dom.el("p", { text: "Export a backup now, then reload the file. If it happens again, note what you were doing and include it in your issue report." }),
        PMP.dom.el("p", { class: "hint", text: detail })
      ]),
      actions: [
        { id: "close", label: "Continue anyway" },
        { id: "export", label: "Export progress", icon: "data", primary: true }
      ]
    }).then(function (choice) {
      if (choice === "export") PMP.Exporter.exportProgress();
    });
  };
})();

window.addEventListener("error", function (e) {
  PMP.report(e.error || new Error(e.message), "page");
});
window.addEventListener("unhandledrejection", function (e) {
  PMP.report(e.reason instanceof Error ? e.reason : new Error(String(e.reason)), "background task");
});

/* Leaving mid-exam loses the sitting on a browser that cannot persist.
   §10.03 sets ui.examActive; the guard itself lives here so it survives
   whatever the exam module does. */
window.addEventListener("beforeunload", function (e) {
  if (!PMP.Store.state.ui.examActive) return;
  e.preventDefault();
  e.returnValue = "";
  return "";
});


/* ── 12.2  SHELL WIRING ─────────────────────────────────────────────────── */
PMP.Shell = (function () {
  var railEl, scrimEl, toggleEl, lastRoute = null;

  function setNav(open) {
    railEl.setAttribute("data-open", open ? "true" : "false");
    scrimEl.setAttribute("data-open", open ? "true" : "false");
    scrimEl.hidden = !open;
    toggleEl.setAttribute("aria-expanded", open ? "true" : "false");
    toggleEl.setAttribute("aria-label", open ? "Close navigation" : "Open navigation");
    if (open) { var first = railEl.querySelector(".nav-i"); if (first) first.focus(); }
  }

  function applyTheme(pref) {
    var resolved = pref;
    if (pref === "system") {
      var mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)");
      resolved = (mq && mq.matches) ? "light" : "dark";
    }
    document.documentElement.setAttribute("data-theme", resolved);
    document.getElementById("theme-icon").setAttribute("href", resolved === "dark" ? "#i-moon" : "#i-sun");
    document.getElementById("theme-label").textContent = resolved === "dark" ? "Dark" : "Light";
    /* Written outside the store namespace so §01.6 can read it before paint. */
    try { window.localStorage.setItem("pmp.theme", pref === "system" ? "" : pref); } catch (e) { /* not persistent; the toggle still works for the session */ }
  }

  function cycleTheme() {
    var cur = document.documentElement.getAttribute("data-theme");
    var next = cur === "dark" ? "light" : "dark";
    PMP.Store.commit(["settings"], function (s) { s.settings.theme = next; });
    applyTheme(next);
    PMP.UI.announce(next === "dark" ? "Dark theme" : "Light theme");
  }

  function renderStatus(state) {
    var tag = document.getElementById("mode-tag");
    var txt = document.getElementById("mode-text");
    var mode = state.sys.storageMode;
    tag.setAttribute("data-mode", mode);
    txt.textContent = mode === "persistent" ? "Saved on this device"
                    : mode === "session" ? "Session only"
                    : "Checking";
    var explain = mode === "persistent"
      ? "Progress is stored on this device (" + (state.sys.storageTier === "idb" ? "IndexedDB" : "local storage") + ")."
      : mode === "session" ? "Progress is held in memory and will be lost when this tab closes."
      : "Checking where progress can be stored.";
    tag.setAttribute("title", explain);
    /* The label text is hidden under 600px, so the name lives on the element. */
    tag.setAttribute("aria-label", txt.textContent + ". " + explain);
    document.getElementById("brand-eco").textContent = "ECO " + PMP.ECO.VERSION;
    var due = document.getElementById("due-badge");
    var scheduled = Object.keys(state.srs).length;
    due.textContent = String(scheduled);
    due.hidden = scheduled === 0;
  }

  function init() {
    railEl = document.getElementById("rail");
    scrimEl = document.getElementById("scrim");
    toggleEl = document.getElementById("nav-toggle");

    PMP.dom.on(toggleEl, "click", function () {
      setNav(railEl.getAttribute("data-open") !== "true");
    });
    PMP.dom.on(scrimEl, "click", function () { setNav(false); });
    PMP.dom.on(document, "keydown", function (e) {
      if (e.key === "Escape" && railEl.getAttribute("data-open") === "true") {
        setNav(false); toggleEl.focus();
      }
    });
    PMP.dom.on(document.getElementById("theme-btn"), "click", cycleTheme);
    PMP.dom.on(document.getElementById("export-btn"), "click", function () { PMP.Exporter.exportProgress(); });
    PMP.dom.delegate(document.getElementById("sheet"), "click", "[data-sheet-close]", function () { PMP.UI.closeSheet(null); });
    PMP.dom.on(document.getElementById("sheet"), "close", function () { PMP.UI.closeSheet(null); });

    /* Follow the OS only while the person has not chosen for themselves. */
    if (window.matchMedia) {
      var mq = window.matchMedia("(prefers-color-scheme: light)");
      var onChange = function () {
        if (PMP.Store.state.settings.theme === "system") applyTheme("system");
      };
      if (mq.addEventListener) mq.addEventListener("change", onChange);
      else if (mq.addListener) mq.addListener(onChange);
    }

    PMP.Store.subscribe(function (state, changed) {
      if (changed.indexOf("sys") >= 0 || changed.indexOf("srs") >= 0) {
        renderStatus(state);
        PMP.UI.renderBanners(state);
      }
      if (changed.indexOf("ui") >= 0 && state.ui.route !== lastRoute) {
        lastRoute = state.ui.route;
        if (railEl.getAttribute("data-open") === "true") setNav(false);
      }
    });
  }

  return { init: init, applyTheme: applyTheme, setNav: setNav, renderStatus: renderStatus };
})();

/* ── 12.4  BOOT ────────────────────────────────────────────────────────────
   The first line of work in the whole file. Everything above only declared. */
(function boot() {
  function run() {
    PMP.Shell.init();
    PMP.Shell.applyTheme(PMP.Store.state.settings.theme || "system");

    PMP.Storage.probe()
      .then(function (mode) {
        PMP.Store.commit(["sys"], function (s) {
          s.sys.storageMode = mode;
          s.sys.storageTier = PMP.Storage.tier;
        }, { transient: true });
        return mode === "session" ? null : PMP.Store.hydrate();
      })
      .catch(function (e) {
        PMP.Store.commit(["sys"], function (s) { s.sys.storageMode = "session"; }, { transient: true });
        PMP.report(e, "startup");
      })
      .then(function () {
        PMP.Shell.applyTheme(PMP.Store.state.settings.theme || "system");
        PMP.Store.commit(["sys"], function (s) { s.sys.ready = true; }, { transient: true });
        PMP.Shell.renderStatus(PMP.Store.state);
        PMP.UI.renderBanners(PMP.Store.state);
        PMP.Router.start();
      });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", run);
  else run();
})();
</script>
