        if (!item.committed && session.mode !== "timed") { if (item.ctrl.answered()) check(item); }
        else advance(item);
        return;
      }
      if (e.key === "Escape") { e.preventDefault(); confirmEnd(); return; }
      if (inField) return;

      var k = e.key;
      if (k === "?") { e.preventDefault(); showKeyHelp(); return; }

      /* The letters printed beside the options win. They are the only key
         mapping on screen, so a person pressing B while looking at a B is
         choosing that option, not asking to go back a question. Everything
         below runs on what the renderer turns down, which is why the actions
         are on N, P, K and R: none of those falls inside A to J for a
         four-option item, and only F does for an item with six or more. */
      if (!item.committed && /^[a-jA-J1-9]$/.test(k) && item.ctrl.hotkey(k)) { e.preventDefault(); return; }

      if (k === "n" || k === "N") { e.preventDefault(); advance(item); return; }
      if (k === "p" || k === "P") { e.preventDefault(); if (session.i > 0) show(session.i - 1); return; }
      if (k === "f" || k === "F") { e.preventDefault(); toggleFlag(item); return; }
      if (k === "k" || k === "K") { e.preventDefault(); editNote(item); return; }
      if (k === "r" || k === "R") { e.preventDefault(); reportIssue(item); return; }
    });
    teardown.push(off);
  }

  function showKeyHelp() {
    PMP.UI.sheet({
      title: "Keyboard shortcuts",
      body: frag([
        el("p", { text: "These work anywhere in a drill, except while you are typing in a box." }),
        keyHelpList()
      ]),
      actions: [{ id: "close", label: "Close", primary: true }]
    });
  }

  function confirmEnd() {
    PMP.UI.confirm(
      "End this drill?",
      "You are on question " + (session.i + 1) + " of " + session.items.length + ". Everything you have already answered is saved, and you will see the summary for those.",
      "End drill", true
    ).then(function (yes) { if (yes) finish(); });
  }

  /* ── 10.02.9  SUMMARY ────────────────────────────────────────────────── */
  function finish() {
    if (session.finished) return;
    session.items.forEach(function (item) {
      item.clock.pause();
      if (!item.committed && item.ctrl && item.ctrl.answered()) {
        item.value = item.ctrl.value();
        item.result = PMP.QRender.score(item.q, item.p, item.value);
        item.committed = true;
        record(item);
      }
    });
    if (session.clock) session.clock.pause();
    session.finished = true;
    session.finishedAt = Date.now();
    cleanup();
    repaint();
  }

  function renderSummary(host) {
    var items = session.items;
    var answered = items.filter(function (i2) { return i2.committed && i2.result; });
    var right = answered.filter(function (i2) { return i2.result.correct; });
    var credit = answered.reduce(function (a, i2) { return a + i2.result.credit; }, 0);
    var totalMs = items.reduce(function (a, i2) { return a + i2.clock.elapsed(); }, 0);
    var avgSec = answered.length ? (answered.reduce(function (a, i2) { return a + i2.clock.elapsed(); }, 0) / answered.length / 1000) : 0;
    var overPace = answered.filter(function (i2) { return i2.clock.elapsed() > PACE_MS; }).length;

    host.appendChild(el("div", { class: "view-hd" }, [
      el("span", { class: "eyebrow", text: MODES[session.mode].name + " \u00B7 finished" }),
      el("h2", { text: answered.length ? PMP.fmt.pct(right.length / answered.length) + " correct" : "Nothing was answered" }),
      el("p", { text: answered.length
        ? right.length + " of " + PMP.fmt.plural(answered.length, "answered question") + " right, in " + PMP.fmt.duration(totalMs / 1000) + ". Every one of them is already saved to your history."
        : "This drill ended without a committed answer, so nothing was recorded." })
    ]));

    host.appendChild(el("div", { class: "card" }, [
      el("span", { class: "eyebrow", text: "The numbers" }),
      el("div", { class: "sum-grid", style: "margin-top:var(--sp-4)" }, [
        stat("Correct", right.length + " / " + answered.length),
        stat("With part marks", answered.length ? PMP.fmt.pct(credit / answered.length) : "\u2014"),
        stat("Average pace", answered.length ? Math.round(avgSec) + "s" : "\u2014"),
        stat("Over " + CFG.PACE_TARGET_SEC + "s", String(overPace)),
        stat("Skipped", String(items.length - answered.length))
      ]),
      el("p", { style: "margin-top:var(--sp-4)", text: "Part marks count each right option in a multiple-response or matching item. The exam scores the item as a whole, so the correct count above is the figure that feeds your readiness score." })
    ]));

    host.appendChild(breakdown("By ECO task", answered, function (i2) {
      var t = PMP.ECO_TASK_BY_ID[i2.q.ecoTask];
      return t ? t.label : "Untagged";
    }));
    host.appendChild(breakdown("By question type", answered, function (i2) {
      return PMP.QRender.label(i2.q.type);
    }));

    var reviewCard = el("div", { class: "card" }, [
      el("span", { class: "eyebrow", text: "Review" }),
      el("h2", { text: "Every question, with the reasoning" })
    ]);
    items.forEach(function (item, idx) {
      if (!item.panel) panelFor(item, idx);
      if (item.committed && item.result && !item.revealed) {
        item.ctrl.reveal(item.result);
        showVerdict(item);
      }
      item.revealed = true;
      if (item.ui.foot) item.ui.foot.hidden = true;
      var state = item.result ? (item.result.correct ? "correct" : item.result.partial ? "flagged" : "incorrect") : null;
      var det = el("details", { class: "review" }, [
        el("summary", null, [
          el("span", { class: "n", text: String(idx + 1) }),
          el("span", { class: "chip" + (state ? " chip--" + state : ""), text: item.result ? (item.result.correct ? "Correct" : item.result.partial ? "Part marks" : "Wrong") : "Skipped" }),
          el("span", { class: "s", text: item.q.stem })
        ]),
        el("div", { class: "review-bd" }, [item.panel])
      ]);
      if (item.result && !item.result.correct) det.open = true;
      reviewCard.appendChild(det);
    });
    host.appendChild(reviewCard);

    var wrong = items.filter(function (i2) { return i2.result && !i2.result.correct; }).map(function (i2) { return i2.q; });
    host.appendChild(el("div", { class: "card" }, [
      el("span", { class: "eyebrow", text: "Next" }),
      el("div", { style: "display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-top:var(--sp-3)" }, [
        wrong.length ? el("button", {
          class: "btn btn--primary", type: "button",
          onclick: function () { startWith(PMP.rng.shuffle(wrong).items, session.mode); }
        }, [icon("target"), "Redo the " + wrong.length + " you missed"]) : null,
        el("button", {
          class: "btn", type: "button",
          onclick: function () { startWith(choose(pool(), session.items.length, session.mode), session.mode); }
        }, "Another drill, same filters"),
        el("button", {
          class: "btn", type: "button",
          onclick: function () { session = null; repaint(); }
        }, "Change the filters")
      ])
    ]));
  }

  function stat(k, v) {
    return el("div", { class: "stat" }, [
      el("span", { class: "stat-k", text: k }),
      el("span", { class: "stat-v", text: v })
    ]);
  }

  function breakdown(title, answered, keyOf) {
    var card = el("div", { class: "card" }, [el("span", { class: "eyebrow", text: title })]);
    if (!answered.length) {
      card.appendChild(el("p", { text: "Nothing was answered, so there is nothing to break down." }));
      return card;
    }
    var groups = Object.create(null);
    answered.forEach(function (i2) {
      var k = keyOf(i2);
      var g = groups[k] || (groups[k] = { n: 0, right: 0, ms: 0 });
      g.n++;
      if (i2.result.correct) g.right++;
      g.ms += i2.clock.elapsed();
    });
    var tbl = el("table", { class: "tbl" }, [
      el("thead", null, [el("tr", null, [
        el("th", { text: title.replace("By ", "") }),
        el("th", { class: "n", text: "Right" }),
        el("th", { class: "n", text: "Asked" }),
        el("th", { class: "n", text: "Avg" })
      ])])
    ]);
    var body = el("tbody");
    Object.keys(groups).sort().forEach(function (k) {
      var g = groups[k];
      body.appendChild(el("tr", null, [
        el("td", { text: k }),
        el("td", { class: "n", text: String(g.right) }),
        el("td", { class: "n", text: String(g.n) }),
        el("td", { class: "n", text: Math.round(g.ms / g.n / 1000) + "s" })
      ]));
    });
    tbl.appendChild(body);
    card.appendChild(tbl);
    return card;
  }

  /* ── 10.02.10  ROUTE ─────────────────────────────────────────────────── */
  function view(host, params) {
    cleanup();
    if (!filters) {
      filters = defaultFilters();
      /* A link like #/practice?domain=process&type=multi lands pre-filtered. */
      if (params) Object.keys(filters).forEach(function (k) {
        if (params[k]) filters[k] = params[k];
      });
    }
    /* A live drill always wins: coming back to Practice after wandering off to
       the dashboard drops you where you left off, on the question you left off
       on, with the answer you had typed. End drill in the header is the way
       out, and it marks whatever has been answered on the way. */
    if (session && !session.finished) return renderDrill(host);
    if (session && session.finished) return renderSummary(host);
    return renderSetup(host, params);
  }

  PMP.Router.register("practice", { title: "Practice", render: view });

  /* Tickers and the document key handler belong to a drill that is on screen.
     Leaving the route takes them down; the session itself is left alone so
     Resume works when the person comes back. */
  PMP.Store.subscribe(function (state, changed) {
    if (changed.indexOf("ui") >= 0 && state.ui.route && state.ui.route !== "practice") cleanup();
  });

  return { startWith: startWith, cleanup: cleanup, get session() { return session; } };
})();

/* ── 10.04  QUESTION RENDERERS ──────────────────────────────────────────────
   Five renderers, one per question type in §3.4. Two of the seven type ids
   accepted by the validator in §09.6 are presentation variants and share a
   renderer with their base type: a "pulldown" is a matching item whose prompts
   read as blanks in the stem, and a "graphic" item is a hotspot over a diagram.
   Nothing outside this section needs to know which is which.

   Three rules hold across all five:

   1. An answer is always a set of option, prompt, region or blank *ids*.
      Never a displayed index. That is what makes shuffling safe.
   2. Shuffling touches the option pool only. Matching prompts keep their
      authored order because they often read as a sequence, and hotspot regions
      are positions in a picture, so neither can move.
   3. Every input is reachable and operable from the keyboard alone, and the
      state of every input is exposed through a native control or an ARIA role.

   The controller returned by render() is the whole contract with §10.02:
      node       the element that was appended
      value()    the current answer, in the shape score() expects
      answered() whether there is enough of an answer to submit
      focus()    move focus to the first input
      reveal(r)  mark up the result of score() and show the rationales
      hotkey(k)  handle a single character, returns true if it was used
   ═════════════════════════════════════════════════════════════════════════ */
PMP.QRender = (function () {
  var el = PMP.dom.el, icon = PMP.dom.icon, on = PMP.dom.on;
  var LETTERS = "ABCDEFGHIJ";
  var SVGNS = "http://www.w3.org/2000/svg";

  var ALIAS = { pulldown: "matching", graphic: "hotspot" };
  var LABEL = {
    single: "Multiple choice", multi: "Multiple response", matching: "Matching",
    pulldown: "Drop-down", hotspot: "Hotspot", graphic: "Graphic hotspot",
    fillblank: "Fill in the blank"
  };

  function base(type) { return ALIAS[type] || type; }
  function label(type) { return LABEL[type] || type; }
  function correctIds(q) {
    return (q.options || []).filter(function (o) { return o.correct; }).map(function (o, i) { return o.id; });
  }

  /* The model answer in the same shape a controller's value() returns, for
     every type rather than just the choice ones. correctIds above only ever
     spoke about options, which leaves matching, hotspot and fill-in-the-blank
     with no way to say what the right answer was — and those are precisely
     the types a review screen has to be able to replay. Anything that wants
     to show a worked answer, or to check a controller round-trips, asks here.
     For a text blank the first accepted spelling is used, since the accept
     list is an alias list and its head is the canonical form. */
  function correctValue(q) {
    var t = base(q.type);
    if (t === "single") return correctIds(q)[0] || null;
    if (t === "multi") return correctIds(q);
    if (t === "matching") {
      var m = {};
      (q.options || []).forEach(function (o) { if (o.match != null) m[o.match] = o.id; });
      return m;
    }
    if (t === "hotspot") {
      return (q.regions || []).filter(function (r) { return r.correct; }).map(function (r) { return r.id; });
    }
    if (t === "fillblank") {
      var b = {};
      (q.blanks || []).forEach(function (bl) {
        b[bl.id] = bl.numeric ? String(bl.expect) : String((bl.accept || [])[0] || "");
      });
      return b;
    }
    return null;
  }

  /* The line under the stem that tells the person what kind of answer is
     wanted. Multi says how many, because "select all that apply" without a
     count is the single most common source of avoidable partial credit. */
  function instruction(q) {
    var t = base(q.type);
    if (t === "single") return "Choose the best answer.";
    if (t === "multi") {
      var n = (q.options || []).filter(function (o) { return o.correct; }).length;
      return n > 1 ? "Choose " + n + " answers." : "Choose all that apply.";
    }
    if (t === "matching") {
      var extra = (q.options || []).length - (q.prompts || []).length;
      return "Choose one for each line." + (extra > 0 ? " " + (extra === 1 ? "One choice is" : extra + " choices are") + " not used." : "");
    }
    if (t === "hotspot") return (q.multi ? "Select every part of the diagram that applies." : "Select one part of the diagram.");
    if (t === "fillblank") return (q.blanks || []).length > 1 ? "Fill in both boxes." : "Type your answer in the box.";
    return "";
  }

  /* ── 10.04.1  PRESENT — shuffle with correct-answer mapping ───────────────
     The presentation is built once per item per sitting and then held for as
     long as that item is on screen, so the option order cannot change under
     someone who is midway through reading it. `src` is the index the option
     held in the pack and `order` is the display-to-source map, both stored on
     the attempt so a review can reproduce exactly what was on screen.
     Options carrying fixed:true (an "all of the above" style tail) keep their
     authored position while everything around them moves. */
  function present(q, opts) {
    opts = opts || {};
    var rand = opts.rand || Math.random;
    var doShuffle = opts.shuffle !== false && q.shuffle !== false;

    var decorated = (q.options || []).map(function (o, i) {
      return {
        id: o.id != null ? String(o.id) : "o" + i,
        text: o.text, rationale: o.rationale, correct: !!o.correct,
        match: o.match != null ? String(o.match) : null,
        fixed: !!o.fixed, src: i
      };
    });

    var options = decorated;
    if (doShuffle && decorated.length > 1) {
      var movable = decorated.filter(function (o) { return !o.fixed; });
      var res = PMP.rng.shuffle(movable, rand);
      var m = 0;
      options = decorated.map(function (o) { return o.fixed ? o : res.items[m++]; });
    }

    return {
      qid: q.id,
      type: base(q.type),
      declaredType: q.type,
      shuffled: doShuffle,
      options: options,
      order: options.map(function (o) { return o.src; }),
      prompts: (q.prompts || []).map(function (p, i) {
        return { id: p.id != null ? String(p.id) : "p" + i, text: p.text };
      }),
      regions: (q.regions || []).map(function (r, i) {
        var o = {};
        for (var k in r) if (Object.prototype.hasOwnProperty.call(r, k)) o[k] = r[k];
        o.id = r.id != null ? String(r.id) : "r" + i;
        o.n = r.n != null ? r.n : i + 1;
        return o;
      }),
      blanks: (q.blanks || []).map(function (b, i) {
        var o = {};
        for (var k in b) if (Object.prototype.hasOwnProperty.call(b, k)) o[k] = b[k];
        o.id = b.id != null ? String(b.id) : "b" + i;
        return o;
      })
    };
  }

  /* ── 10.04.2  SCORE ──────────────────────────────────────────────────────
     Every type returns the same shape: credit 0–1, and correct only when
     credit is a full 1. Partial credit is recorded on the attempt because it
     is the honest measure of a five-option multi-response item, but the exam
     scores the item, not the options, so `correct` stays all-or-nothing and
     that is the figure the readiness score in §10.01 will read. */
  function result(credit, extra) {
    var r = extra || {};
    r.credit = Math.max(0, Math.min(1, credit));
    r.correct = r.credit >= 1;
    r.partial = r.credit > 0 && r.credit < 1;
    return r;
  }

  function setOf(v) {
    var s = Object.create(null);
    (v || []).forEach(function (x) { s[x] = true; });
    return s;
  }

  function parseNumber(s) {
    var t = String(s == null ? "" : s).trim();
    if (!t) return NaN;
    /* Accountancy negatives, thousands separators and a trailing unit are all
       things people type. None of them should read as a wrong answer. */
    t = t.replace(/^\((.*)\)$/, "-$1").replace(/[,\s]/g, "").replace(/[$\u00A3\u20AC%]/g, "");
    if (!/^[-+]?\d*\.?\d+(e[-+]?\d+)?$/i.test(t)) return NaN;
    return parseFloat(t);
  }

  function blankIsRight(b, raw) {
    if (raw == null || String(raw).trim() === "") return false;
    if (b.numeric) {
      var v = parseNumber(raw);
      if (isNaN(v)) return false;
      return Math.abs(v - b.expect) <= (b.tol != null ? b.tol : 0);
    }
    var got = PMP.text.normalise(raw);
    return (b.accept || []).some(function (a) { return PMP.text.normalise(a) === got; });
  }

  function score(q, p, value) {
    var t = p.type, i;

    if (t === "single") {
      var right = p.options.filter(function (o) { return o.correct; })[0];
      var rid = right ? right.id : null;
      return result(value && value === rid ? 1 : 0, { right: rid ? [rid] : [], chosen: value ? [value] : [] });
    }

    if (t === "multi" || t === "hotspot") {
      var pool = t === "multi" ? p.options : p.regions;
      var rightIds = pool.filter(function (o) { return o.correct; }).map(function (o) { return o.id; });
      var picked = Array.isArray(value) ? value : (value ? [value] : []);
      var want = setOf(rightIds), got = setOf(picked);
      var hits = 0, wrong = 0;
      picked.forEach(function (id) { if (want[id]) hits++; else wrong++; });
      /* Wrong picks cancel right ones, so guessing everything scores zero
         rather than full marks. */
      var credit = rightIds.length ? (hits - wrong) / rightIds.length : 0;
      var exact = hits === rightIds.length && wrong === 0;
      return result(exact ? 1 : credit, { right: rightIds, chosen: picked, picked: got });
    }

    if (t === "matching") {
      var v = value || {};
      var perPrompt = {}, hit = 0;
      for (i = 0; i < p.prompts.length; i++) {
        var pr = p.prompts[i];
        var want2 = p.options.filter(function (o) { return o.match === pr.id; })[0];
        var ok = !!(want2 && v[pr.id] === want2.id);
        perPrompt[pr.id] = { chosen: v[pr.id] || null, want: want2 ? want2.id : null, ok: ok };
        if (ok) hit++;
      }
      return result(p.prompts.length ? hit / p.prompts.length : 0, { perPrompt: perPrompt, hit: hit, of: p.prompts.length });
    }

    if (t === "fillblank") {
      var vb = value || {}, perBlank = {}, hitB = 0;
      for (i = 0; i < p.blanks.length; i++) {
        var b = p.blanks[i];
        var okB = blankIsRight(b, vb[b.id]);
        perBlank[b.id] = { given: vb[b.id] == null ? "" : String(vb[b.id]), ok: okB };
        if (okB) hitB++;
      }
      return result(p.blanks.length ? hitB / p.blanks.length : 0, { perBlank: perBlank, hit: hitB, of: p.blanks.length });
    }

    return result(0, {});
  }

  function isAnswered(p, value) {
    var t = p.type, k;
    if (t === "single") return !!value;
    if (t === "multi" || t === "hotspot") return Array.isArray(value) && value.length > 0;
    if (t === "matching") {
      if (!value) return false;
      for (k = 0; k < p.prompts.length; k++) if (!value[p.prompts[k].id]) return false;
      return true;
    }
    if (t === "fillblank") {
      if (!value) return false;
      for (k = 0; k < p.blanks.length; k++) {
        var v = value[p.blanks[k].id];
        if (v == null || String(v).trim() === "") return false;
      }
      return true;
    }
    return false;
  }

  /* ── 10.04.3  SHARED PIECES ──────────────────────────────────────────── */
  function why(text, lead) {
    return el("div", { class: "why" }, [lead ? el("b", { text: lead + " " }) : null, text]);
  }

  function markIcon(kind) {
    return icon(kind === "correct" ? "check" : kind === "missed" ? "flag" : "x", "i mark");
  }

  /* ── 10.04.4  SINGLE AND MULTI ───────────────────────────────────────────
     A native radio or checkbox inside a label. That buys arrow-key movement
     within the group, Space to toggle, correct roles and correct state for a
     screen reader, and the browser's own click target handling, none of which
     a div with a role would give for free. The visible ring is drawn on the
     label with :focus-within because the input itself is offscreen. */
  function renderChoice(p, q, host, ctx) {
    var multi = p.type === "multi";
    var name = "opt-" + p.qid + "-" + (ctx.nonce || 0);
    var rows = [];

    var group = el("fieldset", { class: "opts" }, [
      el("legend", { class: "sr-only", text: instruction(q) })
    ]);

    p.options.forEach(function (o, i) {
      var input = el("input", {
        type: multi ? "checkbox" : "radio",
        name: name, value: o.id, id: name + "-" + i
      });
      var row = el("label", {
        class: "opt", for: input.id, dataset: { sel: "false", opt: o.id }
      }, [
        input,
        el("span", { class: "key", "aria-hidden": "true", text: LETTERS.charAt(i) || String(i + 1) }),
        el("span", { class: "txt" }, [el("span", { text: o.text })])
      ]);
      on(input, "change", function () { sync(); if (ctx.onChange) ctx.onChange(); });
      rows.push({ o: o, row: row, input: input });
      group.appendChild(row);
    });

    function sync() {
      rows.forEach(function (r) { r.row.setAttribute("data-sel", r.input.checked ? "true" : "false"); });
    }

    function value() {
      var picked = rows.filter(function (r) { return r.input.checked; }).map(function (r) { return r.o.id; });
      return multi ? picked : (picked[0] || null);
    }

    host.appendChild(group);

    return {
      node: group,
      value: value,
      answered: function () { return isAnswered(p, value()); },
      focus: function () {
        var checked = rows.filter(function (r) { return r.input.checked; })[0];
        (checked || rows[0]).input.focus();
      },
      /* set() and lock() exist for §10.03. A mock sitting is rebuilt from a
         seed on resume and on review, which means putting an answer back into
         a freshly rendered control; and a block closed by a break has to stop
         accepting input without revealing anything. Neither is reachable from
         a drill, where the panel is never rebuilt and reveal() does the
         locking. */
      set: function (v) {
        var want = setOf(Array.isArray(v) ? v : (v == null ? [] : [v]));
        rows.forEach(function (r) { r.input.checked = !!want[r.o.id]; });
        sync();
      },
      lock: function () { rows.forEach(function (r) { r.input.disabled = true; }); },
      hotkey: function (k) {
        var i = LETTERS.indexOf(k.toUpperCase());
        if (i < 0 && /^[1-9]$/.test(k)) i = parseInt(k, 10) - 1;
        if (i < 0 || i >= rows.length) return false;
        var r = rows[i];
        if (multi) r.input.checked = !r.input.checked;
        else r.input.checked = true;
        sync();
        r.input.focus();
        if (ctx.onChange) ctx.onChange();
        return true;
      },
      reveal: function (res) {
        var chosen = setOf(res.chosen || []);
        rows.forEach(function (r) {
          r.input.disabled = true;
          var mark = null;
          if (r.o.correct && chosen[r.o.id]) mark = "correct";
          else if (r.o.correct) mark = multi ? "missed" : "correct";
          else if (chosen[r.o.id]) mark = "incorrect";
          if (mark) {
            r.row.setAttribute("data-mark", mark);
            r.row.insertBefore(markIcon(mark), r.row.querySelector(".txt").nextSibling);
          }
          if (r.o.rationale) r.row.querySelector(".txt").appendChild(why(r.o.rationale));
        });
      }
    };
  }

  /* ── 10.04.5  MATCHING AND DROP-DOWN ─────────────────────────────────────
     One native select per prompt. A select is the one control here that needs
     no keyboard work of its own: type-ahead, arrow keys and the picker all
     come from the platform, on desktop and on a phone. */
  function renderMatching(p, q, host, ctx) {
    var wrap = el("div", { class: "match" });
    var rows = [];

    p.prompts.forEach(function (pr, i) {
      var sel = el("select", { class: "select", "aria-label": pr.text });
      sel.appendChild(el("option", { value: "", text: "\u2014 choose \u2014" }));
      p.options.forEach(function (o, j) {
        sel.appendChild(el("option", { value: o.id, text: o.text }));
      });
      on(sel, "change", function () { if (ctx.onChange) ctx.onChange(); });
      var row = el("div", { class: "match-row", dataset: { prompt: pr.id } }, [
        el("span", { class: "prompt" }, [
          el("span", { class: "eyebrow", text: String(i + 1) + " " }), pr.text
        ]),
        sel
      ]);
      rows.push({ pr: pr, sel: sel, row: row });
      wrap.appendChild(row);
    });

    function value() {
      var v = {};
      rows.forEach(function (r) { if (r.sel.value) v[r.pr.id] = r.sel.value; });
      return v;
    }

    host.appendChild(wrap);

    return {
      node: wrap,
      value: value,
      answered: function () { return isAnswered(p, value()); },
      focus: function () { if (rows[0]) rows[0].sel.focus(); },
      set: function (v) {
        v = v || {};
        rows.forEach(function (r) { r.sel.value = v[r.pr.id] || ""; });
      },
      lock: function () { rows.forEach(function (r) { r.sel.disabled = true; }); },
      hotkey: function () { return false; },   /* the select owns its keys */
      reveal: function (res) {
        rows.forEach(function (r) {
          r.sel.disabled = true;
          var pp = res.perPrompt[r.pr.id] || {};
          r.row.setAttribute("data-mark", pp.ok ? "correct" : "incorrect");
          var chosenOpt = p.options.filter(function (o) { return o.id === pp.chosen; })[0];
          var wantOpt = p.options.filter(function (o) { return o.id === pp.want; })[0];
          if (pp.ok) {
            if (wantOpt && wantOpt.rationale) r.row.appendChild(why(wantOpt.rationale));
          } else {
            r.row.appendChild(why((wantOpt ? wantOpt.text + ". " + (wantOpt.rationale || "") : "No match was authored for this line."),
              "Answer:"));
            if (chosenOpt && chosenOpt.rationale) r.row.appendChild(why(chosenOpt.rationale, "You chose " + chosenOpt.text + ":"));
          }
        });
        /* Options nobody picked still carry a rationale, and for a matching
           item the unused choice is usually the instructive one. */
        var used = {};
        rows.forEach(function (r) { var pp = res.perPrompt[r.pr.id] || {}; used[pp.chosen] = true; used[pp.want] = true; });
        var spare = p.options.filter(function (o) { return !used[o.id] && o.rationale; });
        if (spare.length) {
          wrap.appendChild(el("div", { class: "match-row" }, [
            el("span", { class: "prompt" }, [el("span", { class: "eyebrow", text: "Not used " })]),
            el("span"),
            el("div", { class: "why" }, spare.map(function (o) {
              return el("div", null, [el("b", { text: o.text + ". " }), o.rationale]);
            }))
          ]));
        }
      }
    };
  }

  /* ── 10.04.6  HOTSPOT AND GRAPHIC ────────────────────────────────────────
     The diagram is drawn from the item's own data rather than loaded as an
     image: no external file to lose, it inherits the theme, and it stays sharp
     at any zoom. Each region is a focusable group with a radio or checkbox
     role, so the picture is fully operable from the keyboard — Tab or the
     arrow keys to move, Enter or Space to select. */
  function svgEl(tag, attrs, children) {
    var n = document.createElementNS(SVGNS, tag), k;
    if (attrs) for (k in attrs) if (Object.prototype.hasOwnProperty.call(attrs, k) && attrs[k] != null) n.setAttribute(k, attrs[k]);
    (children || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }

  function wrapLabel(text, max) {
    var words = String(text).split(" "), lines = [], line = "";
    words.forEach(function (w) {
      if (!line) line = w;
      else if ((line + " " + w).length <= max) line += " " + w;
      else { lines.push(line); line = w; }
    });
    if (line) lines.push(line);
    return lines.slice(0, 3);
  }

  function renderHotspot(p, q, host, ctx) {
    var g = q.graphic || {};
    var multi = !!q.multi;
    var wrap = el("div", { class: "hotspot" });
    var svg = svgEl("svg", {
      viewBox: g.viewBox || "0 0 660 130",
      role: "group",
      "aria-label": g.title || "Diagram"
    });

    /* Connectors between consecutive regions, drawn from the geometry so the
       item data does not have to carry line coordinates. */
    if (g.flow !== false) {
      var ordered = p.regions.slice().sort(function (a, b) { return (a.x || 0) - (b.x || 0); });
      for (var i = 0; i < ordered.length - 1; i++) {
        var a = ordered[i], b = ordered[i + 1];
        var y = (a.y || 0) + (a.h || 0) / 2;
        var x1 = (a.x || 0) + (a.w || 0), x2 = (b.x || 0);
        if (x2 - x1 < 6) continue;
        svg.appendChild(svgEl("path", { class: "flow", d: "M" + x1 + " " + y + " H" + (x2 - 6) }));
        svg.appendChild(svgEl("path", { class: "flow-h", d: "M" + (x2 - 7) + " " + (y - 4) + " l7 4 -7 4 z" }));
      }
    }

    var cells = [];
    p.regions.forEach(function (r, idx) {
      var cell = svgEl("g", {
        class: "hot", tabindex: "0",
        role: multi ? "checkbox" : "radio",
        "aria-checked": "false",
        "aria-label": r.label
      });
      cell.setAttribute("data-sel", "false");
      cell.setAttribute("data-region", r.id);
      cell.appendChild(svgEl("title", null, [document.createTextNode(r.label)]));
      cell.appendChild(svgEl("rect", { class: "box", x: r.x, y: r.y, width: r.w, height: r.h, rx: 6 }));
      cell.appendChild(svgEl("text", { class: "num", x: r.x + 8, y: r.y + 16 }, [document.createTextNode(String(r.n))]));
      var lines = wrapLabel(r.label, 14);
      var top = r.y + r.h / 2 - ((lines.length - 1) * 15) / 2 + 5;
      lines.forEach(function (ln, li) {
        cell.appendChild(svgEl("text", {
          class: "lab", x: r.x + r.w / 2, y: top + li * 15, "text-anchor": "middle"
        }, [document.createTextNode(ln)]));
      });
      cells.push({ r: r, cell: cell });
      svg.appendChild(cell);

      function toggle() {
        if (locked) return;
        if (multi) {
          var now = cell.getAttribute("data-sel") !== "true";
          setSel(cell, now);
        } else {
          cells.forEach(function (c) { setSel(c.cell, c.cell === cell); });
        }
        if (ctx.onChange) ctx.onChange();
      }
      on(cell, "click", toggle);
      on(cell, "keydown", function (e) {
        if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") { e.preventDefault(); toggle(); return; }
        var step = e.key === "ArrowRight" || e.key === "ArrowDown" ? 1
                 : e.key === "ArrowLeft" || e.key === "ArrowUp" ? -1 : 0;
        if (!step) return;
        e.preventDefault();
        var next = cells[(idx + step + cells.length) % cells.length];
        next.cell.focus();
      });
    });

    var locked = false;
    function setSel(cell, on2) {
      cell.setAttribute("data-sel", on2 ? "true" : "false");
      cell.setAttribute("aria-checked", on2 ? "true" : "false");
    }

    function value() {
      return cells.filter(function (c) { return c.cell.getAttribute("data-sel") === "true"; })
                  .map(function (c) { return c.r.id; });
    }

    wrap.appendChild(svg);
    if (g.caption) wrap.appendChild(el("p", { class: "cap", text: g.caption }));
    host.appendChild(wrap);

    return {
      node: wrap,
      value: value,
      answered: function () { return value().length > 0; },
      focus: function () { if (cells[0]) cells[0].cell.focus(); },
      set: function (v) {
        var want = setOf(Array.isArray(v) ? v : (v == null ? [] : [v]));
        cells.forEach(function (c) { setSel(c.cell, !!want[c.r.id]); });
      },
      lock: function () {
        locked = true;
        cells.forEach(function (c) { c.cell.setAttribute("tabindex", "-1"); });
      },
      hotkey: function (k) {
        if (!/^[1-9]$/.test(k)) return false;
        var want = parseInt(k, 10);
        var hit = cells.filter(function (c) { return c.r.n === want; })[0] || cells[want - 1];
        if (!hit) return false;
        if (multi) setSel(hit.cell, hit.cell.getAttribute("data-sel") !== "true");
        else cells.forEach(function (c) { setSel(c.cell, c === hit); });
        hit.cell.focus();
        if (ctx.onChange) ctx.onChange();
        return true;
      },
      reveal: function (res) {
        locked = true;
        var chosen = setOf(res.chosen || []);
        var list = el("ul", { class: "keylist", style: "margin-top:var(--sp-3)" });
        cells.forEach(function (c) {
          c.cell.setAttribute("tabindex", "-1");
          var mark = c.r.correct && chosen[c.r.id] ? "correct"
                   : c.r.correct ? "missed"
                   : chosen[c.r.id] ? "incorrect" : null;
          if (mark) c.cell.setAttribute("data-mark", mark);
          if (c.r.rationale && (mark || !multi)) {
            list.appendChild(el("li", null, [
              el("span", { class: "kbd", text: String(c.r.n) }),
              el("span", { class: "why", style: "margin:0" }, [el("b", { text: c.r.label + ". " }), c.r.rationale])
            ]));
          }
        });
        if (list.childNodes.length) wrap.appendChild(list);
      }
    };
  }

  /* ── 10.04.7  FILL IN THE BLANK ──────────────────────────────────────────
     Numeric blanks are compared inside a tolerance, and the parser forgives
     thousands separators, a currency symbol and bracketed negatives. Text
     blanks compare against an accept list through the same normaliser the
     glossary search uses in §09.5, so case and punctuation do not decide a
     mark. inputmode is set so a phone offers the right keypad. */
  function renderBlanks(p, q, host, ctx) {
    var wrap = el("div", { class: "blanks" });
    var rows = [];

    p.blanks.forEach(function (b, i) {
      var input = el("input", {
        class: "input", type: "text", id: "blank-" + p.qid + "-" + i,
        inputmode: b.numeric ? "decimal" : "text",
        autocomplete: "off", autocapitalize: "off", spellcheck: "false",
        placeholder: b.numeric ? "0" : ""
      });
      on(input, "input", function () { if (ctx.onChange) ctx.onChange(); });
      var row = el("div", { class: "blank", dataset: { blank: b.id } }, [
        el("label", { class: "lbl", for: input.id, text: b.label }),
        el("span", { class: "box" }, [input, b.unit ? el("span", { class: "unit", text: b.unit }) : null])
      ]);
      rows.push({ b: b, input: input, row: row });
      wrap.appendChild(row);
    });

    function value() {
      var v = {};
      rows.forEach(function (r) { v[r.b.id] = r.input.value; });
      return v;
    }

    host.appendChild(wrap);

    return {
      node: wrap,
      value: value,
      answered: function () { return isAnswered(p, value()); },
      focus: function () { if (rows[0]) rows[0].input.focus(); },
      set: function (v) {
        v = v || {};
        rows.forEach(function (r) { r.input.value = v[r.b.id] == null ? "" : String(v[r.b.id]); });
      },
      lock: function () { rows.forEach(function (r) { r.input.readOnly = true; }); },
      hotkey: function () { return false; },   /* the person is typing */
      reveal: function (res) {
        rows.forEach(function (r) {
          r.input.readOnly = true;
          var pb = res.perBlank[r.b.id] || {};
          r.row.setAttribute("data-mark", pb.ok ? "correct" : "incorrect");
          var answer = r.b.numeric ? String(r.b.expect) : (r.b.accept || [])[0];
          r.row.appendChild(why(
            (pb.ok ? "" : "The answer is " + answer + (r.b.unit ? " " + r.b.unit : "") + ". ") + (r.b.rationale || ""),
            pb.ok ? "Correct." : null
          ));
        });
      }
    };
  }

  var RENDERERS = {
    single: renderChoice, multi: renderChoice, matching: renderMatching,
    hotspot: renderHotspot, fillblank: renderBlanks
  };

  /* ── 10.04.8  ENTRY POINT ─────────────────────────────────────────────── */
  function render(p, q, host, ctx) {
    ctx = ctx || {};
    var fn = RENDERERS[p.type];
    if (!fn) {
      host.appendChild(PMP.UI.empty(
        "This item cannot be shown",
        "It is tagged as type \u201C" + p.declaredType + "\u201D, which this build has no renderer for. Skip it, and report it from the pack it came from.",
        "alert"
      ));
      return {
        node: host, value: function () { return null; }, answered: function () { return false; },
        focus: function () {}, hotkey: function () { return false; }, reveal: function () {},
        set: function () {}, lock: function () {}
      };
    }
    return fn(p, q, host, ctx);
  }

  return {
    base: base, label: label, instruction: instruction, correctIds: correctIds,
    correctValue: correctValue,
    present: present, render: render, score: score, isAnswered: isAnswered,
    parseNumber: parseNumber, TYPE_LABELS: LABEL
  };
})();


/* ── 10.03  MOCK EXAM SIMULATOR ─────────────────────────────────────────────
   A full sitting under exam conditions: the published layout, one clock that
   cannot be gamed, two breaks that lock the block behind them, a navigator
   over every item, and no feedback of any kind until the paper is handed in.

   Five decisions worth knowing before reading the code:

   · The clock is a Date.now() delta and nothing else. Ticks are never summed:
     a throttled background tab fires its interval late, and adding up the
     intervals would hand the candidate minutes they had not earned. The
     interval here only paints; elapsedMs() is the single source of truth and
     it subtracts two timestamps every time it is asked.

   · The sitting is rebuilt from a seed, not from a saved copy of its
     questions. What is written to disk is the ordered list of ids, the seed,
     and whether shuffling was on. Replaying PMP.QRender.present() over that
     list with a seeded stream reproduces the option order exactly, so Resume
     puts the same paper back on screen rather than a fresh shuffle of the
     same items. It also means a saved sitting whose pack has gone is refused
     rather than silently re-ordered — see resumable().

   · Breaks lock backwards. Once the block behind a break is closed it stays
     closed, in the navigator and in the renderers, because that is what the
     real thing does and practising without it teaches the wrong instinct
     about when to leave an item unresolved.

   · Nothing is marked mid-sitting. The renderers can mark an item the moment
     it is answered, and every one of those paths is deliberately unused here.
     The candidate sees a verdict once, at the end, on the whole paper.

   · Wall time while the file is closed is not charged to the clock. The
     sitting banks its elapsed figure every few seconds and on the way out, so
     a crash costs at most that much; a tab closed for an hour costs nothing.
     A break, which is real rest rather than exam time, is charged in full.
   ═════════════════════════════════════════════════════════════════════════ */
PMP.Exam = (function () {
  var el = PMP.dom.el, icon = PMP.dom.icon, on = PMP.dom.on, frag = PMP.dom.frag;
  var E = PMP.EXAM;

  var AUTOSAVE_MS = 5000;      /* worst-case clock loss on an unclean close */
  var MIN_ITEMS = 10;          /* below this a sitting is not a sitting */

  /* Proficiency bands. PMI reports Above Target / Target / Below Target /
     Needs Improvement per domain and publishes neither the cut score nor the
     band boundaries, so these four thresholds are this build's own scale and
     are labelled as such everywhere they are shown. */
  var BANDS = [
    { id: "above",  label: "Above Target",      min: 0.75 },
    { id: "target", label: "Target",            min: 0.60 },
    { id: "below",  label: "Below Target",      min: 0.45 },
    { id: "needs",  label: "Needs Improvement", min: 0 }
  ];
  var MIN_BAND_SAMPLE = 5;     /* fewer items than this and no band is claimed */

  var live = null;             /* { run, items } while a sitting is on screen */
  var runningSince = null;     /* epoch ms, or null when the clock is stopped */
  var itemEnteredAt = null;
  var teardown = [];
  var nodes = {};
  var reviewing = null;        /* a finished sitting opened from history */

  /* ── 10.03.1  LAYOUT ─────────────────────────────────────────────────────
     The published layout is 180 items in 240 minutes with two breaks. A pack
     smaller than 180 cannot fill that without repeating items, and repeating
     items inside one sitting would corrupt both the score and the attempt
     history. So a short pack gets a proportionally scaled sitting instead:
     same pace target, same break structure, fewer items and less time. The
     view says so in plain words rather than quietly serving a short paper. */
  function layoutFor(n) {
    var full = n >= E.TOTAL_ITEMS;
    var items = full ? E.TOTAL_ITEMS : n;
    var ratio = items / E.TOTAL_ITEMS;
    var caseItems = full ? E.CASE_BLOCK_ITEMS : Math.max(1, Math.round(E.CASE_BLOCK_ITEMS * ratio));
    var rest = items - caseItems;
    return {
      full: full,
      items: items,
      scored: full ? E.SCORED_ITEMS : Math.max(1, Math.round(E.SCORED_ITEMS * ratio)),
      minutes: full ? E.MINUTES : Math.max(1, Math.round(E.MINUTES * ratio)),
      caseItems: caseItems,
      /* Scaled from the getters in §01.2 rather than recomputed here. The
         position of the two breaks is one of this build's stated assumptions
         about the paper, and an assumption is only honest if it is written
         down once. Recomputing it would let the short-form sitting and the
         full one drift apart the moment somebody edits the config. */
      break1After: full ? E.BREAK_1_AFTER : Math.max(1, Math.round(E.BREAK_1_AFTER * ratio)),
      break2After: full ? E.BREAK_2_AFTER : Math.max(2, Math.round(E.BREAK_2_AFTER * ratio)),
      breakMinutes: full ? E.BREAK_MINUTES : Math.max(2, Math.round(E.BREAK_MINUTES * ratio)),
      paceSec: E.PACE_TARGET_SEC
    };
  }

  function blockBounds(L) {
    return [[0, L.break1After], [L.break1After, L.break2After], [L.break2After, L.items]];
  }
  function blockOf(L, i) {
    var b = blockBounds(L);
    for (var k = 0; k < 3; k++) if (i >= b[k][0] && i < b[k][1]) return k;
    return 2;
  }
  function blockLabel(k) { return ["Block 1", "Block 2", "Block 3"][k] || "Block"; }

  /* ── 10.03.2  ITEM SELECTION ─────────────────────────────────────────────
     Stratified by domain at the published weighting, then round-robin across
     the ECO tasks inside each domain so a single well-stocked task cannot
     take half the paper. Everything downstream of the seed is deterministic:
     the same seed and the same pack give the same sitting. */
  function largestRemainder(fractions, total) {
    var floors = fractions.map(function (f) { return Math.floor(f); });
    var used = floors.reduce(function (a, b) { return a + b; }, 0);
    var rema = fractions.map(function (f, i) { return { i: i, r: f - Math.floor(f) }; })
                        .sort(function (a, b) { return b.r - a.r; });
    var k = 0;
    while (used < total && k < rema.length) { floors[rema[k].i]++; used++; k++; }
    return floors;
  }

  function pickItems(pool, n, rand) {
    var D = PMP.ECO.DOMAINS, W = PMP.ECO.DOMAIN_WEIGHTS;
    var byDomain = Object.create(null);
    D.forEach(function (d) { byDomain[d] = []; });
    var loose = [];
    pool.forEach(function (q) { (byDomain[q.domain] || loose).push(q); });

    var want = largestRemainder(D.map(function (d) { return n * (W[d] || 0); }), n);
    var out = [], shortfall = 0;

    D.forEach(function (d, di) {
      var target = want[di];
      var group = byDomain[d];
      /* Buckets by task, each shuffled, then drained round-robin. */
      var buckets = Object.create(null), keys = [];
      group.forEach(function (q) {
        var k = q.ecoTask || "untagged";
        if (!buckets[k]) { buckets[k] = []; keys.push(k); }
        buckets[k].push(q);
      });
      keys = PMP.rng.shuffle(keys, rand).items;
      keys.forEach(function (k) { buckets[k] = PMP.rng.shuffle(buckets[k], rand).items; });

      var taken = 0, pass = 0, moved = true;
      while (taken < target && moved) {
        moved = false;
        for (var ki = 0; ki < keys.length && taken < target; ki++) {
          var b = buckets[keys[ki]];
          if (b.length > pass) { out.push(b[pass]); taken++; moved = true; }
        }
        pass++;
      }
      shortfall += target - taken;
    });

    /* A domain that could not meet its target gives its places back to the
       rest of the pack rather than shortening the paper. */
    if (shortfall > 0) {
      var have = Object.create(null);
      out.forEach(function (q) { have[q.id] = true; });
      var spare = PMP.rng.shuffle(pool.filter(function (q) { return !have[q.id]; }), rand).items;
      out = out.concat(spare.slice(0, shortfall));
    }
    return PMP.rng.shuffle(out, rand).items.slice(0, n);
  }

  /* ── 10.03.3  BUILD AND REBUILD ──────────────────────────────────────────
     buildRun() creates the record that goes to disk. presentAll() turns that
     record back into questions on screen and is the only place presentation
     is produced, for a new sitting and for a resumed one alike. */
  function buildRun(opts) {
    var pool = PMP.Content.all().filter(function (q) { return q && q.id && !q.retired; });
    var L = layoutFor(Math.min(pool.length, E.TOTAL_ITEMS));
    var seed = PMP.rng.seedFrom(String(Date.now()) + ":" + Math.random());
    var rand = PMP.rng.seeded(seed);
    var picked = pickItems(pool, L.items, rand);

    /* Pretest items. PMI does not identify them during the sitting and nor
       does this; they are named in the results, where knowing which ones did
       not count is useful rather than distorting. */
    var pretest = picked.map(function () { return false; });
    var spare = L.items - L.scored;
    var idx = PMP.rng.shuffle(picked.map(function (_, i) { return i; }), rand).items.slice(0, spare);
    idx.forEach(function (i) { pretest[i] = true; });

    return {
      id: PMP.rng.id("sit"),
      seed: seed,
      shuffle: PMP.Store.state.settings.shuffleOptions !== false,
      ecoVersion: PMP.ECO.VERSION,
      createdAt: Date.now(),
      savedAt: Date.now(),
      layout: L,
      qids: picked.map(function (q) { return q.id; }),
      pretest: pretest,
      answers: {},        /* qid -> value, in the shape score() expects */
      flags: {},          /* qid -> true, local to the sitting */
      times: {},          /* qid -> ms on screen */
      i: 0,
      unlockedFrom: 0,    /* index of the first item still editable */
      breaksTaken: [],
      onBreak: null,      /* { block, startedAt, ms } */
      clockConsumed: 0,
      finished: false
    };
  }

  /* The seed only reproduces the paper if every id still resolves and the
     stream is replayed over the whole list in order. A pack that has lost an
     item breaks both, so the sitting is refused rather than approximated. */
  function missingIds(run) {
    return (run.qids || []).filter(function (id) { return !PMP.Content.has(id); });
  }

  function presentAll(run) {
    var rand = PMP.rng.seeded(run.seed);
    return run.qids.map(function (qid) {
      var q = PMP.Content.byId(qid);
      return {
        q: q,
        p: PMP.QRender.present(q, { rand: rand, shuffle: run.shuffle }),
        ctrl: null, panel: null, ui: {}
      };
    });
  }

  function resumable() {
    var saved = PMP.Store.state.examRun;
    if (!saved || saved.finished) return null;
    if (!saved.qids || !saved.qids.length) return null;
    return saved;
  }

  /* ── 10.03.4  THE CLOCK ──────────────────────────────────────────────────
     Two timestamps and a banked total. Nothing counts a tick. */
  function clockStart() { if (runningSince === null && live && !live.run.onBreak) runningSince = Date.now(); }
  function clockBank() {
    if (runningSince === null) return;
    var now = Date.now();
    live.run.clockConsumed += now - runningSince;
    runningSince = now;
  }
  function clockStop() {
    if (runningSince === null) return;
    live.run.clockConsumed += Date.now() - runningSince;
    runningSince = null;
  }
  function elapsedMs() {
    if (!live) return 0;
    return live.run.clockConsumed + (runningSince === null ? 0 : Date.now() - runningSince);
  }
  function remainingMs() {
    if (!live) return 0;
    return Math.max(0, live.run.layout.minutes * 60000 - elapsedMs());
  }

  function itemEnter() { itemEnteredAt = Date.now(); }
  function itemLeave() {
    if (itemEnteredAt === null || !live) return;
    var qid = live.run.qids[live.run.i];
    live.run.times[qid] = (live.run.times[qid] || 0) + (Date.now() - itemEnteredAt);
    itemEnteredAt = null;
  }

  /* ── 10.03.5  AUTO-SAVE ──────────────────────────────────────────────────
     Written on every answer, every flag, every move between items and every
     five seconds for the clock. Silent, because a save is not a state change
     any view needs to hear about, and a notify here would repaint the paper
     under the person mid-answer. */
  function save() {
    if (!live) return;
    clockBank();
    live.run.savedAt = Date.now();
    var snap;
    try { snap = JSON.parse(JSON.stringify(live.run)); }
    catch (e) { PMP.report(e, "exam autosave"); return; }
    PMP.Store.commit(["examRun"], function (s) { s.examRun = snap; }, { silent: true });
  }

  function clearSaved() {
    PMP.Store.commit(["examRun"], function (s) { s.examRun = null; }, { silent: true });
  }

  /* ── 10.03.6  LIFECYCLE ──────────────────────────────────────────────── */
  function cleanup() {
    teardown.forEach(function (fn) { try { fn(); } catch (e) {} });
    teardown = [];
    if (live && !live.run.finished) { itemLeave(); clockBank(); save(); }
  }

  function repaint() {
    var host = document.getElementById("view");
    if (!host) return;
    host.innerHTML = "";
    view(host, {});
  }

  function ticker(fn) {
    var id = setInterval(fn, 250);
    teardown.push(function () { clearInterval(id); });
    fn();
  }

  function beginSitting(run) {
    live = { run: run, items: presentAll(run) };
    runningSince = null;
    itemEnteredAt = null;
    PMP.Store.commit(["ui"], function (s) { s.ui.examActive = true; }, { transient: true });
    save();
    repaint();
  }

  function startNew() {
    var pool = PMP.Content.all().length;
    if (pool < MIN_ITEMS) {
      PMP.UI.toast("A sitting needs at least " + MIN_ITEMS + " questions. This build has " + pool + ".", "warn");
      return;
    }
    var L = layoutFor(Math.min(pool, E.TOTAL_ITEMS));
    var lines = [
      el("p", { text: "This sitting is " + L.items + " questions in " + L.minutes + " minutes, with a break after question " + L.break1After + " and another after question " + L.break2After + "." }),
      el("p", { text: "Nothing is marked until you hand the paper in. You can move freely inside the block you are in, but once you pass a break the block behind it is closed and cannot be reopened \u2014 the same as the real thing." }),
      el("p", { text: "Your answers are saved as you give them. If the tab closes, you will be offered the sitting back where you left it, with the clock where it was when it last saved." })
    ];
    if (!L.full) {
      lines.push(el("p", { class: "hint", text: "The published exam is " + E.TOTAL_ITEMS + " questions in " + E.MINUTES + " minutes. This build has " + pool + " questions, which is not enough to fill one without asking you the same item twice, so the sitting is scaled: the same pace target of " + E.PACE_TARGET_SEC.toFixed(0) + " seconds a question and the same break structure, over " + L.items + " items." }));
    }
    PMP.UI.sheet({
      title: "Start the sitting?",
      body: frag(lines),
      actions: [
        { id: "cancel", label: "Not yet" },
        { id: "go", label: "Start the clock", icon: "timer", primary: true }
      ]
    }).then(function (choice) {
      if (choice !== "go") return;
      beginSitting(buildRun());
    });
  }

  function resume() {
    var saved = resumable();
    if (!saved) return;
    var missing = missingIds(saved);
    if (missing.length) {
      PMP.UI.sheet({
        title: "That sitting cannot be reopened",
        body: frag([
          el("p", { text: PMP.fmt.plural(missing.length, "question") + " from the saved sitting is no longer in this build, so the paper cannot be put back exactly as it was." }),
          el("p", { text: "Reopening it with different questions would make the score meaningless, so the sitting is offered for deletion instead. Any drills you did are untouched." })
        ]),
        actions: [{ id: "keep", label: "Leave it alone" }, { id: "drop", label: "Delete the sitting", danger: true }]
      }).then(function (choice) {
        if (choice === "drop") { clearSaved(); repaint(); }
      });
      return;
    }
    beginSitting(saved);
  }

  function discardSaved() {
    PMP.UI.confirm("Discard the unfinished sitting?",
      "The questions you answered in it are removed with it and will not appear in your history or your readiness score. This cannot be undone.",
      "Discard it", true).then(function (yes) {
      if (!yes) return;
      clearSaved();
      PMP.UI.toast("Unfinished sitting discarded.", "ok");
      repaint();
    });
  }

  /* ── 10.03.7  SITTING VIEW ───────────────────────────────────────────── */
  function renderSitting(host) {
    var run = live.run, L = run.layout;

    if (run.onBreak) return renderBreak(host);

    var clockNode = el("span", { class: "exam-clock", id: "exam-clock" });
    var counter = el("span", { class: "pool-n" }, [el("b", { text: String(run.i + 1) }), " / " + L.items]);
    var fill = el("i", { style: "width:0%" });
    var blockTag = el("span", { class: "chip" });

    var hd = el("div", { class: "exam-hd" }, [
      el("span", { class: "exam-clock-wrap", id: "exam-clock-wrap", "data-state": "ok" }, [
        icon("timer"),
        clockNode,
        el("span", { class: "exam-clock-l", text: "left" })
      ]),
      blockTag,
      counter,
      el("span", { class: "progress", "aria-hidden": "true" }, [fill]),
      el("span", { class: "spacer" }),
      el("button", { class: "btn btn--sm", type: "button", onclick: showKeyHelp, "aria-label": "Keyboard shortcuts" }, [icon("info")]),
      el("button", { class: "btn btn--sm", type: "button", onclick: confirmEnd }, "End exam")
    ]);
    host.appendChild(hd);

    var card = el("div", { class: "card", id: "exam-card", tabindex: "-1" });
    host.appendChild(card);

    /* Navigator ── one grid per block, so the locked ones read as closed
       sections rather than as a wall of disabled cells. */
    var navCard = el("div", { class: "card" }, [
      el("span", { class: "eyebrow", text: "Navigator" })
    ]);
    var cells = new Array(L.items);
    blockBounds(L).forEach(function (b, k) {
      if (b[1] <= b[0]) return;
      var locked = b[0] < run.unlockedFrom;
      var head = el("div", { class: "nav-blk-hd" }, [
        el("span", { class: "t", text: blockLabel(k) + " \u00B7 " + (b[0] + 1) + "\u2013" + b[1] }),
        locked ? el("span", { class: "chip", text: "Closed" }) : null
      ]);
      var grid = el("div", { class: "navgrid" });
      for (var i = b[0]; i < b[1]; i++) {
        (function (idx) {
          var cell = el("button", {
            class: "navgrid-c", type: "button", dataset: { st: "unseen" },
            onclick: function () { goTo(idx); }
          }, String(idx + 1));
          grid.appendChild(cell);
          cells[idx] = cell;
        })(i);
      }
      navCard.appendChild(head);
      navCard.appendChild(grid);
    });
    navCard.appendChild(el("div", { class: "legend" }, [
      el("span", { class: "chip chip--answered", text: "Answered" }),
      el("span", { class: "chip chip--flagged", text: "Flagged for review" }),
      el("span", { class: "chip", text: "Not answered" }),
      el("span", { class: "chip chip--locked", text: "Closed by a break" })
    ]));
    navCard.appendChild(el("p", {
      text: "No cell tells you whether an answer was right. Nothing on this paper is marked until you hand it in."
    }));
    host.appendChild(navCard);

    nodes = { card: card, clock: clockNode, clockWrap: hd.querySelector("#exam-clock-wrap"),
              counter: counter.querySelector("b"), fill: fill, blockTag: blockTag, cells: cells };

    ticker(function () {
      if (!live || live.run.finished || live.run.onBreak) return;
      var left = remainingMs();
      nodes.clock.textContent = PMP.fmt.clock(left);
      var frac = left / (L.minutes * 60000);
      nodes.clockWrap.setAttribute("data-state", left <= 0 ? "over" : frac <= 0.05 ? "over" : frac <= 0.15 ? "warn" : "ok");
      if (left <= 0) timeUp();
    });

    var saver = setInterval(function () { if (live && !live.run.finished) save(); }, AUTOSAVE_MS);
    teardown.push(function () { clearInterval(saver); });

    /* Banking the clock on the way out of the tab is what keeps an unclean
       close cheap. pagehide fires where beforeunload does not, on iOS. */
    var offHide = on(document, "visibilitychange", function () { if (document.hidden) save(); });
    var offPage = on(window, "pagehide", function () { save(); });
    teardown.push(offHide); teardown.push(offPage);

    clockStart();
    installKeys();
    goTo(run.i, true);
  }

  function goTo(idx, first) {
    var run = live.run, L = run.layout;
    if (idx < run.unlockedFrom) {
      PMP.UI.toast(blockLabel(blockOf(L, idx)) + " closed when you passed the break. Question " + (idx + 1) + " can be read but not changed.", "warn");
    }
    if (!first) itemLeave();
    run.i = Math.max(0, Math.min(L.items - 1, idx));
    itemEnter();

    var item = live.items[run.i];
    nodes.card.innerHTML = "";
    nodes.card.appendChild(panelFor(item, run.i));
    nodes.counter.textContent = String(run.i + 1);
    nodes.fill.style.width = ((run.i + 1) / L.items * 100) + "%";
    nodes.blockTag.textContent = blockLabel(blockOf(L, run.i));
    updateNav();
    save();

    try { nodes.card.focus({ preventScroll: true }); } catch (e) { nodes.card.focus(); }
    PMP.UI.announce("Question " + (run.i + 1) + " of " + L.items + ". " +
      PMP.QRender.label(item.q.type) + ". " + PMP.QRender.instruction(item.q) +
      (run.i < run.unlockedFrom ? " This question is closed and cannot be changed." : ""));
  }

  function updateNav() {
    if (!nodes.cells) return;
    var run = live.run;
    run.qids.forEach(function (qid, idx) {
      var cell = nodes.cells[idx];
      if (!cell) return;
      var locked = idx < run.unlockedFrom;
      var answered = run.answers[qid] !== undefined && run.answers[qid] !== null;
      var st = run.flags[qid] ? "flagged" : answered ? "answered" : "unseen";
      cell.setAttribute("data-st", st);
      cell.setAttribute("data-locked", locked ? "true" : "false");
      cell.setAttribute("data-cur", idx === run.i ? "true" : "false");
      cell.setAttribute("aria-label", "Question " + (idx + 1) + ", " +
        (answered ? "answered" : "not answered") + (run.flags[qid] ? ", flagged" : "") +
        (locked ? ", closed" : "") + (idx === run.i ? ", current" : ""));
    });
  }

  /* ── 10.03.8  ONE ITEM ───────────────────────────────────────────────────
     Built once and kept, exactly as the drill engine does, so returning to an
     item inside the open block shows the same option order and the answer the
     person actually gave. */
  function panelFor(item, idx) {
    if (item.panel) { syncTools(item, idx); return item.panel; }
    var run = live.run, q = item.q;
    var task = PMP.ECO_TASK_BY_ID[q.ecoTask];
    var panel = el("div");

    panel.appendChild(el("div", { class: "q-meta" }, [
      el("span", { class: "eyebrow", text: "Question " + (idx + 1) + " of " + run.layout.items }),
      el("span", { class: "chip", text: PMP.QRender.label(q.type) })
    ]));
    panel.appendChild(el("p", { class: "q-stem", text: q.stem }));
    panel.appendChild(el("p", { class: "q-instr", text: PMP.QRender.instruction(q) }));

    var body = el("div");
    panel.appendChild(body);

    item.ctrl = PMP.QRender.render(item.p, q, body, {
      nonce: "x" + idx,
      onChange: function () { onAnswerChanged(item, idx); }
    });
    if (run.answers[q.id] !== undefined && item.ctrl.set) item.ctrl.set(run.answers[q.id]);

    var lockNote = el("div", { class: "lock-note", hidden: true }, [
      icon("alert"),
      el("span", { text: "This block closed when you took the break after it. You can read the question, but the answer is fixed." })
    ]);
    panel.appendChild(lockNote);

    var flagBtn = el("button", {
      class: "btn btn--sm", type: "button",
      onclick: function () { toggleFlag(item, idx); }
    }, [icon("flag"), "Flag for review"]);

    var clearBtn = el("button", {
      class: "btn btn--sm", type: "button",
      onclick: function () { clearAnswer(item, idx); }
    }, "Clear answer");

    var tools = el("div", { class: "q-tools" }, [flagBtn, clearBtn, el("span", { class: "spacer" })]);
    panel.appendChild(tools);

    var backBtn = el("button", {
      class: "btn", type: "button",
      onclick: function () { if (run.i > 0) goTo(run.i - 1); }
    }, "Back");
    var nextBtn = el("button", {
      class: "btn btn--primary", type: "button",
      onclick: function () { forward(); }
    }, "Next");

    panel.appendChild(el("div", { class: "q-tools", style: "border-top:0;padding-top:0" }, [
      backBtn, el("span", { class: "spacer" }), nextBtn
    ]));

    item.ui = { flagBtn: flagBtn, clearBtn: clearBtn, back: backBtn, next: nextBtn, lockNote: lockNote };
    item.panel = panel;
    syncTools(item, idx);
    return panel;
  }

  function syncTools(item, idx) {
    var run = live.run, locked = idx < run.unlockedFrom;
    var flagged = !!run.flags[item.q.id];
    if (item.ui.flagBtn) {
      item.ui.flagBtn.setAttribute("data-on", flagged ? "true" : "false");
      item.ui.flagBtn.setAttribute("aria-pressed", flagged ? "true" : "false");
      item.ui.flagBtn.lastChild.textContent = flagged ? "Flagged" : "Flag for review";
    }
    if (item.ui.clearBtn) item.ui.clearBtn.disabled = locked || run.answers[item.q.id] === undefined;
    if (item.ui.back) item.ui.back.disabled = run.i === 0;
    if (item.ui.next) {
      var atBlockEnd = isBlockEnd(run.layout, idx);
      item.ui.next.textContent = idx === run.layout.items - 1 ? "Finish the exam"
        : atBlockEnd ? "Finish this block" : "Next";
    }
    if (item.ui.lockNote) item.ui.lockNote.hidden = !locked;
    if (locked && item.ctrl && item.ctrl.lock && !item.lockedOnce) {
      item.ctrl.lock();
      item.lockedOnce = true;
    }
  }

  function isBlockEnd(L, idx) {
    return idx === L.break1After - 1 || idx === L.break2After - 1;
  }

  function onAnswerChanged(item, idx) {
    var run = live.run;
    if (idx < run.unlockedFrom) return;
    var v = item.ctrl.value();
    var has = PMP.QRender.isAnswered(item.p, v);
    if (has) run.answers[item.q.id] = v;
    else delete run.answers[item.q.id];
    syncTools(item, idx);
    updateNav();
    save();
  }

  function clearAnswer(item, idx) {
    var run = live.run;
    if (idx < run.unlockedFrom) return;
    delete run.answers[item.q.id];
    if (item.ctrl.set) item.ctrl.set(item.p.type === "matching" || item.p.type === "fillblank" ? {} : []);
    syncTools(item, idx);
    updateNav();
    save();
    PMP.UI.announce("Answer cleared.");
  }

  function toggleFlag(item, idx) {
    var run = live.run;
    var now = !run.flags[item.q.id];
    if (now) run.flags[item.q.id] = true; else delete run.flags[item.q.id];
    syncTools(item, idx);
    updateNav();
    save();
    PMP.UI.announce(now ? "Flagged for review" : "Flag removed");
  }

  /* ── 10.03.9  MOVING FORWARD, AND THE BREAKS ────────────────────────────
     Going past the last item of a block is the one irreversible move in the
     sitting, so it is the one move that stops and asks. The dialog counts
     what is about to be closed unanswered, because that is the number the
     candidate actually needs in order to decide. */
  function forward() {
    var run = live.run, L = run.layout;
    if (run.i === L.items - 1) return confirmSubmit();
    if (isBlockEnd(L, run.i)) return offerBreak(blockOf(L, run.i));
    goTo(run.i + 1);
  }

  function offerBreak(block) {
    var run = live.run, L = run.layout;
    var b = blockBounds(L)[block];
    var unanswered = 0, flagged = 0;
    for (var i = b[0]; i < b[1]; i++) {
      var qid = run.qids[i];
      if (run.answers[qid] === undefined) unanswered++;
      if (run.flags[qid]) flagged++;
    }

    var warn = [];
    if (unanswered) warn.push(PMP.fmt.plural(unanswered, "question") + " with no answer");
    if (flagged) warn.push(PMP.fmt.plural(flagged, "question") + " flagged for review");

    PMP.UI.sheet({
      title: "End " + blockLabel(block).toLowerCase() + "?",
      body: frag([
        el("p", { text: "Questions " + (b[0] + 1) + " to " + b[1] + " close now and cannot be reopened, whether or not you take the break." }),
        warn.length
          ? el("p", { class: "lock-warn", text: "You are leaving " + warn.join(" and ") + " behind." })
          : el("p", { text: "Everything in this block has an answer." }),
        el("p", { text: "The break is " + PMP.fmt.plural(L.breakMinutes, "minute") + " and the exam clock stops for it. You can come back early. If you skip it, the clock keeps running." })
      ]),
      actions: [
        { id: "back", label: "Go back to the block" },
        { id: "skip", label: "Close it, no break" },
        { id: "break", label: "Close it and take the break", primary: true }
      ]
    }).then(function (choice) {
      if (choice !== "skip" && choice !== "break") return;
      closeBlock(block, choice === "break");
    });
  }

  function closeBlock(block, takeBreak) {
    var run = live.run, L = run.layout;
    var b = blockBounds(L)[block];
    itemLeave();
    run.unlockedFrom = b[1];
    if (run.breaksTaken.indexOf(block) < 0) run.breaksTaken.push(block);

    /* Lock the panels that have already been built; the ones that have not
       pick it up from syncTools() when they are. */
    for (var i = b[0]; i < b[1]; i++) {
      var it = live.items[i];
      if (it && it.ctrl && it.ctrl.lock && !it.lockedOnce) { it.ctrl.lock(); it.lockedOnce = true; }
    }

    if (takeBreak) {
      clockStop();
      run.onBreak = { block: block, startedAt: Date.now(), ms: L.breakMinutes * 60000 };
    }
    run.i = b[1];
    save();
    cleanup();
    repaint();
  }

  function renderBreak(host) {
    var run = live.run, br = run.onBreak;
    var left = el("span", { class: "break-clock" });

    host.appendChild(el("div", { class: "view-hd" }, [
      el("span", { class: "eyebrow", text: "Break " + (run.breaksTaken.length) + " of " + E.BREAK_COUNT }),
      el("h2", { text: "The exam clock is stopped" }),
      el("p", { text: "Questions 1 to " + run.unlockedFrom + " are closed. When you come back you start at question " + (run.unlockedFrom + 1) + " and the clock starts again from where it stopped." })
    ]));

    var card = el("div", { class: "card break-card" }, [
      el("span", { class: "eyebrow", text: "Break time remaining" }),
      left,
      el("p", { text: "Stand up, drink something, and come back before this reaches zero. The break ends by itself when it does, and the exam clock restarts whether you are at the screen or not \u2014 which is exactly how the real one behaves." }),
      el("div", { style: "display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-top:var(--sp-5)" }, [
        el("button", { class: "btn btn--primary", type: "button", onclick: endBreak }, [icon("timer"), "Return to the exam now"])
      ])
    ]);
    host.appendChild(card);

    host.appendChild(el("div", { class: "card" }, [
      el("span", { class: "eyebrow", text: "Where you are" }),
      el("div", { class: "sum-grid", style: "margin-top:var(--sp-4)" }, [
        stat("Answered", String(Object.keys(run.answers).length) + " / " + run.layout.items),
        stat("Flagged", String(Object.keys(run.flags).length)),
        stat("Exam time used", PMP.fmt.clock(elapsedMs())),
        stat("Exam time left", PMP.fmt.clock(remainingMs()))
      ])
    ]));

    ticker(function () {
      if (!live || !live.run.onBreak) return;
      var ms = br.ms - (Date.now() - br.startedAt);
      if (ms <= 0) { endBreak(); return; }
      left.textContent = PMP.fmt.clock(ms);
    });
    var saver = setInterval(function () { if (live) save(); }, AUTOSAVE_MS);
    teardown.push(function () { clearInterval(saver); });
  }

  function endBreak() {
    if (!live || !live.run.onBreak) return;
    live.run.onBreak = null;
    save();
    cleanup();
    PMP.UI.announce("Break over. The exam clock is running.");
    repaint();
  }

  /* ── 10.03.10  KEYBOARD ──────────────────────────────────────────────── */
  function typing(e) {
    var t = e.target;
    if (!t || !t.tagName) return false;
    var tag = t.tagName.toUpperCase();
    return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || t.isContentEditable;
  }

  function installKeys() {
    var off = on(document, "keydown", function (e) {
      if (!live || live.run.finished || live.run.onBreak) return;
      var sheet = document.getElementById("sheet");
      if (sheet && sheet.open) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      var run = live.run;
      var item = live.items[run.i];
      if (!item) return;
      var locked = run.i < run.unlockedFrom;
      var inField = typing(e);

      if (e.key === "Enter") {
        if (inField && e.target.tagName.toUpperCase() === "TEXTAREA") return;
        e.preventDefault(); forward(); return;
      }
      if (e.key === "Escape") { e.preventDefault(); confirmEnd(); return; }
      if (inField) return;

      var k = e.key;
      if (k === "?") { e.preventDefault(); showKeyHelp(); return; }
      if (!locked && /^[a-jA-J1-9]$/.test(k) && item.ctrl.hotkey(k)) { e.preventDefault(); return; }
      if (k === "n" || k === "N") { e.preventDefault(); forward(); return; }
      if (k === "p" || k === "P") { e.preventDefault(); if (run.i > 0) goTo(run.i - 1); return; }
      if (k === "f" || k === "F") { e.preventDefault(); toggleFlag(item, run.i); return; }
      if (k === "g" || k === "G") { e.preventDefault(); nextFlagged(); return; }
    });
    teardown.push(off);
  }

  function nextFlagged() {
    var run = live.run, L = run.layout;
    for (var step = 1; step <= L.items; step++) {
      var idx = (run.i + step) % L.items;
      if (run.flags[run.qids[idx]]) return goTo(idx);
    }
    PMP.UI.toast("Nothing is flagged.", "warn");
  }

  function showKeyHelp() {
    PMP.UI.sheet({
      title: "Keyboard shortcuts",
      body: frag([
        el("p", { text: "These work anywhere in the sitting, except while you are typing in a box." }),
        el("ul", { class: "keylist" }, [
          ["A \u2013 J", "Choose that option. In a multiple-response item the key toggles it."],
          ["1 \u2013 9", "Choose that option, or that numbered part of a diagram."],
          ["Enter / N", "Next question. At the end of a block this offers the break."],
          ["P", "Previous question."],
          ["F", "Flag this question for review."],
          ["G", "Jump to the next flagged question."],
          ["?", "Show this list."],
          ["Esc", "End the exam."]
        ].map(function (r) {
          return el("li", null, [el("span", { class: "kbd", text: r[0] }), el("span", { text: r[1] })]);
        }))
      ]),
      actions: [{ id: "close", label: "Close", primary: true }]
    });
  }

  /* ── 10.03.11  HANDING THE PAPER IN ──────────────────────────────────── */
  function confirmEnd() {
    var run = live.run;
    var unanswered = run.layout.items - Object.keys(run.answers).length;
    PMP.UI.sheet({
      title: "End the exam now?",
      body: frag([
        el("p", { text: "You are on question " + (run.i + 1) + " of " + run.layout.items + ", with " + PMP.fmt.clock(remainingMs()) + " left on the clock." }),
        el("p", { text: unanswered ? PMP.fmt.plural(unanswered, "question") + " has no answer and will be marked wrong." : "Every question has an answer." }),
        el("p", { text: "Ending marks the paper and writes the sitting to your history. The alternative is to leave it running \u2014 the clock does not stop for you." })
      ]),
      actions: [
        { id: "stay", label: "Keep going" },
        { id: "end", label: "End and mark it", danger: true }
      ]
    }).then(function (choice) { if (choice === "end") submit("ended"); });
  }

  function confirmSubmit() {
    var run = live.run;
    var unanswered = run.layout.items - Object.keys(run.answers).length;
    var flagged = Object.keys(run.flags).length;
    var body = [el("p", { text: "This is the last question. Handing in marks the paper." })];
    if (unanswered) body.push(el("p", { class: "lock-warn", text: PMP.fmt.plural(unanswered, "question") + " still has no answer. Unanswered is marked wrong, and there is no penalty for a guess." }));
    if (flagged) body.push(el("p", { text: PMP.fmt.plural(flagged, "question") + " is flagged for review. Press G to walk them, if the block is still open." }));
    body.push(el("p", { text: "You have " + PMP.fmt.clock(remainingMs()) + " left." }));

    PMP.UI.sheet({
      title: "Hand the paper in?",
      body: frag(body),
      actions: [
        { id: "stay", label: "Not yet" },
        { id: "go", label: "Hand it in", primary: true }
      ]
    }).then(function (choice) { if (choice === "go") submit("completed"); });
  }

  function timeUp() {
    if (!live || live.run.finished) return;
    PMP.UI.announce("Time is up. The paper has been marked.", true);
    submit("timeout");
  }

  /* Marking. Every item is scored through the same PMP.QRender.score() the
     drill engine uses, so an item cannot mark differently in the exam than it
     does in practice. Unanswered scores zero rather than being left out: on
     the day it is a wrong answer, and recording it as anything else would
     flatter the score. */
  function submit(reason) {
    if (!live || live.run.finished) return;
    var run = live.run, L = run.layout;
    itemLeave();
    clockStop();
    run.finished = true;

    var at = new Date().toISOString();
    var rows = run.qids.map(function (qid, idx) {
      var item = live.items[idx];
      var value = run.answers[qid];
      var answered = value !== undefined && value !== null;
      var res = answered ? PMP.QRender.score(item.q, item.p, value) : { credit: 0, correct: false, partial: false };
      return {
        qid: qid,
        idx: idx,
        block: blockOf(L, idx),
        pretest: !!run.pretest[idx],
        answered: answered,
        correct: !!res.correct,
        credit: res.credit,
        flagged: !!run.flags[qid],
        ms: run.times[qid] || 0,
        domain: item.q.domain || null,
        ecoTask: item.q.ecoTask || null,
        approach: item.q.approach || null,
        type: PMP.QRender.base(item.q.type),
        difficulty: item.q.difficulty || null
      };
    });

    var scored = rows.filter(function (r) { return !r.pretest; });
    var right = scored.filter(function (r) { return r.correct; }).length;

    var record = {
      id: run.id,
      seed: run.seed,
      shuffle: run.shuffle,
      ecoVersion: run.ecoVersion || PMP.ECO.VERSION,
      startedAt: new Date(run.createdAt).toISOString(),
      finishedAt: at,
      endedBy: reason,
      layout: L,
      qids: run.qids.slice(),
      answers: run.answers,
      flags: run.flags,
      times: run.times,
      pretest: run.pretest,
      rows: rows,
      elapsedMs: run.clockConsumed,
      score: { right: right, of: scored.length, pct: scored.length ? right / scored.length : 0 }
    };

    /* One attempt row per answered item, tagged mode "exam" so the readiness
       score and the analytics see a sitting for what it is. Unanswered items
       are not written: a question nobody read is not evidence about anything,
       which is the same rule the drill engine applies to a skip. */
    PMP.Store.commit(["attempts", "exams", "examRun"], function (s) {
      rows.forEach(function (r) {
        if (!r.answered) return;
        s.attempts.push({
          id: PMP.rng.id("att"),
          qid: r.qid, ecoTask: r.ecoTask, domain: r.domain, approach: r.approach,
          type: r.type, difficulty: r.difficulty,
          correct: r.correct, credit: r.credit,
          ms: Math.round(r.ms), at: at, confidence: null, mode: "exam",
          examId: record.id, order: null
        });
      });
      s.exams.push(record);
      s.examRun = null;
    });
    PMP.Store.flush();

    PMP.Store.commit(["ui"], function (s) { s.ui.examActive = false; }, { transient: true });
    cleanup();
    live = null;
    reviewing = record.id;
    repaint();
  }

  /* ── 10.03.12  RESULTS ───────────────────────────────────────────────── */
  function bandFor(pct, n) {
    if (n < MIN_BAND_SAMPLE) return { id: "thin", label: "Too few items" };
    for (var i = 0; i < BANDS.length; i++) if (pct >= BANDS[i].min) return BANDS[i];
    return BANDS[BANDS.length - 1];
  }

  function group(rows, keyOf) {
    var m = Object.create(null), order = [];
    rows.forEach(function (r) {
      var k = keyOf(r);
      if (k == null) k = "Untagged";
      if (!m[k]) { m[k] = { key: k, n: 0, right: 0, ms: 0, answered: 0 }; order.push(k); }
      m[k].n++;
      m[k].ms += r.ms;
      if (r.correct) m[k].right++;
      if (r.answered) m[k].answered++;
    });
    return order.map(function (k) { return m[k]; });
  }

  function bandTable(title, groups, extraCol) {
    var card = el("div", { class: "card" }, [el("span", { class: "eyebrow", text: title })]);
