# Pull-request check for the Android app: runs the unit tests and a debug
# build. Publishing the APK is android-apk.yml's job.
name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    # The build extracts the app's content from index.html with Node.
    - uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
    - name: Build with Gradle
      working-directory: android
      run: ./gradlew testDebugUnitTest assembleDebug
