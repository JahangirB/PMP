# Builds the Android app from this repository and publishes the APK.
#
# Every build re-extracts the questions, lessons, scenarios, flashcards and
# reference content from index.html and copies every file in packs/, so the
# APK always carries exactly what the repository holds. On the default branch
# the APK is published as the latest release, which is what the "Download APK"
# button in README.md points at. On other branches it is kept as a build
# artifact for testing.
name: Android APK

on:
  push:
    paths:
      - "android/**"
      - "packs/**"
      - "index.html"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build the APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        # Compiler errors and failed tests are also raised as annotations, so they show on the run's summary.
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease 2>&1 | tee build.log || {
            grep -E '^e: |FAILED|AssertionError|ComparisonFailure' build.log | head -40 | sed 's/^/::error::/'
            exit 1
          }

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk PMP-Prep.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PMP-Prep-apk
          path: PMP-Prep.apk

      - name: Publish as the latest release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="apk-${{ github.run_number }}"
          gh release create "$tag" PMP-Prep.apk \
            --target "${{ github.sha }}" \
            --title "PMP Prep for Android · build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Install PMP-Prep.apk on Android 7.0 or later; it updates an earlier install in place and keeps your progress." \
            --latest
