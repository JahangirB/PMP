name: Bug report
description: Something in the app does not work as it should.
labels: ["bug"]
body:
  - type: dropdown
    id: app
    attributes:
      label: Which app?
      options:
        - Website (pmp-sandy.vercel.app)
        - Downloaded HTML file
        - Android
        - iPhone
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser or OS version
      placeholder: e.g. Pixel 7, Android 15 / Chrome 130 on Windows 11
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Press ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Please do not attach backups that contain personal notes.
