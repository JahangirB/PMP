name: Feature request
description: An idea that would make studying easier.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or the study habit, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: dropdown
    id: apps
    attributes:
      label: Which apps?
      multiple: true
      options:
        - Website
        - Android
        - iPhone
